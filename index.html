<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BirPerdeTR — Film ve Dizi Platformu</title>
  <meta name="theme-color" content="#0B1F3A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BirPerdeTR" />

  <!-- Textless BirPerdeTR SVG Favicon -->
  <link id="bp-favicon-svg" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='12' fill='%230B1F3A' stroke='%231D4ED8' stroke-width='2'/%3E%3Crect x='8' y='10' width='3.5' height='4' rx='1' fill='%23EAB308'/%3E%3Crect x='8' y='18' width='3.5' height='4' rx='1' fill='%23EAF4FF'/%3E%3Crect x='8' y='26' width='3.5' height='4' rx='1' fill='%2316A34A'/%3E%3Crect x='8' y='34' width='3.5' height='4' rx='1' fill='%23D92626'/%3E%3Crect x='36.5' y='10' width='3.5' height='4' rx='1' fill='%23D92626'/%3E%3Crect x='36.5' y='18' width='3.5' height='4' rx='1' fill='%23EAB308'/%3E%3Crect x='36.5' y='26' width='3.5' height='4' rx='1' fill='%23EAF4FF'/%3E%3Crect x='36.5' y='34' width='3.5' height='4' rx='1' fill='%2316A34A'/%3E%3Crect x='14.5' y='11' width='19' height='26' rx='4' fill='%23047857'/%3E%3Cpolygon points='21,18 30,24 21,30' fill='%23FFFFFF'/%3E%3C/svg%3E" />
  <link id="bp-favicon-png" rel="icon" type="image/png" sizes="192x192" href="" />
  <link id="bp-shortcut-icon" rel="shortcut icon" type="image/png" href="" />
  <link id="bp-apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="" />
  <link id="bp-manifest-link" rel="manifest" href="" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            bpWhite: '#FFFFFF',
            bpSky: '#EAF4FF',
            bpSkyBorder: '#BFDBFE',
            bpRed: '#D92626',
            bpRoyal: '#1D4ED8',
            bpYellow: '#EAB308',
            bpGreen: '#16A34A',
            bpBlack: '#0F172A',
            bpBrown: '#78350F',
            bpNavy: '#0B1F3A',
            bpEmerald: '#047857',
          }
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: clip;
      overscroll-behavior-x: none;
      touch-action: pan-y;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      user-select: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #EAF4FF;
      color: #0F172A;
      margin: 0;
      padding: 0;
    }

    input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
    }

    #admin-app, header, main, section, article, footer, #modal-overlay {
      max-width: 100%;
      overflow-x: clip;
    }

    body.bp-cinema-blur-active #admin-app > header,
    body.bp-cinema-blur-active #admin-app > main,
    body.bp-cinema-blur-active #admin-app > footer,
    body.bp-cinema-blur-active #background-sync-banner {
      filter: blur(12px) brightness(0.55);
      pointer-events: none;
      transition: filter 0.28s ease;
    }

    body.bp-cinema-blur-active #watch-studio-wrapper {
      position: relative;
      z-index: 60;
      max-width: 72rem !important;
      transition: max-width 0.28s ease;
    }

    body.bp-cinema-blur-active #watch-studio-wrapper .bp-player-stage {
      max-height: 74vh !important;
    }

    #intro-splash {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #173663 0%, #091629 65%, #040912 100%);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    #intro-splash.splash-exit {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    .intro-shimmer-ring {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 9999px;
      background: conic-gradient(from 0deg, rgba(234, 179, 8, 0.0), rgba(234, 179, 8, 0.55), rgba(56, 189, 248, 0.45), rgba(234, 179, 8, 0.0));
      filter: blur(18px);
      animation: introSpin 4.5s linear infinite;
    }

    @keyframes introSpin {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(0.95); }
    }

    @keyframes introPop {
      0% { opacity: 0; transform: translateY(18px) scale(0.84); }
      65% { opacity: 1; transform: translateY(-4px) scale(1.03); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .intro-brand-pop {
      animation: introPop 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes titleShine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .intro-shine-text {
      background: linear-gradient(90deg, #EAF4FF 0%, #FDE047 35%, #FFFFFF 50%, #38BDF8 70%, #EAF4FF 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleShine 2.6s linear infinite;
    }

    .bg-pattern-sky {
      background-color: #EAF4FF;
      background-image: url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%231D4ED8' stroke-opacity='0.07' stroke-width='1'%3E%3Cpath d='M32 0L64 32L32 64L0 32Z'/%3E%3Crect x='20' y='20' width='24' height='24' rx='4'/%3E%3Ccircle cx='32' cy='32' r='4'/%3E%3C/g%3E%3C/svg%3E");
    }

    .theme-banner-movies {
      background-color: #0B1F3A;
      background-image:
        url("data:image/svg+xml,%3Csvg width='48' height='48' viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23FFFFFF' stroke-opacity='0.09' stroke-width='1'%3E%3Crect x='4' y='8' width='40' height='32' rx='4'/%3E%3Ccircle cx='24' cy='24' r='8'/%3E%3C/g%3E%3C/svg%3E"),
        linear-gradient(135deg, #0B1F3A 0%, #1D4ED8 100%);
    }

    .theme-banner-series {
      background-color: #047857;
      background-image:
        url("data:image/svg+xml,%3Csvg width='48' height='48' viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23EAB308' stroke-opacity='0.14' stroke-width='1'%3E%3Cpath d='M0 16H48M0 32H48M16 0V48M32 0V48'/%3E%3C/g%3E%3C/svg%3E"),
        linear-gradient(135deg, #047857 0%, #78350F 100%);
    }

    .birperde-ribbon {
      height: 4px;
      background: linear-gradient(
        90deg,
        #EAF4FF 0%,
        #1D4ED8 16%,
        #0B1F3A 32%,
        #047857 48%,
        #16A34A 62%,
        #EAB308 76%,
        #78350F 88%,
        #D92626 95%,
        #0F172A 100%
      );
    }

    .catalog-responsive-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .catalog-responsive-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }

    @media (min-width: 1024px) {
      .catalog-responsive-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
      }
    }

    .card-movie-frame {
      background: #FFFFFF;
      border: 1.5px solid #BFDBFE;
      border-top: 3px solid #D92626;
      border-radius: 14px;
      overflow: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 14px -4px rgba(11, 31, 58, 0.12);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .card-movie-frame:hover {
      transform: translateY(-2px);
      border-color: #1D4ED8;
      box-shadow: 0 10px 20px -6px rgba(11, 31, 58, 0.22);
    }

    .card-series-frame {
      background: #FFFFFF;
      border: 1.5px solid #A7F3D0;
      border-top: 3px solid #047857;
      border-radius: 14px;
      overflow: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 14px -4px rgba(4, 120, 87, 0.12);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .card-series-frame:hover {
      transform: translateY(-2px);
      border-color: #78350F;
      box-shadow: 0 10px 20px -6px rgba(4, 120, 87, 0.22);
    }

    .bp-fs-rot-cw {
      position: fixed !important;
      top: 0 !important;
      left: 100vw !important;
      width: 100dvh !important;
      height: 100vw !important;
      max-width: none !important;
      transform: rotate(90deg) !important;
      transform-origin: top left !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    .bp-fs-rot-ccw {
      position: fixed !important;
      top: 100vh !important;
      left: 0 !important;
      width: 100dvh !important;
      height: 100vw !important;
      max-width: none !important;
      transform: rotate(-90deg) !important;
      transform-origin: top left !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    @supports not (width: 100dvh) {
      .bp-fs-rot-cw, .bp-fs-rot-ccw {
        width: 100vh !important;
      }
    }

    .bp-fullscreen-landscape-native {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    .bp-fs-rot-cw video,
    .bp-fs-rot-ccw video,
    .bp-fullscreen-landscape-native video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      border-radius: 0 !important;
      border: 0 !important;
      background: #000000 !important;
    }

    .fs-icon-btn {
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: rgba(255, 255, 255, 0.95);
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .fs-icon-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.26);
    }

    .fs-icon-active {
      background: rgba(148, 163, 184, 0.36);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      color: #FFFFFF;
    }

    .watch-soft-btn {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #E2E8F0;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .watch-soft-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .watch-soft-active {
      background: rgba(51, 65, 85, 0.9);
      border: 1px solid rgba(234, 179, 8, 0.7);
      color: #FFFFFF;
    }

    input[type="range"].bp-scrubber {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"].bp-scrubber::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.26);
    }

    input[type="range"].bp-scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 9999px;
      background: rgba(226, 232, 240, 0.95);
      border: 1.5px solid rgba(15, 23, 42, 0.65);
      margin-top: -5px;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .live-indicator {
      animation: livePulse 1.4s infinite ease-in-out;
    }

    @keyframes seekPop {
      0% { opacity: 0; transform: scale(0.85); }
      25% { opacity: 1; transform: scale(1.04); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.95); }
    }
    .seek-feedback-badge {
      animation: seekPop 0.85s ease forwards;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #EAF4FF;
    }
    ::-webkit-scrollbar-thumb {
      background: #1D4ED8;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-pattern-sky min-h-screen">

  <!-- ANIMATED INTRO SPLASH SCREEN -->
  <div id="intro-splash" onclick="dismissIntroSplashNow()" class="cursor-pointer select-none px-6 text-center">
    <div class="relative flex flex-col items-center justify-center">
      <div class="intro-shimmer-ring"></div>
      <div id="intro-logo-mount" class="intro-brand-pop relative z-10 mb-5 drop-shadow-[0_0_28px_rgba(234,179,8,0.35)]"></div>
      <h1 class="intro-brand-pop relative z-10 text-4xl sm:text-6xl font-extrabold tracking-tight intro-shine-text">
        BirPerdeTR
      </h1>
      <p class="intro-brand-pop relative z-10 mt-2 text-xs sm:text-sm font-semibold tracking-widest uppercase text-sky-200/80">
        Film &amp; Dizi Arşivi
      </p>
    </div>
  </div>

  <!-- Top Signature Ribbon -->
  <div class="birperde-ribbon w-full sticky top-0 z-50"></div>

  <!-- Toast Notifications -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[10000] flex flex-col gap-2 max-w-xs w-[calc(100%-2rem)] pointer-events-none"></div>

  <!-- MAIN APPLICATION SHELL -->
  <div id="admin-app" class="min-h-screen flex flex-col w-full">

    <!-- TOP HEADER BAR -->
    <header class="sticky top-[4px] z-40 bg-bpWhite border-b-2 border-bpSkyBorder shadow-xs w-full">
      <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">

        <!-- Left: Textless Brand Icon & YÖNETİCİ Badge -->
        <div class="flex items-center gap-2.5 shrink-0 min-w-0">
          <div id="header-brand-logo" onclick="replayIntroSplash()" class="cursor-pointer" title="Giriş Ekranını Tekrar Göster"></div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-base sm:text-xl font-extrabold tracking-tight text-bpNavy">BirPerdeTR</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-extrabold bg-bpNavy text-bpYellow tracking-wide">
                YÖNETİCİ
              </span>
            </div>
            <p class="text-[11px] text-slate-600 hidden sm:block">Hızlı Yerel + Bulut Arşiv, Kesme ve Süre Motoru</p>
          </div>
        </div>

        <!-- Right: Add Content, Cloud Toggle & Backup Actions -->
        <div class="flex items-center gap-1.5 sm:gap-2 order-2 md:order-3 shrink-0 flex-wrap">
          <button type="button" onclick="openAddContentModal('movie')" class="px-3 py-2 rounded-xl bg-bpNavy hover:bg-bpRoyal text-white text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
            <span>Film Ekle</span>
          </button>

          <button type="button" onclick="openAddContentModal('series')" class="px-3 py-2 rounded-xl bg-bpEmerald hover:bg-bpGreen text-white text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
            <span>Dizi Ekle</span>
          </button>

          <button type="button" onclick="openAddContentModal('episode')" class="px-3 py-2 rounded-xl bg-bpBrown hover:bg-amber-800 text-bpYellow text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
            <span class="hidden sm:inline">Bölüm Ekle</span>
            <span class="sm:hidden">Bölüm</span>
          </button>

          <button
            type="button"
            id="cloud-sync-toggle-btn"
            onclick="toggleCloudSyncPreference()"
            class="px-2.5 py-2 rounded-xl text-xs font-extrabold flex items-center gap-1 transition cursor-pointer border bg-bpEmerald/15 text-bpEmerald border-bpEmerald/40"
            title="Bulut Eşitleme Durumu (Kayıtlı filmleri otomatik eşler)"
          >
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17.5 19H7a5 5 0 0 1-.4-9.98A7 7 0 0 1 20.3 8.2 4.5 4.5 0 0 1 17.5 19Z"/></svg>
            <span id="cloud-sync-toggle-label">Bulut: Açık</span>
          </button>

          <button type="button" onclick="forceCloudRefreshNow()" class="px-2.5 py-2 rounded-xl bg-bpSky hover:bg-bpSkyBorder text-bpNavy text-xs font-extrabold flex items-center gap-1 transition cursor-pointer" title="Buluttan Yenile">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
            <span class="hidden lg:inline">Yenile</span>
          </button>

          <button type="button" onclick="openBackupModal()" class="px-2.5 py-2 rounded-xl bg-bpSky hover:bg-bpSkyBorder text-bpNavy text-xs font-extrabold flex items-center gap-1 transition cursor-pointer" title="Yedekle / Geri Yükle">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            <span class="hidden lg:inline">Yedek</span>
          </button>
        </div>

        <!-- Center: Search Input -->
        <div class="relative order-3 md:order-2 w-full md:flex-1 md:max-w-md min-w-0">
          <div class="relative flex items-center">
            <svg class="w-4 h-4 text-bpRoyal absolute left-3 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
            </svg>
            <input
              type="text"
              id="global-search-input"
              autocomplete="off"
              oninput="handleSearchInput(this.value)"
              placeholder="Film, dizi, tür, tarih veya yıl ara..."
              class="w-full pl-9 pr-16 py-2 rounded-xl bg-bpSky/65 border border-bpSkyBorder focus:border-bpRoyal focus:bg-white focus:outline-none text-xs sm:text-sm font-medium text-bpBlack"
            />
            <button type="button" id="search-clear-btn" onclick="resetSearchInput()" class="hidden absolute right-2 px-2 py-1 rounded-lg bg-bpRed/10 text-bpRed text-[10px] font-extrabold cursor-pointer">
              Temizle
            </button>
          </div>
        </div>
      </div>

      <!-- CATEGORY TABS & LANGUAGE FILTERS -->
      <div class="bg-bpSky/50 border-t border-bpSkyBorder w-full">
        <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 min-w-0 flex-wrap">
            <button type="button" data-nav-tab="all" onclick="switchNavTab('all')" class="nav-tab-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">
              Tüm Arşiv
            </button>
            <button type="button" data-nav-tab="movies" onclick="switchNavTab('movies')" class="nav-tab-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">
              Filmler
            </button>
            <button type="button" data-nav-tab="series" onclick="switchNavTab('series')" class="nav-tab-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">
              Diziler
            </button>

    function drawRoundRectPath(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function renderTextlessBrandPngDataUrl(pxSize = 192) {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = pxSize;
        canvas.height = pxSize;
        const ctx = canvas.getContext('2d');
        const s = pxSize / 48;

        ctx.save();
        ctx.scale(s, s);

        drawRoundRectPath(ctx, 2, 2, 44, 44, 12);
        ctx.fillStyle = '#0B1F3A';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#1D4ED8';
        ctx.stroke();

        const leftBlocks = [
          { y: 10, color: '#EAB308' },
          { y: 18, color: '#EAF4FF' },
          { y: 26, color: '#16A34A' },
          { y: 34, color: '#D92626' }

        leftBlocks.forEach(b => {
          drawRoundRectPath(ctx, 8, b.y, 3.5, 4, 1);

          ctx.fill();
        });

        const rightBlocks = [
          { y: 10, color: '#D92626' },
          { y: 18, color: '#EAB308' },
          { y: 26, color: '#EAF4FF' },

        rightBlocks.forEach(b => {
          drawRoundRectPath(ctx, 36.5, b.y, 3.5, 4, 1);
          ctx.fillStyle = b.color;
          ctx.fill();
        });

        drawRoundRectPath(ctx, 14.5, 11, 19, 26, 4);
        ctx.fillStyle = '#047857';
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(21, 18);
        ctx.lineTo(30, 24);
        ctx.lineTo(21, 30);
        ctx.closePath();
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ctx.restore();
        return canvas.toDataURL('image/png');

    function unlockAudioEngine() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!audioCtxGain) {
          audioCtxGain = new AudioCtx();
        }
        if (audioCtxGain.state === 'suspended') {

        }

    }

    function playIntroChime() {
      try {
        unlockAudioEngine();
        if (!audioCtxGain || audioCtxGain.state !== 'running') return;
        const now = audioCtxGain.currentTime;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = audioCtxGain.createOscillator();
          const gain = audioCtxGain.createGain();
          osc.type = idx === notes.length - 1 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.11);

          gain.gain.setValueAtTime(0.0001, now + idx * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.07, now + idx * 0.11 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.11 + 0.7);

          osc.connect(gain);
          gain.connect(audioCtxGain.destination);
          osc.start(now + idx * 0.11);
          osc.stop(now + idx * 0.11 + 0.75);
        });
      } catch (e) {}
    }

    function isFakePlaceholderItem(item) {
      if (!item) return true;
      if (FAKE_SEED_IDS.has(String(item.id || ''))) return true;
      const t = String(item.title || '').trim().toLowerCase();
      if (FAKE_SEED_TITLES.has(t) && !hasPlayableMedia(item)) return true;
      return false;
    }

    function isValidSourceEntry(s) {
      if (!s || typeof s !== 'object') return false;
      const urlStr = String(s.url || '').trim();
      const hasValidUrl = /^(https?:\/\/|data:video)/i.test(urlStr);
      const hasLiveBlob = urlStr.startsWith('blob:') && Array.from(LOCAL_BLOB_URLS.values()).includes(urlStr);
      return Boolean(s.localKey) || Boolean(s.storagePath) || hasValidUrl || hasLiveBlob;
    }

    function hasPlayableMedia(item) {
      if (!item) return false;
      const checkSources = (srcs) => Array.isArray(srcs) && srcs.some(isValidSourceEntry);
      if (item.type === 'movie') {
        return checkSources(item.sources);
      }
      if (item.type === 'series') {
        return Array.isArray(item.episodes) && item.episodes.some(ep => checkSources(ep && ep.sources));
      }
      return false;
    }

    function normalizeRecoveredItem(raw, fallbackIdx = 0) {
      if (!raw || typeof raw !== 'object') return null;
      const title = String(raw.title || raw.name || '').trim();
      if (!title) return null;

      const inferredType = (raw.type === 'series' || Array.isArray(raw.episodes)) ? 'series' : 'movie';
      const id = String(raw.id || `${inferredType === 'series' ? 'ser' : 'mov'}-rec-${fallbackIdx}-${title.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 10)}`);

      const normalizeSource = (s, idx) => {
        if (!s || typeof s !== 'object') return null;
        return {
          id: s.id || (idx === 1 ? 'dub' : 'sub'),
          label: s.label || (s.defaultMode === 'dub' ? 'TR Dublaj' : 'TR Altyazılı'),
          defaultMode: s.defaultMode || (idx === 1 ? 'dub' : 'sub'),
          url: String(s.url || s.videoUrl || s.src || '').trim(),
          localKey: String(s.localKey || '').trim(),
          storagePath: String(s.storagePath || '').trim(),
          cloudStatus: String(s.cloudStatus || ''),
          durationSec: Number(s.durationSec) || 0,
          trimStart: Number(s.trimStart) || 0,
          trimEnd: Number(s.trimEnd) || 0,
          fileName: String(s.fileName || '')
        };
      };

      let sources = [];
      let episodes = [];

      if (inferredType === 'movie') {
        const rawSources = Array.isArray(raw.sources)
          ? raw.sources
          : ((raw.videoUrl || raw.url || raw.localKey || raw.storagePath) ? [{ id: 'sub', defaultMode: 'sub', url: raw.videoUrl || raw.url || '', localKey: raw.localKey || '', storagePath: raw.storagePath || '' }] : []);
        sources = rawSources.map(normalizeSource).filter(isValidSourceEntry);
      } else {
        const rawEps = Array.isArray(raw.episodes) ? raw.episodes : [];
        episodes = rawEps.map((ep, eIdx) => {
          const epSrcs = Array.isArray(ep.sources)
            ? ep.sources.map(normalizeSource).filter(isValidSourceEntry)
            : ((ep.videoUrl || ep.url || ep.localKey || ep.storagePath) ? [normalizeSource({ id: 'sub', defaultMode: 'sub', url: ep.videoUrl || ep.url || '', localKey: ep.localKey || '', storagePath: ep.storagePath || '' }, 0)].filter(isValidSourceEntry) : []);
          return {
            season: Math.max(1, Number(ep.season) || 1),
            number: Math.max(1, Number(ep.number) || (eIdx + 1)),
            name: String(ep.name || `${Number(ep.number) || (eIdx + 1)}. Bölüm`),
            releaseDate: String(ep.releaseDate || ''),
            duration: String(ep.duration || ''),
            durationSec: Number(ep.durationSec) || 0,
            sources: epSrcs
          };
        }).filter(ep => ep.sources.length > 0);
      }

      const normalized = {
        id,
        type: inferredType,
        title,
        year: Number(raw.year) || new Date().getFullYear(),
        month: raw.month ? Number(raw.month) : null,
        day: raw.day ? Number(raw.day) : null,
        releaseDate: String(raw.releaseDate || raw.year || ''),
        duration: String(raw.duration || ''),
        durationSec: Number(raw.durationSec) || 0,
        genre: String(raw.genre || (inferredType === 'series' ? 'Dizi' : 'Sinema')),
        seasons: inferredType === 'series' ? Math.max(1, Number(raw.seasons) || 1) : undefined,
        hasSub: inferredType === 'movie'
          ? sources.some(s => s.defaultMode === 'sub')
          : episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'sub')),
        hasDub: inferredType === 'movie'
          ? sources.some(s => s.defaultMode === 'dub')
          : episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'dub')),
        posterUrl: String(raw.posterUrl || raw.poster || CINEMA_FALLBACK_PHOTO),
        posterStoragePath: String(raw.posterStoragePath || ''),
        sources: inferredType === 'movie' ? sources : undefined,
        episodes: inferredType === 'series' ? episodes : undefined,
        createdAt: Number(raw.createdAt) || Date.now(),
        updatedAt: Number(raw.updatedAt) || Number(raw.createdAt) || Date.now()
      };

      if (isFakePlaceholderItem(normalized) || !hasPlayableMedia(normalized)) return null;
      return normalized;
    }

    function isValidItem(item) {
      if (!item || !item.id || !item.title || !item.type) return false;
      if (isFakePlaceholderItem(item)) return false;
      if (!hasPlayableMedia(item)) return false;
      return item.type === 'movie' || item.type === 'series';
    }

    function openMediaIDB() {
      if (idbReadyPromise) return idbReadyPromise;
      idbReadyPromise = new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('IndexedDB unavailable'));
          return;
        }
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_VIDEO_STORE)) {
            db.createObjectStore(IDB_VIDEO_STORE);
          }
          if (!db.objectStoreNames.contains(IDB_META_STORE)) {
            db.createObjectStore(IDB_META_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return idbReadyPromise;
    }

    function extractCandidateItemsFromParsed(parsed) {
      const found = [];
      const walk = (node, depth = 0) => {
        if (!node || depth > 4) return;
        if (Array.isArray(node)) {
          node.forEach(el => walk(el, depth + 1));
          return;
        }
        if (typeof node === 'object') {
          if ((node.title || node.name) && (node.type === 'movie' || node.type === 'series' || Array.isArray(node.sources) || Array.isArray(node.episodes) || node.localKey || node.videoUrl || node.storagePath)) {
            const norm = normalizeRecoveredItem(node, found.length);
            if (norm) found.push(norm);
            return;
          }
          Object.values(node).forEach(val => {
            if (val && typeof val === 'object') walk(val, depth + 1);
          });
        }
      };
      walk(parsed, 0);
      return found;
    }

    function mergeRecoveredIntoMap(map, itemsList) {
      (itemsList || []).forEach(raw => {
        const item = normalizeRecoveredItem(raw);
        if (!item || deletedIdsSession.has(item.id)) return;
        const prev = map.get(item.id);
        if (!prev) {
          map.set(item.id, item);
          return;
        }
        const merged = { ...prev, ...item };
        if (item.type === 'movie') {
          const sMap = new Map();
          (prev.sources || []).forEach(s => { if (s && s.id) sMap.set(s.id, { ...s }); });
          (item.sources || []).forEach(s => {
            if (!s || !s.id) return;
            const oldS = sMap.get(s.id) || {};
            sMap.set(s.id, {
              ...oldS,
              ...s,
              url: s.url || oldS.url || '',
              localKey: s.localKey || oldS.localKey || '',
              storagePath: s.storagePath || oldS.storagePath || '',
              cloudStatus: s.cloudStatus || oldS.cloudStatus || ''
            });
          });
          merged.sources = Array.from(sMap.values()).filter(isValidSourceEntry);
          merged.hasSub = merged.sources.some(s => s.defaultMode === 'sub');
          merged.hasDub = merged.sources.some(s => s.defaultMode === 'dub');
        } else {
          const epMap = new Map();
          (prev.episodes || []).forEach(e => epMap.set(`${e.season}_${e.number}`, { ...e }));
          (item.episodes || []).forEach(e => {
            const k = `${e.season}_${e.number}`;
            const oldE = epMap.get(k);
            if (!oldE) {
              epMap.set(k, { ...e });
            } else {
              const esMap = new Map();
              (oldE.sources || []).forEach(s => { if (s && s.id) esMap.set(s.id, { ...s }); });
              (e.sources || []).forEach(s => {
                if (!s || !s.id) return;
                const os = esMap.get(s.id) || {};
                esMap.set(s.id, {
                  ...os,
                  ...s,
                  url: s.url || os.url || '',
                  localKey: s.localKey || os.localKey || '',
                  storagePath: s.storagePath || os.storagePath || '',
                  cloudStatus: s.cloudStatus || os.cloudStatus || ''
                });
              });
              epMap.set(k, { ...oldE, ...e, sources: Array.from(esMap.values()).filter(isValidSourceEntry) });
            }
          });
          merged.episodes = Array.from(epMap.values())
            .filter(ep => Array.isArray(ep.sources) && ep.sources.length > 0)
            .sort((a, b) => (a.season - b.season) || (a.number - b.number));
          merged.hasSub = merged.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'sub'));
          merged.hasDub = merged.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'dub'));
        }
        if ((!merged.posterUrl || merged.posterUrl === CINEMA_FALLBACK_PHOTO || merged.posterUrl.startsWith('blob:')) && prev.posterUrl && !prev.posterUrl.startsWith('blob:')) {
          merged.posterUrl = prev.posterUrl;
        }
        if (isValidItem(merged)) {
          map.set(item.id, merged);
        }
      });
    }

    function readCatalogFromLocalStorage() {
      const mergedMap = new Map();
      const keysToScan = new Set(LEGACY_CATALOG_KEYS);
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k) keysToScan.add(k);
        }
      } catch (e) {}

      for (const k of keysToScan) {
        try {
          const raw = localStorage.getItem(k);
          if (!raw || (raw[0] !== '[' && raw[0] !== '{')) continue;
          const parsed = JSON.parse(raw);
          const extracted = extractCandidateItemsFromParsed(parsed);
          mergeRecoveredIntoMap(mergedMap, extracted);
        } catch (e) {}
      }
      return Array.from(mergedMap.values()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    }

    function sanitizeItemForStorage(item) {
      const copy = JSON.parse(JSON.stringify(item));
      if (copy.posterUrl && copy.posterUrl.startsWith('blob:')) {
        copy.posterUrl = CINEMA_FALLBACK_PHOTO;
      } else if (copy.posterUrl && copy.posterUrl.startsWith('data:image/') && copy.posterUrl.length > 260000) {
        copy.posterUrl = CINEMA_FALLBACK_PHOTO;
      }
      return copy;
    }

    function writeCatalogToStorage(list) {
      const safeList = (list || []).filter(isValidItem).map(sanitizeItemForStorage);
      try {
        localStorage.setItem(CATALOG_STORAGE_KEY, JSON.stringify(safeList));
      } catch (e) {}

      openMediaIDB().then(db => {
        const tx = db.transaction(IDB_META_STORE, 'readwrite');
        tx.objectStore(IDB_META_STORE).put(safeList, 'catalog_items');
      }).catch(() => {});
    }

    async function inspectSingleIDBDatabase(dbName, metaOut, orphanVideosOut) {
      try {
        if (!window.indexedDB) return;
        await new Promise((resolve) => {
          const req = indexedDB.open(dbName);
          req.onsuccess = () => {
            const db = req.result;
            const storeNames = Array.from(db.objectStoreNames || []);
            if (storeNames.length === 0) {
              db.close();
              resolve();
              return;
            }
            const tx = db.transaction(storeNames, 'readonly');
            let pending = storeNames.length;
            const doneOne = () => {
              pending--;
              if (pending <= 0) {
                try { db.close(); } catch (e) {}
                resolve();
              }
            };

            storeNames.forEach(sName => {
              try {
                const store = tx.objectStore(sName);
                const keysReq = store.getAllKeys();
                const valsReq = store.getAll();
                let kDone = false;
                let vDone = false;
                let keysArr = [];
                let valsArr = [];

                const checkPair = () => {
                  if (!kDone || !vDone) return;
                  valsArr.forEach((val, idx) => {
                    const key = keysArr[idx];
                    if (val instanceof Blob || val instanceof File) {
                      const strKey = String(key || '');
                      if (strKey) {
                        LOCAL_IDB_KEYS_PRESENT.add(strKey);
                        orphanVideosOut.push({
                          localKey: strKey,
                          fileName: val.name || `Kayıtlı Video (${strKey.slice(-6)})`,
                          size: val.size || 0,
                          dbName
                        });
                      }
                    } else if (val && typeof val === 'object') {
                      const extracted = extractCandidateItemsFromParsed(val);
                      extracted.forEach(it => metaOut.push(it));
                    }
                  });
                  doneOne();
                };

                keysReq.onsuccess = () => { keysArr = keysReq.result || []; kDone = true; checkPair(); };
                keysReq.onerror = () => { kDone = true; checkPair(); };
                valsReq.onsuccess = () => { valsArr = valsReq.result || []; vDone = true; checkPair(); };
                valsReq.onerror = () => { vDone = true; checkPair(); };
              } catch (e) {
                doneOne();
              }
            });
          };
          req.onerror = () => resolve();
        });
      } catch (e) {}
    }

    async function hydrateCatalogFromIDBIfNeeded() {
      try {
        const map = new Map();
        (state.catalog || []).filter(isValidItem).forEach(item => map.set(item.id, item));

        const dbNameSet = new Set(LEGACY_IDB_NAMES);
        if (window.indexedDB && typeof indexedDB.databases === 'function') {
          try {
            const dbs = await indexedDB.databases();
            (dbs || []).forEach(info => {
              if (info && info.name && (info.name.includes('birperde') || info.name.includes('media') || info.name.includes('catalog'))) {
                dbNameSet.add(info.name);
              }
            });
          } catch (e) {}
        }

        const recoveredMeta = [];
        const storedVideoBlobs = [];
        for (const dbName of dbNameSet) {
          await inspectSingleIDBDatabase(dbName, recoveredMeta, storedVideoBlobs);
        }

        mergeRecoveredIntoMap(map, recoveredMeta);

        const availableBlobKeys = new Set(storedVideoBlobs.map(v => v.localKey));

        // Keep items that have a remote URL/storagePath OR exist locally in this device's IndexedDB
        for (const [id, item] of Array.from(map.entries())) {
          if (item.type === 'movie') {
            item.sources = (item.sources || []).filter(s => {
              if (/^(https?:\/\/|data:video)/i.test(s.url || '') || s.storagePath) return true;
              if (s.localKey && (LOCAL_BLOB_URLS.has(s.localKey) || availableBlobKeys.has(s.localKey))) return true;
              return false;
            });
            if (item.sources.length === 0) map.delete(id);
          } else if (item.type === 'series') {
            item.episodes = (item.episodes || []).map(ep => {
              ep.sources = (ep.sources || []).filter(s => {
                if (/^(https?:\/\/|data:video)/i.test(s.url || '') || s.storagePath) return true;
                if (s.localKey && (LOCAL_BLOB_URLS.has(s.localKey) || availableBlobKeys.has(s.localKey))) return true;
                return false;
              });
              return ep;
            }).filter(ep => ep.sources.length > 0);
            if (item.episodes.length === 0) map.delete(id);
          }
        }

        const referencedLocalKeys = new Set();
        map.forEach(item => {
          (item.sources || []).forEach(s => { if (s && s.localKey) referencedLocalKeys.add(s.localKey); });
          (item.episodes || []).forEach(ep => {
            (ep.sources || []).forEach(s => { if (s && s.localKey) referencedLocalKeys.add(s.localKey); });
          });
        });

        let orphanCount = 0;
        storedVideoBlobs.forEach(v => {
          if (!v.localKey || referencedLocalKeys.has(v.localKey)) return;
          referencedLocalKeys.add(v.localKey);
          const parsed = parseFilenameTitleYear(v.fileName);
          const cleanTitle = parsed.title || `Kayıtlı Video ${orphanCount + 1}`;
          const recId = `mov-idb-${v.localKey}`;
          if (!deletedIdsSession.has(recId) && !map.has(recId)) {
            map.set(recId, {
              id: recId,
              type: 'movie',
              title: cleanTitle,
              year: parsed.year || new Date().getFullYear(),
              month: parsed.month || null,
              day: parsed.day || null,
              releaseDate: `${parsed.year || new Date().getFullYear()}`,
              duration: '',
              durationSec: 0,
              genre: 'Sinema',
              hasSub: true,
              hasDub: false,
              posterUrl: CINEMA_FALLBACK_PHOTO,
              posterStoragePath: '',
              sources: [{
                id: 'sub',
                label: 'TR Altyazılı',
                defaultMode: 'sub',
                url: '',
                localKey: v.localKey,
                storagePath: '',
                durationSec: 0,
                trimStart: 0,
                trimEnd: 0,
                fileName: v.fileName
              }],
              createdAt: Date.now() - orphanCount * 1000
            });
            orphanCount++;
          }
        });

        const beforeCount = (state.catalog || []).length;
        state.catalog = Array.from(map.values())
          .filter(isValidItem)
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        writeCatalogToStorage(state.catalog);
        renderMainView();

        if (state.catalog.length > beforeCount) {
          showToast(`${state.catalog.length - beforeCount} kayıtlı içeriğiniz cihaz arşivinden geri yüklendi.`, 'success');
        }
      } catch (e) {}
    }

    async function getLocalFileFromIDB(localKey) {
      if (!localKey) return null;
      const dbNameSet = new Set(LEGACY_IDB_NAMES);
      if (window.indexedDB && typeof indexedDB.databases === 'function') {
        try {
          const dbs = await indexedDB.databases();
          (dbs || []).forEach(info => { if (info && info.name) dbNameSet.add(info.name); });
        } catch (e) {}
      }
      for (const dbName of dbNameSet) {
        try {
          const found = await new Promise((resolve) => {
            const req = indexedDB.open(dbName);
            req.onsuccess = () => {
              const db = req.result;
              const stores = Array.from(db.objectStoreNames || []);
              if (!stores.includes(IDB_VIDEO_STORE)) {
                db.close();
                resolve(null);
                return;
              }
              const tx = db.transaction(IDB_VIDEO_STORE, 'readonly');
              const getReq = tx.objectStore(IDB_VIDEO_STORE).get(localKey);
              getReq.onsuccess = () => {
                const f = getReq.result || null;
                db.close();
                resolve(f);
              };
              getReq.onerror = () => {
                db.close();
                resolve(null);
              };
            };
            req.onerror = () => resolve(null);
          });
          if (found) return found;
        } catch (e) {}
      }
      return null;
    }

    async function resolvePlayableUrl(source) {
      if (!source) return { url: '', reason: 'no_source' };

      // 1. Check current session memory Blob URL
      if (source.localKey && LOCAL_BLOB_URLS.has(source.localKey)) {
        return { url: LOCAL_BLOB_URLS.get(source.localKey), reason: 'local_mem' };
      }

      // 2. Check current browser IndexedDB
      if (source.localKey) {
        const storedFile = await getLocalFileFromIDB(source.localKey);
        if (storedFile) {
          const freshBlobUrl = URL.createObjectURL(storedFile);
          LOCAL_BLOB_URLS.set(source.localKey, freshBlobUrl);
          LOCAL_IDB_KEYS_PRESENT.add(source.localKey);
          return { url: freshBlobUrl, reason: 'local_idb' };
        }
      }

      // 3. Check Cloud Direct HTTPS URL
      if (source.url && /^https?:\/\//i.test(source.url)) {
        return { url: source.url, reason: 'cloud_url' };
      }

      // 4. Resolve via Firebase Storage Path
      if (source.storagePath) {
        try {
          await ensureFirebaseAuth();
          if (fbStorage) {
            const dlUrl = await getDownloadURL(storageRef(fbStorage, source.storagePath));
            if (dlUrl) {
              source.url = dlUrl;
              return { url: dlUrl, reason: 'cloud_storage' };
            }
          }
        } catch (e) {}
      }

      // 5. If localKey exists but wasn't found here, it means it belongs to another device and cloud upload didn't finish
      if (source.localKey) {
        return { url: '', reason: 'other_device_pending_cloud' };
      }

      return { url: '', reason: 'missing' };
    }

    function getItemStatusBadge(item) {
      const allSources = [];
      if (item.type === 'movie') {

      if (allSources.length === 0) {
        return { text: 'Kaynak Yok', cls: 'bg-bpRed text-white' };
      }
      const hasCloud = allSources.some(s => /^https?:\/\//i.test(s.url || '') || Boolean(s.storagePath));
      if (hasCloud) {
        return { text: 'Bulutta Hazır (Tüm Cihazlar)', cls: 'bg-bpEmerald text-white' };

      const hasLocalHere = allSources.some(s => s.localKey && (LOCAL_BLOB_URLS.has(s.localKey) || LOCAL_IDB_KEYS_PRESENT.has(s.localKey)));
      if (hasLocalHere) {
        return { text: 'Bu Cihazda Hazır', cls: 'bg-bpRoyal text-white' };

      if (allSources.some(s => s.localKey)) {
        return { text: 'Diğer Cihazda (Bulut Bekliyor)', cls: 'bg-amber-600 text-white' };

      return { text: 'Bekliyor', cls: 'bg-amber-600 text-white' };

    function findNextEpisodeInfo() {
      const m = state.player.media;
      if (!m || m.type !== 'series' || !Array.isArray(m.episodes)) return null;
      const sorted = [...m.episodes].sort((a, b) => (Number(a.season) - Number(b.season)) || (Number(a.number) - Number(b.number)));
      const curIdx = sorted.findIndex(e => Number(e.season) === Number(state.player.season) && Number(e.number) === Number(state.player.episode));
      if (curIdx >= 0 && curIdx + 1 < sorted.length) {
        return sorted[curIdx + 1];
      }
      const sameSeasonNext = sorted.find(e => Number(e.season) === Number(state.player.season) && Number(e.number) > Number(state.player.episode));
      if (sameSeasonNext) return sameSeasonNext;
      return sorted.find(e => Number(e.season) > Number(state.player.season)) || null;
    }

    function updateNextEpisodeButtonVisibility(relCur, relDur) {
      const nextBtn = document.getElementById('bp-next-ep-btn');
      if (!nextBtn) return;
      const nextEp = findNextEpisodeInfo();
      if (!nextEp || state.player.media?.type !== 'series') {
        nextBtn.classList.add('hidden');

      const remaining = relDur > 0 ? Math.max(0, relDur - relCur) : 0;
      const nearEnd = relDur > 0 && (remaining <= 35 || (relCur / relDur) >= 0.88);
      nextBtn.classList.toggle('hidden', !nearEnd);
    }

    function persistAndRenderCatalog() {

    /* =====================================================================
       5. FIREBASE AUTH, FIRESTORE & STORAGE UPLOAD ENGINE
    ===================================================================== */
    async function ensureFirebaseAuth() {
      if (!state.cloudSyncEnabled) return null;
      if (!fbAuth) {
        try {
          const app = initializeApp(firebaseConfig);
          fbAuth = getAuth(app);
          fbDb = getFirestore(app);
          fbStorage = getStorage(app);
        } catch (e) {
          return null;
        }
      }
      if (fbAuth.currentUser) return fbAuth.currentUser;
      try {
        if (!authReadyPromise) {
          authReadyPromise = signInAnonymously(fbAuth);
        }
        const cred = await authReadyPromise;
        return cred ? cred.user : fbAuth.currentUser;
      } catch (e) {
        authReadyPromise = null;
        return null;
      }
    }

    function mergeCloudSnapshotDocs(docsList) {
      if (!Array.isArray(docsList) || docsList.length === 0) return;
      const map = new Map();
      (state.catalog || []).filter(item => isValidItem(item) && !deletedIdsSession.has(item.id)).forEach(item => {
        map.set(item.id, item);
      });

      const beforeSize = map.size;
      mergeRecoveredIntoMap(map, docsList);

      state.catalog = Array.from(map.values())
        .filter(isValidItem)
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      writeCatalogToStorage(state.catalog);
      renderMainView();

      const addedFromCloud = state.catalog.length - beforeSize;
      if (addedFromCloud > 0) {
        showToast(`${addedFromCloud} kayıtlı içerik buluttan senkronize edildi.`, 'success');
      }
    }

    async function fetchRealtimeDbBackupCatalog() {
      const endpoints = [
        `${firebaseConfig.databaseURL}/birperde_catalog.json`,
        `${firebaseConfig.databaseURL}/catalog.json`
      ];
      const collected = [];
      for (const ep of endpoints) {
        try {
          const resp = await fetch(ep);
          if (!resp.ok) continue;
          const data = await resp.json();
          if (!data || typeof data !== 'object') continue;
          const extracted = extractCandidateItemsFromParsed(data);
          if (extracted.length > 0) {
            collected.push(...extracted);
            break;
          }
        } catch (e) {}
      }
      return collected;
    }

    async function discoverOrphanStorageVideos() {
      if (!fbStorage) return [];
      const recovered = [];
      const foldersToScan = ['birperde_videos', 'videos', 'uploads'];
      const knownUrls = new Set();
      (state.catalog || []).forEach(it => {
        (it.sources || []).forEach(s => { if (s.url) knownUrls.add(s.url); });
        (it.episodes || []).forEach(ep => (ep.sources || []).forEach(s => { if (s.url) knownUrls.add(s.url); }));
      });

      for (const folder of foldersToScan) {
        try {
          const listRes = await listAll(storageRef(fbStorage, folder));
          for (const itemRef of (listRes.items || [])) {
            try {
              const dlUrl = await getDownloadURL(itemRef);
              if (!dlUrl || knownUrls.has(dlUrl)) continue;
              knownUrls.add(dlUrl);
              const parsed = parseFilenameTitleYear(itemRef.name);
              const cleanTitle = parsed.title || itemRef.name.replace(/\.[^/.]+$/, '');
              const id = 'mov-st-' + itemRef.name.replace(/[^a-zA-Z0-9]/g, '').slice(0, 20);
              recovered.push({
                id,
                type: 'movie',
                title: cleanTitle,
                year: parsed.year || new Date().getFullYear(),
                month: parsed.month || null,
                day: parsed.day || null,
                releaseDate: `${parsed.year || new Date().getFullYear()}`,
                duration: '',
                durationSec: 0,
                genre: 'Sinema',
                hasSub: true,
                hasDub: false,
                posterUrl: CINEMA_FALLBACK_PHOTO,
                posterStoragePath: '',
                sources: [{
                  id: 'sub',
                  label: 'TR Altyazılı',
                  defaultMode: 'sub',
                  url: dlUrl,
                  localKey: '',
                  storagePath: itemRef.fullPath,
                  durationSec: 0,
                  trimStart: 0,
                  trimEnd: 0,
                  fileName: itemRef.name
                }],
                createdAt: Date.now() - 5000
              });
            } catch (e) {}
          }
        } catch (e) {}
      }
      return recovered;
    }

    function initOptionalCloudSync(manualTrigger = false) {
      if (!state.cloudSyncEnabled) return;
      if (cloudSyncInProgress && !manualTrigger) return;
      cloudSyncInProgress = true;

      fetchRealtimeDbBackupCatalog().then(rtdbDocs => {
        if (rtdbDocs.length > 0) mergeCloudSnapshotDocs(rtdbDocs);
      }).catch(() => {});

      ensureFirebaseAuth().then(async (user) => {
        try {
          if (!fbDb || !state.cloudSyncEnabled) return;
          const collectionsToCheck = ['birperde_catalog', 'catalog', 'movies', 'series'];
          for (const colName of collectionsToCheck) {
            try {
              const snap = await getDocs(collection(fbDb, colName));
              const docs = [];
              snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
              if (docs.length > 0) mergeCloudSnapshotDocs(docs);
            } catch (e) {}
          }

          const storageDocs = await discoverOrphanStorageVideos();
          if (storageDocs.length > 0) {
            mergeCloudSnapshotDocs(storageDocs);
          }

          if (!cloudUnsubscribe) {
            cloudUnsubscribe = onSnapshot(collection(fbDb, 'birperde_catalog'), (snap) => {
              if (!state.cloudSyncEnabled) return;
              const liveDocs = [];
              snap.forEach(d => liveDocs.push({ id: d.id, ...d.data() }));
              mergeCloudSnapshotDocs(liveDocs);
            }, () => {});
          }
        } finally {
          cloudSyncInProgress = false;
        }
      }).catch(() => {
        cloudSyncInProgress = false;
      });
    }

    async function syncMetaToFirestoreSilent(item) {
      if (!state.cloudSyncEnabled || !item || deletedIdsSession.has(item.id)) return;
      const payload = sanitizeItemForStorage(item);
      try {
        fetch(`${firebaseConfig.databaseURL}/birperde_catalog/${encodeURIComponent(payload.id)}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});
      } catch (e) {}

      try {
        await ensureFirebaseAuth();
        if (!fbDb) return;
        await setDoc(doc(fbDb, 'birperde_catalog', payload.id), payload, { merge: true });
      } catch (e) {}
    }

    async function removeItemFromFirestoreSilent(item) {
      if (!item) return;
      deletedIdsSession.add(item.id);
      if (!state.cloudSyncEnabled) return;
      try {
        fetch(`${firebaseConfig.databaseURL}/birperde_catalog/${encodeURIComponent(item.id)}.json`, {
          method: 'DELETE'
        }).catch(() => {});
      } catch (e) {}

      try {
        await ensureFirebaseAuth();
        if (fbDb) await deleteDoc(doc(fbDb, 'birperde_catalog', item.id));
        if (fbStorage) {
          const paths = [];
          if (item.posterStoragePath) paths.push(item.posterStoragePath);
          (item.sources || []).forEach(s => { if (s.storagePath) paths.push(s.storagePath); });
          (item.episodes || []).forEach(ep => {
            (ep.sources || []).forEach(s => { if (s.storagePath) paths.push(s.storagePath); });
          });
          for (const p of paths) {
            deleteObject(storageRef(fbStorage, p)).catch(() => {});
          }
        }
      } catch (e) {}
    }

    function setSyncBanner(show, text = '', pct = 0) {
      const banner = document.getElementById('background-sync-banner');
      const txt = document.getElementById('background-sync-text');
      const pctEl = document.getElementById('background-sync-pct');
      const barEl = document.getElementById('background-sync-bar');
      if (!banner) return;
      if (!show) {
        banner.classList.add('hidden');
        return;
      }
      banner.classList.remove('hidden');
      if (txt) txt.textContent = text;
      if (pctEl) pctEl.textContent = `%${pct}`;
      if (barEl) barEl.style.width = `${Math.max(2, Math.min(100, pct))}%`;
    }

    function formatBytesMb(bytes) {
      return (Number(bytes || 0) / 1048576).toFixed(1) + ' MB';
    }

    async function runOptionalBackgroundUploads(itemId, tasks) {
      if (!state.cloudSyncEnabled || !tasks || tasks.length === 0) return;
      cloudUploadCancelFlag = false;
      activeCloudUploads++;
      try {
        setSyncBanner(true, 'Bulut bağlantısı kuruluyor...', 1);
        await ensureFirebaseAuth();
        if (!fbStorage) {
          setSyncBanner(false);
          showToast('Firebase Storage başlatılamadı. Video sadece bu cihazda kayıtlı.', 'error');
          return;
        }
        if (cloudUploadCancelFlag) return;

        for (const task of tasks) {
          if (cloudUploadCancelFlag || !state.cloudSyncEnabled) break;
          const totalMb = formatBytesMb(task.file.size);
          setSyncBanner(true, `Buluta yükleniyor: ${task.title} (${task.label}) • 0.0 MB / ${totalMb}`, 1);

          const cleanName = (task.file.name || 'media.mp4').replace(/[^a-zA-Z0-9._-]/g, '_');
          const path = `${task.folder}/${Date.now()}_${Math.random().toString(36).slice(2, 6)}_${cleanName}`;
          const ref = storageRef(fbStorage, path);
          const uploadTask = uploadBytesResumable(ref, task.file, {
            contentType: task.file.type || 'video/mp4'
          });

          let stallTimer = setTimeout(() => {
            showToast('Yükleme başlamadı: Firebase Storage kurallarını (Rules) kontrol edin.', 'error');
          }, 12000);

          await new Promise((resolve) => {
            uploadTask.on(
              'state_changed',
              (snap) => {
                if (snap.bytesTransferred > 0 && stallTimer) {
                  clearTimeout(stallTimer);
                  stallTimer = null;
                }
                if (cloudUploadCancelFlag) {
                  try { uploadTask.cancel(); } catch (e) {}
                  resolve();
                  return;
                }
                if (snap.totalBytes > 0) {
                  const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
                  const sentMb = formatBytesMb(snap.bytesTransferred);
                  setSyncBanner(
                    true,
                    `Buluta yükleniyor: ${task.title} (${task.label}) • ${sentMb} / ${totalMb}`,
                    pct
                  );
                }
              },
              (err) => {
                if (stallTimer) clearTimeout(stallTimer);
                const code = err && err.code ? err.code : '';
                if (code === 'storage/unauthorized') {
                  showToast('Firebase Storage yazma izni kapalı (storage/unauthorized). Rules ayarını açın.', 'error');
                } else if (code !== 'storage/canceled') {
                  showToast(`Bulut yükleme hatası (${code || 'Ağ hatası'}). Video bu cihazda korunuyor.`, 'error');
                }
                resolve();
              },
              async () => {
                if (stallTimer) clearTimeout(stallTimer);
                try {
                  const url = await getDownloadURL(uploadTask.snapshot.ref);
                  const target = state.catalog.find(m => m.id === itemId);
                  if (target && url) {
                    if (task.kind === 'poster') {
                      target.posterUrl = url;
                      target.posterStoragePath = path;
                    } else if (task.kind === 'movie_source') {
                      const sObj = (target.sources || []).find(s => s.id === task.sourceId);
                      if (sObj) {
                        sObj.url = url;
                        sObj.storagePath = path;
                        sObj.cloudStatus = 'ready';
                      }
                    } else if (task.kind === 'episode_source') {
                      const ep = (target.episodes || []).find(e => Number(e.season) === Number(task.season) && Number(e.number) === Number(task.episode));
                      const sObj = ep && (ep.sources || []).find(s => s.id === task.sourceId);
                      if (sObj) {
                        sObj.url = url;
                        sObj.storagePath = path;
                        sObj.cloudStatus = 'ready';
                      }
                    }
                    persistAndRenderCatalog();
                    await syncMetaToFirestoreSilent(target);
                    showToast(`"${task.title}" (${task.label}) buluta yüklendi, artık tüm cihazlardan izlenebilir!`, 'success');
                  }
                } catch (e) {}
                resolve();
              }
            );
          });
        }
      } finally {
        activeCloudUploads = Math.max(0, activeCloudUploads - 1);
        if (activeCloudUploads === 0) {
          setSyncBanner(false);
        }
      }
    }

    /* =====================================================================
       6. AUTOMATIC DURATION ENGINE
    ===================================================================== */
    function formatDurationFromSeconds(sec) {
      const s = Math.max(0, Math.round(Number(sec) || 0));
      if (!s) return '';
      const mins = Math.max(1, Math.round(s / 60));
      if (mins >= 60) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return m > 0 ? `${h} sa ${m} dk` : `${h} sa`;
      }
      return `${mins} dk`;
    }

    function formatDurationFromMillis(ms) {
      const n = Number(ms) || 0;
      if (!n) return '';
      return formatDurationFromSeconds(n / 1000);
    }

    function formatPreciseTime(sec) {
      const val = Math.max(0, Number(sec) || 0);
      const mins = Math.floor(val / 60);
      const secs = Math.floor(val % 60);
      const tenths = Math.floor((val * 10) % 10);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${tenths}`;
    }

    function inspectVideoFileOrUrl(sourceObjOrFile) {
      return new Promise((resolve) => {
        let objectUrlToRevoke = '';
        let srcUrl = '';

        if (sourceObjOrFile instanceof File || sourceObjOrFile instanceof Blob) {
          objectUrlToRevoke = URL.createObjectURL(sourceObjOrFile);
          srcUrl = objectUrlToRevoke;
        } else if (typeof sourceObjOrFile === 'string') {
          srcUrl = sourceObjOrFile.trim();
        }

        if (!srcUrl) {
          resolve({ durationSec: 0, durationLabel: '', frameUrl: '' });
          return;
        }

        const vid = document.createElement('video');
        vid.preload = 'metadata';
        vid.muted = true;
        vid.playsInline = true;
        vid.src = srcUrl;

        let settled = false;
        const finish = (payload) => {
          if (settled) return;
          settled = true;
          try { vid.removeAttribute('src'); vid.load(); } catch (e) {}
          if (objectUrlToRevoke) {
            setTimeout(() => {
              try { URL.revokeObjectURL(objectUrlToRevoke); } catch (e) {}
            }, 300);
          }
          resolve(payload);
        };

        const timeout = setTimeout(() => {
          const d = (vid.duration && isFinite(vid.duration) && vid.duration > 0) ? vid.duration : 0;
          finish({
            durationSec: d,
            durationLabel: d > 0 ? formatDurationFromSeconds(d) : '',
            frameUrl: ''
          });
        }, 2500);

        vid.onloadedmetadata = () => {
          clearTimeout(timeout);
          const rawDur = (vid.duration && isFinite(vid.duration) && vid.duration > 0) ? vid.duration : 0;
          const durLabel = rawDur > 0 ? formatDurationFromSeconds(rawDur) : '';
          finish({ durationSec: rawDur, durationLabel: durLabel, frameUrl: '' });
        };

        vid.onerror = () => {
          clearTimeout(timeout);
          finish({ durationSec: 0, durationLabel: '', frameUrl: '' });
        };
      });
    }

    /* =====================================================================
       7. BROAD MULTI-SOURCE METADATA SEARCH
    ===================================================================== */
    const GENRE_MAP = {
      'action': 'Aksiyon',
      'adventure': 'Macera',
      'action & adventure': 'Aksiyon, Macera',
      'animation': 'Animasyon',
      'anime': 'Anime',
      'comedy': 'Komedi',
      'crime': 'Suç',
      'documentary': 'Belgesel',
      'drama': 'Dram',
      'family': 'Aile',
      'fantasy': 'Fantastik',
      'history': 'Tarih',
      'horror': 'Korku',
      'kids': 'Çocuk',
      'music': 'Müzik',
      'musical': 'Müzikal',
      'mystery': 'Gizem',
      'romance': 'Romantik',
      'sci-fi': 'Bilim Kurgu',
      'science fiction': 'Bilim Kurgu',
      'sci-fi & fantasy': 'Bilim Kurgu, Fantastik',
      'thriller': 'Gerilim',
      'war': 'Savaş',
      'western': 'Vahşi Batı',
      'sports': 'Spor',
      'tv shows': 'Dizi',
      'movies': 'Sinema'
    };

    function toTurkishGenre(raw, fallbackType = 'movie') {
      if (!raw) return fallbackType === 'series' ? 'Dizi' : 'Sinema';
      const parts = String(raw).split(/[,/&]+/).map(s => s.trim()).filter(Boolean);
      const translated = parts.map(p => {
        const lower = p.toLowerCase();
        if (GENRE_MAP[lower]) return GENRE_MAP[lower];
        for (const [k, v] of Object.entries(GENRE_MAP)) {
          if (lower.includes(k)) return v;
        }
        return p;
      });
      return Array.from(new Set(translated)).slice(0, 3).join(', ') || (fallbackType === 'series' ? 'Dizi' : 'Sinema');
    }

    function parseDateParts(isoOrStr) {
      if (!isoOrStr) return { year: null, month: null, day: null, fullDate: '' };
      const str = String(isoOrStr).trim();
      const ymd = str.match(/\b(19\d{2}|20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})\b/);
      if (ymd) {
        const y = Number(ymd[1]);
        const m = Math.min(12, Math.max(1, Number(ymd[2])));
        const d = Math.min(31, Math.max(1, Number(ymd[3])));
        return {
          year: y,
          month: m,
          day: d,
          fullDate: `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`
        };
      }
      const ym = str.match(/\b(19\d{2}|20\d{2})[-/.](\d{1,2})\b/);
      if (ym) {
        const y = Number(ym[1]);
        const m = Math.min(12, Math.max(1, Number(ym[2])));
        return { year: y, month: m, day: null, fullDate: `${y}-${String(m).padStart(2, '0')}` };
      }
      const yOnly = str.match(/\b(19\d{2}|20\d{2})\b/);
      if (yOnly) {
        return { year: Number(yOnly[1]), month: null, day: null, fullDate: String(yOnly[1]) };
      }
      return { year: null, month: null, day: null, fullDate: '' };
    }

    function extractSeasonEpisodeFromText(text) {
      if (!text) return { season: null, episode: null, epTitle: '', seriesName: text };
      const sxe = text.match(/s(?:eason)?\s*0*(\d+)\s*e(?:p(?:isode)?)?\s*0*(\d+)/i);
      if (sxe) {
        const seriesName = text.slice(0, sxe.index).replace(/[-–:|.]+$/g, '').trim();
        return { season: Number(sxe[1]), episode: Number(sxe[2]), epTitle: '', seriesName: seriesName || text };
      }
      const trEp = text.match(/(\d+)\.\s*sezon\s*(\d+)\.\s*b[öo]l[üü]m/i);
      if (trEp) {
        const seriesName = text.slice(0, trEp.index).replace(/[-–:|.]+$/g, '').trim();
        return { season: Number(trEp[1]), episode: Number(trEp[2]), epTitle: '', seriesName: seriesName || text };
      }
      const onlyEp = text.match(/\b(\d+)\.\s*b[öo]l[üü]m\b/i) || text.match(/\bep(?:isode)?\s*0*(\d+)\b/i);
      if (onlyEp) {
        const seriesName = text.slice(0, onlyEp.index).replace(/[-–:|.]+$/g, '').trim();
        return { season: 1, episode: Number(onlyEp[1]), epTitle: '', seriesName: seriesName || text };
      }
      return { season: null, episode: null, epTitle: '', seriesName: text };
    }

    function parseFilenameTitleYear(filename) {
      if (!filename) return { title: '', year: null, month: null, day: null };
      let base = filename.replace(/\.[^/.]+$/, '');
      const dateParts = parseDateParts(base);
      const yMatch = base.match(/\b(19\d{2}|20\d{2})\b/);
      if (yMatch) base = base.slice(0, yMatch.index);
      base = base
        .replace(/\(.*?\)|\[.*?\]/g, ' ')
        .replace(/\b(1080p|720p|480p|2160p|4k|bluray|web-dl|webrip|hdrip|x264|x265|hevc|tr|dublaj|altyazili|altyazı)\b/gi, ' ')
        .replace(/^\d+_\w+_/, '')
        .replace(/[._-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return {
        title: base,
        year: dateParts.year,
        month: dateParts.month,
        day: dateParts.day
      };
    }

    async function queryBroadMediaMetadata(query, mediaType = 'movie', seasonNum = null, epNum = null) {
      const epParsed = extractSeasonEpisodeFromText(query || '');
      const rawClean = (epParsed.seriesName || query || '')
        .replace(/\b(19\d{2}|20\d{2})\b/g, '')
        .trim();

      if (!rawClean || rawClean.length < 1) return [];

      const results = [];
      const targetS = seasonNum || epParsed.season || 1;
      const targetE = epNum || epParsed.episode || null;

      const fetchJsonSafe = async (url) => {
        try {
          const resp = await fetch(url);
          if (!resp.ok) return null;
          return await resp.json();
        } catch (e) {
          return null;
        }
      };

      const fetchItunesBroad = async (country, mediaParam) => {
        const data = await fetchJsonSafe(
          `https://itunes.apple.com/search?term=${encodeURIComponent(rawClean)}&country=${country}&media=${mediaParam}&limit=15`
        );
        if (!data || !Array.isArray(data.results)) return;
        for (const item of data.results) {
          const title = item.trackName || item.collectionName || item.artistName || '';
          if (!title) continue;
          const dp = parseDateParts(item.releaseDate || '');
          const posterUrl = item.artworkUrl100
            ? item.artworkUrl100.replace(/100x100bb\.(jpg|png)/i, '600x600bb.$1')
            : '';
          const genre = toTurkishGenre(item.primaryGenreName || '', mediaType);
          const duration = item.trackTimeMillis ? formatDurationFromMillis(item.trackTimeMillis) : '';
          results.push({
            title,
            year: dp.year || new Date().getFullYear(),
            month: dp.month || 1,
            day: dp.day || null,
            releaseDate: dp.fullDate || '',
            posterUrl,
            genre,
            duration,
            season: targetS,
            episode: targetE,
            epTitle: '',
            sourceLabel: `iTunes (${country.toUpperCase()})`,
            fromTr: country === 'tr'
          });
        }
      };

      const fetchTvMazeBroad = async () => {
        const single = await fetchJsonSafe(
          `https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(rawClean)}&embed=episodes`
        );
        if (single && single.name) {
          const showDate = parseDateParts(single.premiered || '');
          let epDate = { year: null, month: null, day: null, fullDate: '' };
          let epName = '';
          let epRuntime = '';
          const epsList = single._embedded && Array.isArray(single._embedded.episodes) ? single._embedded.episodes : [];
          if (targetE) {
            const foundEp = epsList.find(e => Number(e.season) === Number(targetS) && Number(e.number) === Number(targetE));
            if (foundEp) {
              epDate = parseDateParts(foundEp.airdate || '');
              epName = foundEp.name || `${targetE}. Bölüm`;
              if (foundEp.runtime) epRuntime = `${foundEp.runtime} dk`;
            }
          }
          results.push({
            title: single.name,
            year: epDate.year || showDate.year || new Date().getFullYear(),
            month: epDate.month || showDate.month || 1,
            day: epDate.day || showDate.day || null,
            releaseDate: epDate.fullDate || showDate.fullDate || '',
            posterUrl: (single.image && (single.image.original || single.image.medium)) || '',
            genre: Array.isArray(single.genres) && single.genres.length > 0
              ? toTurkishGenre(single.genres.join(', '), 'series')
              : 'Dizi',
            duration: epRuntime || (single.averageRuntime ? `${single.averageRuntime} dk` : ''),
            season: targetS,
            episode: targetE,
            epTitle: epName,
            sourceLabel: 'TVMaze',
            fromTr: false
          });
        }

        const list = await fetchJsonSafe(
          `https://api.tvmaze.com/search/shows?q=${encodeURIComponent(rawClean)}`
        );
        if (Array.isArray(list)) {
          for (const entry of list.slice(0, 12)) {
            const sh = entry && entry.show;
            if (!sh || !sh.name) continue;
            const dp = parseDateParts(sh.premiered || '');
            results.push({
              title: sh.name,
              year: dp.year || new Date().getFullYear(),
              month: dp.month || 1,
              day: dp.day || null,
              releaseDate: dp.fullDate || '',
              posterUrl: (sh.image && (sh.image.original || sh.image.medium)) || '',
              genre: Array.isArray(sh.genres) && sh.genres.length > 0
                ? toTurkishGenre(sh.genres.join(', '), 'series')
                : 'Dizi',
              duration: sh.averageRuntime ? `${sh.averageRuntime} dk` : '',
              season: targetS,
              episode: targetE,
              epTitle: '',
              sourceLabel: 'TVMaze',
              fromTr: false
            });
          }
        }
      };

      const fetchWikipediaBroad = async () => {
        const data = await fetchJsonSafe(
          `https://tr.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(rawClean)}&limit=8&namespace=0&format=json&origin=*`
        );
        if (Array.isArray(data) && Array.isArray(data[1])) {
          data[1].forEach((wikiTitle, i) => {
            if (!wikiTitle) return;
            const desc = (Array.isArray(data[2]) && data[2][i]) || '';
            const dp = parseDateParts(desc);
            results.push({
              title: wikiTitle,
              year: dp.year || new Date().getFullYear(),
              month: dp.month || 1,
              day: dp.day || null,
              releaseDate: dp.fullDate || '',
              posterUrl: '',
              genre: mediaType === 'series' ? 'Dizi' : 'Sinema',
              duration: '',
              season: targetS,
              episode: targetE,
              epTitle: desc ? desc.slice(0, 48) : '',
              sourceLabel: 'Wikipedia TR',
              fromTr: true
            });
          });
        }
      };

      await Promise.all([
        fetchItunesBroad('tr', 'movie'),
        fetchItunesBroad('tr', 'tvShow'),
        fetchItunesBroad('us', 'movie'),
        fetchItunesBroad('us', 'tvShow'),
        fetchTvMazeBroad(),
        fetchWikipediaBroad()
      ]);

      (state.catalog || []).forEach(catItem => {
        if (catItem && catItem.title && catItem.title.toLowerCase().includes(rawClean.toLowerCase())) {
          results.push({
            title: catItem.title,
            year: catItem.year || new Date().getFullYear(),
            month: catItem.month || 1,
            day: catItem.day || null,
            releaseDate: catItem.releaseDate || '',
            posterUrl: catItem.posterUrl || '',
            genre: catItem.genre || (catItem.type === 'series' ? 'Dizi' : 'Sinema'),
            duration: catItem.duration || '',
            season: targetS,
            episode: targetE,
            epTitle: '',
            sourceLabel: 'Arşivim',
            fromTr: true
          });
        }
      });

      const qLower = rawClean.toLowerCase();
      results.sort((a, b) => {
        const aExact = a.title.toLowerCase() === qLower ? 25 : (a.title.toLowerCase().includes(qLower) ? 12 : 0);
        const bExact = b.title.toLowerCase() === qLower ? 25 : (b.title.toLowerCase().includes(qLower) ? 12 : 0);
        const aScore = aExact + (a.fromTr ? 5 : 0) + (a.posterUrl ? 3 : 0);
        const bScore = bExact + (b.fromTr ? 5 : 0) + (b.posterUrl ? 3 : 0);
        return bScore - aScore;
      });

      const dedup = new Map();
      for (const r of results) {
        const key = `${r.title.toLowerCase()}_${r.sourceLabel}_${r.year}_${r.episode || 0}`;
        if (!dedup.has(key)) dedup.set(key, r);
      }
      return Array.from(dedup.values()).slice(0, 20);
    }
