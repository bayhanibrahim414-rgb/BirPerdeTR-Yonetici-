  <script type="module">

    /* =====================================================================
       1. FIREBASE CONFIGURATION & CONSTANTS
    ===================================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyB1eT555N2stbzj6x6zkmxHKtMolvCJmeY",
      authDomain: "birperdetr.firebaseapp.com",
      databaseURL: "https://birperdetr-default-rtdb.firebaseio.com",
      projectId: "birperdetr",
      storageBucket: "birperdetr.firebasestorage.app",
      messagingSenderId: "315520445101",
      appId: "1:315520445101:web:f1f6361b23e957b2f7f424",
      measurementId: "G-1Y3247DHPR"
    };

    let fbAuth = null;
    let fbDb = null;
    let fbStorage = null;

    const CATALOG_STORAGE_KEY = 'birperdetr_catalog_v5';
    const CINEMA_FALLBACK_PHOTO = 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/35mm_movie_film.jpg/500px-35mm_movie_film.jpg';
    const DEMO_STREAM_SUB = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
    const DEMO_STREAM_DUB = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4';

    const DEFAULT_STARTER_CATALOG = [
      {
        id: 'mov-starter-1',
        type: 'movie',
        title: 'Büyük Tavşan Macerası',
        year: 2008,
        duration: '10 dk',
        genre: 'Animasyon, Komedi',
        hasSub: true,
        hasDub: true,
        posterUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Big_buck_bunny_poster_big.jpg/440px-Big_buck_bunny_poster_big.jpg',
        posterStoragePath: '',
        sources: [
          { id: 'sub', label: 'TR Altyazılı', defaultMode: 'sub', url: DEMO_STREAM_SUB, localKey: '', storagePath: '', fileName: 'big_buck_bunny_sub.mp4' },
          { id: 'dub', label: 'TR Dublaj', defaultMode: 'dub', url: DEMO_STREAM_DUB, localKey: '', storagePath: '', fileName: 'big_buck_bunny_dub.mp4' }
        ],
        createdAt: 1700000002000
      },
      {
        id: 'ser-starter-1',
        type: 'series',
        title: 'Çelik Düşler Günlüğü',
        year: 2010,
        duration: '11 dk',
        genre: 'Bilim Kurgu, Dram',
        seasons: 1,
        hasSub: true,
        hasDub: true,
        posterUrl: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Elephants_Dream_s5_both.jpg/440px-Elephants_Dream_s5_both.jpg',
        posterStoragePath: '',
        episodes: [
          {
            season: 1,
            number: 1,
            name: '1. Bölüm',
            duration: '11 dk',
            sources: [
              { id: 'sub', label: 'TR Altyazılı', defaultMode: 'sub', url: DEMO_STREAM_DUB, localKey: '', storagePath: '', fileName: 's01e01_sub.mp4' }
            ]
          },
          {
            season: 1,
            number: 2,
            name: '2. Bölüm',
            duration: '10 dk',
            sources: [
              { id: 'dub', label: 'TR Dublaj', defaultMode: 'dub', url: DEMO_STREAM_SUB, localKey: '', storagePath: '', fileName: 's01e02_dub.mp4' }
            ]
          }
        ],
        createdAt: 1700000001000
      }
    ];

    /* =====================================================================
       2. LOCAL STORAGE & INSTANT BLOB / INDEXEDDB MEDIA STORE
    ===================================================================== */
    const LOCAL_BLOB_URLS = new Map();
    const IDB_NAME = 'birperdetr_media_idb_v1';
    const IDB_STORE = 'videos';

    function isValidItem(item) {
      if (!item || !item.id || !item.title || !item.type) return false;
      return item.type === 'movie' || item.type === 'series';
    }

    function readCatalogFromStorage() {
      try {
        const raw = localStorage.getItem(CATALOG_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            return parsed.filter(isValidItem);
          }
        }
      } catch (e) {}
      return DEFAULT_STARTER_CATALOG.map(x => JSON.parse(JSON.stringify(x)));
    }

    function writeCatalogToStorage(list) {
      try {
        const safeList = (list || []).map(item => {
          const copy = JSON.parse(JSON.stringify(item));
          if (copy.posterUrl && copy.posterUrl.startsWith('data:image/') && copy.posterUrl.length > 220000) {
            copy.posterUrl = CINEMA_FALLBACK_PHOTO;
          }
          return copy;
        });
        localStorage.setItem(CATALOG_STORAGE_KEY, JSON.stringify(safeList));
      } catch (e) {}
    }

    function openMediaIDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('IndexedDB unavailable'));
          return;
        }
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveLocalVideoFileInstant(file) {
      const key = 'vid_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const blobUrl = URL.createObjectURL(file);
      LOCAL_BLOB_URLS.set(key, blobUrl);

      openMediaIDB().then(db => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(file, key);
      }).catch(() => {});

      return { localKey: key, blobUrl };
    }

    async function resolvePlayableUrl(source) {
      if (!source) return '';
      if (source.localKey && LOCAL_BLOB_URLS.has(source.localKey)) {
        return LOCAL_BLOB_URLS.get(source.localKey);
      }
      if (source.localKey) {
        try {
          const db = await openMediaIDB();
          const storedFile = await new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readonly');
            const req = tx.objectStore(IDB_STORE).get(source.localKey);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => reject(req.error);
          });
          if (storedFile) {
            const freshBlobUrl = URL.createObjectURL(storedFile);
            LOCAL_BLOB_URLS.set(source.localKey, freshBlobUrl);
            return freshBlobUrl;
          }
        } catch (e) {}
      }
      if (source.url && /^https?:\/\//i.test(source.url)) {
        return source.url;
      }
      return source.url || '';
    }

    /* =====================================================================
       3. APPLICATION STATE
    ===================================================================== */
    const state = {
      catalog: readCatalogFromStorage(),
      navTab: 'all',
      langFilter: 'all',
      searchQuery: '',
      player: {
        media: null,
        season: 1,
        episode: 1,
        channels: [],
        activeChannelId: 'sub',
        isPlaying: false,

    function initBackgroundFirebase() {
      try {
        const app = initializeApp(firebaseConfig);
        fbAuth = getAuth(app);
        fbDb = getFirestore(app);
        fbStorage = getStorage(app);

        signInAnonymously(fbAuth).catch(() => {});

        onSnapshot(collection(fbDb, 'birperde_catalog'), (snap) => {
          const cloudMap = new Map();
          snap.forEach(d => {
            const item = { id: d.id, ...d.data() };
            if (isValidItem(item)) {
              cloudMap.set(item.id, item);
            }
          });

          (state.catalog || []).forEach(localItem => {
            if (!cloudMap.has(localItem.id) && isValidItem(localItem)) {
              cloudMap.set(localItem.id, localItem);
            }
          });

          state.catalog = Array.from(cloudMap.values()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          writeCatalogToStorage(state.catalog);

          if (state.player.media) {
            const latest = state.catalog.find(m => m.id === state.player.media.id);
            if (latest && !state.player.isFullscreen) {
              state.player.media = latest;
              state.player.channels = buildChannels(latest, state.player.season, state.player.episode);
            }
          }
          renderMainView();
        }, () => {});
      } catch (e) {}
    }

    async function syncItemToFirestore(item) {
      if (!fbDb) return;
      try {
        if (fbAuth && !fbAuth.currentUser) {
          await signInAnonymously(fbAuth).catch(() => {});
        }
        const payload = JSON.parse(JSON.stringify(item));
        if (payload.posterUrl && payload.posterUrl.startsWith('data:image/') && payload.posterUrl.length > 220000) {
          payload.posterUrl = CINEMA_FALLBACK_PHOTO;
        }
        await setDoc(doc(fbDb, 'birperde_catalog', payload.id), payload, { merge: true });
      } catch (e) {}
    }

    async function removeItemFromFirestore(item) {
      if (!fbDb) return;
      try {
        await deleteDoc(doc(fbDb, 'birperde_catalog', item.id));
      } catch (e) {}
      if (fbStorage) {
        const paths = [];
        if (item.posterStoragePath) paths.push(item.posterStoragePath);
        (item.sources || []).forEach(s => { if (s.storagePath) paths.push(s.storagePath); });
        (item.episodes || []).forEach(ep => {
          (ep.sources || []).forEach(s => { if (s.storagePath) paths.push(s.storagePath); });
        });
        for (const p of paths) {
          deleteObject(storageRef(fbStorage, p)).catch(() => {});
        }
      }
    }

    function setSyncBanner(show, text = '', pct = 0) {
      const banner = document.getElementById('background-sync-banner');
      const txt = document.getElementById('background-sync-text');
      const pctEl = document.getElementById('background-sync-pct');
      if (!banner) return;
      if (!show) {
        banner.classList.add('hidden');
        return;
      }
      banner.classList.remove('hidden');
      if (txt) txt.textContent = text;
      if (pctEl) pctEl.textContent = `%${pct}`;
    }

    function uploadBlobBackground(file, folder, onProgress) {
      if (!fbStorage || !file) return Promise.resolve({ url: '', storagePath: '' });
      const cleanName = (file.name || 'media.mp4').replace(/[^a-zA-Z0-9._-]/g, '_');
      const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2, 6)}_${cleanName}`;
      const ref = storageRef(fbStorage, path);
      const task = uploadBytesResumable(ref, file, { contentType: file.type || 'video/mp4' });

      return new Promise((resolve) => {
        task.on(
          'state_changed',
          (snap) => {
            if (snap.totalBytes > 0 && typeof onProgress === 'function') {
              const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
              const mbDone = (snap.bytesTransferred / 1048576).toFixed(1);
              const mbTotal = (snap.totalBytes / 1048576).toFixed(1);
              onProgress(pct, `${mbDone} / ${mbTotal} MB`);
            }
          },
          () => resolve({ url: '', storagePath: '' }),
          async () => {
            try {
              const downloadUrl = await getDownloadURL(task.snapshot.ref);
              resolve({ url: downloadUrl, storagePath: path });
            } catch (e) {
              resolve({ url: '', storagePath: '' });
            }
          }
        );
      });
    }

    async function runBackgroundUploadQueue(itemId, tasks) {
      if (!tasks || tasks.length === 0) return;
      for (const task of tasks) {
        setSyncBanner(true, `"${task.title}" — ${task.label} arka planda aktarılıyor...`, 1);
        const res = await uploadBlobBackground(task.file, task.folder, (pct, detail) => {
          setSyncBanner(true, `"${task.title}" — ${task.label} (${detail})`, pct);
        });
        if (res && res.url) {
          const target = state.catalog.find(m => m.id === itemId);
          if (target) {
            if (task.kind === 'poster') {
              target.posterUrl = res.url;
              target.posterStoragePath = res.storagePath;
            } else if (task.kind === 'movie_source') {
              const sObj = (target.sources || []).find(s => s.id === task.sourceId);
              if (sObj) {
                sObj.url = res.url;
                sObj.storagePath = res.storagePath;
              }
            } else if (task.kind === 'episode_source') {
              const ep = (target.episodes || []).find(e => Number(e.season) === Number(task.season) && Number(e.number) === Number(task.episode));
              const sObj = ep && (ep.sources || []).find(s => s.id === task.sourceId);
              if (sObj) {
                sObj.url = res.url;
                sObj.storagePath = res.storagePath;
              }
            }
            writeCatalogToStorage(state.catalog);
            await syncItemToFirestore(target);
          }
        }
      }
      setSyncBanner(false);
    }

    const GENRE_MAP = {
      'action': 'Aksiyon',
      'adventure': 'Macera',
      'action & adventure': 'Aksiyon, Macera',
      'animation': 'Animasyon',
      'anime': 'Anime',
      'comedy': 'Komedi',
      'crime': 'Suç',
      'documentary': 'Belgesel',
      'drama': 'Dram',
      'family': 'Aile',
      'fantasy': 'Fantastik',

      'horror': 'Korku',

      'music': 'Müzik',
      'musical': 'Müzikal',
      'mystery': 'Gizem',
      'romance': 'Romantik',
      'sci-fi': 'Bilim Kurgu',
      'science fiction': 'Bilim Kurgu',
      'sci-fi & fantasy': 'Bilim Kurgu, Fantastik',
      'thriller': 'Gerilim',
      'war': 'Savaş',
      'western': 'Vahşi Batı',
      'sports': 'Spor'
    };

    function toTurkishGenre(raw) {
      if (!raw) return '';
      const parts = String(raw).split(/[,/&]+/).map(s => s.trim()).filter(Boolean);
      const translated = parts.map(p => {
        const lower = p.toLowerCase();
        if (GENRE_MAP[lower]) return GENRE_MAP[lower];
        for (const [k, v] of Object.entries(GENRE_MAP)) {
          if (lower.includes(k)) return v;
        }
        return p;
      });
      return Array.from(new Set(translated)).slice(0, 3).join(', ');
    }

    function formatDurationFromSeconds(sec) {
      const s = Math.max(0, Math.round(Number(sec) || 0));
      if (!s) return '';
      const mins = Math.max(1, Math.round(s / 60));
      if (mins >= 60) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return m > 0 ? `${h} sa ${m} dk` : `${h} sa`;
      }
      return `${mins} dk`;
    }

    function formatDurationFromMillis(ms) {
      const n = Number(ms) || 0;
      if (!n) return '';
      return formatDurationFromSeconds(n / 1000);
    }

    function parseFilenameTitleYear(filename) {
      if (!filename) return { title: '', year: null };
      let base = filename.replace(/\.[^/.]+$/, '');
      const yMatch = base.match(/\b(19\d{2}|20\d{2})\b/);
      const year = yMatch ? Number(yMatch[1]) : null;
      if (yMatch) base = base.slice(0, yMatch.index);
      base = base
        .replace(/\(.*?\)|\[.*?\]/g, ' ')
        .replace(/\b(1080p|720p|480p|2160p|4k|bluray|web-dl|webrip|hdrip|x264|x265|hevc|tr|dublaj|altyazili|altyazı)\b/gi, ' ')
        .replace(/[._-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return { title: base, year };
    }

    async function queryExternalMediaMetadata(query, mediaType = 'movie') {
      const q = (query || '').replace(/\b(19\d{2}|20\d{2})\b/g, '').trim();
      if (q.length < 2) return [];

      const results = [];
      const entity = mediaType === 'series' ? 'tvShow' : 'movie';

      const checkItunes = async (country) => {
        try {
          const url = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&country=${country}&media=${entity}&limit=5`;
          const resp = await fetch(url);
          if (!resp.ok) return;
          const data = await resp.json();
          for (const item of (data.results || [])) {
            const title = item.trackName || item.collectionName || '';
            const yStr = item.releaseDate ? String(item.releaseDate).slice(0, 4) : '';
            const year = /^\d{4}$/.test(yStr) ? Number(yStr) : null;
            const posterUrl = item.artworkUrl100
              ? item.artworkUrl100.replace(/100x100bb\.(jpg|png)/i, '600x600bb.$1')
              : '';
            const genre = toTurkishGenre(item.primaryGenreName || '') || (mediaType === 'series' ? 'Dizi' : 'Sinema');
            const duration = item.trackTimeMillis ? formatDurationFromMillis(item.trackTimeMillis) : '';
            if (title && year) {
              results.push({ title, year, posterUrl, genre, duration, fromTr: country === 'tr' });
            }
          }
        } catch (e) {}
      };

      const checkTvMaze = async () => {
        if (mediaType !== 'series') return;
        try {
          const resp = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
          if (!resp.ok) return;
          const data = await resp.json();
          for (const entry of (data || []).slice(0, 5)) {
            const show = entry.show;
            if (!show || !show.name) continue;
            const yStr = show.premiered ? String(show.premiered).slice(0, 4) : '';
            const year = /^\d{4}$/.test(yStr) ? Number(yStr) : null;
            const posterUrl = (show.image && (show.image.original || show.image.medium)) || '';
            const genre = Array.isArray(show.genres) && show.genres.length > 0
              ? toTurkishGenre(show.genres.join(', '))
              : 'Dizi';
            const duration = show.averageRuntime ? `${show.averageRuntime} dk` : '';
            if (year) {
              results.push({ title: show.name, year, posterUrl, genre, duration, fromTr: false });
            }
          }
        } catch (e) {}
      };

      await Promise.all([checkItunes('tr'), checkItunes('us'), checkTvMaze()]);

      const qLower = q.toLowerCase();
      results.sort((a, b) => {
        const aExact = a.title.toLowerCase() === qLower ? 20 : (a.title.toLowerCase().includes(qLower) ? 10 : 0);
        const bExact = b.title.toLowerCase() === qLower ? 20 : (b.title.toLowerCase().includes(qLower) ? 10 : 0);
        const aScore = aExact + (a.fromTr ? 5 : 0) + (a.posterUrl ? 4 : 0);
        const bScore = bExact + (b.fromTr ? 5 : 0) + (b.posterUrl ? 4 : 0);
        return bScore - aScore;
      });

      const dedup = new Map();
      for (const r of results) {
        const key = `${r.title.toLowerCase()}_${r.year}`;
        if (!dedup.has(key)) dedup.set(key, r);
      }
      return Array.from(dedup.values()).slice(0, 5);
    }

    function quickInspectVideoMetadata(file) {
      return new Promise((resolve) => {
        if (!file) {
          resolve({ duration: '', frameUrl: '' });
          return;
        }
        const tempUrl = URL.createObjectURL(file);
        const vid = document.createElement('video');
        vid.preload = 'metadata';
        vid.muted = true;
        vid.playsInline = true;
        vid.src = tempUrl;

        let done = false;
        const finish = (payload) => {
          if (done) return;
          done = true;
          try { URL.revokeObjectURL(tempUrl); } catch (e) {}
          resolve(payload);
        };

        const timer = setTimeout(() => finish({ duration: '', frameUrl: '' }), 1500);

        vid.onloadedmetadata = () => {
          const durStr = isFinite(vid.duration) ? formatDurationFromSeconds(vid.duration) : '';
          try {
            vid.currentTime = vid.duration > 4 ? Math.min(vid.duration * 0.1, 15) : 0.2;
          } catch (e) {
            clearTimeout(timer);
            finish({ duration: durStr, frameUrl: '' });
          }

          vid.onseeked = () => {
            clearTimeout(timer);
            let frameUrl = '';
            try {
              if (vid.videoWidth > 0 && vid.videoHeight > 0) {
                const canvas = document.createElement('canvas');
                const w = 400;
                canvas.width = w;
                canvas.height = Math.max(225, Math.round(w * (vid.videoHeight / vid.videoWidth)));
                canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
                frameUrl = canvas.toDataURL('image/jpeg', 0.8);
              }
            } catch (e) {}
            finish({ duration: durStr, frameUrl });
          };
        };

        vid.onerror = () => {
          clearTimeout(timer);
          finish({ duration: '', frameUrl: '' });
        };
      });
    }

    async function runMetadataLookupNow(rawTitle, mediaType, titleInputId) {
      const cleaned = (rawTitle || '').replace(/\b(19\d{2}|20\d{2})\b/g, '').trim();
      const statusEl = document.getElementById('draft-lookup-status');
      if (cleaned.length < 2) {
        foundCandidates = [];
        renderCandidateList(titleInputId);
        return;
      }

      if (statusEl) statusEl.textContent = 'Yıl, tür, süre ve kapak aranıyor...';
      const list = await queryExternalMediaMetadata(cleaned, mediaType);
      foundCandidates = list;
      renderCandidateList(titleInputId);

      if (list.length > 0) {
        const best = list[0];
        if (!formDraft.yearLockedByUser && best.year) formDraft.year = best.year;
        if (!formDraft.genreLockedByUser && best.genre) formDraft.genre = best.genre;
        if (!formDraft.durationLockedByUser && best.duration) formDraft.duration = best.duration;
        if (!formDraft.posterLockedByUser && best.posterUrl) formDraft.posterUrl = best.posterUrl;
        refreshDraftInputsInModal();
        if (statusEl) statusEl.textContent = `Bulundu: ${best.title} (${best.year}) — Dilediğiniz alanı değiştirebilirsiniz.`;
      } else if (statusEl) {
        statusEl.textContent = 'Otomatik sonuç bulunamadı — Yıl, tür, süre ve kapağı elle girin.';
      }
    }

        if (badge) {
          badge.textContent = '';
          badge.classList.add('hidden');

        return;
      }

      const mb = (file.size / 1048576).toFixed(1);
      if (badge) {
        badge.textContent = `Seçildi: ${file.name} (${mb} MB)`;
        badge.classList.remove('hidden');
      }

      const parsed = parseFilenameTitleYear(file.name);
      if (parsed.year && !formDraft.yearLockedByUser) {
        formDraft.year = parsed.year;
      }
      if (titleInputId) {
        const titleEl = document.getElementById(titleInputId);
        if (titleEl && !titleEl.value.trim() && parsed.title) {
          titleEl.value = parsed.title;
          runMetadataLookupNow(parsed.title, mediaType, titleInputId);
        }
      }

      const inspected = await quickInspectVideoMetadata(file);
      if (inspected.duration && !formDraft.durationLockedByUser) {
        formDraft.duration = inspected.duration;
      }
      if (inspected.frameUrl && !formDraft.autoFrameUrl) {
        formDraft.autoFrameUrl = inspected.frameUrl;

      refreshDraftInputsInModal();

    function findActiveVideoSourceForCutter() {
      const prefixes = activeAddTab === 'series' ? ['series', 'movie', 'ep'] : ['movie', 'series', 'ep'];
      for (const p of prefixes) {
        const fSub = document.getElementById(`${p}-sub-file`)?.files?.[0];
        if (fSub) return { url: URL.createObjectURL(fSub), revoke: true };
        const fDub = document.getElementById(`${p}-dub-file`)?.files?.[0];
        if (fDub) return { url: URL.createObjectURL(fDub), revoke: true };
      }
      for (const p of prefixes) {
        const uSub = document.getElementById(`${p}-sub-url`)?.value?.trim();
        if (uSub) return { url: uSub, revoke: false };
        const uDub = document.getElementById(`${p}-dub-url`)?.value?.trim();
        if (uDub) return { url: uDub, revoke: false };
      }
      return null;
    }

    function openCoverFrameCutter() {
      const picked = findActiveVideoSourceForCutter();
      if (!picked || !picked.url) {
        showToast('Önce bir video dosyası seçin veya video bağlantısı girin.', 'error');
        return;

      const card = document.getElementById('modal-card');
      if (card) modalSavedHtml = card.innerHTML;

      if (cutterObjectUrl) {
        try { URL.revokeObjectURL(cutterObjectUrl); } catch (e) {}

    function updateCutterReadout() {
      const vid = document.getElementById('cutter-preview-video');
      const slider = document.getElementById('cutter-range-slider');
      const readout = document.getElementById('cutter-time-readout');
      if (!vid) return;
      const dur = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : 0;
      if (slider && dur > 0) {
        slider.value = Math.min(100, (vid.currentTime / dur) * 100);
      }
      if (readout) {
        readout.textContent = `${formatClock(vid.currentTime || 0)} / ${formatClock(dur)}`;
      }
    }

    function seekCutterBySlider(pct) {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid || !isFinite(vid.duration) || vid.duration <= 0) return;
      vid.pause();
      vid.currentTime = (Number(pct) / 100) * vid.duration;
      updateCutterReadout();
    }

    function stepCutterSeconds(delta) {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid) return;
      vid.pause();
      const dur = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : (vid.currentTime + Math.abs(delta) + 10);
      vid.currentTime = Math.max(0, Math.min(dur, (vid.currentTime || 0) + delta));
      updateCutterReadout();
    }

    function toggleCutterPlayback() {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid) return;
      if (vid.paused) vid.play().catch(() => {});
      else vid.pause();
    }

    function captureCurrentFrameAsCover() {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid) return;
      try {
        const vw = vid.videoWidth || 640;
        const vh = vid.videoHeight || 360;
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = Math.max(360, Math.round(640 * (vh / vw)));
        canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
        const frameData = canvas.toDataURL('image/jpeg', 0.88);

        formDraft.posterUrl = frameData;
        formDraft.autoFrameUrl = frameData;
        formDraft.posterLockedByUser = true;

        closeCoverFrameCutter();
        const urlInp = document.getElementById('draft-poster-url-input');
        if (urlInp) urlInp.value = '';
        showToast('Seçilen video karesi kapak fotoğrafı olarak ayarlandı.', 'success');
      } catch (e) {
        showToast('Bu kare alınamadı, yerel video seçip veya başka saniyeye alıp tekrar deneyin.', 'error');
      }
    }

    function closeCoverFrameCutter() {
      if (cutterObjectUrl) {
        try { URL.revokeObjectURL(cutterObjectUrl); } catch (e) {}
        cutterObjectUrl = '';
      }
      if (modalSavedHtml) {
        openModal(modalSavedHtml);
        refreshDraftInputsInModal();
      } else {
        renderAddModal();
      }
    }

    async function buildSourcesAndBackgroundTasks(prefix, title, season = null, episode = null) {
      const subFile = document.getElementById(`${prefix}-sub-file`)?.files?.[0];
      const dubFile = document.getElementById(`${prefix}-dub-file`)?.files?.[0];
      const subUrl = document.getElementById(`${prefix}-sub-url`)?.value?.trim() || '';
      const dubUrl = document.getElementById(`${prefix}-dub-url`)?.value?.trim() || '';

      const sources = [];
      const bgTasks = [];

      if (subFile) {
        const stored = await saveLocalVideoFileInstant(subFile);
        sources.push({
          id: 'sub',
          label: 'TR Altyazılı',
          defaultMode: 'sub',
          url: '',
          localKey: stored.localKey,
          storagePath: '',
          fileName: subFile.name
        });
        bgTasks.push({
          kind: season !== null ? 'episode_source' : 'movie_source',
          sourceId: 'sub',
          season,
          episode,
          title,
          label: 'TR Altyazılı Video',
          file: subFile,
          folder: 'birperde_videos'
        });
      } else if (subUrl) {
        sources.push({
          id: 'sub',
          label: 'TR Altyazılı',
          defaultMode: 'sub',
          url: subUrl,
          localKey: '',
          storagePath: '',
          fileName: 'stream.mp4'
        });
      }

      if (dubFile) {
        const stored = await saveLocalVideoFileInstant(dubFile);
        sources.push({
          id: 'dub',
          label: 'TR Dublaj',
          defaultMode: 'dub',
          url: '',
          localKey: stored.localKey,
          storagePath: '',
          fileName: dubFile.name
        });
        bgTasks.push({
          kind: season !== null ? 'episode_source' : 'movie_source',
          sourceId: 'dub',
          season,
          episode,
          title,
          label: 'TR Dublaj Video',
          file: dubFile,
          folder: 'birperde_videos'
        });
      } else if (dubUrl) {
        sources.push({
          id: 'dub',
          label: 'TR Dublaj',
          defaultMode: 'dub',
          url: dubUrl,
          localKey: '',
          storagePath: '',
          fileName: 'stream.mp4'
        });
      }

      return { sources, bgTasks };
    }

    function collectEditedDraftMeta(defaultGenre) {
      const year = Number(document.getElementById('draft-year-input')?.value) || new Date().getFullYear();
      const duration = document.getElementById('draft-duration-input')?.value?.trim() || '';
      const genre = document.getElementById('draft-genre-input')?.value?.trim() || defaultGenre;
      const manualUrl = document.getElementById('draft-poster-url-input')?.value?.trim() || '';
      const posterFile = document.getElementById('draft-poster-file-input')?.files?.[0];

      let posterUrl = CINEMA_FALLBACK_PHOTO;
      if (posterFile) {
        posterUrl = URL.createObjectURL(posterFile);
      } else if (manualUrl) {
        posterUrl = manualUrl;
      } else if (formDraft.posterUrl) {
        posterUrl = formDraft.posterUrl;
      } else if (formDraft.autoFrameUrl) {
        posterUrl = formDraft.autoFrameUrl;
      }

      return { year, duration, genre, posterUrl, posterFile };
    }

    async function submitNewMovie(e) {
      e.preventDefault();
      const title = document.getElementById('add-movie-title').value.trim();
      if (!title) return;

      const { sources, bgTasks } = await buildSourcesAndBackgroundTasks('movie', title);
      if (sources.length === 0) {
        showToast('Lütfen en az bir video seçin veya video bağlantısı girin.', 'error');
        return;
      }

      const meta = collectEditedDraftMeta('Sinema');
      const id = 'mov-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);

      if (meta.posterFile) {
        bgTasks.unshift({ kind: 'poster', title, label: 'Kapak Görseli', file: meta.posterFile, folder: 'birperde_posters' });
      }

      const newMovie = {
        id,
        type: 'movie',
        title,
        year: meta.year,
        duration: meta.duration || 'Sinema',
        genre: meta.genre,
        hasSub: sources.some(s => s.defaultMode === 'sub'),
        hasDub: sources.some(s => s.defaultMode === 'dub'),
        posterUrl: meta.posterUrl,
        posterStoragePath: '',
        sources,
        createdAt: Date.now()
      };

      state.catalog.unshift(newMovie);
      persistAndRenderCatalog();
      closeModal();
      showToast(`"${title}" (${meta.year}) anında eklendi.`, 'success');

      syncItemToFirestore(newMovie);
      if (bgTasks.length > 0) runBackgroundUploadQueue(id, bgTasks);
    }

    async function submitNewSeries(e) {
      e.preventDefault();
      const title = document.getElementById('add-series-title').value.trim();
      if (!title) return;

      const { sources, bgTasks } = await buildSourcesAndBackgroundTasks('series', title, 1, 1);
      if (sources.length === 0) {
        showToast('Lütfen 1. Bölüm için video seçin veya bağlantı girin.', 'error');
        return;
      }

      const meta = collectEditedDraftMeta('Dizi');
      const id = 'ser-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);

      if (meta.posterFile) {
        bgTasks.unshift({ kind: 'poster', title, label: 'Kapak Görseli', file: meta.posterFile, folder: 'birperde_posters' });
      }

      const newSeries = {
        id,
        type: 'series',
        title,
        year: meta.year,
        duration: meta.duration,
        genre: meta.genre,
        seasons: 1,
        hasSub: sources.some(s => s.defaultMode === 'sub'),
        hasDub: sources.some(s => s.defaultMode === 'dub'),
        posterUrl: meta.posterUrl,
        posterStoragePath: '',
        episodes: [{ season: 1, number: 1, name: '1. Bölüm', duration: meta.duration, sources }],
        createdAt: Date.now()
      };

      state.catalog.unshift(newSeries);
      persistAndRenderCatalog();
      closeModal();
      showToast(`"${title}" (${meta.year}) dizisi anında eklendi.`, 'success');

      syncItemToFirestore(newSeries);
      if (bgTasks.length > 0) runBackgroundUploadQueue(id, bgTasks);
    }

    async function submitNewEpisode(e) {
      e.preventDefault();
      const seriesId = document.getElementById('add-ep-series').value;
      const season = Math.max(1, Number(document.getElementById('add-ep-season').value) || 1);
      const number = Math.max(1, Number(document.getElementById('add-ep-number').value) || 1);
      const name = document.getElementById('add-ep-name').value.trim() || `${number}. Bölüm`;

      const series = state.catalog.find(s => s.id === seriesId && s.type === 'series');
      if (!series) return;

      const { sources, bgTasks } = await buildSourcesAndBackgroundTasks('ep', series.title, season, number);
      if (sources.length === 0) {
        showToast('Lütfen bölüm için video seçin veya bağlantı girin.', 'error');
        return;
      }

      if (!Array.isArray(series.episodes)) series.episodes = [];
      const existingIdx = series.episodes.findIndex(ep => Number(ep.season) === season && Number(ep.number) === number);
      const epPayload = { season, number, name, duration: series.duration || '', sources };
      if (existingIdx >= 0) series.episodes[existingIdx] = epPayload;
      else series.episodes.push(epPayload);

      series.episodes.sort((a, b) => (Number(a.season) - Number(b.season)) || (Number(a.number) - Number(b.number)));
      series.seasons = Math.max(...series.episodes.map(ep => Number(ep.season)));
      series.hasSub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'sub'));
      series.hasDub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'dub'));

      persistAndRenderCatalog();
      closeModal();
      if (state.player.media && state.player.media.id === series.id) {
        openPlayer(series.id, season, number);
      }
      showToast(`${series.title} — S${season} B${number} eklendi.`, 'success');

      syncItemToFirestore(series);
      if (bgTasks.length > 0) runBackgroundUploadQueue(series.id, bgTasks);
    }

    async function lookupIntoEditModal(mediaType) {
      const titleVal = document.getElementById('edit-title-inp')?.value?.trim() || '';
      if (titleVal.length < 2) return;
      const list = await queryExternalMediaMetadata(titleVal, mediaType);
      if (list.length > 0) {
        const best = list[0];
        if (best.year) document.getElementById('edit-year-inp').value = best.year;
        if (best.genre) document.getElementById('edit-genre-inp').value = best.genre;
        if (best.duration) document.getElementById('edit-duration-inp').value = best.duration;
        if (best.posterUrl) {
          document.getElementById('edit-poster-url-inp').value = best.posterUrl;
          document.getElementById('edit-poster-img').src = best.posterUrl;
        }
        showToast(`"${best.title}" (${best.year}) bilgileri getirildi.`, 'success');
      } else {
        showToast('Eşleşme bulunamadı, alanları elle girebilirsiniz.', 'error');
      }
    }

    async function saveEditedItem(e, itemId) {
      e.preventDefault();
      const item = state.catalog.find(m => m.id === itemId);
      if (!item) return;

      item.title = document.getElementById('edit-title-inp').value.trim() || item.title;
      item.year = Number(document.getElementById('edit-year-inp').value) || item.year;
      item.duration = document.getElementById('edit-duration-inp').value.trim();
      item.genre = document.getElementById('edit-genre-inp').value.trim();

      const posterUrl = document.getElementById('edit-poster-url-inp').value.trim();
      const posterFile = document.getElementById('edit-poster-file-inp').files[0];

      if (posterFile) {
        item.posterUrl = URL.createObjectURL(posterFile);
      } else if (posterUrl) {
        item.posterUrl = posterUrl;
      }

      persistAndRenderCatalog();
      if (state.player.media && state.player.media.id === item.id) {
        state.player.media = item;
        renderWatchStudio();
      }
      closeModal();
      showToast(`"${item.title}" güncellendi.`, 'success');

      syncItemToFirestore(item);
      if (posterFile) {
        runBackgroundUploadQueue(item.id, [{
          kind: 'poster',
          title: item.title,
          label: 'Kapak Görseli',
          file: posterFile,
          folder: 'birperde_posters'
        }]);
      }
    }

    function deleteEpisodeFromSeries(seriesId, season, epNum) {
      const series = state.catalog.find(s => s.id === seriesId && s.type === 'series');
      if (!series || !Array.isArray(series.episodes)) return;

      series.episodes = series.episodes.filter(e => !(Number(e.season) === Number(season) && Number(e.number) === Number(epNum)));
      series.seasons = series.episodes.length > 0 ? Math.max(...series.episodes.map(e => Number(e.season))) : 1;
      series.hasSub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'sub'));
      series.hasDub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'dub'));

      persistAndRenderCatalog();
      openEpisodesModal(series.id);
      syncItemToFirestore(series);
      showToast(`Sezon ${season} Bölüm ${epNum} silindi.`, 'info');
    }

    function askDeleteItem(itemId) {
      const item = state.catalog.find(m => m.id === itemId);
      if (!item) return;
      openModal(`
        <div class="birperde-ribbon"></div>
        <div class="p-5 space-y-4">
          <h3 class="text-base font-extrabold text-bpRed">İçeriği Sil</h3>
          <p class="text-xs text-slate-700 leading-relaxed">

            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-bpSky text-bpNavy text-xs font-extrabold cursor-pointer">Vazgeç</button>

          </div>
        </div>
      `);
    }

    function confirmDeleteItem(itemId) {
      const item = state.catalog.find(m => m.id === itemId);
      if (!item) return;

      state.catalog = state.catalog.filter(m => m.id !== itemId);
      if (state.player.media && state.player.media.id === itemId) {
        closePlayer();

      closeModal();
      persistAndRenderCatalog();
      removeItemFromFirestore(item);
      showToast(`"${item.title}" silindi.`, 'info');
    }

    /* =====================================================================
       9. SEARCH, FILTERS & 3-COLUMN GRID RENDERING
    ===================================================================== */
    function handleSearchInput(val) {
      state.searchQuery = (val || '').trim();
      const btn = document.getElementById('search-clear-btn');
      if (btn) btn.classList.toggle('hidden', !state.searchQuery);
      renderMainView();
    }

    function resetSearchInput() {
      const inp = document.getElementById('global-search-input');
      if (inp) inp.value = '';
      handleSearchInput('');
    }

    function updateFilterButtons() {
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        const tab = btn.getAttribute('data-nav-tab');
        const active = tab === state.navTab;
        const activeMap = {
          all: 'bg-bpRoyal text-white shadow-xs',
          movies: 'bg-bpNavy text-white shadow-xs',
          series: 'bg-bpEmerald text-white shadow-xs'
        };
        btn.className = active
          ? `nav-tab-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer ${activeMap[tab]}`
          : 'nav-tab-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-bpWhite text-bpBlack border border-bpSkyBorder hover:bg-bpSky transition cursor-pointer';
      });

      document.querySelectorAll('.lang-filter-btn').forEach(btn => {
        const lang = btn.getAttribute('data-lang-btn');
        btn.className = lang === state.langFilter
          ? 'lang-filter-btn px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-bpNavy text-white transition cursor-pointer'
          : 'lang-filter-btn px-2.5 py-1 rounded-lg text-[11px] font-bold bg-bpWhite text-slate-700 border border-bpSkyBorder hover:bg-bpSky transition cursor-pointer';
      });
    }

    function switchNavTab(tab) {
      state.navTab = tab;
      updateFilterButtons();
      renderMainView();
    }

    function switchLangFilter(lang) {
      state.langFilter = lang;
      updateFilterButtons();
      renderMainView();
    }

    function getFilteredItems() {
      const q = state.searchQuery.toLowerCase();
      return (state.catalog || []).filter(item => {
        if (
          q &&
          !item.title.toLowerCase().includes(q) &&
          !String(item.year).includes(q) &&
          !(item.genre && item.genre.toLowerCase().includes(q))
        ) {
          return false;
        }
        if (state.langFilter === 'dub' && !item.hasDub) return false;
        if (state.langFilter === 'sub' && !item.hasSub) return false;
        return true;
      });
    }

              </div>

              <div class="grid grid-cols-2 gap-1 pt-1 border-t border-bpSky">
                <button type="button" onclick="openPlayer('${escapeAttr(item.id)}')" class="py-1.5 px-1 rounded-lg bg-bpEmerald hover:bg-bpGreen text-white text-[10px] font-extrabold text-center transition cursor-pointer">İzle</button>
                <button type="button" onclick="openEpisodesModal('${escapeAttr(item.id)}')" class="py-1.5 px-1 rounded-lg bg-bpSky hover:bg-bpRoyal text-bpNavy hover:text-white text-[10px] font-extrabold text-center transition cursor-pointer">Bölümler</button>
                <button type="button" onclick="openEditItemModal('${escapeAttr(item.id)}')" class="py-1.5 px-1 rounded-lg bg-bpSky/80 hover:bg-bpNavy text-bpNavy hover:text-white text-[10px] font-extrabold text-center transition cursor-pointer">Düzenle</button>

    function renderMainView() {
      const mainEl = document.getElementById('main-content-area');
      if (!mainEl) return;

      const filtered = getFilteredItems();
      const movies = filtered.filter(m => m.type === 'movie');
      const series = filtered.filter(m => m.type === 'series');

      if (state.navTab === 'movies') {
        mainEl.innerHTML = `
          <div class="theme-banner-movies text-white rounded-2xl p-4 sm:p-5 flex items-center justify-between gap-2 shadow-xs">

          </div>
          ${movies.length === 0 ? `
            <div class="bg-bpWhite rounded-2xl p-6 border border-bpSkyBorder text-center space-y-2">
              <div class="text-sm font-extrabold text-bpNavy">Film Bulunamadı</div>
              <p class="text-xs text-slate-600">Yeni film ekleyebilir veya arama filtresini değiştirebilirsiniz.</p>
            </div>
          ` : `
            <div class="grid-three-cards">${movies.map(renderCard).join('')}</div>
          `}
        `;
        return;
      }

      if (state.navTab === 'series') {
        mainEl.innerHTML = `

              <button type="button" onclick="openAddContentModal('series')" class="px-3 py-1.5 rounded-xl bg-bpYellow text-bpBlack text-xs font-extrabold shrink-0 cursor-pointer">+ Dizi Ekle</button>

          </div>

              <p class="text-xs text-slate-600">Yeni dizi ekleyebilir veya arama filtresini değiştirebilirsiniz.</p>

      mainEl.innerHTML = `
        <section class="space-y-2.5">
          <div class="theme-banner-movies text-white rounded-2xl px-4 py-3 flex items-center justify-between">
            <h2 class="text-sm sm:text-base font-extrabold">Filmler (${movies.length})</h2>
            <button type="button" onclick="openAddContentModal('movie')" class="px-3 py-1.5 rounded-xl bg-bpRed text-white text-xs font-extrabold shrink-0 cursor-pointer">+ Film Ekle</button>
          </div>
          ${movies.length === 0 ? `
            <div class="bg-bpWhite rounded-2xl p-5 border border-bpSkyBorder text-center">
              <p class="text-xs text-slate-600 font-semibold">Henüz film bulunmuyor.</p>
            </div>
          ` : `
            <div class="grid-three-cards">${movies.map(renderCard).join('')}</div>
          `}
        </section>

        <section class="space-y-2.5">
          <div class="theme-banner-series text-white rounded-2xl px-4 py-3 flex items-center justify-between">
            <h2 class="text-sm sm:text-base font-extrabold">Diziler (${series.length})</h2>
            <div class="flex items-center gap-1.5">
              <button type="button" onclick="openAddContentModal('episode')" class="px-2.5 py-1.5 rounded-xl bg-white/15 text-white text-xs font-extrabold shrink-0 cursor-pointer">+ Bölüm</button>
              <button type="button" onclick="openAddContentModal('series')" class="px-3 py-1.5 rounded-xl bg-bpYellow text-bpBlack text-xs font-extrabold shrink-0 cursor-pointer">+ Dizi Ekle</button>
            </div>
          </div>
          ${series.length === 0 ? `
            <div class="bg-bpWhite rounded-2xl p-5 border border-bpSkyBorder text-center">
              <p class="text-xs text-slate-600 font-semibold">Henüz dizi bulunmuyor.</p>
            </div>
          ` : `
            <div class="grid-three-cards">${series.map(renderCard).join('')}</div>
          `}
        </section>
      `;
    }

    /* =====================================================================
       10. WATCH STUDIO
    ===================================================================== */
    let hlsController = null;
    let hudTimer = null;
    let singleTapTimer = null;
    let lastTapTs = 0;
    let hudShown = false;

    function buildChannels(media, season, episode) {
      let list = [];
      if (media.type === 'series') {
        const eps = Array.isArray(media.episodes) ? media.episodes : [];
        const ep = eps.find(e => Number(e.season) === Number(season) && Number(e.number) === Number(episode)) || eps[0];
        if (ep && Array.isArray(ep.sources) && ep.sources.length > 0) list = ep.sources;
      } else if (Array.isArray(media.sources) && media.sources.length > 0) {
        list = media.sources;
      }

      if (list.length === 0) {
        return [{ id: 'sub', label: 'TR Altyazılı', defaultMode: 'sub', url: '', localKey: '' }];
      }

      return list.map((src, idx) => ({
        id: src.id || `src-${idx}`,
        label: src.label || (src.defaultMode === 'dub' ? 'TR Dublaj' : 'TR Altyazılı'),
        defaultMode: src.defaultMode || 'sub',
        url: src.url || '',
        localKey: src.localKey || ''
      }));
    }

    function cleanupPlayerTimers() {
      if (hlsController) {
        try { hlsController.destroy(); } catch (e) {}
        hlsController = null;
      }
      clearTimeout(hudTimer);
      clearTimeout(singleTapTimer);
    }

    function openPlayer(itemId, season = null, episode = null) {
      const media = state.catalog.find(m => m.id === itemId);
      if (!media) return;

      let s = Number(season) || 1;
      let ep = Number(episode) || 1;
      if (media.type === 'series' && Array.isArray(media.episodes) && media.episodes.length > 0 && season === null) {
        s = Number(media.episodes[0].season) || 1;
        ep = Number(media.episodes[0].number) || 1;
      }

      const channels = buildChannels(media, s, ep);
      state.player.media = media;
      state.player.season = s;
      state.player.episode = ep;
      state.player.channels = channels;
      state.player.activeChannelId = channels[0].id;
      state.player.isFullscreen = false;
      state.player.isPlaying = true;

      renderWatchStudio(0, true);
      const sec = document.getElementById('watch-studio-wrapper');
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function switchPlayerChannel(channelId) {
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;
      state.player.activeChannelId = channelId;
      renderWatchStudio(resume, playing);
    }

    function switchPlayerEpisode(season, episode) {
      if (!state.player.media) return;
      openPlayer(state.player.media.id, Number(season), Number(episode));
    }

    function syncFullscreenClass() {
      const wrap = document.getElementById('watch-studio-wrapper');
      if (!wrap || !state.player.isFullscreen) return;
      const isPortrait = window.innerHeight > window.innerWidth;
      wrap.className = isPortrait ? 'bp-fullscreen-landscape-rotated' : 'bp-fullscreen-landscape-native';
    }

    async function enterFullscreenMode() {
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;

      state.player.isFullscreen = true;
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';

      if (screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock('landscape'); } catch (e) {}
      }

      renderWatchStudio(resume, playing);
      showFullscreenHudAutoHide();
    }

    async function exitFullscreenMode() {
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;

      clearTimeout(hudTimer);
      clearTimeout(singleTapTimer);
      hudShown = false;
      state.player.isFullscreen = false;
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';

      if (document.fullscreenElement && document.exitFullscreen) {
        try { await document.exitFullscreen(); } catch (e) {}
      }
      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (e) {}
      }

      renderWatchStudio(resume, playing);
    }

    function showFullscreenHudAutoHide() {
      const hud = document.getElementById('fs-hud');
      if (!hud) return;
      hudShown = true;
      hud.classList.remove('opacity-0', 'pointer-events-none');
      hud.classList.add('opacity-100');
      clearTimeout(hudTimer);
      hudTimer = setTimeout(() => {
        hideFullscreenHud();
      }, 2000);
    }

    function hideFullscreenHud() {
      const hud = document.getElementById('fs-hud');
      if (!hud) return;
      hudShown = false;
      hud.classList.remove('opacity-100');
      hud.classList.add('opacity-0', 'pointer-events-none');
      clearTimeout(hudTimer);
    }

    function keepFullscreenHudAlive() {
      if (state.player.isFullscreen && hudShown) {
        showFullscreenHudAutoHide();
      }
    }

    function flashSeekBadge(side, text) {
      const el = document.getElementById(side === 'left' ? 'fs-seek-left' : 'fs-seek-right');
      if (!el) return;
      el.textContent = text;
      el.classList.remove('hidden', 'seek-feedback-badge');
      void el.offsetWidth;
      el.classList.add('seek-feedback-badge');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.add('hidden'), 860);
    }

    function seekRelative(sec) {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      const dur = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : (vid.currentTime + Math.abs(sec) + 10);
      vid.currentTime = Math.max(0, Math.min(dur, (vid.currentTime || 0) + sec));
      syncPlayerControls();
      flashSeekBadge(sec < 0 ? 'left' : 'right', sec < 0 ? '« 10 sn Geri' : '10 sn İleri »');
      keepFullscreenHudAlive();
    }

    function handleFullscreenTap(ev) {
      if (!state.player.isFullscreen) {
        togglePlayPause();
        return;
      }
      const surface = document.getElementById('fs-tap-surface');
      if (!surface) return;
      const pt = (ev.changedTouches && ev.changedTouches[0]) || ev;
      const rect = surface.getBoundingClientRect();
      const rotatedPortrait = window.innerHeight > window.innerWidth;
      const ratioX = rotatedPortrait
        ? (pt.clientY - rect.top) / Math.max(1, rect.height)
        : (pt.clientX - rect.left) / Math.max(1, rect.width);

      const now = Date.now();
      if (now - lastTapTs <= 280) {
        clearTimeout(singleTapTimer);
        lastTapTs = 0;
        if (ratioX < 0.5) seekRelative(-10);
        else seekRelative(10);
        return;
      }

      lastTapTs = now;
      clearTimeout(singleTapTimer);
      singleTapTimer = setTimeout(() => {
        lastTapTs = 0;
        if (hudShown) hideFullscreenHud();
        else showFullscreenHudAutoHide();
      }, 280);
    }

    function closePlayer() {
      cleanupPlayerTimers();
      const vid = document.getElementById('birperde-video');
      if (vid) vid.pause();
      state.player.media = null;
      state.player.isFullscreen = false;
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
      const wrap = document.getElementById('watch-studio-wrapper');
      wrap.classList.add('hidden');
      wrap.innerHTML = '';
    }

    function togglePlayPause() {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      if (vid.paused) vid.play().catch(() => {});
      else vid.pause();
      syncPlayerControls();
      keepFullscreenHudAlive();
    }

    function toggleMute() {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      vid.muted = !vid.muted;
      syncPlayerControls();
      keepFullscreenHudAlive();
    }

    function scrubPlayer(val) {
      const vid = document.getElementById('birperde-video');
      if (!vid || !isFinite(vid.duration) || vid.duration <= 0) return;
      vid.currentTime = (Number(val) / 100) * vid.duration;
      syncPlayerControls();
      keepFullscreenHudAlive();
    }

    function formatClock(seconds) {
      const s = Math.max(0, Math.floor(seconds || 0));
      const h = Math.floor(s / 3600);
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const r = String(s % 60).padStart(2, '0');
      return h > 0 ? `${h}:${m}:${r}` : `${m}:${r}`;
    }

    function syncPlayerControls() {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      const cur = vid.currentTime || 0;
      const dur = (vid.duration && isFinite(vid.duration)) ? vid.duration : 0;
      const pct = dur > 0 ? Math.min(100, (cur / dur) * 100) : 0;

      const slider = document.getElementById('bp-timeline-slider');
      if (slider) slider.value = pct;

      const clock = document.getElementById('bp-clock-text');
      if (clock) clock.textContent = `${formatClock(cur)} / ${formatClock(dur)}`;

      const playIcon = document.getElementById('bp-play-btn');
      if (playIcon) {
        playIcon.innerHTML = !vid.paused
          ? `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`
          : `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>`;
      }

      const centerBtn = document.getElementById('fs-center-play');
      if (centerBtn) {
        centerBtn.innerHTML = !vid.paused
          ? `<svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`
          : `<svg class="w-8 h-8 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>`;
      }

      const muteBtn = document.getElementById('bp-mute-btn');
      if (muteBtn) {
        muteBtn.innerHTML = vid.muted
          ? `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>`
          : `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
      }
    }

    async function attachVideoSource(resumeTime = 0, shouldPlay = true) {
      cleanupPlayerTimers();
      const vid = document.getElementById('birperde-video');
      const badge = document.getElementById('bp-loading-badge');
      if (!vid) return;

      const onCanPlay = () => {
        if (badge) badge.classList.add('hidden');
        if (resumeTime > 0 && isFinite(vid.duration) && resumeTime < vid.duration) {
          vid.currentTime = resumeTime;
          resumeTime = 0;
        }
        syncPlayerControls();
      };

      vid.addEventListener('loadeddata', onCanPlay);
      vid.addEventListener('canplay', onCanPlay);
      vid.addEventListener('playing', onCanPlay);
      vid.addEventListener('timeupdate', syncPlayerControls);
      vid.addEventListener('play', syncPlayerControls);
      vid.addEventListener('pause', syncPlayerControls);

      const ch = state.player.channels.find(c => c.id === state.player.activeChannelId) || state.player.channels[0];
      const playableUrl = await resolvePlayableUrl(ch);

      if (!playableUrl) {
        if (badge) badge.textContent = 'Video Yok';
        return;
      }

      const isHls = /\.m3u8(\?|$)/i.test(playableUrl);
      if (isHls && window.Hls && window.Hls.isSupported()) {
        const hls = new window.Hls({ enableWorker: true });
        hlsController = hls;
        hls.loadSource(playableUrl);
        hls.attachMedia(vid);
        hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
          if (shouldPlay) {
            vid.play().catch(() => {
              vid.muted = true;
              vid.play().catch(() => {});
            });
          }
        });
      } else {
        vid.src = playableUrl;
        vid.load();
        if (shouldPlay) {
          vid.play().catch(() => {
            vid.muted = true;
            vid.play().catch(() => {});
          });
        }
      }
    }

    function renderWatchStudio(resumeTime = 0, shouldPlay = true) {
      const wrap = document.getElementById('watch-studio-wrapper');
      const p = state.player;
      if (!wrap || !p.media) return;
      wrap.classList.remove('hidden');

      if (p.isFullscreen) {
        syncFullscreenClass();
        wrap.innerHTML = `
          <div class="relative w-full h-full bg-black text-white select-none overflow-hidden">
            <video id="birperde-video" preload="auto" playsinline class="w-full h-full object-contain bg-black"></video>
            <div id="fs-tap-surface" onclick="handleFullscreenTap(event)" class="absolute inset-0 z-10 cursor-pointer"></div>

            <div id="fs-seek-left" class="hidden pointer-events-none absolute left-8 top-1/2 -translate-y-1/2 z-30 px-4 py-2.5 rounded-2xl bg-black/80 border border-bpYellow text-bpYellow text-sm font-extrabold">« 10 sn Geri</div>
            <div id="fs-seek-right" class="hidden pointer-events-none absolute right-8 top-1/2 -translate-y-1/2 z-30 px-4 py-2.5 rounded-2xl bg-black/80 border border-bpYellow text-bpYellow text-sm font-extrabold">10 sn İleri »</div>

            <div id="bp-loading-badge" class="pointer-events-none absolute top-4 left-1/2 -translate-x-1/2 z-30 px-3 py-1 rounded-lg bg-bpRoyal/90 text-white text-xs font-extrabold flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-bpYellow live-indicator"></span>
              <span>Yükleniyor</span>
            </div>

            <div id="fs-hud" onclick="event.stopPropagation(); keepFullscreenHudAlive();" class="absolute inset-0 z-20 flex flex-col justify-between bg-gradient-to-b from-black/75 via-transparent to-black/85 transition-opacity duration-200 opacity-0 pointer-events-none p-4">
              <div class="flex items-center justify-between gap-2 min-w-0">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="text-sm font-extrabold text-white truncate">${escapeHtml(p.media.title)}</span>
                  ${p.channels.map(ch => `
                    <button type="button" onclick="switchPlayerChannel('${escapeAttr(ch.id)}')" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold border shrink-0 cursor-pointer ${ch.id === p.activeChannelId ? 'bg-bpRoyal border-bpYellow text-white' : 'bg-white/15 border-white/20 text-slate-200'}">${escapeHtml(ch.label)}</button>
                  `).join('')}
                </div>
                <button type="button" onclick="exitFullscreenMode()" class="px-3.5 py-2 rounded-xl bg-bpYellow hover:bg-amber-400 text-bpBlack text-xs font-extrabold flex items-center gap-1.5 shrink-0 shadow-lg cursor-pointer">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg>
                  <span>Küçük Ekran</span>
                </button>
              </div>

              <div class="flex items-center justify-center gap-8">
                <button type="button" onclick="seekRelative(-10)" class="px-3.5 py-2.5 rounded-2xl bg-black/65 hover:bg-bpRoyal border border-white/25 text-white text-xs font-extrabold cursor-pointer">-10 sn</button>
                <button type="button" id="fs-center-play" onclick="togglePlayPause()" class="w-16 h-16 rounded-full bg-bpRoyal/95 hover:bg-bpNavy border-2 border-bpYellow text-white flex items-center justify-center shadow-2xl cursor-pointer">
                  <svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                </button>
                <button type="button" onclick="seekRelative(10)" class="px-3.5 py-2.5 rounded-2xl bg-black/65 hover:bg-bpRoyal border border-white/25 text-white text-xs font-extrabold cursor-pointer">+10 sn</button>
              </div>

              <div class="flex items-center gap-3">
                <button type="button" id="bp-play-btn" onclick="togglePlayPause()" class="px-3 py-2 rounded-xl bg-bpRoyal text-white text-xs font-extrabold shrink-0 cursor-pointer">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                </button>
                <input type="range" id="bp-timeline-slider" min="0" max="100" step="0.2" value="0" oninput="scrubPlayer(this.value)" class="bp-scrubber flex-1 min-w-0" />
                <span id="bp-clock-text" class="font-mono text-xs font-extrabold text-bpYellow shrink-0">00:00 / 00:00</span>
                <button type="button" id="bp-mute-btn" onclick="toggleMute()" class="w-9 h-9 rounded-xl bg-white/15 text-white flex items-center justify-center shrink-0 cursor-pointer">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                </button>
                <button type="button" onclick="exitFullscreenMode()" class="px-3 py-2 rounded-xl bg-bpYellow text-bpBlack text-xs font-extrabold shrink-0 cursor-pointer">Küçük Ekran</button>
              </div>
            </div>
          </div>
        `;
        attachVideoSource(resumeTime, shouldPlay);
        return;
      }

      wrap.className = 'max-w-6xl w-full mx-auto px-3 sm:px-5 pt-4';

      let episodeBar = '';
      if (p.media.type === 'series') {
        const eps = Array.isArray(p.media.episodes) && p.media.episodes.length > 0
          ? p.media.episodes
          : [{ season: 1, number: 1, name: '1. Bölüm' }];
        const seasons = Array.from(new Set(eps.map(e => Number(e.season)))).sort((a, b) => a - b);
        const curEps = eps.filter(e => Number(e.season) === Number(p.season)).sort((a, b) => Number(a.number) - Number(b.number));

        episodeBar = `
          <div class="px-4 py-2.5 bg-slate-900 border-b border-white/10 flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2 min-w-0">
              <select onchange="switchPlayerEpisode(this.value, 1)" class="px-2.5 py-1.5 rounded-lg bg-bpNavy border border-bpRoyal text-xs font-extrabold text-white">
                ${seasons.map(sn => `<option value="${sn}" ${Number(p.season) === sn ? 'selected' : ''}>${sn}. Sezon</option>`).join('')}
              </select>
              <div class="flex items-center gap-1 flex-wrap">
                ${curEps.map(ep => `
                  <button type="button" onclick="switchPlayerEpisode(${p.season}, ${ep.number})" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition cursor-pointer ${Number(ep.number) === Number(p.episode) ? 'bg-bpGreen text-white' : 'bg-white/10 hover:bg-white/20 text-slate-200'}">${ep.number}. Bölüm</button>
                `).join('')}
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button type="button" onclick="openAddContentModal('episode', '${escapeAttr(p.media.id)}')" class="px-2.5 py-1 rounded-lg bg-bpYellow text-bpBlack text-[11px] font-extrabold cursor-pointer">+ Bölüm Ekle</button>
              <button type="button" onclick="openEpisodesModal('${escapeAttr(p.media.id)}')" class="px-2.5 py-1 rounded-lg bg-bpRed text-white text-[11px] font-extrabold cursor-pointer">Bölümler</button>
            </div>
          </div>
        `;
      }

      wrap.innerHTML = `
        <div class="bg-bpBlack text-white rounded-2xl border-2 border-bpRoyal shadow-xl overflow-hidden">
          <div class="birperde-ribbon"></div>
          <div class="px-4 py-3 bg-bpNavy flex flex-wrap items-center justify-between gap-2 border-b border-white/10">
            <div class="flex flex-wrap items-center gap-2 min-w-0">
              <span class="px-2 py-0.5 rounded text-[10px] font-extrabold uppercase ${p.media.type === 'movie' ? 'bg-bpRed' : 'bg-bpEmerald'}">${p.media.type === 'movie' ? 'FİLM' : 'DİZİ'}</span>
              <h2 class="text-sm sm:text-lg font-extrabold text-white truncate">${escapeHtml(p.media.title)}</h2>
              <span class="px-2 py-0.5 rounded bg-bpYellow text-bpBlack font-mono text-[11px] font-extrabold">${p.media.year}</span>
              ${p.media.duration ? `<span class="px-2 py-0.5 rounded bg-white/15 text-sky-200 text-[11px] font-bold">${escapeHtml(p.media.duration)}</span>` : ''}
            </div>
            <div class="flex items-center gap-1.5">
              <button type="button" onclick="enterFullscreenMode()" class="px-3.5 py-1.5 rounded-xl bg-bpRoyal hover:bg-blue-600 text-white text-xs font-extrabold transition cursor-pointer">Tam Ekran</button>
              <button type="button" onclick="closePlayer()" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-extrabold transition cursor-pointer">Kapat</button>
            </div>
          </div>

          ${episodeBar}

          <div class="px-4 py-2 bg-slate-900/95 border-b border-white/10 flex items-center gap-2 flex-wrap">
            <span class="text-[11px] font-bold text-slate-400">Ses / Sürüm:</span>
            ${p.channels.map(ch => {
              const active = ch.id === p.activeChannelId;
              const isDub = ch.defaultMode === 'dub';
              return `
                <button type="button" onclick="switchPlayerChannel('${escapeAttr(ch.id)}')" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold border transition cursor-pointer ${active ? (isDub ? 'bg-bpEmerald border-bpYellow text-white shadow' : 'bg-bpRoyal border-bpYellow text-white shadow') : 'bg-white/5 hover:bg-white/15 border-white/15 text-slate-200'}">${escapeHtml(ch.label)}</button>
              `;
            }).join('')}
          </div>

          <div class="p-3 sm:p-4">
            <div class="relative aspect-video rounded-xl overflow-hidden bg-bpNavy border border-white/20">
              <video id="birperde-video" preload="auto" playsinline onclick="togglePlayPause()" class="w-full h-full object-contain bg-bpNavy cursor-pointer"></video>

              <div id="bp-loading-badge" class="pointer-events-none absolute top-2.5 right-2.5 px-2.5 py-1 rounded-lg bg-bpRoyal/90 text-white text-[10px] font-extrabold flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-bpYellow live-indicator"></span>
                <span>Yükleniyor</span>
              </div>

              <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/95 via-black/80 to-transparent px-3 py-2 flex items-center gap-2">
                <button type="button" id="bp-play-btn" onclick="togglePlayPause()" aria-label="Oynat veya Duraklat" class="w-8 h-8 rounded-lg bg-bpRoyal hover:bg-bpNavy text-white flex items-center justify-center shrink-0 transition cursor-pointer">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                </button>

                <input type="range" id="bp-timeline-slider" min="0" max="100" step="0.5" value="0" oninput="scrubPlayer(this.value)" aria-label="Zaman Çizelgesi" class="bp-scrubber flex-1 min-w-0" />

                <span id="bp-clock-text" class="font-mono text-[10px] sm:text-[11px] font-bold text-sky-200 shrink-0">00:00 / 00:00</span>

                <button type="button" id="bp-mute-btn" onclick="toggleMute()" aria-label="Sesi Aç veya Kapat" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 text-white flex items-center justify-center shrink-0 transition cursor-pointer">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                </button>

                <button type="button" onclick="enterFullscreenMode()" aria-label="Tam Ekran" class="w-8 h-8 rounded-lg bg-bpYellow text-bpBlack flex items-center justify-center shrink-0 transition cursor-pointer">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;

      attachVideoSource(resumeTime, shouldPlay);
    }

    /* =====================================================================
       11. UI HELPERS & GLOBAL EXPORTS
    ===================================================================== */
    function getBrandSvg(size = 34) {
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" class="shrink-0">
          <rect x="2" y="2" width="44" height="44" rx="12" fill="#0B1F3A" stroke="#1D4ED8" stroke-width="2"/>
          <rect x="8" y="10" width="3.5" height="4" rx="1" fill="#EAB308"/>
          <rect x="8" y="18" width="3.5" height="4" rx="1" fill="#EAF4FF"/>
          <rect x="8" y="26" width="3.5" height="4" rx="1" fill="#16A34A"/>
          <rect x="8" y="34" width="3.5" height="4" rx="1" fill="#D92626"/>
          <rect x="36.5" y="10" width="3.5" height="4" rx="1" fill="#D92626"/>
          <rect x="36.5" y="18" width="3.5" height="4" rx="1" fill="#EAB308"/>
          <rect x="36.5" y="26" width="3.5" height="4" rx="1" fill="#EAF4FF"/>
          <rect x="36.5" y="34" width="3.5" height="4" rx="1" fill="#16A34A"/>
          <rect x="14.5" y="11" width="19" height="26" rx="4" fill="#047857"/>
          <polygon points="21,18 30,24 21,30" fill="#FFFFFF"/>
        </svg>
      `;
    }

    function openModal(html) {
      document.getElementById('modal-card').innerHTML = html;
      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
      document.getElementById('modal-card').innerHTML = '';
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'modal-overlay') closeModal();
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toast-container');
      const el = document.createElement('div');
      const palette = {
        success: 'bg-bpEmerald text-white border-bpYellow',
        error: 'bg-bpRed text-white border-white',
        info: 'bg-bpNavy text-white border-bpRoyal'
      };
      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl border text-xs font-extrabold shadow-lg ${palette[type] || palette.info}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => { if (el.parentElement) el.remove(); }, 3200);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    // Expose inline handlers immediately on window so all HTML events work reliably
    Object.assign(window, {
      formDraft,
      openAddContentModal,
      handleDraftTitleChange,
      runMetadataLookupNow,
      selectSearchCandidate,
      handleVideoPickerChange,
      handlePosterFileChosen,
      handleManualPosterUrlInput,
      openCoverFrameCutter,
      updateCutterReadout,
      seekCutterBySlider,
      stepCutterSeconds,
      toggleCutterPlayback,
      captureCurrentFrameAsCover,
      closeCoverFrameCutter,
      submitNewMovie,
      submitNewSeries,
      submitNewEpisode,
      openEditItemModal,
      lookupIntoEditModal,
      saveEditedItem,
      openEpisodesModal,
      deleteEpisodeFromSeries,
      askDeleteItem,
      confirmDeleteItem,
      handleSearchInput,
      resetSearchInput,
      switchNavTab,
      switchLangFilter,
      openPlayer,
      switchPlayerChannel,
      switchPlayerEpisode,
      enterFullscreenMode,
      exitFullscreenMode,
      handleFullscreenTap,
      keepFullscreenHudAlive,
      seekRelative,
      closePlayer,
      togglePlayPause,
      toggleMute,
      scrubPlayer,
      closeModal,
      handleOverlayClick
    });

    function bootstrapApp() {
      const logoEl = document.getElementById('header-brand-logo');
      if (logoEl && !logoEl.innerHTML) {
        logoEl.innerHTML = getBrandSvg(34);
      }
      updateFilterButtons();
      renderMainView();
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', bootstrapApp);
    } else {
      bootstrapApp();
    }

    initBackgroundFirebase();

    window.addEventListener('resize', syncFullscreenClass);
    window.addEventListener('orientationchange', syncFullscreenClass);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && state.player.isFullscreen) {
        exitFullscreenMode();
      }
    });
  </script>
</body>
</html>
