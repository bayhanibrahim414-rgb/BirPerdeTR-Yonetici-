<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BirPerdeTR — Film ve Dizi Platformu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            bpWhite: '#FFFFFF',
            bpSky: '#EAF4FF',
            bpSkyBorder: '#BFDBFE',
            bpRed: '#D92626',
            bpRoyal: '#1D4ED8',
            bpYellow: '#EAB308',
            bpGreen: '#16A34A',
            bpBlack: '#0F172A',
            bpBrown: '#78350F',
            bpNavy: '#0B1F3A',
            bpEmerald: '#047857',
          }
        }
      }
    };
  </script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: clip;
      overscroll-behavior-x: none;
      touch-action: pan-y;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #EAF4FF;
      color: #0F172A;
      margin: 0;
      padding: 0;
    }

    #admin-app, header, main, section, article, footer, #modal-overlay {
      max-width: 100%;
      overflow-x: clip;
    }

    /* Animated Intro Splash */
    #intro-splash {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #173663 0%, #091629 65%, #040912 100%);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    #intro-splash.splash-exit {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
    }

    .intro-shimmer-ring {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 9999px;
      background: conic-gradient(from 0deg, rgba(234, 179, 8, 0.0), rgba(234, 179, 8, 0.55), rgba(56, 189, 248, 0.45), rgba(234, 179, 8, 0.0));
      filter: blur(18px);
      animation: introSpin 4.5s linear infinite;
    }

    @keyframes introSpin {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(0.95); }
    }

    @keyframes introPop {
      0% { opacity: 0; transform: translateY(18px) scale(0.84); }
      65% { opacity: 1; transform: translateY(-4px) scale(1.03); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .intro-brand-pop {
      animation: introPop 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes titleShine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .intro-shine-text {
      background: linear-gradient(90deg, #EAF4FF 0%, #FDE047 35%, #FFFFFF 50%, #38BDF8 70%, #EAF4FF 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleShine 2.6s linear infinite;
    }

    .bg-pattern-sky {
      background-color: #EAF4FF;
      background-image: url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%231D4ED8' stroke-opacity='0.07' stroke-width='1'%3E%3Cpath d='M32 0L64 32L32 64L0 32Z'/%3E%3Crect x='20' y='20' width='24' height='24' rx='4'/%3E%3Ccircle cx='32' cy='32' r='4'/%3E%3C/g%3E%3C/svg%3E");
    }

    .theme-banner-movies {
      background-color: #0B1F3A;
      background-image:
        url("data:image/svg+xml,%3Csvg width='48' height='48' viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23FFFFFF' stroke-opacity='0.09' stroke-width='1'%3E%3Crect x='4' y='8' width='40' height='32' rx='4'/%3E%3Ccircle cx='24' cy='24' r='8'/%3E%3C/g%3E%3C/svg%3E"),
        linear-gradient(135deg, #0B1F3A 0%, #1D4ED8 100%);
    }

    .theme-banner-series {
      background-color: #047857;
      background-image:
        url("data:image/svg+xml,%3Csvg width='48' height='48' viewBox='0 0 48 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23EAB308' stroke-opacity='0.14' stroke-width='1'%3E%3Cpath d='M0 16H48M0 32H48M16 0V48M32 0V48'/%3E%3C/g%3E%3C/svg%3E"),
        linear-gradient(135deg, #047857 0%, #78350F 100%);
    }

    .birperde-ribbon {
      height: 4px;
      background: linear-gradient(
        90deg,
        #EAF4FF 0%,
        #1D4ED8 16%,
        #0B1F3A 32%,
        #047857 48%,
        #16A34A 62%,
        #EAB308 76%,
        #78350F 88%,
        #D92626 95%,
        #0F172A 100%
      );
    }

    /* Responsive Catalog Grid: 3 cols on Mobile, 4 cols on Tablet, 5 cols on Desktop */
    .catalog-responsive-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .catalog-responsive-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }

    @media (min-width: 1024px) {
      .catalog-responsive-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
      }
    }

    .card-movie-frame {
      background: #FFFFFF;
      border: 1.5px solid #BFDBFE;
      border-top: 3px solid #D92626;
      border-radius: 14px;
      overflow: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 14px -4px rgba(11, 31, 58, 0.12);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .card-movie-frame:hover {
      transform: translateY(-2px);
      border-color: #1D4ED8;
      box-shadow: 0 10px 20px -6px rgba(11, 31, 58, 0.22);
    }

    .card-series-frame {
      background: #FFFFFF;
      border: 1.5px solid #A7F3D0;
      border-top: 3px solid #047857;
      border-radius: 14px;
      overflow: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 14px -4px rgba(4, 120, 87, 0.12);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .card-series-frame:hover {
      transform: translateY(-2px);
      border-color: #78350F;
      box-shadow: 0 10px 20px -6px rgba(4, 120, 87, 0.22);
    }

    /* Fullscreen containers: Mobile portrait rotates cleanly; Tablet/Desktop uses full viewport */
    .bp-fs-rot-cw {
      position: fixed !important;
      top: 0 !important;
      left: 100vw !important;
      width: 100dvh !important;
      height: 100vw !important;
      max-width: none !important;
      transform: rotate(90deg) !important;
      transform-origin: top left !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    .bp-fs-rot-ccw {
      position: fixed !important;
      top: 100vh !important;
      left: 0 !important;
      width: 100dvh !important;
      height: 100vw !important;
      max-width: none !important;
      transform: rotate(-90deg) !important;
      transform-origin: top left !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    @supports not (width: 100dvh) {
      .bp-fs-rot-cw, .bp-fs-rot-ccw {
        width: 100vh !important;
      }
    }

    .bp-fullscreen-landscape-native {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    .bp-fs-rot-cw video,
    .bp-fs-rot-ccw video,
    .bp-fullscreen-landscape-native video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      border-radius: 0 !important;
      border: 0 !important;
      background: #000000 !important;
    }

    .fs-icon-btn {
      background: rgba(15, 23, 42, 0.56);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: rgba(255, 255, 255, 0.94);
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .fs-icon-btn:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.26);
    }

    .fs-icon-active {
      background: rgba(148, 163, 184, 0.36);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      color: #FFFFFF;
    }

    .watch-soft-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #E2E8F0;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .watch-soft-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .watch-soft-active {
      background: rgba(51, 65, 85, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.55);
      color: #FFFFFF;
    }

    input[type="range"].bp-scrubber {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"].bp-scrubber::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.24);
    }

    input[type="range"].bp-scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 9999px;
      background: rgba(226, 232, 240, 0.95);
      border: 1.5px solid rgba(15, 23, 42, 0.65);
      margin-top: -5px;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .live-indicator {
      animation: livePulse 1.4s infinite ease-in-out;
    }

    @keyframes seekPop {
      0% { opacity: 0; transform: scale(0.85); }
      25% { opacity: 1; transform: scale(1.04); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.95); }
    }
    .seek-feedback-badge {
      animation: seekPop 0.85s ease forwards;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #EAF4FF;
    }
    ::-webkit-scrollbar-thumb {
      background: #1D4ED8;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-pattern-sky min-h-screen">

  <!-- ANIMATED INTRO SPLASH SCREEN WITH SOUND -->
  <div id="intro-splash" onclick="dismissIntroSplashNow()" class="cursor-pointer select-none px-6 text-center">
    <div class="relative flex flex-col items-center justify-center">
      <div class="intro-shimmer-ring"></div>
      <div id="intro-logo-mount" class="intro-brand-pop relative z-10 mb-5 drop-shadow-[0_0_28px_rgba(234,179,8,0.35)]"></div>
      <h1 class="intro-brand-pop relative z-10 text-4xl sm:text-6xl font-extrabold tracking-tight intro-shine-text">
        BirPerdeTR
      </h1>
      <p class="intro-brand-pop relative z-10 mt-2 text-xs sm:text-sm font-semibold tracking-widest uppercase text-sky-200/80">
        Film &amp; Dizi Arşivi
      </p>
    </div>
  </div>

  <!-- Top Signature Ribbon -->
  <div class="birperde-ribbon w-full sticky top-0 z-50"></div>

  <!-- Toast Notifications -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[10000] flex flex-col gap-2 max-w-xs w-[calc(100%-2rem)] pointer-events-none"></div>

  <!-- MAIN APPLICATION SHELL -->
  <div id="admin-app" class="min-h-screen flex flex-col w-full">

    <!-- TOP HEADER BAR -->
    <header class="sticky top-[4px] z-40 bg-bpWhite border-b-2 border-bpSkyBorder shadow-xs w-full">
      <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">

        <!-- Left: Brand Title & YÖNETİCİ Badge -->
        <div class="flex items-center gap-2.5 shrink-0 min-w-0">
          <div id="header-brand-logo" onclick="replayIntroSplash()" class="cursor-pointer" title="Giriş Ekranını Tekrar Göster"></div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-base sm:text-xl font-extrabold tracking-tight text-bpNavy">BirPerdeTR</span>
              <span class="px-2 py-0.5 rounded text-[10px] font-extrabold bg-bpNavy text-bpYellow tracking-wide">
                YÖNETİCİ
              </span>
            </div>
            <p class="text-[11px] text-slate-600 hidden sm:block">Kişisel Film ve Dizi Arşivi</p>
          </div>
        </div>

        <!-- Right: Add Content & Backup Actions -->
        <div class="flex items-center gap-1.5 sm:gap-2 order-2 md:order-3 shrink-0 flex-wrap">
          <button type="button" onclick="openAddContentModal('movie')" class="px-3 py-2 rounded-xl bg-bpNavy hover:bg-bpRoyal text-white text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
            <span>Film Ekle</span>
          </button>

          <button type="button" onclick="openAddContentModal('series')" class="px-3 py-2 rounded-xl bg-bpEmerald hover:bg-bpGreen text-white text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
            <span>Dizi Ekle</span>
          </button>

          <button type="button" onclick="openAddContentModal('episode')" class="px-3 py-2 rounded-xl bg-bpBrown hover:bg-amber-800 text-bpYellow text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>

          <button type="button" onclick="openBackupModal()" class="px-2.5 py-2 rounded-xl bg-bpSky hover:bg-bpSkyBorder text-bpNavy text-xs font-extrabold flex items-center gap-1 transition cursor-pointer" title="Yedekle / Geri Yükle">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            <span class="hidden lg:inline">Yedek</span>
          </button>
        </div>

        <!-- Center: Search Input -->
        <div class="relative order-3 md:order-2 w-full md:flex-1 md:max-w-md min-w-0">
          <div class="relative flex items-center">
            <svg class="w-4 h-4 text-bpRoyal absolute left-3 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">

            </svg>
            <input
              type="text"

              placeholder="Film, dizi, tür, tarih veya yıl ara..."

            />
            <button type="button" id="search-clear-btn" onclick="resetSearchInput()" class="hidden absolute right-2 px-2 py-1 rounded-lg bg-bpRed/10 text-bpRed text-[10px] font-extrabold cursor-pointer">

      </div>

      <!-- CATEGORY TABS & LANGUAGE FILTERS -->
      <div class="bg-bpSky/50 border-t border-bpSkyBorder w-full">
        <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 min-w-0 flex-wrap">
            <button type="button" data-nav-tab="all" onclick="switchNavTab('all')" class="nav-tab-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">

            </button>
            <button type="button" data-lang-btn="dub" onclick="switchLangFilter('dub')" class="lang-filter-btn px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition cursor-pointer">

            <button type="button" data-lang-btn="sub" onclick="switchLangFilter('sub')" class="lang-filter-btn px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition cursor-pointer">

        </div>
      </div>
    </header>

    <!-- NON-BLOCKING BACKGROUND CLOUD SYNC STATUS BANNER -->
    <div id="background-sync-banner" class="hidden max-w-6xl w-full mx-auto px-3 sm:px-5 pt-3">
      <div class="px-4 py-2.5 rounded-xl bg-bpNavy text-white border border-bpRoyal flex items-center justify-between gap-3 shadow-sm min-w-0">
        <div class="flex items-center gap-2 min-w-0">
          <span class="w-2.5 h-2.5 rounded-full bg-bpYellow live-indicator shrink-0"></span>
          <span id="background-sync-text" class="text-xs font-extrabold text-bpYellow truncate">Arka planda aktarılıyor...</span>
        </div>
        <span id="background-sync-pct" class="font-mono text-xs font-extrabold text-white shrink-0">%0</span>

    <!-- WATCH STUDIO (Compact Theater Frame on Tablet & Desktop, Full-width on Phone) -->

    <!-- MAIN CATALOG AREA -->
    <main id="main-content-area" class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-5 py-4 space-y-5"></main>

    <!-- FOOTER -->
    <footer class="bg-bpWhite border-t border-bpSkyBorder mt-8 py-4 px-3 sm:px-5 text-center text-[11px] text-slate-600">
      BirPerdeTR — Kişisel Film ve Dizi Arşivi
    </footer>
  </div>

  <!-- MODAL DIALOG -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-50 bg-bpBlack/65 flex items-center justify-center p-3 overflow-y-auto" onclick="handleOverlayClick(event)">
    <div id="modal-card" class="w-full max-w-lg bg-bpWhite rounded-2xl border-2 border-bpRoyal shadow-2xl overflow-hidden my-auto max-h-[92vh] overflow-y-auto"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      deleteDoc,
      onSnapshot,
      collection
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import {
      getStorage,
      ref as storageRef,
      uploadBytesResumable,
      getDownloadURL,
      deleteObject
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

    /* =====================================================================
       1. INTRO SPLASH + WEB AUDIO ENGINE UNLOCK
    ===================================================================== */
    let splashDismissTimer = null;
    let audioCtxGain = null;
    let audioGainNode = null;
    let wiredGainVideo = null;

    function unlockAudioEngine() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        if (!audioCtxGain) {
          audioCtxGain = new AudioCtx();
        }
        if (audioCtxGain.state === 'suspended') {
          audioCtxGain.resume().catch(() => {});
        }
      } catch (e) {}
    }

    ['touchstart', 'pointerdown', 'click'].forEach(evtName => {
      document.addEventListener(evtName, unlockAudioEngine, { passive: true });
    });

    function playIntroChime() {
      try {
        unlockAudioEngine();
        if (!audioCtxGain) return;
        const now = audioCtxGain.currentTime;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = audioCtxGain.createOscillator();
          const gain = audioCtxGain.createGain();
          osc.type = idx === notes.length - 1 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.11);

          gain.gain.setValueAtTime(0.0001, now + idx * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.08, now + idx * 0.11 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.11 + 0.75);

          osc.connect(gain);
          gain.connect(audioCtxGain.destination);
          osc.start(now + idx * 0.11);
          osc.stop(now + idx * 0.11 + 0.8);
        });
      } catch (e) {}
    }

          'state_changed',
          (snap) => {

              const pct = Math.round((snap.bytesTransferred / snap.totalBytes) * 100);
              const mbDone = (snap.bytesTransferred / 1048576).toFixed(1);
              const mbTotal = (snap.totalBytes / 1048576).toFixed(1);
              onProgress(pct, `${mbDone} / ${mbTotal} MB`);
            }
          },
          () => resolve({ url: '', storagePath: '' }),
          async () => {
            try {
              const downloadUrl = await getDownloadURL(task.snapshot.ref);
              resolve({ url: downloadUrl, storagePath: path });
            } catch (e) {
              resolve({ url: '', storagePath: '' });
            }
          }
        );
      });

    const GENRE_MAP = {
      'action': 'Aksiyon',
      'adventure': 'Macera',
      'action & adventure': 'Aksiyon, Macera',
      'animation': 'Animasyon',
      'anime': 'Anime',

    function toTurkishGenre(raw, fallbackType = 'movie') {
      if (!raw) return fallbackType === 'series' ? 'Dizi' : 'Sinema';
      const parts = String(raw).split(/[,/&]+/).map(s => s.trim()).filter(Boolean);
      const translated = parts.map(p => {
        const lower = p.toLowerCase();
        if (GENRE_MAP[lower]) return GENRE_MAP[lower];
        for (const [k, v] of Object.entries(GENRE_MAP)) {
          if (lower.includes(k)) return v;
        }
        return p;
      });
      return Array.from(new Set(translated)).slice(0, 3).join(', ') || (fallbackType === 'series' ? 'Dizi' : 'Sinema');
    }

    function parseDateParts(isoOrStr) {
      if (!isoOrStr) return { year: null, month: null, day: null, fullDate: '' };
      const str = String(isoOrStr).trim();
      const ymd = str.match(/\b(19\d{2}|20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})\b/);
      if (ymd) {
        const y = Number(ymd[1]);
        const m = Math.min(12, Math.max(1, Number(ymd[2])));
        const d = Math.min(31, Math.max(1, Number(ymd[3])));
        return {
          year: y,
          month: m,
          day: d,
          fullDate: `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`
        };
      }
      const ym = str.match(/\b(19\d{2}|20\d{2})[-/.](\d{1,2})\b/);
      if (ym) {
        const y = Number(ym[1]);
        const m = Math.min(12, Math.max(1, Number(ym[2])));
        return { year: y, month: m, day: null, fullDate: `${y}-${String(m).padStart(2, '0')}` };
      }
      const yOnly = str.match(/\b(19\d{2}|20\d{2})\b/);
      if (yOnly) {
        return { year: Number(yOnly[1]), month: null, day: null, fullDate: String(yOnly[1]) };
      }
      return { year: null, month: null, day: null, fullDate: '' };
    }

    function formatDurationFromSeconds(sec) {
      const s = Math.max(0, Math.round(Number(sec) || 0));
      if (!s) return '';
      const mins = Math.max(1, Math.round(s / 60));
      if (mins >= 60) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return m > 0 ? `${h} sa ${m} dk` : `${h} sa`;
      }
      return `${mins} dk`;
    }

    function formatDurationFromMillis(ms) {
      const n = Number(ms) || 0;
      if (!n) return '';
      return formatDurationFromSeconds(n / 1000);
    }

    function extractSeasonEpisodeFromText(text) {
      if (!text) return { season: null, episode: null, epTitle: '', seriesName: text };
      const sxe = text.match(/s(?:eason)?\s*0*(\d+)\s*e(?:p(?:isode)?)?\s*0*(\d+)/i);
      if (sxe) {
        const seriesName = text.slice(0, sxe.index).replace(/[-–:|.]+$/g, '').trim();
        return { season: Number(sxe[1]), episode: Number(sxe[2]), epTitle: '', seriesName: seriesName || text };
      }
      const trEp = text.match(/(\d+)\.\s*sezon\s*(\d+)\.\s*b[öo]l[üü]m/i);
      if (trEp) {
        const seriesName = text.slice(0, trEp.index).replace(/[-–:|.]+$/g, '').trim();
        return { season: Number(trEp[1]), episode: Number(trEp[2]), epTitle: '', seriesName: seriesName || text };
      }
      const onlyEp = text.match(/\b(\d+)\.\s*b[öo]l[üü]m\b/i) || text.match(/\bep(?:isode)?\s*0*(\d+)\b/i);
      if (onlyEp) {
        const seriesName = text.slice(0, onlyEp.index).replace(/[-–:|.]+$/g, '').trim();
        return { season: 1, episode: Number(onlyEp[1]), epTitle: '', seriesName: seriesName || text };
      }
      return { season: null, episode: null, epTitle: '', seriesName: text };
    }

    function parseFilenameTitleYear(filename) {
      if (!filename) return { title: '', year: null, month: null, day: null };
      let base = filename.replace(/\.[^/.]+$/, '');
      const dateParts = parseDateParts(base);
      const yMatch = base.match(/\b(19\d{2}|20\d{2})\b/);
      if (yMatch) base = base.slice(0, yMatch.index);
      base = base
        .replace(/\(.*?\)|\[.*?\]/g, ' ')
        .replace(/\b(1080p|720p|480p|2160p|4k|bluray|web-dl|webrip|hdrip|x264|x265|hevc|tr|dublaj|altyazili|altyazı)\b/gi, ' ')
        .replace(/[._-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return {
        title: base,
        year: dateParts.year,
        month: dateParts.month,
        day: dateParts.day
      };
    }

    async function queryExternalMediaMetadata(query, mediaType = 'movie', seasonNum = null, epNum = null) {
      const epParsed = extractSeasonEpisodeFromText(query || '');
      const cleanQuery = (epParsed.seriesName || query || '')
        .replace(/\b(19\d{2}|20\d{2})\b/g, '')
        .trim();

      if (cleanQuery.length < 2) return [];

      const results = [];
      const targetS = seasonNum || epParsed.season || 1;
      const targetE = epNum || epParsed.episode || null;

      const checkItunes = async (country, mediaParam) => {
        try {
          const url = `https://itunes.apple.com/search?term=${encodeURIComponent(cleanQuery)}&country=${country}&media=${mediaParam}&limit=6`;
          const resp = await fetch(url);
          if (!resp.ok) return;
          const data = await resp.json();
          for (const item of (data.results || [])) {
            const title = item.trackName || item.collectionName || '';
            const dp = parseDateParts(item.releaseDate || '');
            const posterUrl = item.artworkUrl100
              ? item.artworkUrl100.replace(/100x100bb\.(jpg|png)/i, '600x600bb.$1')
              : '';
            const genre = toTurkishGenre(item.primaryGenreName || '', mediaType);
            const duration = item.trackTimeMillis ? formatDurationFromMillis(item.trackTimeMillis) : '';
            if (title && (dp.year || genre)) {
              results.push({
                title,
                year: dp.year || new Date().getFullYear(),
                month: dp.month || 1,
                day: dp.day || null,
                releaseDate: dp.fullDate || '',
                posterUrl,
                genre,
                duration,
                season: targetS,
                episode: targetE,
                epTitle: '',
                fromTr: country === 'tr'
              });
            }
          }
        } catch (e) {}
      };

      const checkTvMaze = async () => {
        try {
          const resp = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(cleanQuery)}&embed=episodes`);
          if (resp.ok) {
            const show = await resp.json();
            if (show && show.name) {
              const showDate = parseDateParts(show.premiered || '');
              let epDate = { year: null, month: null, day: null, fullDate: '' };
              let epName = '';
              let epRuntime = '';

              const epsList = show._embedded && Array.isArray(show._embedded.episodes) ? show._embedded.episodes : [];
              if (targetE) {
                const foundEp = epsList.find(e => Number(e.season) === Number(targetS) && Number(e.number) === Number(targetE));
                if (foundEp) {
                  epDate = parseDateParts(foundEp.airdate || '');
                  epName = foundEp.name || `${targetE}. Bölüm`;
                  if (foundEp.runtime) epRuntime = `${foundEp.runtime} dk`;
                }
              }

              const finalYear = epDate.year || showDate.year || new Date().getFullYear();
              const finalMonth = epDate.month || showDate.month || 1;
              const finalDay = epDate.day || showDate.day || null;
              const finalDate = epDate.fullDate || showDate.fullDate || '';

              results.push({
                title: show.name,
                year: finalYear,
                month: finalMonth,
                day: finalDay,
                releaseDate: finalDate,
                posterUrl: (show.image && (show.image.original || show.image.medium)) || '',
                genre: Array.isArray(show.genres) && show.genres.length > 0
                  ? toTurkishGenre(show.genres.join(', '), mediaType)
                  : (mediaType === 'series' ? 'Dizi' : 'Sinema'),
                duration: epRuntime || (show.averageRuntime ? `${show.averageRuntime} dk` : ''),
                season: targetS,
                episode: targetE,
                epTitle: epName,
                fromTr: false
              });
            }
          }

          const searchResp = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(cleanQuery)}`);
          if (searchResp.ok) {
            const sData = await searchResp.json();
            for (const entry of (sData || []).slice(0, 4)) {
              const sh = entry.show;
              if (!sh || !sh.name) continue;
              const dp = parseDateParts(sh.premiered || '');
              results.push({
                title: sh.name,
                year: dp.year || new Date().getFullYear(),
                month: dp.month || 1,
                day: dp.day || null,
                releaseDate: dp.fullDate || '',
                posterUrl: (sh.image && (sh.image.original || sh.image.medium)) || '',
                genre: Array.isArray(sh.genres) && sh.genres.length > 0
                  ? toTurkishGenre(sh.genres.join(', '), mediaType)
                  : (mediaType === 'series' ? 'Dizi' : 'Sinema'),
                duration: sh.averageRuntime ? `${sh.averageRuntime} dk` : '',
                season: targetS,
                episode: targetE,
                epTitle: '',
                fromTr: false
              });
            }
          }
        } catch (e) {}
      };

      const primaryMedia = mediaType === 'series' ? 'tvShow' : 'movie';
      const secondaryMedia = mediaType === 'series' ? 'movie' : 'tvShow';

      await Promise.all([
        checkItunes('tr', primaryMedia),
        checkItunes('us', primaryMedia),
        checkItunes('tr', secondaryMedia),
        checkTvMaze()
      ]);

      const qLower = cleanQuery.toLowerCase();
      results.sort((a, b) => {
        const aExact = a.title.toLowerCase() === qLower ? 28 : (a.title.toLowerCase().includes(qLower) ? 14 : 0);
        const bExact = b.title.toLowerCase() === qLower ? 28 : (b.title.toLowerCase().includes(qLower) ? 14 : 0);
        const aMonthBonus = a.month ? 5 : 0;
        const bMonthBonus = b.month ? 5 : 0;
        const aScore = aExact + aMonthBonus + (a.fromTr ? 6 : 0) + (a.posterUrl ? 4 : 0);
        const bScore = bExact + bMonthBonus + (b.fromTr ? 6 : 0) + (b.posterUrl ? 4 : 0);
        return bScore - aScore;
      });

      const dedup = new Map();
      for (const r of results) {
        const key = `${r.title.toLowerCase()}_${r.year}_${r.month || 0}_${r.episode || 0}`;
        if (!dedup.has(key)) dedup.set(key, r);
      }
      return Array.from(dedup.values()).slice(0, 6);
    }

    function quickInspectVideoMetadata(file) {
      return new Promise((resolve) => {
        if (!file) {
          resolve({ duration: '', frameUrl: '' });
          return;
        }
        const tempUrl = URL.createObjectURL(file);
        const vid = document.createElement('video');
        vid.preload = 'metadata';
        vid.muted = true;
        vid.playsInline = true;
        vid.src = tempUrl;

        let done = false;
        const finish = (payload) => {
          if (done) return;
          done = true;
          try { URL.revokeObjectURL(tempUrl); } catch (e) {}
          resolve(payload);
        };

        const timer = setTimeout(() => finish({ duration: '', frameUrl: '' }), 1500);

        vid.onloadedmetadata = () => {
          const durStr = isFinite(vid.duration) ? formatDurationFromSeconds(vid.duration) : '';
          try {
            vid.currentTime = vid.duration > 4 ? Math.min(vid.duration * 0.1, 15) : 0.2;
          } catch (e) {
            clearTimeout(timer);
            finish({ duration: durStr, frameUrl: '' });
          }

          vid.onseeked = () => {
            clearTimeout(timer);
            let frameUrl = '';
            try {
              if (vid.videoWidth > 0 && vid.videoHeight > 0) {
                const canvas = document.createElement('canvas');
                const w = 400;
                canvas.width = w;
                canvas.height = Math.max(225, Math.round(w * (vid.videoHeight / vid.videoWidth)));
                canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
                frameUrl = canvas.toDataURL('image/jpeg', 0.8);
              }
            } catch (e) {}
            finish({ duration: durStr, frameUrl });
          };
        };

        vid.onerror = () => {
          clearTimeout(timer);
          finish({ duration: '', frameUrl: '' });
        };
      });
    }

    async function runMetadataLookupNow(rawTitle, mediaType, titleInputId) {
      const statusEl = document.getElementById('draft-lookup-status');
      const epParsed = extractSeasonEpisodeFromText(rawTitle || '');
      const cleaned = (epParsed.seriesName || rawTitle || '').replace(/\b(19\d{2}|20\d{2})\b/g, '').trim();
      if (cleaned.length < 2) {
        foundCandidates = [];
        renderCandidateList(titleInputId);
        return;
      }

      if (statusEl) statusEl.textContent = 'Yıl, ay ve tür aranıyor...';
      const list = await queryExternalMediaMetadata(rawTitle, mediaType, epParsed.season, epParsed.episode);
      foundCandidates = list;
      renderCandidateList(titleInputId);

      if (list.length > 0) {
        const best = list[0];
        applyCandidateToForm(best, titleInputId);
        if (statusEl) {
          const mText = best.month ? `${MONTHS_TR[best.month - 1]} ${best.year}` : `${best.year}`;
          statusEl.textContent = `Bulundu: ${best.title} • ${mText} • ${best.genre}`;
        }
      } else if (statusEl) {
        statusEl.textContent = 'Otomatik sonuç bulunamadı, yıl/ay/tür alanlarını elle girebilirsiniz.';
      }
    }

    function updateCutterReadout() {
      const vid = document.getElementById('cutter-preview-video');
      const slider = document.getElementById('cutter-range-slider');
      const readout = document.getElementById('cutter-time-readout');
      if (!vid) return;
      const dur = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : 0;
      if (slider && dur > 0) {
        slider.value = Math.min(100, (vid.currentTime / dur) * 100);
      }
      if (readout) {
        readout.textContent = `${formatClock(vid.currentTime || 0)} / ${formatClock(dur)}`;
      }
    }

    function seekCutterBySlider(pct) {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid || !isFinite(vid.duration) || vid.duration <= 0) return;
      vid.pause();
      vid.currentTime = (Number(pct) / 100) * vid.duration;
      updateCutterReadout();
    }

    function stepCutterSeconds(delta) {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid) return;
      vid.pause();
      const dur = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : (vid.currentTime + Math.abs(delta) + 10);
      vid.currentTime = Math.max(0, Math.min(dur, (vid.currentTime || 0) + delta));
      updateCutterReadout();
    }

    function toggleCutterPlayback() {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid) return;
      if (vid.paused) vid.play().catch(() => {});
      else vid.pause();
    }

    function captureCurrentFrameAsCover() {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid) return;
      try {
        const vw = vid.videoWidth || 640;
        const vh = vid.videoHeight || 360;
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = Math.max(360, Math.round(640 * (vh / vw)));
        canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
        const frameData = canvas.toDataURL('image/jpeg', 0.88);

        formDraft.posterUrl = frameData;
        formDraft.autoFrameUrl = frameData;
        formDraft.posterLockedByUser = true;
        setPendingFile('poster', null);

        closeCoverFrameCutter();
        showToast('Seçilen kare kapak fotoğrafı yapıldı.', 'success');
      } catch (e) {
        showToast('Bu kare alınamadı, farklı bir saniyeye gelip tekrar deneyin.', 'error');
      }
    }

    async function buildSourcesAndBackgroundTasks(prefix, title, season = null, episode = null) {
      const subFile = getPendingFile(`${prefix}_sub`) || document.getElementById(`${prefix}-sub-file`)?.files?.[0];
      const dubFile = getPendingFile(`${prefix}_dub`) || document.getElementById(`${prefix}-dub-file`)?.files?.[0];
      const subUrl = document.getElementById(`${prefix}-sub-url`)?.value?.trim() || '';
      const dubUrl = document.getElementById(`${prefix}-dub-url`)?.value?.trim() || '';

      const sources = [];
      const bgTasks = [];

      if (subFile) {
        const stored = await saveLocalVideoFileInstant(subFile);
        sources.push({
          id: 'sub',
          label: 'TR Altyazılı',
          defaultMode: 'sub',
          url: '',
          localKey: stored.localKey,
          storagePath: '',
          fileName: subFile.name
        });
        bgTasks.push({
          kind: season !== null ? 'episode_source' : 'movie_source',
          sourceId: 'sub',
          season,
          episode,
          title,
          label: 'TR Altyazılı Video',
          file: subFile,
          folder: 'birperde_videos'
        });
      } else if (subUrl) {
        sources.push({
          id: 'sub',
          label: 'TR Altyazılı',
          defaultMode: 'sub',
          url: subUrl,
          localKey: '',
          storagePath: '',
          fileName: 'stream.mp4'
        });
      }

      if (dubFile) {
        const stored = await saveLocalVideoFileInstant(dubFile);
        sources.push({
          id: 'dub',
          label: 'TR Dublaj',
          defaultMode: 'dub',
          url: '',
          localKey: stored.localKey,
          storagePath: '',
          fileName: dubFile.name
        });
        bgTasks.push({
          kind: season !== null ? 'episode_source' : 'movie_source',
          sourceId: 'dub',
          season,
          episode,
          title,
          label: 'TR Dublaj Video',
          file: dubFile,
          folder: 'birperde_videos'
        });
      } else if (dubUrl) {
        sources.push({
          id: 'dub',
          label: 'TR Dublaj',
          defaultMode: 'dub',
          url: dubUrl,
          localKey: '',
          storagePath: '',
          fileName: 'stream.mp4'
        });
      }

      return { sources, bgTasks };
    }

    function collectEditedDraftMeta(defaultGenre) {
      const year = Number(document.getElementById('draft-year-input')?.value) || new Date().getFullYear();
      const monthRaw = Number(document.getElementById('draft-month-input')?.value);
      const dayRaw = Number(document.getElementById('draft-day-input')?.value);
      const month = monthRaw >= 1 && monthRaw <= 12 ? monthRaw : null;
      const day = dayRaw >= 1 && dayRaw <= 31 ? dayRaw : null;
      const releaseDate = month && day
        ? `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`
        : (month ? `${year}-${String(month).padStart(2, '0')}` : `${year}`);

      const duration = document.getElementById('draft-duration-input')?.value?.trim() || '';
      const genre = document.getElementById('draft-genre-input')?.value?.trim() || defaultGenre;
      const manualUrl = document.getElementById('draft-poster-url-input')?.value?.trim() || '';
      const posterFile = getPendingFile('poster') || document.getElementById('draft-poster-file-input')?.files?.[0];

      let posterUrl = CINEMA_FALLBACK_PHOTO;
      if (posterFile) {
        posterUrl = URL.createObjectURL(posterFile);
      } else if (manualUrl) {
        posterUrl = manualUrl;
      } else if (formDraft.posterUrl) {
        posterUrl = formDraft.posterUrl;
      } else if (formDraft.autoFrameUrl) {
        posterUrl = formDraft.autoFrameUrl;
      }

      return { year, month, day, releaseDate, duration, genre, posterUrl, posterFile };
    }

    async function submitNewMovie(e) {
      e.preventDefault();
      const title = document.getElementById('add-movie-title').value.trim();
      if (!title) return;

      const { sources, bgTasks } = await buildSourcesAndBackgroundTasks('movie', title);
      if (sources.length === 0) {
        showToast('Lütfen en az bir video seçin veya video bağlantısı girin.', 'error');
        return;
      }

      const meta = collectEditedDraftMeta('Sinema');
      const id = 'mov-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);

      if (meta.posterFile) {
        bgTasks.unshift({ kind: 'poster', title, label: 'Kapak Görseli', file: meta.posterFile, folder: 'birperde_posters' });
      }

      const newMovie = {
        id,
        type: 'movie',
        title,
        year: meta.year,
        month: meta.month,
        day: meta.day,
        releaseDate: meta.releaseDate,
        duration: meta.duration || 'Sinema',
        genre: meta.genre,
        hasSub: sources.some(s => s.defaultMode === 'sub'),
        hasDub: sources.some(s => s.defaultMode === 'dub'),
        posterUrl: meta.posterUrl,
        posterStoragePath: '',
        sources,
        createdAt: Date.now()
      };

      clearAllPendingFiles();
      state.catalog.unshift(newMovie);
      persistAndRenderCatalog();
      closeModal();
      showToast(`"${title}" eklendi.`, 'success');

      syncItemToFirestore(newMovie);
      if (bgTasks.length > 0) runBackgroundUploadQueue(id, bgTasks);
    }

    async function submitNewSeries(e) {
      e.preventDefault();
      const rawTitle = document.getElementById('add-series-title').value.trim();
      if (!rawTitle) return;

      const epParsed = extractSeasonEpisodeFromText(rawTitle);
      const title = epParsed.seriesName || rawTitle;
      const startSeason = Math.max(1, Number(document.getElementById('add-series-season')?.value) || epParsed.season || 1);
      const startEp = Math.max(1, Number(document.getElementById('add-series-episode')?.value) || epParsed.episode || 1);

      const { sources, bgTasks } = await buildSourcesAndBackgroundTasks('series', title, startSeason, startEp);
      if (sources.length === 0) {
        showToast('Lütfen bölüm için video seçin veya bağlantı girin.', 'error');
        return;
      }

      const meta = collectEditedDraftMeta('Dizi');
      const id = 'ser-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);

      if (meta.posterFile) {
        bgTasks.unshift({ kind: 'poster', title, label: 'Kapak Görseli', file: meta.posterFile, folder: 'birperde_posters' });
      }

      const newSeries = {
        id,
        type: 'series',
        title,
        year: meta.year,
        month: meta.month,
        day: meta.day,
        releaseDate: meta.releaseDate,
        duration: meta.duration,
        genre: meta.genre,
        seasons: startSeason,
        hasSub: sources.some(s => s.defaultMode === 'sub'),
        hasDub: sources.some(s => s.defaultMode === 'dub'),
        posterUrl: meta.posterUrl,
        posterStoragePath: '',
        episodes: [{
          season: startSeason,
          number: startEp,
          name: `${startEp}. Bölüm`,
          releaseDate: meta.releaseDate,
          duration: meta.duration,
          sources
        }],
        createdAt: Date.now()
      };

      clearAllPendingFiles();
      state.catalog.unshift(newSeries);
      persistAndRenderCatalog();
      closeModal();
      showToast(`"${title}" dizisi eklendi.`, 'success');

      syncItemToFirestore(newSeries);
      if (bgTasks.length > 0) runBackgroundUploadQueue(id, bgTasks);
    }

    async function submitNewEpisode(e) {
      e.preventDefault();
      const seriesId = document.getElementById('add-ep-series').value;
      const season = Math.max(1, Number(document.getElementById('add-ep-season').value) || 1);
      const number = Math.max(1, Number(document.getElementById('add-ep-number').value) || 1);
      const name = document.getElementById('add-ep-name').value.trim() || `${number}. Bölüm`;

      const series = state.catalog.find(s => s.id === seriesId && s.type === 'series');
      if (!series) return;

      const { sources, bgTasks } = await buildSourcesAndBackgroundTasks('ep', series.title, season, number);
      if (sources.length === 0) {
        showToast('Lütfen bölüm için video seçin veya bağlantı girin.', 'error');
        return;
      }

      const epDateLabel = formDraft.releaseDate || series.releaseDate || `${series.year}`;
      if (!Array.isArray(series.episodes)) series.episodes = [];
      const existingIdx = series.episodes.findIndex(ep => Number(ep.season) === season && Number(ep.number) === number);
      const epPayload = {
        season,
        number,
        name,
        releaseDate: epDateLabel,
        duration: formDraft.duration || series.duration || '',
        sources
      };
      if (existingIdx >= 0) series.episodes[existingIdx] = epPayload;
      else series.episodes.push(epPayload);

      series.episodes.sort((a, b) => (Number(a.season) - Number(b.season)) || (Number(a.number) - Number(b.number)));
      series.seasons = Math.max(...series.episodes.map(ep => Number(ep.season)));
      series.hasSub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'sub'));
      series.hasDub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'dub'));

      clearAllPendingFiles();
      persistAndRenderCatalog();
      closeModal();
      if (state.player.media && state.player.media.id === series.id) {
        openPlayer(series.id, season, number);
      }
      showToast(`${series.title} — S${season} B${number} eklendi.`, 'success');

      syncItemToFirestore(series);
      if (bgTasks.length > 0) runBackgroundUploadQueue(series.id, bgTasks);
    }

    async function lookupIntoEditModal(mediaType) {
      const titleVal = document.getElementById('edit-title-inp')?.value?.trim() || '';
      if (titleVal.length < 2) return;
      const list = await queryExternalMediaMetadata(titleVal, mediaType);
      if (list.length > 0) {
        const best = list[0];
        if (best.year) document.getElementById('edit-year-inp').value = best.year;
        if (best.month) document.getElementById('edit-month-inp').value = best.month;
        if (best.day) document.getElementById('edit-day-inp').value = best.day;
        if (best.genre) document.getElementById('edit-genre-inp').value = best.genre;
        if (best.duration) document.getElementById('edit-duration-inp').value = best.duration;
        if (best.posterUrl) {
          document.getElementById('edit-poster-url-inp').value = best.posterUrl;
          document.getElementById('edit-poster-img').src = best.posterUrl;
        }
        showToast(`"${best.title}" bilgileri getirildi.`, 'success');
      } else {
        showToast('Eşleşme bulunamadı, alanları elle girebilirsiniz.', 'error');
      }
    }

    async function saveEditedItem(e, itemId) {
      e.preventDefault();
      const item = state.catalog.find(m => m.id === itemId);
      if (!item) return;

      item.title = document.getElementById('edit-title-inp').value.trim() || item.title;
      item.year = Number(document.getElementById('edit-year-inp').value) || item.year;
      const mVal = Number(document.getElementById('edit-month-inp').value);
      const dVal = Number(document.getElementById('edit-day-inp').value);
      item.month = mVal >= 1 && mVal <= 12 ? mVal : null;
      item.day = dVal >= 1 && dVal <= 31 ? dVal : null;
      item.releaseDate = item.month && item.day
        ? `${item.year}-${String(item.month).padStart(2, '0')}-${String(item.day).padStart(2, '0')}`
        : (item.month ? `${item.year}-${String(item.month).padStart(2, '0')}` : `${item.year}`);
      item.duration = document.getElementById('edit-duration-inp').value.trim();
      item.genre = document.getElementById('edit-genre-inp').value.trim();

      const posterUrl = document.getElementById('edit-poster-url-inp').value.trim();
      const posterFile = document.getElementById('edit-poster-file-inp').files[0];

      if (posterFile) {
        item.posterUrl = URL.createObjectURL(posterFile);
      } else if (posterUrl) {
        item.posterUrl = posterUrl;
      }

      persistAndRenderCatalog();
      if (state.player.media && state.player.media.id === item.id) {
        state.player.media = item;
        renderWatchStudio();
      }
      closeModal();
      showToast(`"${item.title}" güncellendi.`, 'success');

      syncItemToFirestore(item);
      if (posterFile) {
        runBackgroundUploadQueue(item.id, [{
          kind: 'poster',
          title: item.title,
          label: 'Kapak Görseli',
          file: posterFile,
          folder: 'birperde_posters'
        }]);
      }
    }

    function downloadCatalogJsonFile() {
      const blob = new Blob([JSON.stringify(state.catalog || [], null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `birperdetr-arsiv-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Arşiv JSON dosyası indirildi.', 'success');
    }

    function copyCatalogJsonToClipboard() {
      const ta = document.getElementById('backup-json-textarea');
      if (!ta) return;
      navigator.clipboard?.writeText(ta.value).then(() => {
        showToast('JSON panoya kopyalandı.', 'success');
      }).catch(() => {
        ta.select();
        document.execCommand('copy');
        showToast('JSON kopyalandı.', 'success');
      });
    }

    function importCatalogJsonText() {
      const raw = document.getElementById('backup-json-textarea')?.value || '';
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) {
          showToast('Geçerli bir liste formatı girin.', 'error');
          return;
        }
        const valid = parsed.filter(isValidItem);
        const map = new Map();
        (state.catalog || []).forEach(x => map.set(x.id, x));
        valid.forEach(x => {
          deletedIdsSession.delete(x.id);
          map.set(x.id, x);
        });
        state.catalog = Array.from(map.values());
        persistAndRenderCatalog();
        state.catalog.forEach(item => syncItemToFirestore(item));
        closeModal();
        showToast(`${valid.length} içerik arşive aktarıldı.`, 'success');
      } catch (e) {
        showToast('JSON biçimi hatalı, lütfen kontrol edin.', 'error');
      }
    }

    function deleteEpisodeFromSeries(seriesId, season, epNum) {
      const series = state.catalog.find(s => s.id === seriesId && s.type === 'series');
      if (!series || !Array.isArray(series.episodes)) return;

      series.episodes = series.episodes.filter(e => !(Number(e.season) === Number(season) && Number(e.number) === Number(epNum)));
      series.seasons = series.episodes.length > 0 ? Math.max(...series.episodes.map(e => Number(e.season))) : 1;
      series.hasSub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'sub'));
      series.hasDub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'dub'));

      persistAndRenderCatalog();
      openEpisodesModal(series.id);
      syncItemToFirestore(series);
      showToast(`Sezon ${season} Bölüm ${epNum} silindi.`, 'info');
    }

      state.langFilter = lang;
      updateFilterButtons();
      renderMainView();
    }

    function getFilteredItems() {
      const q = state.searchQuery.toLowerCase();
      return (state.catalog || []).filter(item => {
        if (!isValidItem(item) || deletedIdsSession.has(item.id)) return false;
        if (
          q &&
          !item.title.toLowerCase().includes(q) &&
          !String(item.year).includes(q) &&
          !(item.releaseDate && item.releaseDate.toLowerCase().includes(q)) &&
          !(item.genre && item.genre.toLowerCase().includes(q))
        ) {
          return false;
        }
        if (state.langFilter === 'dub' && !item.hasDub) return false;
        if (state.langFilter === 'sub' && !item.hasSub) return false;
        return true;
      });
    }

      const dateCompact = `${monthShort}${item.year}`;

      return `
        <article class="${cardClass}">
          <div onclick="openPlayer('${escapeAttr(item.id)}')" class="relative aspect-[2/3] bg-bpNavy cursor-pointer overflow-hidden">
            <img
              src="${escapeAttr(posterSrc)}"
              alt="${escapeAttr(item.title)}"
              referrerpolicy="no-referrer"
              loading="lazy"
              onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='${CINEMA_FALLBACK_PHOTO}';}"
              class="w-full h-full object-cover transition duration-300 hover:scale-105"
            />

              <button type="button" onclick="openAddContentModal('series')" class="px-3 py-1.5 rounded-xl bg-bpYellow text-bpBlack text-xs font-extrabold shrink-0 cursor-pointer">+ Dizi Ekle</button>
