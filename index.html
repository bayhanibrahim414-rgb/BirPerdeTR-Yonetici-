    function applyCandidateToForm(c, titleInputId, updateTitleBox = false) {
      if (!c) return;
      if (updateTitleBox) {
        const titleEl = document.getElementById(titleInputId);
        if (titleEl) titleEl.value = c.title;
      }

      if (!formDraft.yearLockedByUser && c.year) formDraft.year = c.year;
      if (!formDraft.monthLockedByUser && c.month) formDraft.month = c.month;
      if (!formDraft.dayLockedByUser && c.day) formDraft.day = c.day;
      if (c.releaseDate) formDraft.releaseDate = c.releaseDate;
      if (!formDraft.genreLockedByUser && c.genre) formDraft.genre = c.genre;
      if (!formDraft.durationLockedByUser && c.duration && !formDraft.durationSec) {
        formDraft.duration = c.duration;
      }
      if (!formDraft.posterLockedByUser && c.posterUrl) formDraft.posterUrl = c.posterUrl;

      refreshDraftInputsInModal();
    }

    function selectSearchCandidate(idx, titleInputId) {
      const c = foundCandidates[idx];
      if (!c) return;
      formDraft.yearLockedByUser = false;
      formDraft.monthLockedByUser = false;
      formDraft.dayLockedByUser = false;
      formDraft.genreLockedByUser = false;
      formDraft.posterLockedByUser = false;

      applyCandidateToForm(c, titleInputId, true);
      const box = document.getElementById('draft-candidates-box');
      if (box) box.classList.add('hidden');
      const statusEl = document.getElementById('draft-lookup-status');
      const mText = c.month ? `${MONTHS_TR[c.month - 1]} ${c.year}` : `${c.year}`;
      if (statusEl) statusEl.textContent = `Seçildi: ${c.title} • ${mText} • ${c.genre}`;
    }

    async function fetchBroadSuggestions(rawTitle, mediaType, titleInputId) {
      const statusEl = document.getElementById('draft-lookup-status');
      const epParsed = extractSeasonEpisodeFromText(rawTitle || '');
      const cleaned = (epParsed.seriesName || rawTitle || '').replace(/\b(19\d{2}|20\d{2})\b/g, '').trim();
      if (!cleaned) {
        foundCandidates = [];
        renderCandidateList(titleInputId);
        return;
      }
      if (statusEl) statusEl.textContent = `"${cleaned}" için geniş kaynaklarda sonuçlar listeleniyor...`;
      const list = await queryBroadMediaMetadata(rawTitle, mediaType, epParsed.season, epParsed.episode);
      foundCandidates = list;
      renderCandidateList(titleInputId);
      if (statusEl) {
        statusEl.textContent = list.length > 0
          ? `${list.length} sonuç bulundu. Yazdığınız ad korunur; isterseniz listeden seçin.`
          : 'Dış sonuç bulunamadı; kendi başlığınız ve bilgilerinizle devam edebilirsiniz.';
      }
    }

    function handleDraftTitleChange(val, mediaType, titleInputId) {
      clearTimeout(lookupDebounce);
      lookupDebounce = setTimeout(() => {
        fetchBroadSuggestions(val, mediaType, titleInputId);
      }, 280);
    }

    async function autoDetectDurationFromSource(sourceObjOrFile, durationInputId = 'draft-duration-input', isDraft = true) {
      const inspected = await inspectVideoFileOrUrl(sourceObjOrFile);
      if (inspected.durationSec > 0 && inspected.durationLabel) {
        if (isDraft) {
          formDraft.durationSec = inspected.durationSec;
          formDraft.duration = inspected.durationLabel;
          if (!formDraft.autoFrameUrl && inspected.frameUrl) {
            formDraft.autoFrameUrl = inspected.frameUrl;
          }
          refreshDraftInputsInModal();
        }
        const durEl = document.getElementById(durationInputId);
        if (durEl) {
          durEl.value = inspected.durationLabel;
        }
        const statusEl = document.getElementById('draft-lookup-status');
        if (statusEl) {
          statusEl.textContent = `Video süresi otomatik hesaplandı: ${inspected.durationLabel}`;
        }
      }
      return inspected;
    }

      const badge = document.getElementById(badgeId);
      const file = (inputEl && inputEl.files && inputEl.files[0]) || getPendingFile(slotKey);
      if (inputEl && inputEl.files && inputEl.files[0]) {
        setPendingFile(slotKey, inputEl.files[0]);
      }

      if (!file) {
        if (badge) {
          badge.textContent = '';
          badge.classList.add('hidden');
        }
        return;
      }

      const mb = (file.size / 1048576).toFixed(1);
      if (badge) {
        badge.textContent = `Hazır: ${file.name} (${mb} MB)`;
        badge.classList.remove('hidden');
      }

      const parsed = parseFilenameTitleYear(file.name);
      if (parsed.year && !formDraft.yearLockedByUser) formDraft.year = parsed.year;
      if (parsed.month && !formDraft.monthLockedByUser) formDraft.month = parsed.month;
      if (parsed.day && !formDraft.dayLockedByUser) formDraft.day = parsed.day;

      if (titleInputId) {
        const titleEl = document.getElementById(titleInputId);
        if (titleEl && !titleEl.value.trim() && parsed.title) {
          titleEl.value = parsed.title;
          fetchBroadSuggestions(parsed.title, mediaType, titleInputId);
        }
      }

      refreshDraftInputsInModal();
      await autoDetectDurationFromSource(file, 'draft-duration-input', true);
    }

    function findActiveVideoSourceForCutter() {
      const prefixes = activeAddTab === 'series' ? ['series', 'movie', 'ep'] : ['movie', 'series', 'ep'];
      for (const p of prefixes) {
        const fSub = getPendingFile(`${p}_sub`) || document.getElementById(`${p}-sub-file`)?.files?.[0];
        if (fSub) return { url: URL.createObjectURL(fSub), revoke: true };
        const fDub = getPendingFile(`${p}_dub`) || document.getElementById(`${p}-dub-file`)?.files?.[0];
        if (fDub) return { url: URL.createObjectURL(fDub), revoke: true };
      }
      for (const p of prefixes) {
        const uSub = document.getElementById(`${p}-sub-url`)?.value?.trim();
        if (uSub) return { url: uSub, revoke: false };
        const uDub = document.getElementById(`${p}-dub-url`)?.value?.trim();
        if (uDub) return { url: uDub, revoke: false };
      }
      return null;
    }

    function updateCutterReadout() {
      const vid = document.getElementById('cutter-preview-video');
      const slider = document.getElementById('cutter-range-slider');
      const readout = document.getElementById('cutter-time-readout');
      if (!vid) return;
      const dur = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : 0;
      if (slider && dur > 0) {
        slider.value = Math.min(100, (vid.currentTime / dur) * 100);
      }
      if (readout) {
        readout.textContent = `${formatPreciseTime(vid.currentTime || 0)} / ${formatPreciseTime(dur)}`;
      }
    }

    function seekCutterBySlider(pct) {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid || !isFinite(vid.duration) || vid.duration <= 0) return;
      vid.pause();
      vid.currentTime = (Number(pct) / 100) * vid.duration;
      updateCutterReadout();
    }

    function stepCutterSeconds(delta) {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid) return;
      vid.pause();
      const dur = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : (vid.currentTime + Math.abs(delta) + 10);
      vid.currentTime = Math.max(0, Math.min(dur, (vid.currentTime || 0) + delta));
      updateCutterReadout();
    }

    function toggleCutterPlayback() {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid) return;
      if (vid.paused) vid.play().catch(() => {});
      else vid.pause();
    }

    function captureCurrentFrameAsCover() {
      const vid = document.getElementById('cutter-preview-video');
      if (!vid) return;
      try {
        const vw = vid.videoWidth || 640;
        const vh = vid.videoHeight || 360;
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = Math.max(360, Math.round(640 * (vh / vw)));
        canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
        const frameData = canvas.toDataURL('image/jpeg', 0.88);

        formDraft.posterUrl = frameData;
        formDraft.autoFrameUrl = frameData;
        formDraft.posterLockedByUser = true;
        setPendingFile('poster', null);

        closeCoverFrameCutter();
        showToast('Seçilen kare kapak fotoğrafı yapıldı.', 'success');
      } catch (e) {

    async function buildLocalSourcesAndOptionalTasks(prefix, title, season = null, episode = null) {
      const subFile = getPendingFile(`${prefix}_sub`) || document.getElementById(`${prefix}-sub-file`)?.files?.[0];
      const dubFile = getPendingFile(`${prefix}_dub`) || document.getElementById(`${prefix}-dub-file`)?.files?.[0];
      const subUrl = document.getElementById(`${prefix}-sub-url`)?.value?.trim() || '';
      const dubUrl = document.getElementById(`${prefix}-dub-url`)?.value?.trim() || '';

      const sources = [];
      const bgTasks = [];
      let detectedDurLabel = formDraft.duration || '';
      let detectedDurSec = formDraft.durationSec || 0;

      if (subFile) {
        const stored = await saveLocalVideoFileInstant(subFile);
        sources.push({
          id: 'sub',
          label: 'TR Altyazılı',
          defaultMode: 'sub',
          url: '',
          localKey: stored.localKey,
          storagePath: '',
          cloudStatus: state.cloudSyncEnabled ? 'uploading' : 'local_only',
          durationSec: detectedDurSec || 0,
          trimStart: 0,
          trimEnd: detectedDurSec || 0,
          fileName: subFile.name
        });
        bgTasks.push({
          kind: season !== null ? 'episode_source' : 'movie_source',
          sourceId: 'sub',
          season,
          episode,
          title,
          label: 'TR Altyazılı Video',
          file: subFile,
          folder: 'birperde_videos'
        });
      } else if (subUrl) {
        sources.push({
          id: 'sub',
          label: 'TR Altyazılı',
          defaultMode: 'sub',
          url: subUrl,
          localKey: '',
          storagePath: '',
          cloudStatus: 'ready',
          durationSec: detectedDurSec || 0,
          trimStart: 0,
          trimEnd: detectedDurSec || 0,
          fileName: 'stream.mp4'
        });
      }

      if (dubFile) {
        const stored = await saveLocalVideoFileInstant(dubFile);
        sources.push({
          id: 'dub',
          label: 'TR Dublaj',
          defaultMode: 'dub',
          url: '',
          localKey: stored.localKey,
          storagePath: '',
          cloudStatus: state.cloudSyncEnabled ? 'uploading' : 'local_only',
          durationSec: detectedDurSec || 0,
          trimStart: 0,
          trimEnd: detectedDurSec || 0,
          fileName: dubFile.name
        });
        bgTasks.push({
          kind: season !== null ? 'episode_source' : 'movie_source',
          sourceId: 'dub',
          season,
          episode,
          title,
          label: 'TR Dublaj Video',
          file: dubFile,
          folder: 'birperde_videos'
        });
      } else if (dubUrl) {
        sources.push({
          id: 'dub',
          label: 'TR Dublaj',
          defaultMode: 'dub',
          url: dubUrl,
          localKey: '',
          storagePath: '',
          cloudStatus: 'ready',
          durationSec: detectedDurSec || 0,
          trimStart: 0,
          trimEnd: detectedDurSec || 0,
          fileName: 'stream.mp4'
        });
      }

      return { sources, bgTasks, detectedDurLabel, detectedDurSec };
    }

    function collectEditedDraftMeta(defaultGenre, fallbackDurLabel = '') {
      const year = Number(document.getElementById('draft-year-input')?.value) || new Date().getFullYear();
      const monthRaw = Number(document.getElementById('draft-month-input')?.value);
      const dayRaw = Number(document.getElementById('draft-day-input')?.value);
      const month = monthRaw >= 1 && monthRaw <= 12 ? monthRaw : null;
      const day = dayRaw >= 1 && dayRaw <= 31 ? dayRaw : null;
      const releaseDate = month && day
        ? `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`
        : (month ? `${year}-${String(month).padStart(2, '0')}` : `${year}`);

      const durInputVal = document.getElementById('draft-duration-input')?.value?.trim() || '';
      const duration = durInputVal || fallbackDurLabel || formDraft.duration || '';
      const genre = document.getElementById('draft-genre-input')?.value?.trim() || defaultGenre;
      const manualUrl = document.getElementById('draft-poster-url-input')?.value?.trim() || '';
      const posterFile = getPendingFile('poster') || document.getElementById('draft-poster-file-input')?.files?.[0];

      let posterUrl = CINEMA_FALLBACK_PHOTO;
      if (posterFile) {
        posterUrl = URL.createObjectURL(posterFile);
      } else if (manualUrl) {
        posterUrl = manualUrl;
      } else if (formDraft.posterUrl) {
        posterUrl = formDraft.posterUrl;
      } else if (formDraft.autoFrameUrl) {
        posterUrl = formDraft.autoFrameUrl;
      }

      return { year, month, day, releaseDate, duration, genre, posterUrl, posterFile };
    }

    async function submitNewMovie(e) {
      e.preventDefault();
      const title = document.getElementById('add-movie-title').value.trim();
      if (!title) return;

      const { sources, bgTasks, detectedDurLabel, detectedDurSec } = await buildLocalSourcesAndOptionalTasks('movie', title);
      if (sources.length === 0) {
        showToast('Lütfen en az bir video seçin veya video bağlantısı girin.', 'error');
        return;
      }

      const meta = collectEditedDraftMeta('Sinema', detectedDurLabel || 'Sinema');
      const id = 'mov-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);

      if (meta.posterFile) {
        bgTasks.unshift({ kind: 'poster', title, label: 'Kapak Görseli', file: meta.posterFile, folder: 'birperde_posters' });
      }

      const newMovie = {
        id,
        type: 'movie',
        title,
        year: meta.year,
        month: meta.month,
        day: meta.day,
        releaseDate: meta.releaseDate,
        duration: meta.duration,
        durationSec: detectedDurSec || formDraft.durationSec || 0,
        genre: meta.genre,
        hasSub: sources.some(s => s.defaultMode === 'sub'),
        hasDub: sources.some(s => s.defaultMode === 'dub'),
        posterUrl: meta.posterUrl,
        posterStoragePath: '',
        sources,
        createdAt: Date.now()
      };

      clearAllPendingFiles();
      state.catalog = state.catalog.filter(it => !isFakePlaceholderItem(it));
      state.catalog.unshift(newMovie);
      persistAndRenderCatalog();
      closeModal();
      showToast(`"${title}" eklendi. Bulut aktarımı üst çubukta başladı.`, 'success');

      syncMetaToFirestoreSilent(newMovie);
      if (state.cloudSyncEnabled && bgTasks.length > 0) {
        runOptionalBackgroundUploads(id, bgTasks);
      }
    }

    async function submitNewSeries(e) {
      e.preventDefault();
      const rawTitle = document.getElementById('add-series-title').value.trim();
      if (!rawTitle) return;

      const epParsed = extractSeasonEpisodeFromText(rawTitle);
      const title = epParsed.seriesName || rawTitle;
      const startSeason = Math.max(1, Number(document.getElementById('add-series-season')?.value) || epParsed.season || 1);
      const startEp = Math.max(1, Number(document.getElementById('add-series-episode')?.value) || epParsed.episode || 1);

      const { sources, bgTasks, detectedDurLabel, detectedDurSec } = await buildLocalSourcesAndOptionalTasks('series', title, startSeason, startEp);
      if (sources.length === 0) {
        showToast('Lütfen bölüm için video seçin veya bağlantı girin.', 'error');
        return;
      }

      const meta = collectEditedDraftMeta('Dizi', detectedDurLabel);
      const id = 'ser-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);

      if (meta.posterFile) {
        bgTasks.unshift({ kind: 'poster', title, label: 'Kapak Görseli', file: meta.posterFile, folder: 'birperde_posters' });
      }

      const newSeries = {
        id,
        type: 'series',
        title,
        year: meta.year,
        month: meta.month,
        day: meta.day,
        releaseDate: meta.releaseDate,
        duration: meta.duration,
        durationSec: detectedDurSec || formDraft.durationSec || 0,
        genre: meta.genre,
        seasons: startSeason,
        hasSub: sources.some(s => s.defaultMode === 'sub'),
        hasDub: sources.some(s => s.defaultMode === 'dub'),
        posterUrl: meta.posterUrl,
        posterStoragePath: '',
        episodes: [{
          season: startSeason,
          number: startEp,
          name: `${startEp}. Bölüm`,
          releaseDate: meta.releaseDate,
          duration: meta.duration,
          durationSec: detectedDurSec || 0,
          sources
        }],
        createdAt: Date.now()
      };

      clearAllPendingFiles();
      state.catalog = state.catalog.filter(it => !isFakePlaceholderItem(it));
      state.catalog.unshift(newSeries);
      persistAndRenderCatalog();
      closeModal();
      showToast(`"${title}" eklendi. Bulut aktarımı üst çubukta başladı.`, 'success');

      syncMetaToFirestoreSilent(newSeries);
      if (state.cloudSyncEnabled && bgTasks.length > 0) {
        runOptionalBackgroundUploads(id, bgTasks);
      }
    }

    async function submitNewEpisode(e) {
      e.preventDefault();
      const seriesId = document.getElementById('add-ep-series').value;
      const season = Math.max(1, Number(document.getElementById('add-ep-season').value) || 1);
      const number = Math.max(1, Number(document.getElementById('add-ep-number').value) || 1);
      const name = document.getElementById('add-ep-name').value.trim() || `${number}. Bölüm`;

      const series = state.catalog.find(s => s.id === seriesId && s.type === 'series');
      if (!series) return;

      const { sources, bgTasks, detectedDurLabel, detectedDurSec } = await buildLocalSourcesAndOptionalTasks('ep', series.title, season, number);
      if (sources.length === 0) {
        showToast('Lütfen bölüm için video seçin veya bağlantı girin.', 'error');
        return;
      }

      const epDur = detectedDurLabel || formDraft.duration || series.duration || '';
      if (!Array.isArray(series.episodes)) series.episodes = [];
      const existingIdx = series.episodes.findIndex(ep => Number(ep.season) === season && Number(ep.number) === number);
      const epPayload = {
        season,
        number,
        name,
        releaseDate: formDraft.releaseDate || series.releaseDate || `${series.year}`,
        duration: epDur,
        durationSec: detectedDurSec || 0,
        sources
      };
      if (existingIdx >= 0) series.episodes[existingIdx] = epPayload;
      else series.episodes.push(epPayload);

      series.episodes.sort((a, b) => (Number(a.season) - Number(b.season)) || (Number(a.number) - Number(b.number)));
      series.seasons = Math.max(...series.episodes.map(ep => Number(ep.season)));
      if (epDur) {
        series.duration = epDur;
        if (detectedDurSec) series.durationSec = detectedDurSec;
      }
      series.hasSub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'sub'));
      series.hasDub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'dub'));

      clearAllPendingFiles();
      persistAndRenderCatalog();
      closeModal();
      if (state.player.media && state.player.media.id === series.id) {
        openPlayer(series.id, season, number);
      }
      showToast(`${series.title} — S${season} B${number} eklendi.`, 'success');

      syncMetaToFirestoreSilent(series);
      if (state.cloudSyncEnabled && bgTasks.length > 0) {
        runOptionalBackgroundUploads(series.id, bgTasks);
      }
    }

    /* =====================================================================
       9. VIDEO TRIMMING / CUTTING EDITOR
    ===================================================================== */
    let trimEditorCtx = {
      itemId: '',
      season: null,
      episode: null,
      sourceId: 'sub',
      objectUrl: '',
      revokeUrl: false,
      durationSec: 120,
      trimStart: 0,
      trimEnd: 120,
      previewPlaying: false
    };

    function getTargetSourcesForTrim(item, season = null, episode = null) {
      if (!item) return [];
      if (item.type === 'movie') {
        return Array.isArray(item.sources) ? item.sources : [];
      }
      const eps = Array.isArray(item.episodes) ? item.episodes : [];
      const ep = eps.find(e => Number(e.season) === Number(season) && Number(e.number) === Number(episode)) || eps[0];
      return ep && Array.isArray(ep.sources) ? ep.sources : [];
    }

    async function openVideoTrimModal(itemId, season = null, episode = null, sourceId = null) {
      const item = state.catalog.find(m => m.id === itemId);
      if (!item) return;

      const srcs = getTargetSourcesForTrim(item, season, episode);
      if (srcs.length === 0) {
        showToast('Bu içerikte kesilecek video kaynağı bulunamadı.', 'error');
        return;
      }

      const chosenSrc = srcs.find(s => s.id === sourceId) || srcs[0];
      const resolved = await resolvePlayableUrl(chosenSrc);

      if (!resolved.url) {
        if (resolved.reason === 'other_device_pending_cloud') {
          showToast('Bu video başka cihazda yerel olarak eklenmiş; bulut yüklemesi tamamlanmadan bu cihazda kesilemez.', 'error');
        } else {
          showToast('Video dosyasına erişilemedi.', 'error');
        }
        return;
      }

      if (trimEditorCtx.objectUrl && trimEditorCtx.revokeUrl) {
        try { URL.revokeObjectURL(trimEditorCtx.objectUrl); } catch (e) {}
      }

      const inspected = await inspectVideoFileOrUrl(resolved.url);
      const totalDur = inspected.durationSec > 0
        ? inspected.durationSec
        : (chosenSrc.durationSec > 0 ? chosenSrc.durationSec : 120);

      const savedStart = typeof chosenSrc.trimStart === 'number' && chosenSrc.trimStart >= 0 && chosenSrc.trimStart < totalDur
        ? chosenSrc.trimStart
        : 0;
      const savedEnd = typeof chosenSrc.trimEnd === 'number' && chosenSrc.trimEnd > savedStart && chosenSrc.trimEnd <= totalDur
        ? chosenSrc.trimEnd
        : totalDur;

      trimEditorCtx = {
        itemId: item.id,
        season: item.type === 'series' ? (season || (item.episodes && item.episodes[0] && item.episodes[0].season) || 1) : null,
        episode: item.type === 'series' ? (episode || (item.episodes && item.episodes[0] && item.episodes[0].number) || 1) : null,
        sourceId: chosenSrc.id,
        objectUrl: resolved.url,
        revokeUrl: false,
        durationSec: Number(totalDur.toFixed(1)),
        trimStart: Number(savedStart.toFixed(1)),
        trimEnd: Number(savedEnd.toFixed(1)),
        previewPlaying: false
      };

      const activeLen = Math.max(0.5, trimEditorCtx.trimEnd - trimEditorCtx.trimStart);
      const autoAdjustedLabel = formatDurationFromSeconds(activeLen);

      openModal(`
        <div class="birperde-ribbon"></div>
        <div class="p-4 sm:p-5 space-y-3.5">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <h3 class="text-base font-extrabold text-bpNavy truncate">Videoyu Kes / Düzenle — ${escapeHtml(item.title)}</h3>
              <p class="text-[11px] text-slate-600">Başlangıç ve bitiş noktalarını seçin; oynatıcı kesilen aralığı otomatik uygular.</p>
            </div>
            <button type="button" onclick="closeTrimEditor()" class="px-3 py-1.5 rounded-lg bg-bpSky hover:bg-bpRed hover:text-white text-xs font-extrabold cursor-pointer">Kapat</button>
          </div>

          ${srcs.length > 1 ? `
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[11px] font-extrabold text-bpNavy">Kaynak:</span>
              ${srcs.map(s => `
                <button type="button" onclick="openVideoTrimModal('${escapeAttr(item.id)}', ${season || 'null'}, ${episode || 'null'}, '${escapeAttr(s.id)}')" class="px-3 py-1 rounded-lg text-xs font-extrabold cursor-pointer ${s.id === chosenSrc.id ? 'bg-bpNavy text-white' : 'bg-bpSky text-bpNavy'}">
                  ${escapeHtml(s.label)}
                </button>
              `).join('')}
            </div>
          ` : ''}

          <div class="relative aspect-video rounded-xl overflow-hidden bg-black border-2 border-bpRoyal">
            <video
              id="trim-editor-video"
              src="${escapeAttr(resolved.url)}"
              playsinline
              preload="auto"
              onloadedmetadata="onTrimVideoMetadataLoaded()"
              ontimeupdate="onTrimVideoTimeUpdate()"
              class="w-full h-full object-contain bg-black"
            ></video>
          </div>

          <div class="p-3.5 rounded-xl bg-bpSky/70 border border-bpSkyBorder space-y-3">
            <div class="flex items-center justify-between text-xs font-extrabold text-bpNavy">
              <span>Kesim Zaman Çizelgesi</span>
              <span id="trim-current-clock" class="font-mono text-bpRoyal">00:00.0 / ${formatPreciseTime(trimEditorCtx.durationSec)}</span>
            </div>

            <div class="space-y-2">
              <div class="flex items-center justify-between text-[11px] font-bold text-bpBlack">
                <span>Başlangıç (Kesilecek Başı): <strong id="trim-start-readout" class="font-mono text-bpEmerald">${formatPreciseTime(trimEditorCtx.trimStart)}</strong></span>
                <span>Bitiş (Kesilecek Sonu): <strong id="trim-end-readout" class="font-mono text-bpRed">${formatPreciseTime(trimEditorCtx.trimEnd)}</strong></span>
              </div>

              <div>
                <label class="block text-[10px] font-extrabold text-bpEmerald mb-0.5">Başlangıç Sınırı</label>
                <input
                  type="range"
                  id="trim-start-slider"
                  min="0"
                  max="${trimEditorCtx.durationSec}"
                  step="0.1"
                  value="${trimEditorCtx.trimStart}"
                  oninput="onTrimStartChanged(this.value)"
                  class="bp-scrubber w-full"
                />
              </div>

              <div>
                <label class="block text-[10px] font-extrabold text-bpRed mb-0.5">Bitiş Sınırı</label>
                <input
                  type="range"
                  id="trim-end-slider"
                  min="0"
                  max="${trimEditorCtx.durationSec}"
                  step="0.1"
                  value="${trimEditorCtx.trimEnd}"
                  oninput="onTrimEndChanged(this.value)"
                  class="bp-scrubber w-full"
                />
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <button type="button" onclick="markCutStartHere()" class="px-2.5 py-1.5 rounded-lg bg-bpEmerald hover:bg-bpGreen text-white text-[11px] font-extrabold cursor-pointer">
                  Başı Buradan Kes
                </button>
                <button type="button" onclick="markCutEndHere()" class="px-2.5 py-1.5 rounded-lg bg-bpRed hover:bg-red-700 text-white text-[11px] font-extrabold cursor-pointer">
                  Sonu Buraya Kes
                </button>
                <button type="button" onclick="toggleTrimRangePreview()" id="trim-preview-btn" class="px-3 py-1.5 rounded-lg bg-bpRoyal hover:bg-bpNavy text-white text-[11px] font-extrabold cursor-pointer">
                  Kesilen Aralığı Önizle
                </button>
              </div>
              <button type="button" onclick="resetTrimRange()" class="px-2.5 py-1.5 rounded-lg bg-white border border-bpSkyBorder text-[11px] font-extrabold text-bpNavy cursor-pointer">
                Sıfırla
              </button>
            </div>

            <div class="pt-2 border-t border-bpSkyBorder flex flex-wrap items-center justify-between gap-2">
              <div class="text-xs font-extrabold text-bpNavy">
                Yeni Süre: <span id="trim-new-duration-text" class="font-mono text-bpEmerald">${escapeHtml(autoAdjustedLabel)}</span>
              </div>
              <button type="button" onclick="saveTrimmedRange()" class="px-4 py-2 rounded-xl bg-bpEmerald hover:bg-bpGreen text-white text-xs font-extrabold shadow cursor-pointer">
                Kesimi Kaydet ve Süreyi Güncelle
              </button>
            </div>
          </div>
        </div>
      `);
    }

    function onTrimVideoMetadataLoaded() {
      const vid = document.getElementById('trim-editor-video');
      if (!vid || !isFinite(vid.duration) || vid.duration <= 0) return;
      const realDur = Number(vid.duration.toFixed(1));
      if (Math.abs(realDur - trimEditorCtx.durationSec) > 0.2) {
        trimEditorCtx.durationSec = realDur;
        if (trimEditorCtx.trimEnd <= 0 || trimEditorCtx.trimEnd > realDur) {
          trimEditorCtx.trimEnd = realDur;
        }
        const sSlider = document.getElementById('trim-start-slider');
        const eSlider = document.getElementById('trim-end-slider');
        if (sSlider) { sSlider.max = realDur; sSlider.value = trimEditorCtx.trimStart; }
        if (eSlider) { eSlider.max = realDur; eSlider.value = trimEditorCtx.trimEnd; }
      }
      vid.currentTime = trimEditorCtx.trimStart;
      updateTrimReadouts();
    }

    function onTrimVideoTimeUpdate() {
      const vid = document.getElementById('trim-editor-video');
      if (!vid) return;
      const clock = document.getElementById('trim-current-clock');
      if (clock) {
        clock.textContent = `${formatPreciseTime(vid.currentTime || 0)} / ${formatPreciseTime(trimEditorCtx.durationSec)}`;
      }
      if (!vid.paused && vid.currentTime >= trimEditorCtx.trimEnd) {
        vid.pause();
        vid.currentTime = trimEditorCtx.trimStart;
        const btn = document.getElementById('trim-preview-btn');
        if (btn) btn.textContent = 'Kesilen Aralığı Önizle';
      }
    }

    function updateTrimReadouts() {
      const startEl = document.getElementById('trim-start-readout');
      const endEl = document.getElementById('trim-end-readout');
      const durEl = document.getElementById('trim-new-duration-text');
      if (startEl) startEl.textContent = formatPreciseTime(trimEditorCtx.trimStart);
      if (endEl) endEl.textContent = formatPreciseTime(trimEditorCtx.trimEnd);
      if (durEl) {
        const len = Math.max(0.5, trimEditorCtx.trimEnd - trimEditorCtx.trimStart);
        durEl.textContent = `${formatDurationFromSeconds(len)} (${len.toFixed(1)} sn)`;
      }
    }

    function onTrimStartChanged(val) {
      const num = Number(val);
      const maxAllowed = Math.max(0, trimEditorCtx.trimEnd - 0.5);
      trimEditorCtx.trimStart = Number(Math.max(0, Math.min(maxAllowed, num)).toFixed(1));
      const slider = document.getElementById('trim-start-slider');
      if (slider) slider.value = trimEditorCtx.trimStart;
      const vid = document.getElementById('trim-editor-video');
      if (vid) vid.currentTime = trimEditorCtx.trimStart;
      updateTrimReadouts();
    }

    function onTrimEndChanged(val) {
      const num = Number(val);
      const minAllowed = Math.min(trimEditorCtx.durationSec, trimEditorCtx.trimStart + 0.5);
      trimEditorCtx.trimEnd = Number(Math.max(minAllowed, Math.min(trimEditorCtx.durationSec, num)).toFixed(1));
      const slider = document.getElementById('trim-end-slider');
      if (slider) slider.value = trimEditorCtx.trimEnd;
      const vid = document.getElementById('trim-editor-video');
      if (vid) vid.currentTime = trimEditorCtx.trimEnd;
      updateTrimReadouts();
    }

    function markCutStartHere() {
      const vid = document.getElementById('trim-editor-video');
      if (!vid) return;
      onTrimStartChanged(vid.currentTime || 0);
      showToast(`Başlangıç kesim noktası: ${formatPreciseTime(trimEditorCtx.trimStart)}`, 'info');
    }

    function markCutEndHere() {
      const vid = document.getElementById('trim-editor-video');
      if (!vid) return;
      onTrimEndChanged(vid.currentTime || trimEditorCtx.durationSec);
      showToast(`Bitiş kesim noktası: ${formatPreciseTime(trimEditorCtx.trimEnd)}`, 'info');
    }

    function toggleTrimRangePreview() {
      const vid = document.getElementById('trim-editor-video');
      const btn = document.getElementById('trim-preview-btn');
      if (!vid) return;
      if (!vid.paused) {
        vid.pause();
        if (btn) btn.textContent = 'Kesilen Aralığı Önizle';
        return;
      }
      if (vid.currentTime < trimEditorCtx.trimStart || vid.currentTime >= trimEditorCtx.trimEnd) {
        vid.currentTime = trimEditorCtx.trimStart;
      }
      vid.play().catch(() => {});
      if (btn) btn.textContent = 'Önizlemeyi Durdur';
    }

    function resetTrimRange() {
      trimEditorCtx.trimStart = 0;
      trimEditorCtx.trimEnd = trimEditorCtx.durationSec;
      const sSlider = document.getElementById('trim-start-slider');
      const eSlider = document.getElementById('trim-end-slider');
      if (sSlider) sSlider.value = 0;
      if (eSlider) eSlider.value = trimEditorCtx.durationSec;
      const vid = document.getElementById('trim-editor-video');
      if (vid) vid.currentTime = 0;
      updateTrimReadouts();
    }

    function saveTrimmedRange() {
      const item = state.catalog.find(m => m.id === trimEditorCtx.itemId);
      if (!item) return;

      const activeSec = Math.max(0.5, trimEditorCtx.trimEnd - trimEditorCtx.trimStart);
      const newDurLabel = formatDurationFromSeconds(activeSec);

      if (item.type === 'movie') {
        const sObj = (item.sources || []).find(s => s.id === trimEditorCtx.sourceId) || (item.sources && item.sources[0]);
        if (sObj) {
          sObj.trimStart = trimEditorCtx.trimStart;
          sObj.trimEnd = trimEditorCtx.trimEnd;
          sObj.durationSec = activeSec;
        }
        item.duration = newDurLabel;
        item.durationSec = activeSec;
      } else {
        const eps = Array.isArray(item.episodes) ? item.episodes : [];
        const ep = eps.find(e => Number(e.season) === Number(trimEditorCtx.season) && Number(e.number) === Number(trimEditorCtx.episode)) || eps[0];
        if (ep) {
          const sObj = (ep.sources || []).find(s => s.id === trimEditorCtx.sourceId) || (ep.sources && ep.sources[0]);
          if (sObj) {
            sObj.trimStart = trimEditorCtx.trimStart;
            sObj.trimEnd = trimEditorCtx.trimEnd;
            sObj.durationSec = activeSec;
          }
          ep.duration = newDurLabel;
          ep.durationSec = activeSec;
          item.duration = newDurLabel;
          item.durationSec = activeSec;
        }
      }

      persistAndRenderCatalog();
      syncMetaToFirestoreSilent(item);
      closeTrimEditor();
      showToast(`Kesim kaydedildi, yeni süre: ${newDurLabel}`, 'success');

      if (state.player.media && state.player.media.id === item.id) {
        openPlayer(item.id, state.player.season, state.player.episode);
      }
    }

    function closeTrimEditor() {
      const vid = document.getElementById('trim-editor-video');
      if (vid) {
        try { vid.pause(); } catch (e) {}
      }
      if (trimEditorCtx.objectUrl && trimEditorCtx.revokeUrl) {
        try { URL.revokeObjectURL(trimEditorCtx.objectUrl); } catch (e) {}
        trimEditorCtx.objectUrl = '';
      }
      closeModal();
    }

    async function lookupIntoEditModal(mediaType) {
      const titleVal = document.getElementById('edit-title-inp')?.value?.trim() || '';
      if (!titleVal) return;
      const list = await queryBroadMediaMetadata(titleVal, mediaType);
      if (list.length > 0) {
        const best = list[0];
        if (best.year) document.getElementById('edit-year-inp').value = best.year;
        if (best.month) document.getElementById('edit-month-inp').value = best.month;
        if (best.day) document.getElementById('edit-day-inp').value = best.day;
        if (best.genre) document.getElementById('edit-genre-inp').value = best.genre;
        if (best.duration && !document.getElementById('edit-duration-inp').value.trim()) {
          document.getElementById('edit-duration-inp').value = best.duration;
        }
        if (best.posterUrl) {
          document.getElementById('edit-poster-url-inp').value = best.posterUrl;
          document.getElementById('edit-poster-img').src = best.posterUrl;
        }
        showToast(`"${best.title}" bilgileri getirildi.`, 'success');
      } else {
        showToast('Eşleşme bulunamadı, alanları elle girebilirsiniz.', 'error');
      }
    }

    async function saveEditedItem(e, itemId) {
      e.preventDefault();
      const item = state.catalog.find(m => m.id === itemId);
      if (!item) return;

      item.title = document.getElementById('edit-title-inp').value.trim() || item.title;
      item.year = Number(document.getElementById('edit-year-inp').value) || item.year;
      const mVal = Number(document.getElementById('edit-month-inp').value);
      const dVal = Number(document.getElementById('edit-day-inp').value);
      item.month = mVal >= 1 && mVal <= 12 ? mVal : null;
      item.day = dVal >= 1 && dVal <= 31 ? dVal : null;
      item.releaseDate = item.month && item.day
        ? `${item.year}-${String(item.month).padStart(2, '0')}-${String(item.day).padStart(2, '0')}`
        : (item.month ? `${item.year}-${String(item.month).padStart(2, '0')}` : `${item.year}`);
      item.genre = document.getElementById('edit-genre-inp').value.trim();

      const posterUrl = document.getElementById('edit-poster-url-inp').value.trim();
      const posterFile = document.getElementById('edit-poster-file-inp').files[0];

      const bgTasks = [];
      if (posterFile) {
        item.posterUrl = URL.createObjectURL(posterFile);
        bgTasks.push({
          kind: 'poster',
          title: item.title,
          label: 'Kapak Görseli',
          file: posterFile,
          folder: 'birperde_posters'
        });
      } else if (posterUrl) {
        item.posterUrl = posterUrl;
      }

      let detectedDur = '';
      if (item.type === 'movie') {
        const updated = await buildLocalSourcesAndOptionalTasks('edit', item.title);
        if (updated.sources.length > 0) {
          item.sources = updated.sources;
          item.hasSub = item.sources.some(s => s.defaultMode === 'sub');
          item.hasDub = item.sources.some(s => s.defaultMode === 'dub');
          if (updated.detectedDurLabel) {
            detectedDur = updated.detectedDurLabel;
            item.durationSec = updated.detectedDurSec;
          }
          bgTasks.push(...updated.bgTasks);
        }
      }

      item.duration = detectedDur || document.getElementById('edit-duration-inp').value.trim() || item.duration;

      clearAllPendingFiles();
      persistAndRenderCatalog();
      if (state.player.media && state.player.media.id === item.id) {
        state.player.media = item;
        state.player.channels = buildChannels(item, state.player.season, state.player.episode);
        renderWatchStudio();
      }
      closeModal();
      showToast(`"${item.title}" güncellendi.`, 'success');

      syncMetaToFirestoreSilent(item);
      if (state.cloudSyncEnabled && bgTasks.length > 0) {
        runOptionalBackgroundUploads(item.id, bgTasks);
      }
    }

    function downloadCatalogJsonFile() {
      const blob = new Blob([JSON.stringify(state.catalog || [], null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `birperdetr-arsiv-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Arşiv JSON dosyası indirildi.', 'success');
    }

    function copyCatalogJsonToClipboard() {
      const ta = document.getElementById('backup-json-textarea');
      if (!ta) return;
      navigator.clipboard?.writeText(ta.value).then(() => {
        showToast('JSON panoya kopyalandı.', 'success');
      }).catch(() => {
        ta.select();
        document.execCommand('copy');
        showToast('JSON kopyalandı.', 'success');
      });
    }

    function importCatalogJsonText() {
      const raw = document.getElementById('backup-json-textarea')?.value || '';
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) {
          showToast('Geçerli bir liste formatı girin.', 'error');
          return;
        }
        const valid = parsed.map((x, idx) => normalizeRecoveredItem(x, idx)).filter(Boolean);
        const map = new Map();
        (state.catalog || []).forEach(x => map.set(x.id, x));
        valid.forEach(x => {
          deletedIdsSession.delete(x.id);
          map.set(x.id, x);
        });
        state.catalog = Array.from(map.values());
        persistAndRenderCatalog();
        state.catalog.forEach(item => syncMetaToFirestoreSilent(item));
        closeModal();
        showToast(`${valid.length} oynatılabilir içerik arşive aktarıldı.`, 'success');
      } catch (e) {
        showToast('JSON biçimi hatalı, lütfen kontrol edin.', 'error');
      }
    }

    function deleteEpisodeFromSeries(seriesId, season, epNum) {
      const series = state.catalog.find(s => s.id === seriesId && s.type === 'series');
      if (!series || !Array.isArray(series.episodes)) return;

      series.episodes = series.episodes.filter(e => !(Number(e.season) === Number(season) && Number(e.number) === Number(epNum)));
      series.seasons = series.episodes.length > 0 ? Math.max(...series.episodes.map(e => Number(e.season))) : 1;
      series.hasSub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'sub'));
      series.hasDub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'dub'));

      if (
        state.player.media &&
        state.player.media.id === seriesId &&
        Number(state.player.season) === Number(season) &&
        Number(state.player.episode) === Number(epNum)
      ) {
        closePlayer();
      }

      persistAndRenderCatalog();
      openEpisodesModal(series.id);
      syncMetaToFirestoreSilent(series);
      showToast(`Sezon ${season} Bölüm ${epNum} silindi.`, 'info');
    }

    function getFilteredItems() {
      const q = state.searchQuery.toLowerCase();
      return (state.catalog || []).filter(item => {
        if (!isValidItem(item) || deletedIdsSession.has(item.id)) return false;
        if (
          q &&
          !item.title.toLowerCase().includes(q) &&
          !String(item.year).includes(q) &&
          !(item.releaseDate && item.releaseDate.toLowerCase().includes(q)) &&
          !(item.genre && item.genre.toLowerCase().includes(q))
        ) {
          return false;
        }
        if (state.langFilter === 'dub' && !item.hasDub) return false;
        if (state.langFilter === 'sub' && !item.hasSub) return false;
        return true;
      });
    }

              Yedek Yükle

          </div>
        </div>

    }

            <div class="flex items-center gap-1.5">
              <button type="button" onclick="openAddContentModal('episode')" class="px-3 py-1.5 rounded-xl bg-bpWhite text-bpBlack text-xs font-extrabold shrink-0 cursor-pointer">+ Bölüm Ekle</button>
              <button type="button" onclick="openAddContentModal('series')" class="px-3 py-1.5 rounded-xl bg-bpYellow text-bpBlack text-xs font-extrabold shrink-0 cursor-pointer">+ Dizi Ekle</button>
            </div>
          </div>
          ${series.length === 0 ? renderEmptyArchiveBox('series') : `
            <div class="catalog-responsive-grid">${series.map(renderCard).join('')}</div>
          `}
        `;
        return;
      }

      mainEl.innerHTML = `
        <section class="space-y-2.5">
          <div class="theme-banner-movies text-white rounded-2xl px-4 py-3 flex items-center justify-between">
            <h2 class="text-sm sm:text-base font-extrabold">Filmler (${movies.length})</h2>
            <button type="button" onclick="openAddContentModal('movie')" class="px-3 py-1.5 rounded-xl bg-bpRed text-white text-xs font-extrabold shrink-0 cursor-pointer">+ Film Ekle</button>

          ${movies.length === 0 ? renderEmptyArchiveBox('movie') : `

              <button type="button" onclick="openAddContentModal('series')" class="px-3 py-1.5 rounded-xl bg-bpYellow text-bpBlack text-xs font-extrabold shrink-0 cursor-pointer">+ Dizi Ekle</button>
            </div>
          </div>
          ${series.length === 0 ? renderEmptyArchiveBox('series') : `

          `}

    /* =====================================================================
       13. WATCH STUDIO
    ===================================================================== */
    let hlsController = null;
    let singleTapTimer = null;
    let lastTapTs = 0;
    let hudVisibleInFullscreen = false;
    let volumePopoverHideTimer = null;
    let isDraggingVerticalVol = false;
    let autoplayFallbackMuted = false;

    function getCurrentProgressKey() {
      const m = state.player.media;
      if (!m) return '';
      return m.type === 'series'
        ? `${m.id}_s${state.player.season}_e${state.player.episode}`
        : `${m.id}_movie`;
    }

    function buildChannels(media, season, episode) {
      let list = [];
      if (media.type === 'series') {
        const eps = Array.isArray(media.episodes) ? media.episodes : [];
        const ep = eps.find(e => Number(e.season) === Number(season) && Number(e.number) === Number(episode)) || eps[0];
        if (ep && Array.isArray(ep.sources) && ep.sources.length > 0) list = ep.sources;
      } else if (Array.isArray(media.sources) && media.sources.length > 0) {
        list = media.sources;
      }

      if (list.length === 0) {
        return [{ id: 'sub', label: 'TR Altyazılı', defaultMode: 'sub', url: '', localKey: '', storagePath: '', trimStart: 0, trimEnd: 0 }];
      }

      return list.map((src, idx) => ({
        id: src.id || `src-${idx}`,
        label: src.label || (src.defaultMode === 'dub' ? 'TR Dublaj' : 'TR Altyazılı'),
        defaultMode: src.defaultMode || 'sub',
        url: src.url || '',
        localKey: src.localKey || '',
        storagePath: src.storagePath || '',
        trimStart: typeof src.trimStart === 'number' ? src.trimStart : 0,
        trimEnd: typeof src.trimEnd === 'number' ? src.trimEnd : 0
      }));
    }

    function canAttachWebAudioGain(url) {
      if (!url) return false;
      if (url.startsWith('blob:') || url.startsWith('data:')) return true;
      try {
        const parsed = new URL(url, window.location.href);
        return parsed.origin === window.location.origin;
      } catch (e) {
        return false;
      }
    }

    function setupVideoGainPipeline(vid, playableUrl = '') {
      if (!vid || wiredGainVideo === vid) return;
      if (!canAttachWebAudioGain(playableUrl || vid.currentSrc || vid.src)) return;
      try {
        unlockAudioEngine();
        if (!audioCtxGain || audioCtxGain.state !== 'running') return;
        const srcNode = audioCtxGain.createMediaElementSource(vid);
        audioGainNode = audioCtxGain.createGain();
        audioGainNode.gain.setValueAtTime(state.player.volume ?? 1, audioCtxGain.currentTime);
        srcNode.connect(audioGainNode);
        audioGainNode.connect(audioCtxGain.destination);
        wiredGainVideo = vid;
      } catch (e) {
        audioGainNode = null;
      }
    }

    function syncMediaSessionMetadata() {
      try {
        if (!('mediaSession' in navigator) || !state.player.media) return;
        const m = state.player.media;
        navigator.mediaSession.metadata = new MediaMetadata({
          title: m.title,
          artist: m.type === 'series' ? `${state.player.season}. Sezon ${state.player.episode}. Bölüm` : 'BirPerdeTR'
        });
        navigator.mediaSession.playbackState = state.player.isPlaying ? 'playing' : 'paused';
      } catch (e) {}
    }

    function openVolumePopover(autoHideMs = 2400) {
      const dock = document.getElementById('bp-vertical-vol-dock');
      if (!dock) return;
      state.player.volumePopoverOpen = true;
      dock.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
      dock.classList.add('opacity-100', 'scale-100');
      clearTimeout(volumePopoverHideTimer);
      if (autoHideMs > 0 && !isDraggingVerticalVol) {
        volumePopoverHideTimer = setTimeout(() => {
          closeVolumePopover();
        }, autoHideMs);
      }
    }

    function closeVolumePopover() {
      const dock = document.getElementById('bp-vertical-vol-dock');
      state.player.volumePopoverOpen = false;
      if (!dock) return;
      dock.classList.remove('opacity-100', 'scale-100');
      dock.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
    }

    function toggleVolumePopoverByButton(ev) {
      if (ev) ev.stopPropagation();
      unlockAudioEngine();
      if (state.player.volumePopoverOpen) {
        closeVolumePopover();
      } else {
        openVolumePopover(2800);
      }
    }

    function applyVolumeLevel(newVol, syncToNativeElement = true, revealPopover = true) {
      unlockAudioEngine();
      const clamped = Math.max(0, Math.min(1, Number(Number(newVol).toFixed(2))));
      state.player.volume = clamped;
      if (clamped > 0.02) {
        state.player.lastNonZeroVolume = clamped;
      }

      const vid = document.getElementById('birperde-video');
      if (vid) {
        if (clamped > 0.005) {
          autoplayFallbackMuted = false;
          vid.muted = false;
        } else {
          vid.muted = true;
        }

        if (!wiredGainVideo && canAttachWebAudioGain(vid.currentSrc || vid.src)) {
          setupVideoGainPipeline(vid, vid.currentSrc || vid.src);
        }

        if (audioGainNode && wiredGainVideo === vid && audioCtxGain) {
          if (audioCtxGain.state === 'suspended') {
            audioCtxGain.resume().catch(() => {});
          }
          try {
            vid.volume = 1;
            audioGainNode.gain.cancelScheduledValues(audioCtxGain.currentTime);
            audioGainNode.gain.setTargetAtTime(clamped, audioCtxGain.currentTime, 0.015);
          } catch (e) {
            audioGainNode.gain.value = clamped;
          }
        } else if (syncToNativeElement) {
          try {
            vid.volume = clamped;
          } catch (e) {}
        }
      }

      renderVerticalVolumeVisuals();
      if (revealPopover) {
        openVolumePopover(isDraggingVerticalVol ? 0 : 2200);
      }
    }

    function adjustVolumeStep(delta, revealPopover = true) {
      applyVolumeLevel((state.player.volume ?? 1) + delta, true, revealPopover);
    }

    function toggleMuteVerticalVolume(ev) {
      if (ev) ev.stopPropagation();
      if ((state.player.volume ?? 1) > 0.01) {
        applyVolumeLevel(0, true, true);
      } else {
        applyVolumeLevel(state.player.lastNonZeroVolume || 1, true, true);
      }
    }

    function setVerticalVolumeFromPointer(ev, trackEl) {
      if (!trackEl) return;
      const pt = (ev.touches && ev.touches[0]) || ev;
      const rect = trackEl.getBoundingClientRect();
      const isRotated = state.player.isFullscreen && isMobilePortraitViewport();
      const angle = getOrientationAngle();

      let ratio = 1 - ((pt.clientY - rect.top) / Math.max(1, rect.height));
      if (isRotated) {
        ratio = angle === 270
          ? 1 - ((pt.clientX - rect.left) / Math.max(1, rect.width))
          : (pt.clientX - rect.left) / Math.max(1, rect.width);
      }
      applyVolumeLevel(ratio, true, true);
    }

    function onVerticalVolPointerDown(ev, trackEl) {
      ev.stopPropagation();
      unlockAudioEngine();
      isDraggingVerticalVol = true;
      clearTimeout(volumePopoverHideTimer);
      try { trackEl.setPointerCapture(ev.pointerId); } catch (e) {}
      setVerticalVolumeFromPointer(ev, trackEl);
    }

    function onVerticalVolPointerMove(ev, trackEl) {
      if (!isDraggingVerticalVol) return;
      ev.stopPropagation();
      setVerticalVolumeFromPointer(ev, trackEl);
    }

    function onVerticalVolPointerUp(ev, trackEl) {
      if (!isDraggingVerticalVol) return;
      ev.stopPropagation();
      isDraggingVerticalVol = false;
      try { trackEl.releasePointerCapture(ev.pointerId); } catch (e) {}
      openVolumePopover(2000);
    }

    function onVerticalVolWheel(ev) {
      ev.preventDefault();
      ev.stopPropagation();
      const step = ev.deltaY < 0 ? 0.08 : -0.08;
      adjustVolumeStep(step, true);
    }

    function renderVerticalVolumeVisuals() {
      const vol = Math.max(0, Math.min(1, state.player.volume ?? 1));
      const pct = Math.round(vol * 100);

      const lineFill = document.getElementById('bp-vvol-fill');
      if (lineFill) lineFill.style.height = `${pct}%`;

      const thumbDot = document.getElementById('bp-vvol-thumb');
      if (thumbDot) thumbDot.style.bottom = `calc(${pct}% - 6px)`;

      const pctLabel = document.getElementById('bp-vvol-pct');
      if (pctLabel) pctLabel.textContent = `%${pct}`;

      const speakerSvg = pct === 0
        ? `<svg class="w-4 h-4 text-rose-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>`
        : pct < 50
          ? `<svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`
          : `<svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;

      const iconBox = document.getElementById('bp-vvol-icon');
      if (iconBox) iconBox.innerHTML = speakerSvg;

      const triggerBtn = document.getElementById('bp-vol-trigger-btn');
      if (triggerBtn) triggerBtn.innerHTML = speakerSvg;
    }

    function buildVerticalVolumeLineWidget(isFullscreenMode) {
      const pct = Math.round(Math.max(0, Math.min(1, state.player.volume ?? 1)) * 100);
      const posCls = isFullscreenMode
        ? 'right-14 sm:right-16 bottom-16 z-30'
        : 'right-11 bottom-12 z-20';
      const shellCls = isFullscreenMode
        ? 'fs-icon-btn'
        : 'bg-slate-950/92 backdrop-blur-md border border-white/25';

      return `
        <div
          id="bp-vertical-vol-dock"
          onclick="event.stopPropagation()"
          onwheel="onVerticalVolWheel(event)"
          class="absolute ${posCls} w-10 py-2 rounded-2xl ${shellCls} flex flex-col items-center gap-1 select-none shadow-2xl opacity-0 scale-95 pointer-events-none transition-all duration-150"
        >
          <span id="bp-vvol-pct" class="font-mono text-[9px] font-extrabold text-amber-300 leading-none">%${pct}</span>

          <button type="button" onclick="adjustVolumeStep(0.15, true)" aria-label="Sesi Artır" class="w-7 h-6 rounded-lg bg-white/10 hover:bg-white/25 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">+</button>

          <div
            onpointerdown="onVerticalVolPointerDown(event, this)"
            onpointermove="onVerticalVolPointerMove(event, this)"
            onpointerup="onVerticalVolPointerUp(event, this)"
            onpointercancel="onVerticalVolPointerUp(event, this)"
            style="touch-action: none;"
            role="slider"
            aria-label="Ses Seviyesi"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="${pct}"
            class="relative w-8 h-24 flex items-center justify-center cursor-pointer"
          >
            <div class="relative w-1.5 h-20 rounded-full bg-white/25 overflow-visible">
              <div id="bp-vvol-fill" style="height: ${pct}%" class="absolute bottom-0 inset-x-0 rounded-full bg-amber-300 transition-[height] duration-75"></div>
              <span id="bp-vvol-thumb" style="bottom: calc(${pct}% - 6px)" class="absolute left-1/2 -translate-x-1/2 w-3 h-3 rounded-full bg-white shadow"></span>
            </div>
          </div>

          <button type="button" onclick="adjustVolumeStep(-0.15, true)" aria-label="Sesi Azalt" class="w-7 h-6 rounded-lg bg-white/10 hover:bg-white/25 text-white text-xs font-extrabold flex items-center justify-center cursor-pointer">-</button>

          <button type="button" id="bp-vvol-icon" onclick="toggleMuteVerticalVolume(event)" aria-label="Sesi Kapat veya Aç" class="w-6 h-6 flex items-center justify-center cursor-pointer">
            <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </button>
        </div>
      `;
    }

    function cleanupPlayerTimers() {
      if (hlsController) {
        try { hlsController.destroy(); } catch (e) {}
        hlsController = null;
      }
      clearTimeout(singleTapTimer);
      clearTimeout(volumePopoverHideTimer);
    }

    function openPlayer(itemId, season = null, episode = null) {
      unlockAudioEngine();
      const media = state.catalog.find(m => m.id === itemId);
      if (!media) return;

      let s = Number(season) || 1;
      let ep = Number(episode) || 1;
      if (media.type === 'series' && Array.isArray(media.episodes) && media.episodes.length > 0 && season === null) {
        s = Number(media.episodes[0].season) || 1;
        ep = Number(media.episodes[0].number) || 1;
      }

      const channels = buildChannels(media, s, ep);
      state.player.media = media;
      state.player.season = s;
      state.player.episode = ep;
      state.player.channels = channels;
      state.player.activeChannelId = channels[0].id;
      state.player.isFullscreen = false;
      state.player.isPlaying = true;
      state.player.volumePopoverOpen = false;
      hudVisibleInFullscreen = false;

      const activeCh = channels[0];
      const trimStart = (activeCh && activeCh.trimStart > 0) ? activeCh.trimStart : 0;

      const progKey = media.type === 'series' ? `${media.id}_s${s}_e${ep}` : `${media.id}_movie`;
      const saved = readWatchProgress()[progKey];
      const startSec = saved && saved.time > trimStart + 2 && (!saved.duration || saved.time < saved.duration - 5)
        ? saved.time
        : trimStart;

      renderWatchStudio(startSec, true);
      const sec = document.getElementById('watch-studio-wrapper');
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function switchPlayerChannel(channelId) {
      unlockAudioEngine();
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;
      state.player.activeChannelId = channelId;
      renderWatchStudio(resume, playing);
    }

    function switchPlayerEpisode(season, episode) {
      if (!state.player.media) return;
      openPlayer(state.player.media.id, Number(season), Number(episode));
    }

    function changePlaybackSpeed(rate) {
      const numRate = Number(rate) || 1;
      state.player.playbackRate = numRate;
      const vid = document.getElementById('birperde-video');
      if (vid) vid.playbackRate = numRate;
      const sel = document.getElementById('bp-speed-select');
      if (sel) sel.value = String(numRate);
    }

    function getOrientationAngle() {
      const scrAngle = (screen.orientation && typeof screen.orientation.angle === 'number')
        ? screen.orientation.angle
        : (typeof window.orientation === 'number' ? window.orientation : 0);
      return ((scrAngle % 360) + 360) % 360;
    }

    function isMobilePortraitViewport() {
      return window.innerWidth < 768 && window.innerHeight > window.innerWidth;
    }

    function syncFullscreenClass() {
      const wrap = document.getElementById('watch-studio-wrapper');
      if (!wrap || !state.player.isFullscreen) return;
      if (!isMobilePortraitViewport()) {
        wrap.className = 'bp-fullscreen-landscape-native';
        return;
      }
      const angle = getOrientationAngle();
      wrap.className = angle === 270 ? 'bp-fs-rot-ccw' : 'bp-fs-rot-cw';
    }

    async function enterFullscreenMode() {
      unlockAudioEngine();
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;

      state.player.isFullscreen = true;
      hudVisibleInFullscreen = true;
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';

      renderWatchStudio(resume, playing);
      setFullscreenHudVisibility(true);

      const wrap = document.getElementById('watch-studio-wrapper');
      if (!isMobilePortraitViewport() && wrap && wrap.requestFullscreen) {
        try { await wrap.requestFullscreen(); } catch (e) {}
      } else if (screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock('landscape'); } catch (e) {}
      }
    }

    async function exitFullscreenMode() {
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;

      state.player.isFullscreen = false;
      hudVisibleInFullscreen = false;
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';

      if (document.fullscreenElement) {
        try { await document.exitFullscreen(); } catch (e) {}
      }
      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (e) {}
      }

      renderWatchStudio(resume, playing);
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && state.player.isFullscreen && !isMobilePortraitViewport()) {
        exitFullscreenMode();
      }
    });

    function onDeviceOrientationUpdated() {
      if (!state.player.isFullscreen) return;
      syncFullscreenClass();
    }

    window.addEventListener('orientationchange', onDeviceOrientationUpdated);
    window.addEventListener('resize', onDeviceOrientationUpdated);
    if (screen.orientation && screen.orientation.addEventListener) {
      screen.orientation.addEventListener('change', onDeviceOrientationUpdated);
    }

    function closePlayer() {
      if (state.player.isFullscreen) {
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        if (document.fullscreenElement) {
          try { document.exitFullscreen(); } catch (e) {}
        }
        if (screen.orientation && screen.orientation.unlock) {
          try { screen.orientation.unlock(); } catch (e) {}
        }
      }
      if (state.player.blurMode) {
        state.player.blurMode = false;
        document.body.classList.remove('bp-cinema-blur-active');
      }
      cleanupPlayerTimers();
      state.player.media = null;
      state.player.isFullscreen = false;
      const sec = document.getElementById('watch-studio-wrapper');
      if (sec) {
        sec.className = 'hidden max-w-4xl w-full mx-auto px-3 sm:px-5 pt-4';
        sec.innerHTML = '';
      }
    }

    function setFullscreenHudVisibility(visible) {
      hudVisibleInFullscreen = visible;
      const hud = document.getElementById('fullscreen-hud-layer');
      if (!hud) return;
      if (visible) {
        hud.classList.remove('opacity-0', 'pointer-events-none');
        hud.classList.add('opacity-100');
      } else {
        hud.classList.remove('opacity-100');
        hud.classList.add('opacity-0', 'pointer-events-none');
        closeVolumePopover();
      }
    }

    function revealFullscreenHudBriefly() {
      if (!state.player.isFullscreen) return;
      setFullscreenHudVisibility(true);
    }

    function toggleFullscreenHudBySingleTap() {
      if (!state.player.isFullscreen) {
        togglePlayPauseVideo();
        return;
      }
      setFullscreenHudVisibility(!hudVisibleInFullscreen);
    }

    function showSeekVisualBadge(labelText, side) {
      const box = document.getElementById('seek-feedback-layer');
      if (!box) return;
      const alignClass = side === 'left'
        ? 'left-8 top-1/2 -translate-y-1/2'
        : side === 'right'
          ? 'right-8 top-1/2 -translate-y-1/2'
          : 'left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2';

      box.innerHTML = `
        <div class="seek-feedback-badge absolute ${alignClass} px-3.5 py-2 rounded-full bg-slate-950/75 border border-white/25 text-white text-xs font-extrabold tracking-wide shadow-lg">
          ${escapeHtml(labelText)}
        </div>
      `;
    }

    function handlePlayerSurfaceTap(ev) {
      if (ev.target && ev.target.closest('button, input, select, a, label')) return;
      unlockAudioEngine();

      if (state.player.volumePopoverOpen) {
        closeVolumePopover();
        return;
      }

      const rect = ev.currentTarget.getBoundingClientRect();
      const pt = (ev.changedTouches && ev.changedTouches[0]) || ev;
      let relX = (pt.clientX - rect.left) / Math.max(1, rect.width);

      if (state.player.isFullscreen && isMobilePortraitViewport()) {
        const angle = getOrientationAngle();
        relX = angle === 270
          ? 1 - ((pt.clientY - rect.top) / Math.max(1, rect.height))
          : (pt.clientY - rect.top) / Math.max(1, rect.height);
      }

      const now = Date.now();
      const isDoubleTap = (now - lastTapTs) < 280;
      lastTapTs = now;

      if (isDoubleTap) {
        clearTimeout(singleTapTimer);
        if (relX < 0.35) {
          seekVideoBySeconds(-10);
          showSeekVisualBadge('« 10 sn', 'left');
        } else if (relX > 0.65) {
          seekVideoBySeconds(10);
          showSeekVisualBadge('10 sn »', 'right');
        } else {
          togglePlayPauseVideo();
          const vid = document.getElementById('birperde-video');
          showSeekVisualBadge(vid && vid.paused ? 'Duraklatıldı' : 'Oynatılıyor', 'center');
        }
        return;
      }

      clearTimeout(singleTapTimer);
      singleTapTimer = setTimeout(() => {
        toggleFullscreenHudBySingleTap();
      }, 285);
    }

    function togglePlayPauseVideo() {
      unlockAudioEngine();
      const vid = document.getElementById('birperde-video');

      } else {

    function seekVideoBySeconds(delta) {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      const activeCh = state.player.channels.find(c => c.id === state.player.activeChannelId) || state.player.channels[0];
      const minBound = activeCh && activeCh.trimStart > 0 ? activeCh.trimStart : 0;
      const rawDur = (vid.duration && isFinite(vid.duration)) ? vid.duration : (vid.currentTime + Math.abs(delta) + 10);
      const maxBound = activeCh && activeCh.trimEnd > minBound && activeCh.trimEnd <= rawDur ? activeCh.trimEnd : rawDur;

      vid.currentTime = Math.max(minBound, Math.min(maxBound, (vid.currentTime || 0) + delta));
      updateVideoTimelineUI();
    }

    function seekVideoByPercent(pct) {
      const vid = document.getElementById('birperde-video');
      if (!vid || !vid.duration || !isFinite(vid.duration)) return;
      const activeCh = state.player.channels.find(c => c.id === state.player.activeChannelId) || state.player.channels[0];
      const minBound = activeCh && activeCh.trimStart > 0 ? activeCh.trimStart : 0;
      const maxBound = activeCh && activeCh.trimEnd > minBound && activeCh.trimEnd <= vid.duration ? activeCh.trimEnd : vid.duration;
      const span = Math.max(0.1, maxBound - minBound);

      vid.currentTime = minBound + (Number(pct) / 100) * span;
      updateVideoTimelineUI();
    }

    function formatClock(sec) {
      if (!isFinite(sec) || sec < 0) return '00:00';
      const s = Math.floor(sec);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const rem = s % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
      return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    function updateVideoTimelineUI() {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      const activeCh = state.player.channels.find(c => c.id === state.player.activeChannelId) || state.player.channels[0];
      const minBound = activeCh && activeCh.trimStart > 0 ? activeCh.trimStart : 0;
      const rawDur = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : 0;
      const maxBound = activeCh && activeCh.trimEnd > minBound && (rawDur === 0 || activeCh.trimEnd <= rawDur)
        ? activeCh.trimEnd
        : rawDur;

      if (maxBound > minBound && vid.currentTime >= maxBound - 0.15) {
        if (state.player.loopMode) {
          vid.currentTime = minBound;
          vid.play().catch(() => {});
          return;
        }
        vid.pause();
        vid.currentTime = minBound;
        const nextEp = findNextEpisodeInfo();
        if (nextEp && state.player.media?.type === 'series') {
          showToast(`Bölüm tamamlandı • Sonraki: S${nextEp.season} B${nextEp.number}`, 'info');
        }
        return;
      }

      const relCur = Math.max(0, (vid.currentTime || 0) - minBound);
      const relDur = Math.max(0, maxBound - minBound);

      const curEl = document.getElementById('bp-cur-time');
      const durEl = document.getElementById('bp-dur-time');
      const rngEl = document.getElementById('bp-timeline-range');
      if (curEl) curEl.textContent = formatClock(relCur);
      if (durEl) durEl.textContent = formatClock(relDur);
      if (rngEl && relDur > 0) {
        rngEl.value = Math.min(100, (relCur / relDur) * 100);
      }
      updateNextEpisodeButtonVisibility(relCur, relDur);
      saveWatchProgress(getCurrentProgressKey(), vid.currentTime, rawDur);
    }

    function attachVideoStream(url, reason, resumeTime, autoPlay, activeCh) {
      const video = document.getElementById('birperde-video');
      const overlay = document.getElementById('player-status-overlay');
      const statusText = document.getElementById('player-status-text');
      if (!video) return;

      wiredGainVideo = null;
      audioGainNode = null;

      video.onplay = () => syncPlayPauseButtons(true);
      video.onpause = () => syncPlayPauseButtons(false);
      video.ontimeupdate = updateVideoTimelineUI;
      video.onloadedmetadata = updateVideoTimelineUI;

      if (!url) {
        if (overlay) overlay.classList.remove('hidden');
        if (statusText) {
          if (reason === 'other_device_pending_cloud') {
            statusText.innerHTML = 'Bu film/bölüm başka bir cihazdan yerel dosya olarak eklenmiş ancak bulut yüklemesi henüz tamamlanmamış. İlk cihazda bulut yüklemesinin %100 bitmesini bekleyin veya bu cihazdan videoyu seçin.';
          } else {
            statusText.textContent = 'Bu kanal için video dosyası bulunamadı. Düzenle butonundan video seçebilirsiniz.';
          }
        }
        return;
      }

      if (overlay) overlay.classList.add('hidden');
      const minStart = (activeCh && activeCh.trimStart > 0) ? activeCh.trimStart : 0;

      const onReady = () => {
        video.playbackRate = state.player.playbackRate || 1;
        setupVideoGainPipeline(video, url);
        applyVolumeLevel(state.player.volume ?? 1, true, false);
        const startPos = resumeTime > minStart ? resumeTime : minStart;
        if (startPos > 0.2) {
          try { video.currentTime = startPos; } catch (e) {}
        }
        if (autoPlay) {
          video.play().catch(() => {
            autoplayFallbackMuted = true;
            video.muted = true;
            video.play().catch(() => {});
          });
        }
      };

      video.onerror = () => {
        if (overlay) overlay.classList.remove('hidden');
        if (statusText) statusText.textContent = 'Video oynatılamadı. Bağlantıyı veya dosya formatını kontrol edin.';
      };

      if (url.includes('.m3u8') && window.Hls && Hls.isSupported()) {
        hlsController = new Hls({ enableWorker: true });
        hlsController.loadSource(url);
        hlsController.attachMedia(video);
        hlsController.on(Hls.Events.MANIFEST_PARSED, onReady);
      } else {
        video.src = url;
        video.addEventListener('loadedmetadata', onReady, { once: true });
      }
    }

    document.addEventListener('keydown', (e) => {
      if (!state.player.media) return;
      const modalOpen = !document.getElementById('modal-overlay')?.classList.contains('hidden');
      if (modalOpen) return;
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;

      const key = e.key;
      const lower = key.toLowerCase();

      if (key === ' ' || lower === 'k') {
        e.preventDefault();
        togglePlayPauseVideo();
        const vid = document.getElementById('birperde-video');
        showSeekVisualBadge(vid && vid.paused ? 'Duraklatıldı' : 'Oynatılıyor', 'center');
      } else if (key === 'ArrowLeft' || lower === 'j') {
        e.preventDefault();
        seekVideoBySeconds(-10);
        showSeekVisualBadge('« 10 sn', 'left');
      } else if (key === 'ArrowRight' || lower === 'l') {
        e.preventDefault();
        seekVideoBySeconds(10);
        showSeekVisualBadge('10 sn »', 'right');
      } else if (key === 'ArrowUp') {
        e.preventDefault();
        adjustVolumeStep(0.1, true);
      } else if (key === 'ArrowDown') {
        e.preventDefault();
        adjustVolumeStep(-0.1, true);
      } else if (lower === 'm') {
        e.preventDefault();
        toggleMuteVerticalVolume();
      } else if (lower === 'f') {
        e.preventDefault();
        if (state.player.isFullscreen) exitFullscreenMode();
        else enterFullscreenMode();
      } else if (lower === 'b') {
        e.preventDefault();
        toggleCinemaBlurMode();
      } else if (lower === 'r') {
        e.preventDefault();
        toggleLoopMode();
      } else if (lower === 'p') {
        e.preventDefault();
        togglePictureInPicture();
      } else if (lower === 's') {
        e.preventDefault();
        captureQuickVideoSnapshot();
      } else if (lower === 'n') {
        e.preventDefault();
        playNextEpisodeIfAvailable();
      } else if (key === '>' || (e.shiftKey && key === '.')) {
        e.preventDefault();
        const rates = [0.75, 1, 1.25, 1.5, 2];
        const idx = rates.indexOf(state.player.playbackRate || 1);
        const nextRate = rates[Math.min(rates.length - 1, idx + 1)];
        changePlaybackSpeed(nextRate);
        showToast(`Oynatma hızı: ${nextRate}x`, 'info');
      } else if (key === '<' || (e.shiftKey && key === ',')) {
        e.preventDefault();
        const rates = [0.75, 1, 1.25, 1.5, 2];
        const idx = rates.indexOf(state.player.playbackRate || 1);
        const prevRate = rates[Math.max(0, idx - 1)];
        changePlaybackSpeed(prevRate);
        showToast(`Oynatma hızı: ${prevRate}x`, 'info');
      } else if (/^[0-9]$/.test(key)) {
        e.preventDefault();
        const pct = Number(key) * 10;
        seekVideoByPercent(pct);
        showSeekVisualBadge(`%${pct}`, 'center');
      } else if (key === 'Escape' && state.player.isFullscreen) {
        exitFullscreenMode();
      } else if (key === 'Escape' && state.player.blurMode) {
        toggleCinemaBlurMode();
      }
    });

    /* =====================================================================
       14. HELPERS, MODAL & TOAST
    ===================================================================== */
    function openModal(html) {
      const overlay = document.getElementById('modal-overlay');
      const card = document.getElementById('modal-card');
      if (!overlay || !card) return;
      card.innerHTML = html;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');
      if (overlay) overlay.classList.add('hidden');
    }

    function handleOverlayClick(e) {
      if (e.target && e.target.id === 'modal-overlay') closeModal();
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toast-container');
      if (!box) return;
      const colors = {
        success: 'bg-bpEmerald text-white border-bpGreen',
        error: 'bg-bpRed text-white border-red-900',
        info: 'bg-bpNavy text-white border-bpRoyal'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl border-2 text-xs font-extrabold shadow-lg ${colors[type] || colors.info}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 4000);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }
