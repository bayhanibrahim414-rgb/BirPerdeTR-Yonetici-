<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BirPerdeTR — Film ve Dizi Platformu</title>
  <meta name="theme-color" content="#071326" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BirPerdeTR" />

  <link id="bp-favicon-svg" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='12' fill='%23071326' stroke='%232563EB' stroke-width='2'/%3E%3Crect x='8' y='10' width='3.5' height='4' rx='1' fill='%23FACC15'/%3E%3Crect x='8' y='18' width='3.5' height='4' rx='1' fill='%23E0F2FE'/%3E%3Crect x='8' y='26' width='3.5' height='4' rx='1' fill='%2310B981'/%3E%3Crect x='8' y='34' width='3.5' height='4' rx='1' fill='%23E11D48'/%3E%3Crect x='36.5' y='10' width='3.5' height='4' rx='1' fill='%23E11D48'/%3E%3Crect x='36.5' y='18' width='3.5' height='4' rx='1' fill='%23FACC15'/%3E%3Crect x='36.5' y='26' width='3.5' height='4' rx='1' fill='%23E0F2FE'/%3E%3Crect x='36.5' y='34' width='3.5' height='4' rx='1' fill='%2310B981'/%3E%3Crect x='14.5' y='11' width='19' height='26' rx='4' fill='%23059669'/%3E%3Cpolygon points='21,18 30,24 21,30' fill='%23FFFFFF'/%3E%3C/svg%3E" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            bpWhite: '#FFFFFF',
            bpSky: '#EFF6FF',
            bpSkyBorder: '#CBD5E1',
            bpRed: '#E11D48',
            bpRoyal: '#2563EB',
            bpYellow: '#FACC15',
            bpGreen: '#10B981',
            bpBlack: '#0F172A',
            bpNavy: '#071326',
            bpEmerald: '#059669',
          }
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: clip;
      overscroll-behavior-x: none;
      touch-action: pan-y;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      user-select: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #EFF6FF;
      color: #0F172A;
      margin: 0;
      padding: 0;
    }

    input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
    }

    #admin-app, header, main, section, article, footer, #modal-overlay {
      max-width: 100%;
      overflow-x: clip;
    }

    body.bp-cinema-blur-active #admin-app > header,
    body.bp-cinema-blur-active #admin-app > main,
    body.bp-cinema-blur-active #admin-app > footer,
    body.bp-cinema-blur-active #background-sync-banner {
      filter: blur(14px) brightness(0.45);
      pointer-events: none;
      transition: filter 0.25s ease;
    }

    body.bp-cinema-blur-active #watch-studio-wrapper {
      position: relative;
      z-index: 60;
      max-width: 72rem !important;
      transition: max-width 0.25s ease;
    }

    body.bp-cinema-blur-active #watch-studio-wrapper .bp-player-stage {
      max-height: 75vh !important;
    }

    #intro-splash {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #16325C 0%, #071326 65%, #030712 100%);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #intro-splash.splash-exit {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    .intro-shimmer-ring {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 9999px;
      background: conic-gradient(from 0deg, rgba(250, 204, 21, 0), rgba(250, 204, 21, 0.55), rgba(56, 189, 248, 0.45), rgba(250, 204, 21, 0));
      filter: blur(18px);
      animation: introSpin 4.5s linear infinite;
    }

    @keyframes introSpin {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(0.95); }
    }

    @keyframes introPop {
      0% { opacity: 0; transform: translateY(14px) scale(0.88); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .intro-brand-pop {
      animation: introPop 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes titleShine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .intro-shine-text {
      background: linear-gradient(90deg, #E0F2FE 0%, #FACC15 35%, #FFFFFF 50%, #38BDF8 70%, #E0F2FE 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleShine 2.6s linear infinite;
    }

    .bg-pattern-sky {
      background-color: #EFF6FF;
      background-image: radial-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .theme-banner-movies {
      background: linear-gradient(135deg, #071326 0%, #1E3A8A 100%);
    }

    .theme-banner-series {
      background: linear-gradient(135deg, #064E3B 0%, #059669 100%);
    }

    .birperde-ribbon {
      height: 4px;
      background: linear-gradient(90deg, #2563EB 0%, #071326 25%, #059669 50%, #FACC15 75%, #E11D48 100%);
    }

    .catalog-responsive-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .catalog-responsive-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
    }

    @media (min-width: 1024px) {
      .catalog-responsive-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
      }
    }

    .card-movie-frame {
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-top: 3px solid #E11D48;
      border-radius: 14px;
      overflow: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 12px -4px rgba(7, 19, 38, 0.12);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card-movie-frame:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -6px rgba(7, 19, 38, 0.22);
    }

    .card-series-frame {
      background: #FFFFFF;
      border: 1px solid #A7F3D0;
      border-top: 3px solid #059669;
      border-radius: 14px;
      overflow: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 12px -4px rgba(5, 150, 105, 0.12);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card-series-frame:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -6px rgba(5, 150, 105, 0.22);
    }

    .bp-fs-rot-cw {
      position: fixed !important;
      top: 0 !important;
      left: 100vw !important;
      width: 100dvh !important;
      height: 100vw !important;
      max-width: none !important;
      transform: rotate(90deg) !important;
      transform-origin: top left !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    .bp-fs-rot-ccw {
      position: fixed !important;
      top: 100vh !important;
      left: 0 !important;
      width: 100dvh !important;
      height: 100vw !important;
      max-width: none !important;
      transform: rotate(-90deg) !important;
      transform-origin: top left !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    @supports not (width: 100dvh) {
      .bp-fs-rot-cw, .bp-fs-rot-ccw {
        width: 100vh !important;
      }
    }

    .bp-fullscreen-landscape-native {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    .bp-fs-rot-cw video,
    .bp-fs-rot-ccw video,
    .bp-fullscreen-landscape-native video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      border-radius: 0 !important;
      border: 0 !important;
      background: #000000 !important;
    }

    .fs-icon-btn {
      background: rgba(7, 19, 38, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .fs-icon-btn:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.25);
    }

    .fs-icon-active {
      background: rgba(37, 99, 235, 0.85);
      border: 1px solid rgba(250, 204, 21, 0.85);
      color: #FFFFFF;
    }

    .watch-soft-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #F1F5F9;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .watch-soft-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .watch-soft-active {
      background: rgba(37, 99, 235, 0.55);
      border: 1px solid rgba(250, 204, 21, 0.75);
      color: #FFFFFF;
    }

    input[type="range"].bp-scrubber {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"].bp-scrubber::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.28);
    }

    input[type="range"].bp-scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 9999px;
      background: #FACC15;
      border: 2px solid #071326;
      margin-top: -5px;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .live-indicator {
      animation: livePulse 1.3s infinite ease-in-out;
    }

    @keyframes seekPop {
      0% { opacity: 0; transform: scale(0.8); }
      25% { opacity: 1; transform: scale(1.06); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.95); }
    }
    .seek-feedback-badge {
      animation: seekPop 0.75s ease forwards;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #EFF6FF;
    }
    ::-webkit-scrollbar-thumb {
      background: #2563EB;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-pattern-sky min-h-screen">

  <!-- INTRO SPLASH SCREEN -->
  <div id="intro-splash" onclick="dismissIntroSplashNow()" class="cursor-pointer select-none px-6 text-center">
    <div class="relative flex flex-col items-center justify-center">
      <div class="intro-shimmer-ring"></div>
      <div id="intro-logo-mount" class="intro-brand-pop relative z-10 mb-5 drop-shadow-[0_0_28px_rgba(250,204,21,0.35)]"></div>
      <h1 class="intro-brand-pop relative z-10 text-4xl sm:text-6xl font-extrabold tracking-tight intro-shine-text">
        BirPerdeTR
      </h1>
      <p class="intro-brand-pop relative z-10 mt-2 text-xs sm:text-sm font-semibold tracking-widest uppercase text-sky-200/80">
        Bulut Film &amp; Dizi Platformu
      </p>
    </div>
  </div>

  <!-- Top Signature Ribbon -->
  <div class="birperde-ribbon w-full sticky top-0 z-50"></div>

  <!-- Toast Notifications -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[10000] flex flex-col gap-2 max-w-xs w-[calc(100%-2rem)] pointer-events-none"></div>

  <!-- MAIN APPLICATION SHELL -->
  <div id="admin-app" class="min-h-screen flex flex-col w-full">

    <!-- TOP HEADER BAR -->
    <header class="sticky top-[4px] z-40 bg-bpWhite/95 backdrop-blur-md border-b border-slate-200 shadow-xs w-full">
      <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">

        <!-- Left: Brand -->
        <div class="flex items-center gap-2.5 shrink-0 min-w-0">
          <div id="header-brand-logo" onclick="replayIntroSplash()" class="cursor-pointer"></div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-base sm:text-xl font-extrabold tracking-tight text-bpNavy">BirPerdeTR</span>
              <span id="cloud-live-dot" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-bpEmerald/15 text-bpEmerald border border-bpEmerald/30">
                <span class="w-1.5 h-1.5 rounded-full bg-bpEmerald live-indicator"></span>
                <span>CANLI BULUT</span>
              </span>
            </div>
            <p class="text-[11px] text-slate-500 hidden sm:block">Hızlı bulut &amp; cihazlar arası anında izle</p>
          </div>
        </div>

        <!-- Right: Action Buttons -->
        <div class="flex items-center gap-1.5 sm:gap-2 order-2 md:order-3 shrink-0 flex-wrap">
          <button type="button" onclick="openAddContentModal('movie')" class="px-3 py-2 rounded-xl bg-bpNavy hover:bg-bpRoyal text-white text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
            <span>Film Ekle</span>
          </button>

          <button type="button" onclick="openAddContentModal('series')" class="px-3 py-2 rounded-xl bg-bpEmerald hover:bg-emerald-700 text-white text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
            <span>Dizi Ekle</span>
          </button>

          <button type="button" onclick="openAddContentModal('episode')" class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-bpNavy text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
            <span>Bölüm</span>
          </button>

          <button type="button" onclick="openDirectTransferModal()" class="px-2.5 py-2 rounded-xl bg-bpRoyal/10 hover:bg-bpRoyal text-bpRoyal hover:text-white text-xs font-extrabold flex items-center gap-1 transition cursor-pointer" title="Karşı Cihaza Anında Aktar">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
            <span class="hidden sm:inline">Hızlı Aktar</span>
          </button>

          <button type="button" onclick="syncAllFromCloudNow(true)" class="p-2 rounded-xl bg-slate-100 hover:bg-bpRoyal hover:text-white text-bpNavy transition cursor-pointer" title="Buluttan Yenile">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          </button>
        </div>

        <!-- Center: Search -->
        <div class="relative order-3 md:order-2 w-full md:flex-1 md:max-w-md min-w-0">
          <div class="relative flex items-center">
            <svg class="w-4 h-4 text-bpRoyal absolute left-3 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
            </svg>
            <input
              type="text"
              id="global-search-input"
              autocomplete="off"
              oninput="handleSearchInput(this.value)"
              placeholder="Film, dizi, tür veya yıl ara..."
              class="w-full pl-9 pr-10 py-2 rounded-xl bg-slate-100/80 border border-slate-200 focus:border-bpRoyal focus:bg-white focus:outline-none text-xs sm:text-sm font-medium text-bpBlack"
            />
            <button type="button" id="search-clear-btn" onclick="resetSearchInput()" class="hidden absolute right-2 w-6 h-6 rounded-lg bg-bpRed/15 text-bpRed flex items-center justify-center cursor-pointer" title="Temizle">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- CATEGORY TABS & LANGUAGE FILTERS -->
      <div class="bg-slate-50 border-t border-slate-200 w-full">
        <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 min-w-0 flex-wrap">
            <button type="button" data-nav-tab="all" onclick="switchNavTab('all')" class="nav-tab-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">
              Tüm Arşiv
            </button>
            <button type="button" data-nav-tab="movies" onclick="switchNavTab('movies')" class="nav-tab-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">
              Filmler
            </button>
            <button type="button" data-nav-tab="series" onclick="switchNavTab('series')" class="nav-tab-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer">
              Diziler
            </button>
          </div>

          <div class="flex items-center gap-1 shrink-0">
            <button type="button" data-lang-btn="all" onclick="switchLangFilter('all')" class="lang-filter-btn px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition cursor-pointer">
              Tümü
            </button>
            <button type="button" data-lang-btn="dub" onclick="switchLangFilter('dub')" class="lang-filter-btn px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition cursor-pointer">
              TR Dublaj
            </button>
            <button type="button" data-lang-btn="sub" onclick="switchLangFilter('sub')" class="lang-filter-btn px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition cursor-pointer">
              TR Altyazılı
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- CLOUD UPLOAD PROGRESS BANNER -->
    <div id="background-sync-banner" class="hidden max-w-6xl w-full mx-auto px-3 sm:px-5 pt-3">
      <div class="px-4 py-2.5 rounded-xl bg-bpNavy text-white border border-bpRoyal flex flex-col gap-1.5 shadow-md min-w-0">
        <div class="flex items-center justify-between gap-3 min-w-0">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-2.5 h-2.5 rounded-full bg-bpYellow live-indicator shrink-0"></span>
            <span id="background-sync-text" class="text-xs font-extrabold text-bpYellow truncate">Buluta aktarılıyor...</span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span id="background-sync-pct" class="font-mono text-xs font-extrabold text-white">%0</span>
            <button type="button" onclick="cancelActiveCloudSync()" class="w-6 h-6 rounded-lg bg-white/15 hover:bg-bpRed flex items-center justify-center text-white cursor-pointer" title="İptal">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>
        <div class="w-full h-1.5 rounded-full bg-white/15 overflow-hidden">
          <div id="background-sync-bar" style="width: 0%" class="h-full bg-bpYellow transition-all duration-200"></div>
        </div>
      </div>
    </div>

    <!-- WATCH STUDIO -->
    <section id="watch-studio-wrapper" class="hidden max-w-4xl w-full mx-auto px-3 sm:px-5 pt-4"></section>

    <!-- MAIN CATALOG AREA -->
    <main id="main-content-area" class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-5 py-4 space-y-5"></main>

    <!-- FOOTER -->
    <footer class="bg-bpWhite border-t border-slate-200 mt-8 py-4 px-3 sm:px-5 text-center text-[11px] text-slate-500">
      BirPerdeTR — Ortak Bulut Film &amp; Dizi Platformu
    </footer>
  </div>

  <!-- MODAL DIALOG -->
  <div id="modal-overlay" class="hidden fixed inset-0 z-50 bg-bpBlack/70 backdrop-blur-xs flex items-center justify-center p-3 overflow-y-auto" onclick="handleOverlayClick(event)">

    /* =====================================================================

    const firebaseConfig = {
      apiKey: "AIzaSyB1eT555N2stbzj6x6zkmxHKtMolvCJmeY",
      authDomain: "birperdetr.firebaseapp.com",
      databaseURL: "https://birperdetr-default-rtdb.firebaseio.com",
      projectId: "birperdetr",

      messagingSenderId: "315520445101",
      appId: "1:315520445101:web:f1f6361b23e957b2f7f424",
      measurementId: "G-1Y3247DHPR"
    };

    const app = initializeApp(firebaseConfig);
    const fbAuth = getAuth(app);
    const fbDb = getFirestore(app);
    const fbStorage = getStorage(app);

    const LOCAL_SESSION_BLOBS = new Map();
    const LOCAL_SESSION_FILES = new Map();
    const PENDING_FILES = new Map();
    let cloudUploadCancelFlag = false;
    let activeUploadsCount = 0;
    let activeXhrUpload = null;
    let activeFbTask = null;

    function readDeletedTombstones() {
      try {
        const arr = JSON.parse(localStorage.getItem(MASTER_DELETED_KEY) || '[]');
        return new Set(Array.isArray(arr) ? arr.map(String) : []);
      } catch (e) {
        return new Set();
      }
    }

    const deletedTombstones = readDeletedTombstones();

    function saveDeletedTombstones() {
      try {
        localStorage.setItem(MASTER_DELETED_KEY, JSON.stringify(Array.from(deletedTombstones)));
      } catch (e) {}
    }

    function readLocalCatalogCache() {
      try {
        const arr = JSON.parse(localStorage.getItem(MASTER_CATALOG_KEY) || '[]');
        if (!Array.isArray(arr)) return [];
        return arr.filter(it => it && it.id && !deletedTombstones.has(String(it.id)));
      } catch (e) {
        return [];
      }
    }

    function writeLocalCatalogCache(list) {
      try {
        const clean = (list || []).map(it => {
          const copy = JSON.parse(JSON.stringify(it));
          if (copy.posterUrl && copy.posterUrl.startsWith('blob:')) {
            copy.posterUrl = CINEMA_FALLBACK_PHOTO;
          }
          return copy;
        });
        localStorage.setItem(MASTER_CATALOG_KEY, JSON.stringify(clean));
      } catch (e) {}
    }

    function readWatchProgressMap() {
      try {
        return JSON.parse(localStorage.getItem(WATCH_PROGRESS_KEY) || '{}') || {};
      } catch (e) {
        return {};
      }
    }

    function saveWatchProgress(key, sec) {
      if (!key || !isFinite(sec) || sec < 2) return;
      try {
        const map = readWatchProgressMap();
        map[key] = Math.floor(sec);
        localStorage.setItem(WATCH_PROGRESS_KEY, JSON.stringify(map));
      } catch (e) {}
    }

    function getSavedWatchProgress(key) {
      const map = readWatchProgressMap();
      return Number(map[key]) || 0;
    }

    const state = {
      catalog: readLocalCatalogCache(),
      navTab: 'all',
      langFilter: 'all',
      searchQuery: '',
      player: {
        media: null,
        season: 1,
        episode: 1,
        channels: [],
        activeChannelId: 'sub',
        playbackRate: 1,
        volume: 1,
        lastNonZeroVolume: 1,
        volumePopoverOpen: false,
        isPlaying: false,
        isFullscreen: false,
        blurMode: false,

    async function ensureAuthReady() {
      if (fbAuth.currentUser) return fbAuth.currentUser;
      try {
        const cred = await signInAnonymously(fbAuth);
        return cred.user;
      } catch (e) {
        return null;
      }
    }

    function normalizeItem(raw) {
      if (!raw || typeof raw !== 'object' || !raw.id || !raw.title) return null;
      const id = String(raw.id);
      if (deletedTombstones.has(id) || raw.deleted === true) return null;

      const type = raw.type === 'series' ? 'series' : 'movie';
      const normSrc = (s, idx) => {
        if (!s || typeof s !== 'object') return null;
        return {
          id: s.id || (idx === 1 ? 'dub' : 'sub'),
          label: s.label || (s.defaultMode === 'dub' ? 'TR Dublaj' : 'TR Altyazılı'),
          defaultMode: s.defaultMode || (idx === 1 ? 'dub' : 'sub'),
          url: String(s.url || '').trim(),
          sessionKey: String(s.sessionKey || ''),
          storagePath: String(s.storagePath || '').trim(),
          durationSec: Number(s.durationSec) || 0,
          trimStart: Number(s.trimStart) || 0,
          trimEnd: Number(s.trimEnd) || 0
        };
      };

      const item = {
        id,
        type,
        title: String(raw.title).trim(),
        year: Number(raw.year) || new Date().getFullYear(),
        duration: String(raw.duration || ''),
        durationSec: Number(raw.durationSec) || 0,
        genre: String(raw.genre || (type === 'series' ? 'Dizi' : 'Sinema')),
        seasons: type === 'series' ? Math.max(1, Number(raw.seasons) || 1) : undefined,
        posterUrl: String(raw.posterUrl || CINEMA_FALLBACK_PHOTO),
        posterStoragePath: String(raw.posterStoragePath || ''),
        createdAt: Number(raw.createdAt) || Date.now(),
        updatedAt: Number(raw.updatedAt) || Number(raw.createdAt) || Date.now(),
        sources: [],
        episodes: [],
        hasSub: false,
        hasDub: false
      };

      if (type === 'movie') {
        item.sources = (Array.isArray(raw.sources) ? raw.sources : []).map(normSrc).filter(Boolean);
        item.hasSub = item.sources.some(s => s.defaultMode === 'sub');
        item.hasDub = item.sources.some(s => s.defaultMode === 'dub');
      } else {
        item.episodes = (Array.isArray(raw.episodes) ? raw.episodes : []).map((ep, i) => ({
          season: Math.max(1, Number(ep.season) || 1),
          number: Math.max(1, Number(ep.number) || (i + 1)),
          name: String(ep.name || `${Number(ep.number) || (i + 1)}. Bölüm`),
          duration: String(ep.duration || ''),
          durationSec: Number(ep.durationSec) || 0,
          sources: (Array.isArray(ep.sources) ? ep.sources : []).map(normSrc).filter(Boolean)
        })).sort((a, b) => (a.season - b.season) || (a.number - b.number));
        item.hasSub = item.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'sub'));
        item.hasDub = item.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'dub'));
      }

      return item;
    }

    function applyCloudCatalogMerge(incomingList, authoritativeSet = null) {
      const map = new Map();
      (state.catalog || []).forEach(it => {
        if (!it || !it.id || deletedTombstones.has(it.id)) return;
        if (authoritativeSet && !authoritativeSet.has(it.id) && (Date.now() - (it.createdAt || 0) > 15000)) {
          return;
        }
        map.set(it.id, it);
      });

      (incomingList || []).forEach(raw => {
        if (!raw || !raw.id) return;
        const id = String(raw.id);
        if (raw.deleted === true) {
          deletedTombstones.add(id);
          saveDeletedTombstones();
          map.delete(id);
          return;
        }
        if (deletedTombstones.has(id)) return;
        const norm = normalizeItem(raw);
        if (!norm) return;

        const existing = map.get(id);
        if (!existing) {
          map.set(id, norm);
        } else {
          const merged = { ...existing, ...norm };
          if (norm.type === 'movie') {
            const sMap = new Map();
            (existing.sources || []).forEach(s => sMap.set(s.id, { ...s }));
            (norm.sources || []).forEach(s => {
              const prevS = sMap.get(s.id) || {};
              sMap.set(s.id, {
                ...prevS,
                ...s,
                url: s.url || prevS.url || '',
                storagePath: s.storagePath || prevS.storagePath || '',
                sessionKey: s.sessionKey || prevS.sessionKey || ''
              });
            });
            merged.sources = Array.from(sMap.values());
            merged.hasSub = merged.sources.some(s => s.defaultMode === 'sub');
            merged.hasDub = merged.sources.some(s => s.defaultMode === 'dub');
          } else {
            const epMap = new Map();
            (existing.episodes || []).forEach(e => epMap.set(`${e.season}_${e.number}`, { ...e }));
            (norm.episodes || []).forEach(e => {
              const k = `${e.season}_${e.number}`;
              const prevE = epMap.get(k);
              if (!prevE) {
                epMap.set(k, e);
              } else {
                const esMap = new Map();
                (prevE.sources || []).forEach(s => esMap.set(s.id, { ...s }));
                (e.sources || []).forEach(s => {
                  const ps = esMap.get(s.id) || {};
                  esMap.set(s.id, {
                    ...ps,
                    ...s,
                    url: s.url || ps.url || '',
                    storagePath: s.storagePath || ps.storagePath || '',
                    sessionKey: s.sessionKey || ps.sessionKey || ''
                  });
                });
                epMap.set(k, { ...prevE, ...e, sources: Array.from(esMap.values()) });
              }
            });
            merged.episodes = Array.from(epMap.values()).sort((a, b) => (a.season - b.season) || (a.number - b.number));
            merged.hasSub = merged.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'sub'));
            merged.hasDub = merged.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'dub'));
          }
          if ((!merged.posterUrl || merged.posterUrl === CINEMA_FALLBACK_PHOTO) && existing.posterUrl && existing.posterUrl !== CINEMA_FALLBACK_PHOTO) {
            merged.posterUrl = existing.posterUrl;
          }
          map.set(id, merged);
        }
      });

      state.catalog = Array.from(map.values())
        .filter(it => !deletedTombstones.has(it.id))
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      writeLocalCatalogCache(state.catalog);
      renderMainView();
    }

    async function pushItemToAllClouds(item) {
      if (!item || deletedTombstones.has(item.id)) return;
      item.updatedAt = Date.now();
      const payload = JSON.parse(JSON.stringify(item));
      if (payload.posterUrl && payload.posterUrl.startsWith('blob:')) {
        payload.posterUrl = CINEMA_FALLBACK_PHOTO;
      }

      try {
        await fetch(`${firebaseConfig.databaseURL}/${RTDB_NODE}/${encodeURIComponent(payload.id)}.json`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (e) {}

      try {
        await ensureAuthReady();
        await setDoc(doc(fbDb, FIRESTORE_COLLECTION, payload.id), payload);
      } catch (e) {}
    }

    async function deleteItemFromAllClouds(item) {
      if (!item || !item.id) return;
      const id = String(item.id);
      deletedTombstones.add(id);
      saveDeletedTombstones();

      state.catalog = state.catalog.filter(m => m.id !== id);
      writeLocalCatalogCache(state.catalog);
      renderMainView();

      fetch(`${firebaseConfig.databaseURL}/${RTDB_NODE}/${encodeURIComponent(id)}.json`, {
        method: 'DELETE'
      }).catch(() => {});

      try {
        await ensureAuthReady();
        await deleteDoc(doc(fbDb, FIRESTORE_COLLECTION, id));
        const paths = [];
        if (item.posterStoragePath) paths.push(item.posterStoragePath);
        (item.sources || []).forEach(s => { if (s.storagePath) paths.push(s.storagePath); });
        (item.episodes || []).forEach(ep => (ep.sources || []).forEach(s => { if (s.storagePath) paths.push(s.storagePath); }));
        for (const p of paths) {
          deleteObject(storageRef(fbStorage, p)).catch(() => {});
        }
      } catch (e) {}
    }

    async function syncAllFromCloudNow(showFeedback = false) {
      let mergedAny = false;
      try {
        const rtdbResp = await fetch(`${firebaseConfig.databaseURL}/${RTDB_NODE}.json`, { cache: 'no-store' });
        if (rtdbResp.ok) {
          const data = await rtdbResp.json();
          if (data && typeof data === 'object') {
            const items = Object.values(data).filter(Boolean);
            const authIds = new Set(items.map(i => String(i.id)));
            applyCloudCatalogMerge(items, authIds);
            mergedAny = true;
          } else if (data === null && state.catalog.length > 0) {
            state.catalog = state.catalog.filter(it => (Date.now() - (it.createdAt || 0)) < 15000);
            writeLocalCatalogCache(state.catalog);
            renderMainView();
          }
        }
      } catch (e) {}

      try {
        await ensureAuthReady();
        const snap = await getDocs(collection(fbDb, FIRESTORE_COLLECTION));
        const docs = [];
        snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
        if (docs.length > 0) {
          applyCloudCatalogMerge(docs);
          mergedAny = true;
        }
      } catch (e) {}

      if (showFeedback) {
        showToast(mergedAny ? 'Bulut arşivi güncellendi.' : 'Bulut bağlantısı güncel.', 'success');
      }
    }

    function startRealtimeCloudListener() {
      setInterval(() => {
        if (activeUploadsCount === 0) {
          syncAllFromCloudNow(false);
        }
      }, 4500);

      ensureAuthReady().then(() => {
        onSnapshot(collection(fbDb, FIRESTORE_COLLECTION), (snap) => {
          const docs = [];
          snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
          if (docs.length > 0) {
            applyCloudCatalogMerge(docs);
          }
        }, () => {});
      }).catch(() => {});
    }

    /* =====================================================================
       3. MULTI-ENGINE FAST CLOUD UPLOADER (TMPFILES + LITTERBOX + FIREBASE)
    ===================================================================== */
    function setUploadBanner(show, text = '', pct = 0) {
      const banner = document.getElementById('background-sync-banner');
      const txt = document.getElementById('background-sync-text');
      const pctEl = document.getElementById('background-sync-pct');
      const barEl = document.getElementById('background-sync-bar');
      if (!banner) return;
      if (!show) {
        banner.classList.add('hidden');
        return;
      }
      banner.classList.remove('hidden');
      if (txt) txt.textContent = text;
      if (pctEl) pctEl.textContent = `%${pct}`;
      if (barEl) barEl.style.width = `${Math.max(2, Math.min(100, pct))}%`;
    }

    function cancelActiveCloudSync() {
      cloudUploadCancelFlag = true;
      if (activeFbTask) {
        try { activeFbTask.cancel(); } catch (e) {}
        activeFbTask = null;
      }
      if (activeXhrUpload) {
        try { activeXhrUpload.abort(); } catch (e) {}
        activeXhrUpload = null;
      }
      activeUploadsCount = 0;
      setUploadBanner(false);
      showToast('Bulut aktarımı iptal edildi.', 'info');
    }

    // Engine 1: Tmpfiles.org CORS-enabled direct upload -> converts to /dl/ direct streamable MP4 URL
    function uploadViaTmpfiles(file, onProgress) {
      return new Promise((resolve, reject) => {
        const formData = new FormData();
        formData.append('file', file, file.name || 'video.mp4');

        const xhr = new XMLHttpRequest();
        activeXhrUpload = xhr;
        xhr.open('POST', 'https://tmpfiles.org/api/v1/upload', true);

        xhr.upload.onprogress = (ev) => {
          if (cloudUploadCancelFlag) { try { xhr.abort(); } catch (e) {} return; }
          if (ev.lengthComputable && ev.total > 0) onProgress(ev.loaded, ev.total);
        };

        xhr.onload = () => {
          activeXhrUpload = null;
          try {
            const json = JSON.parse(xhr.responseText || '{}');
            const rawUrl = json?.data?.url || '';
            if (xhr.status >= 200 && xhr.status < 300 && rawUrl) {
              const directUrl = rawUrl.replace(/^http:\/\//i, 'https://').replace('tmpfiles.org/', 'tmpfiles.org/dl/');
              resolve({ downloadUrl: directUrl, storagePath: '' });
            } else {
              reject(new Error('Tmpfiles geçersiz yanıt'));
            }
          } catch (e) {
            reject(e);
          }
        };

        xhr.onerror = () => { activeXhrUpload = null; reject(new Error('Tmpfiles ağ hatası')); };
        xhr.onabort = () => { activeXhrUpload = null; reject(new Error('İptal edildi')); };
        xhr.send(formData);
      });
    }

    // Engine 2: Litterbox 72-hour fast file host
    function uploadViaLitterbox(file, onProgress) {
      return new Promise((resolve, reject) => {
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('time', '72h');
        formData.append('fileToUpload', file, file.name || 'video.mp4');

        const xhr = new XMLHttpRequest();
        activeXhrUpload = xhr;
        xhr.open('POST', 'https://litterbox.catbox.moe/resources/internals/api.php', true);

        xhr.upload.onprogress = (ev) => {
          if (cloudUploadCancelFlag) { try { xhr.abort(); } catch (e) {} return; }
          if (ev.lengthComputable && ev.total > 0) onProgress(ev.loaded, ev.total);
        };

        xhr.onload = () => {
          activeXhrUpload = null;
          const url = (xhr.responseText || '').trim();
          if (xhr.status >= 200 && xhr.status < 300 && /^https?:\/\//i.test(url)) {
            resolve({ downloadUrl: url, storagePath: '' });
          } else {
            reject(new Error('Litterbox geçersiz yanıt'));
          }
        };

        xhr.onerror = () => { activeXhrUpload = null; reject(new Error('Litterbox ağ hatası')); };
        xhr.onabort = () => { activeXhrUpload = null; reject(new Error('İptal edildi')); };
        xhr.send(formData);
      });
    }

    // Engine 3: Firebase Storage with fast 4-second rules check
    function uploadFileViaFirebaseStorage(file, onProgress) {
      return new Promise(async (resolve, reject) => {
        try {
          await ensureAuthReady();
          const safeName = (file.name || 'video.mp4').replace(/[^a-zA-Z0-9._-]/g, '_');
          const path = `birperde_media/${Date.now()}_${Math.random().toString(36).slice(2, 6)}_${safeName}`;
          const ref = storageRef(fbStorage, path);
          const task = uploadBytesResumable(ref, file, { contentType: file.type || 'video/mp4' });
          activeFbTask = task;

          let started = false;
          const stallTimer = setTimeout(() => {
            if (!started) {
              try { task.cancel(); } catch (e) {}
              reject(new Error('Firebase Rules kapalı'));
            }
          }, 4500);

          task.on(
            'state_changed',
            (snap) => {
              if (snap.bytesTransferred > 0) {
                started = true;
                clearTimeout(stallTimer);
              }
              if (cloudUploadCancelFlag) { try { task.cancel(); } catch (e) {} return; }
              if (snap.totalBytes > 0) onProgress(snap.bytesTransferred, snap.totalBytes);
            },
            (err) => { clearTimeout(stallTimer); activeFbTask = null; reject(err); },
            async () => {
              clearTimeout(stallTimer);
              activeFbTask = null;
              try {
                const downloadUrl = await getDownloadURL(task.snapshot.ref);
                resolve({ downloadUrl, storagePath: path });
              } catch (e) { reject(e); }
            }
          );
        } catch (err) { reject(err); }
      });
    }

    async function uploadMediaFilesToCloud(itemId, tasks) {
      if (!tasks || tasks.length === 0) return;
      cloudUploadCancelFlag = false;
      activeUploadsCount++;

      try {
        for (const task of tasks) {
          if (cloudUploadCancelFlag) break;
          const totalMb = (task.file.size / 1048576).toFixed(1);
          setUploadBanner(true, `Buluta aktarılıyor: ${task.title} (${task.label}) • 0.0 / ${totalMb} MB`, 2);

          const onProgress = (sent, total) => {
            const pct = Math.round((sent / total) * 100);
            const sentMb = (sent / 1048576).toFixed(1);
            setUploadBanner(true, `Karşı cihaza aktarılıyor: ${task.title} (${task.label}) • ${sentMb} / ${totalMb} MB`, pct);
          };

          let result = null;
          const engines = [
            () => uploadViaTmpfiles(task.file, onProgress),
            () => uploadFileViaFirebaseStorage(task.file, onProgress),
            () => uploadViaLitterbox(task.file, onProgress)
          ];

          for (const runEngine of engines) {
            if (cloudUploadCancelFlag || result) break;
            try {
              result = await runEngine();
            } catch (e) {}
          }

          if (!result && !cloudUploadCancelFlag) {
            showToast(`"${task.title}" buluta yüklenemedi. "Hızlı Aktar" butonuyla doğrudan karşı cihaza gönderebilirsiniz.`, 'error');
          }

          if (result && result.downloadUrl) {
            const target = state.catalog.find(m => m.id === itemId);
            if (target) {
              if (task.kind === 'poster') {
                target.posterUrl = result.downloadUrl;
                target.posterStoragePath = result.storagePath || '';
              } else if (task.kind === 'movie_source') {
                const srcObj = (target.sources || []).find(s => s.id === task.sourceId);
                if (srcObj) {
                  srcObj.url = result.downloadUrl;
                  srcObj.storagePath = result.storagePath || '';
                }
              } else if (task.kind === 'episode_source') {
                const ep = (target.episodes || []).find(e => Number(e.season) === Number(task.season) && Number(e.number) === Number(task.episode));
                const srcObj = ep && (ep.sources || []).find(s => s.id === task.sourceId);
                if (srcObj) {
                  srcObj.url = result.downloadUrl;
                  srcObj.storagePath = result.storagePath || '';
                }
              }
              writeLocalCatalogCache(state.catalog);
              renderMainView();
              await pushItemToAllClouds(target);
              if (task.kind !== 'poster') {
                showToast(`"${task.title}" (${task.label}) buluta yüklendi! Tüm cihazlarda izlenebilir.`, 'success');
              }
            }
          }
        }
      } finally {
        activeUploadsCount = Math.max(0, activeUploadsCount - 1);
        if (activeUploadsCount === 0) setUploadBanner(false);
      }
    }

    async function startP2pSender() {
      const itemId = document.getElementById('p2p-send-select')?.value;
      const item = state.catalog.find(m => m.id === itemId);
      const statusEl = document.getElementById('p2p-sender-status');
      if (!item) {
        showToast('Önce cihazınızdan bir video ekleyin.', 'error');
        return;
      }
      const srcs = item.type === 'movie' ? (item.sources || []) : (item.episodes || []).flatMap(e => e.sources || []);
      const srcWithFile = srcs.find(s => s.sessionKey && LOCAL_SESSION_FILES.has(s.sessionKey));
      const file = srcWithFile && LOCAL_SESSION_FILES.get(srcWithFile.sessionKey);
      if (!file) {
        showToast('Video dosyası bellekte bulunamadı.', 'error');
        return;
      }

      const code = String(Math.floor(100000 + Math.random() * 900000));
      const roomUrl = `${firebaseConfig.databaseURL}/birperde_p2p/${code}.json`;
      if (statusEl) statusEl.innerHTML = `Kodunuz: <span class="px-2 py-0.5 rounded bg-bpNavy text-bpYellow font-mono text-sm">${code}</span><br/>Karşı cihazın bağlanması bekleniyor...`;

      if (activeP2pPeer) { try { activeP2pPeer.close(); } catch (e) {} }
      const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      activeP2pPeer = pc;
      const dc = pc.createDataChannel('videoFile', { ordered: true });
      dc.binaryType = 'arraybuffer';

      const candidates = [];
      pc.onicecandidate = (e) => { if (e.candidate) candidates.push(e.candidate); };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await new Promise(r => setTimeout(r, 900));

      await fetch(roomUrl, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          offer: pc.localDescription,
          offerCandidates: candidates,
          meta: { itemId: item.id, title: item.title, fileName: file.name, fileSize: file.size, fileType: file.type || 'video/mp4' }
        })
      });

      dc.onopen = async () => {
        if (statusEl) statusEl.textContent = `Bağlandı! "${file.name}" gönderiliyor...`;
        const chunkSize = 65536;
        let offset = 0;
        while (offset < file.size) {
          if (dc.bufferedAmount > 4 * 1024 * 1024) {
            await new Promise(r => setTimeout(r, 25));
            continue;
          }
          const slice = file.slice(offset, offset + chunkSize);
          const buf = await slice.arrayBuffer();
          dc.send(buf);
          offset += buf.byteLength;
          const pct = Math.round((offset / file.size) * 100);
          if (statusEl) statusEl.textContent = `Aktarılıyor: %${pct}`;
        }
        dc.send(JSON.stringify({ done: true }));
        if (statusEl) statusEl.textContent = 'Aktarım tamamlandı!';
        showToast('Video karşı cihaza başarıyla aktarıldı!', 'success');
      };

      const pollAnswer = setInterval(async () => {
        try {
          const r = await fetch(roomUrl, { cache: 'no-store' });
          const d = await r.json();
          if (d && d.answer && !pc.currentRemoteDescription) {
            clearInterval(pollAnswer);
            await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
            (d.answerCandidates || []).forEach(c => pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}));
          }
        } catch (e) {}
      }, 1500);
    }

    async function startP2pReceiver() {
      const code = (document.getElementById('p2p-room-input')?.value || '').trim();
      const statusEl = document.getElementById('p2p-receiver-status');
      if (code.length !== 6) {
        showToast('6 haneli kodu girin.', 'error');
        return;
      }

      const roomUrl = `${firebaseConfig.databaseURL}/birperde_p2p/${code}.json`;
      const resp = await fetch(roomUrl, { cache: 'no-store' });
      const data = await resp.json();
      if (!data || !data.offer) {
        showToast('Bu koda ait aktif bir gönderim bulunamadı.', 'error');
        return;
      }

      if (statusEl) statusEl.textContent = `Bağlanıyor: ${data.meta?.title || 'Video'}...`;
      if (activeP2pPeer) { try { activeP2pPeer.close(); } catch (e) {} }
      const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      activeP2pPeer = pc;
      const ansCandidates = [];
      pc.onicecandidate = (e) => { if (e.candidate) ansCandidates.push(e.candidate); };

      const chunks = [];
      let receivedBytes = 0;
      const totalBytes = Number(data.meta?.fileSize) || 1;

      pc.ondatachannel = (ev) => {
        const dc = ev.channel;
        dc.binaryType = 'arraybuffer';
        dc.onmessage = (msg) => {
          if (typeof msg.data === 'string') {
            const parsed = JSON.parse(msg.data);
            if (parsed.done) {
              const blob = new Blob(chunks, { type: data.meta?.fileType || 'video/mp4' });
              const sk = 'p2p_' + Date.now();
              const blobUrl = URL.createObjectURL(blob);
              LOCAL_SESSION_BLOBS.set(sk, blobUrl);
              LOCAL_SESSION_FILES.set(sk, new File([blob], data.meta?.fileName || 'video.mp4', { type: blob.type }));

              let target = state.catalog.find(m => m.id === data.meta?.itemId);
              if (!target) {
                target = {
                  id: data.meta?.itemId || ('mov-' + Date.now()),
                  type: 'movie',
                  title: data.meta?.title || 'Aktarılan Video',
                  year: new Date().getFullYear(),
                  genre: 'Sinema',
                  duration: '',
                  hasSub: true,
                  hasDub: false,
                  posterUrl: CINEMA_FALLBACK_PHOTO,
                  sources: [{ id: 'sub', label: 'TR Altyazılı', defaultMode: 'sub', url: '', sessionKey: sk, storagePath: '', trimStart: 0, trimEnd: 0 }],
                  createdAt: Date.now()
                };
                state.catalog.unshift(target);
              } else {
                const firstSrc = target.type === 'movie' ? target.sources?.[0] : target.episodes?.[0]?.sources?.[0];
                if (firstSrc) firstSrc.sessionKey = sk;
              }
              writeLocalCatalogCache(state.catalog);
              renderMainView();
              closeModal();
              openPlayer(target.id);
              showToast('Video alındı ve açıldı!', 'success');
              fetch(roomUrl, { method: 'DELETE' }).catch(() => {});
            }
            return;
          }
          chunks.push(msg.data);
          receivedBytes += msg.data.byteLength;
          const pct = Math.min(100, Math.round((receivedBytes / totalBytes) * 100));
          if (statusEl) statusEl.textContent = `İndiriliyor: %${pct}`;
        };
      };

      await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
      (data.offerCandidates || []).forEach(c => pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {}));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await new Promise(r => setTimeout(r, 900));

      await fetch(roomUrl, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answer: pc.localDescription, answerCandidates: ansCandidates })
      });
    }

    async function resolvePlayableVideoUrl(source) {
      if (!source) return { url: '', status: 'none' };
      if (source.sessionKey && LOCAL_SESSION_BLOBS.has(source.sessionKey)) {
        return { url: LOCAL_SESSION_BLOBS.get(source.sessionKey), status: 'local_session' };
      }
      if (source.url && /^https?:\/\//i.test(source.url)) {
        return { url: source.url, status: 'cloud_ready' };
      }
      if (source.storagePath) {
        try {
          await ensureAuthReady();
          const dl = await getDownloadURL(storageRef(fbStorage, source.storagePath));
          if (dl) {
            source.url = dl;
            return { url: dl, status: 'cloud_ready' };
          }
        } catch (e) {}
      }
      return { url: '', status: 'not_uploaded_yet' };
    }

    /* =====================================================================
       4. VIDEO FRAME SNAPSHOT EXTRACTOR (AUTO RANDOM + MANUAL SCRUBBER)
    ===================================================================== */
    let activeFrameVideoUrl = '';

    function captureFrameFromVideoFile(fileOrUrl, targetRatio = null) {
      return new Promise((resolve) => {
        let rev = '';
        let src = '';
        if (fileOrUrl instanceof File || fileOrUrl instanceof Blob) {
          rev = URL.createObjectURL(fileOrUrl);
          src = rev;
        } else if (typeof fileOrUrl === 'string') {
          src = fileOrUrl.trim();
        }
        if (!src) return resolve(null);

        const v = document.createElement('video');
        v.muted = true;
        v.playsInline = true;
        v.preload = 'auto';
        v.crossOrigin = 'anonymous';
        v.src = src;

        let done = false;
        const cleanup = (res) => {
          if (done) return;
          done = true;
          try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
          if (rev) setTimeout(() => { try { URL.revokeObjectURL(rev); } catch (e) {} }, 300);
          resolve(res);
        };

        const timer = setTimeout(() => cleanup(null), 5000);

        v.onloadedmetadata = () => {
          const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 10;
          const ratio = targetRatio !== null ? targetRatio : (0.18 + Math.random() * 0.64);
          const seekTo = Math.max(0.5, Math.min(dur - 0.5, dur * ratio));
          try {
            v.currentTime = seekTo;
          } catch (e) {
            clearTimeout(timer);
            cleanup(null);
          }
        };

        v.onseeked = () => {
          clearTimeout(timer);
          try {
            const vw = v.videoWidth || 640;
            const vh = v.videoHeight || 360;
            const maxW = 640;
            const scale = Math.min(1, maxW / vw);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(vw * scale);
            canvas.height = Math.round(vh * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
            canvas.toBlob((blob) => {
              if (!blob) return cleanup(null);
              const posterFile = new File([blob], `kapak_${Date.now()}.jpg`, { type: 'image/jpeg' });
              const previewUrl = URL.createObjectURL(blob);
              cleanup({ file: posterFile, previewUrl, durationSec: v.duration || 0 });
            }, 'image/jpeg', 0.86);
          } catch (e) {
            cleanup(null);
          }
        };

        v.onerror = () => {
          clearTimeout(timer);
          cleanup(null);
        };
      });
    }

    async function scrubFrameForCover(ratioPct) {
      const anyVideoFile = PENDING_FILES.get('movie_sub') || PENDING_FILES.get('movie_dub') ||

    /* =====================================================================
       5. DURATION & LIVE AUTOCOMPLETE SUGGESTIONS (CLICKABLE, NO AUTO-OVERWRITE)
    ===================================================================== */
    function formatDurationFromSeconds(sec) {
      const s = Math.max(0, Math.round(Number(sec) || 0));
      if (!s) return '';
      const mins = Math.max(1, Math.round(s / 60));
      if (mins >= 60) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return m > 0 ? `${h} sa ${m} dk` : `${h} sa`;
      }
      return `${mins} dk`;
    }

    function formatPreciseTime(sec) {
      const val = Math.max(0, Number(sec) || 0);
      const mins = Math.floor(val / 60);
      const secs = Math.floor(val % 60);
      const tenths = Math.floor((val * 10) % 10);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${tenths}`;
    }

    function readVideoMetadataQuick(fileOrUrl) {
      return new Promise((resolve) => {
        let rev = '';
        let src = '';
        if (fileOrUrl instanceof File || fileOrUrl instanceof Blob) {
          rev = URL.createObjectURL(fileOrUrl);
          src = rev;
        } else if (typeof fileOrUrl === 'string') {
          src = fileOrUrl.trim();
        }
        if (!src) return resolve({ durationSec: 0, durationLabel: '' });

        const v = document.createElement('video');
        v.preload = 'metadata';
        v.muted = true;
        v.src = src;

        let done = false;
        const end = (res) => {
          if (done) return;
          done = true;
          try { v.removeAttribute('src'); v.load(); } catch (e) {}
          if (rev) setTimeout(() => { try { URL.revokeObjectURL(rev); } catch (e) {} }, 200);
          resolve(res);
        };

        const t = setTimeout(() => end({ durationSec: 0, durationLabel: '' }), 2500);
        v.onloadedmetadata = () => {
          clearTimeout(t);
          const d = isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
          end({ durationSec: d, durationLabel: d > 0 ? formatDurationFromSeconds(d) : '' });
        };
        v.onerror = () => { clearTimeout(t); end({ durationSec: 0, durationLabel: '' }); };
      });
    }

    function parseFilenameTitleYear(filename) {
      if (!filename) return { title: '', year: null };
      let base = filename.replace(/\.[^/.]+$/, '');
      const yMatch = base.match(/\b(19\d{2}|20\d{2})\b/);
      const year = yMatch ? Number(yMatch[1]) : null;
      if (yMatch) base = base.slice(0, yMatch.index);
      base = base
        .replace(/\(.*?\)|\[.*?\]/g, ' ')
        .replace(/\b(1080p|720p|480p|2160p|4k|bluray|web-dl|webrip|hdrip|x264|x265|hevc|tr|dublaj|altyazili|altyazı)\b/gi, ' ')
        .replace(/[._-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return { title: base, year };
    }

    async function searchOnlineMetadata(query, mediaType = 'movie') {
      const clean = (query || '').replace(/\b(19\d{2}|20\d{2})\b/g, '').trim();
      if (clean.length < 2) return [];
      const out = [];
      const seen = new Set();

      // 1. iTunes Search API
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(clean)}&country=tr&media=${mediaType === 'series' ? 'tvShow' : 'movie'}&limit=8`);
        const data = await res.json();
        (data.results || []).forEach(it => {
          const title = it.trackName || it.collectionName || '';
          if (!title) return;
          const yMatch = String(it.releaseDate || '').match(/\b(19\d{2}|20\d{2})\b/);
          const yr = yMatch ? Number(yMatch[1]) : new Date().getFullYear();
          const key = `${title.toLowerCase()}_${yr}`;
          if (seen.has(key)) return;
          seen.add(key);
          out.push({
            title,
            year: yr,
            genre: it.primaryGenreName || (mediaType === 'series' ? 'Dizi' : 'Sinema'),
            posterUrl: it.artworkUrl100 ? it.artworkUrl100.replace(/100x100bb\.(jpg|png)/i, '600x600bb.$1') : '',
            duration: it.trackTimeMillis ? formatDurationFromSeconds(it.trackTimeMillis / 1000) : ''
          });
        });
      } catch (e) {}

      // 2. TVMaze API for TV series
      if (mediaType === 'series' && out.length < 6) {
        try {
          const res2 = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(clean)}`);
          const list2 = await res2.json();
          (list2 || []).slice(0, 6).forEach(entry => {
            const sh = entry.show;
            if (!sh || !sh.name) return;
            const yr = sh.premiered ? Number(sh.premiered.slice(0, 4)) : new Date().getFullYear();
            const key = `${sh.name.toLowerCase()}_${yr}`;
            if (seen.has(key)) return;
            seen.add(key);
            out.push({
              title: sh.name,
              year: yr,
              genre: (sh.genres && sh.genres[0]) || 'Dizi',
              posterUrl: (sh.image && (sh.image.original || sh.image.medium)) || '',
              duration: sh.runtime ? `${sh.runtime} dk` : ''
            });
          });
        } catch (e) {}
      }

      return out.slice(0, 8);
    }

    async function handleTitleSearchBtn(inputId, mediaType) {
      const q = document.getElementById(inputId)?.value?.trim() || '';
      if (!q) return;
      foundCandidates = await searchOnlineMetadata(q, mediaType);
      const box = document.getElementById('draft-candidates-box');
      if (!box) return;
      if (foundCandidates.length === 0) {
        box.classList.add('hidden');
        showToast('Sonuç bulunamadı, kendi bilgilerinizle devam edebilirsiniz.', 'info');
        return;
      }
      box.classList.remove('hidden');
      box.innerHTML = foundCandidates.map((c, idx) => `
        <button type="button" onclick="pickCandidate(${idx}, '${escapeAttr(inputId)}')" class="w-full p-2 flex items-center gap-2.5 text-left hover:bg-bpSky border-b border-slate-100 last:border-0 cursor-pointer">

    function pickCandidate(idx, inputId) {
      const c = foundCandidates[idx];
      if (!c) return;
      const inp = document.getElementById(inputId);
      if (inp) inp.value = c.title;
      formDraft.year = c.year;
      formDraft.genre = c.genre;
      if (c.posterUrl) formDraft.posterUrl = c.posterUrl;
      if (c.duration && !formDraft.durationSec) formDraft.duration = c.duration;

      const yEl = document.getElementById('draft-year-input');
      const gEl = document.getElementById('draft-genre-input');
      const pEl = document.getElementById('draft-poster-url-input');
      const dEl = document.getElementById('draft-duration-input');
      const img = document.getElementById('draft-poster-preview');
      if (yEl) yEl.value = c.year;
      if (gEl) gEl.value = c.genre;
      if (pEl && c.posterUrl) pEl.value = c.posterUrl;
      if (dEl && c.duration) dEl.value = c.duration;
      if (img && c.posterUrl && !PENDING_FILES.has('poster')) img.src = c.posterUrl;

      document.getElementById('draft-candidates-box')?.classList.add('hidden');
    }

    async function onVideoFilePicked(inputEl, slotKey, badgeId, titleInputId) {
      const file = inputEl?.files?.[0];
      const badge = document.getElementById(badgeId);
      if (!file) return;
      PENDING_FILES.set(slotKey, file);

      if (badge) {
        badge.textContent = `${file.name} (${(file.size / 1048576).toFixed(1)} MB)`;
        badge.classList.remove('hidden');
      }

      const parsed = parseFilenameTitleYear(file.name);
      if (titleInputId) {
        const tEl = document.getElementById(titleInputId);
        if (tEl && !tEl.value.trim() && parsed.title) {
          tEl.value = parsed.title;
          onTitleTypingAutocomplete(titleInputId, activeAddTab === 'series' ? 'series' : 'movie');
        }
      }
      if (parsed.year) {
        formDraft.year = parsed.year;
        const yEl = document.getElementById('draft-year-input');
        if (yEl) yEl.value = parsed.year;
      }

      const meta = await readVideoMetadataQuick(file);
      if (meta.durationSec > 0) {
        formDraft.durationSec = meta.durationSec;
        formDraft.duration = meta.durationLabel;
        const dEl = document.getElementById('draft-duration-input');
        if (dEl) dEl.value = meta.durationLabel;
      }

      if (!PENDING_FILES.has('poster') && !formDraft.posterUrl) {
        const snap = await captureFrameFromVideoFile(file, null);
        if (snap) {
          PENDING_FILES.set('poster', snap.file);
          const img = document.getElementById('draft-poster-preview') || document.getElementById('edit-poster-img');
          if (img) img.src = snap.previewUrl;
        }
      }
      document.getElementById('video-frame-cover-tools')?.classList.remove('hidden');
    }

    function collectVideoSourcesAndTasks(prefix, title, season = null, episode = null) {
      const subFile = PENDING_FILES.get(`${prefix}_sub`) || document.getElementById(`${prefix}-sub-file`)?.files?.[0];
      const dubFile = PENDING_FILES.get(`${prefix}_dub`) || document.getElementById(`${prefix}-dub-file`)?.files?.[0];
      const subUrl = document.getElementById(`${prefix}-sub-url`)?.value?.trim() || '';
      const dubUrl = document.getElementById(`${prefix}-dub-url`)?.value?.trim() || '';

      const sources = [];
      const tasks = [];

      if (subFile) {
        const sk = 'sess_' + Date.now() + '_sub';
        LOCAL_SESSION_BLOBS.set(sk, URL.createObjectURL(subFile));
        LOCAL_SESSION_FILES.set(sk, subFile);
        sources.push({
          id: 'sub',
          label: 'TR Altyazılı',
          defaultMode: 'sub',
          url: '',
          sessionKey: sk,
          storagePath: '',
          durationSec: formDraft.durationSec || 0,
          trimStart: 0,
          trimEnd: formDraft.durationSec || 0
        });
        tasks.push({
          kind: season !== null ? 'episode_source' : 'movie_source',
          sourceId: 'sub',
          season,
          episode,
          title,
          label: 'TR Altyazılı',
          file: subFile
        });
      } else if (subUrl) {
        sources.push({
          id: 'sub',
          label: 'TR Altyazılı',
          defaultMode: 'sub',
          url: subUrl,
          sessionKey: '',
          storagePath: '',
          durationSec: formDraft.durationSec || 0,
          trimStart: 0,
          trimEnd: formDraft.durationSec || 0
        });
      }

      if (dubFile) {
        const sk = 'sess_' + Date.now() + '_dub';
        LOCAL_SESSION_BLOBS.set(sk, URL.createObjectURL(dubFile));
        LOCAL_SESSION_FILES.set(sk, dubFile);
        sources.push({
          id: 'dub',
          label: 'TR Dublaj',
          defaultMode: 'dub',
          url: '',
          sessionKey: sk,
          storagePath: '',
          durationSec: formDraft.durationSec || 0,
          trimStart: 0,
          trimEnd: formDraft.durationSec || 0
        });
        tasks.push({
          kind: season !== null ? 'episode_source' : 'movie_source',
          sourceId: 'dub',
          season,
          episode,
          title,
          label: 'TR Dublaj',
          file: dubFile
        });
      } else if (dubUrl) {
        sources.push({
          id: 'dub',
          label: 'TR Dublaj',
          defaultMode: 'dub',
          url: dubUrl,
          sessionKey: '',
          storagePath: '',
          durationSec: formDraft.durationSec || 0,
          trimStart: 0,
          trimEnd: formDraft.durationSec || 0
        });
      }

      return { sources, tasks };
    }

    async function submitNewMovie(e) {
      e.preventDefault();
      const title = document.getElementById('add-movie-title').value.trim();
      if (!title) return;

      const { sources, tasks } = collectVideoSourcesAndTasks('movie', title);
      if (sources.length === 0) {
        showToast('Lütfen video dosyası seçin veya URL girin.', 'error');
        return;
      }

      const year = Number(document.getElementById('draft-year-input')?.value) || new Date().getFullYear();
      const genre = document.getElementById('draft-genre-input')?.value?.trim() || 'Sinema';
      const duration = document.getElementById('draft-duration-input')?.value?.trim() || formDraft.duration || '';
      const posterFile = PENDING_FILES.get('poster') || document.getElementById('draft-poster-file')?.files?.[0];
      const posterUrlInp = document.getElementById('draft-poster-url-input')?.value?.trim() || '';

      let posterUrl = posterUrlInp || formDraft.posterUrl || CINEMA_FALLBACK_PHOTO;
      if (posterFile) {
        posterUrl = URL.createObjectURL(posterFile);
        tasks.unshift({ kind: 'poster', title, label: 'Kapak', file: posterFile });
      }

      const id = 'mov-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      const movie = {
        id,
        type: 'movie',
        title,
        year,
        genre,

        posterUrl,
        posterStoragePath: '',

    async function submitNewEpisode(e) {
      e.preventDefault();
      const seriesId = document.getElementById('add-ep-series').value;
      const season = Math.max(1, Number(document.getElementById('add-ep-season').value) || 1);
      const number = Math.max(1, Number(document.getElementById('add-ep-number').value) || 1);
      const name = document.getElementById('add-ep-name').value.trim() || `${number}. Bölüm`;

      const series = state.catalog.find(s => s.id === seriesId);
      if (!series) return;

      const { sources, tasks } = collectVideoSourcesAndTasks('ep', series.title, season, number);
      if (sources.length === 0) {
        showToast('Lütfen video seçin veya URL girin.', 'error');
        return;
      }

      if (!Array.isArray(series.episodes)) series.episodes = [];
      const idx = series.episodes.findIndex(ep => Number(ep.season) === season && Number(ep.number) === number);
      const epObj = { season, number, name, duration: formDraft.duration || '', durationSec: formDraft.durationSec || 0, sources };
      if (idx >= 0) series.episodes[idx] = epObj;
      else series.episodes.push(epObj);

      series.episodes.sort((a, b) => (a.season - b.season) || (a.number - b.number));
      series.seasons = Math.max(...series.episodes.map(ep => ep.season));
      series.hasSub = series.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'sub'));
      series.hasDub = series.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'dub'));

      writeLocalCatalogCache(state.catalog);
      renderMainView();
      closeModal();
      showToast(`${series.title} — S${season} B${number} eklendi.`, 'success');

      await pushItemToAllClouds(series);
      if (tasks.length > 0) uploadMediaFilesToCloud(series.id, tasks);
    }

    let trimCtx = { itemId: '', season: null, episode: null, sourceId: 'sub', durationSec: 120, trimStart: 0, trimEnd: 120 };

    async function openVideoTrimModal(itemId, season = null, episode = null, sourceId = null) {
      const item = state.catalog.find(m => m.id === itemId);
      if (!item) return;
      const srcs = item.type === 'movie'
        ? (item.sources || [])
        : ((item.episodes || []).find(e => Number(e.season) === Number(season) && Number(e.number) === Number(episode)) || (item.episodes || [])[0])?.sources || [];

      if (srcs.length === 0) {
        showToast('Video kaynağı bulunamadı.', 'error');
        return;
      }

      const chosen = srcs.find(s => s.id === sourceId) || srcs[0];
      const resolved = await resolvePlayableVideoUrl(chosen);
      if (!resolved.url) {
        showToast('Video henüz yüklenmediği için kesilemiyor.', 'error');
        return;
      }

      const meta = await readVideoMetadataQuick(resolved.url);
      const totalDur = meta.durationSec > 0 ? meta.durationSec : (chosen.durationSec || 120);
      trimCtx = {
        itemId: item.id,
        season,
        episode,
        sourceId: chosen.id,
        durationSec: Number(totalDur.toFixed(1)),
        trimStart: Number((chosen.trimStart || 0).toFixed(1)),
        trimEnd: Number((chosen.trimEnd > 0 && chosen.trimEnd <= totalDur ? chosen.trimEnd : totalDur).toFixed(1))
      };

      openModal(`
        <div class="birperde-ribbon"></div>
        <div class="p-4 sm:p-5 space-y-3.5">
          <div class="flex items-center justify-between gap-2">
            <h3 class="text-base font-extrabold text-bpNavy truncate">Videoyu Kes — ${escapeHtml(item.title)}</h3>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-bpRed hover:text-white flex items-center justify-center cursor-pointer">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>

          <div class="relative aspect-video rounded-xl overflow-hidden bg-black">
            <video id="trim-editor-video" src="${escapeAttr(resolved.url)}" playsinline preload="auto" onloadedmetadata="onTrimMeta()" class="w-full h-full object-contain bg-black"></video>
          </div>

          <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
            <div class="flex items-center justify-between text-xs font-bold">
              <span>Başlangıç: <strong id="trim-s-lbl" class="font-mono text-bpEmerald">${formatPreciseTime(trimCtx.trimStart)}</strong></span>
              <span>Bitiş: <strong id="trim-e-lbl" class="font-mono text-bpRed">${formatPreciseTime(trimCtx.trimEnd)}</strong></span>
            </div>
            <input type="range" id="trim-s-rng" min="0" max="${trimCtx.durationSec}" step="0.1" value="${trimCtx.trimStart}" oninput="updateTrimBounds(this.value, null)" class="bp-scrubber w-full" />
            <input type="range" id="trim-e-rng" min="0" max="${trimCtx.durationSec}" step="0.1" value="${trimCtx.trimEnd}" oninput="updateTrimBounds(null, this.value)" class="bp-scrubber w-full" />

            <div class="flex justify-end gap-2 pt-1">
              <button type="button" onclick="saveTrimChanges()" class="px-4 py-2 rounded-xl bg-bpEmerald text-white text-xs font-extrabold cursor-pointer">Kesimi Kaydet</button>
            </div>
          </div>
        </div>
      `);
    }

    function onTrimMeta() {
      const v = document.getElementById('trim-editor-video');
      if (!v || !isFinite(v.duration) || v.duration <= 0) return;
      trimCtx.durationSec = Number(v.duration.toFixed(1));
      if (trimCtx.trimEnd <= 0 || trimCtx.trimEnd > trimCtx.durationSec) trimCtx.trimEnd = trimCtx.durationSec;
      const sR = document.getElementById('trim-s-rng');
      const eR = document.getElementById('trim-e-rng');
      if (sR) { sR.max = trimCtx.durationSec; sR.value = trimCtx.trimStart; }
      if (eR) { eR.max = trimCtx.durationSec; eR.value = trimCtx.trimEnd; }
      v.currentTime = trimCtx.trimStart;
    }

    function updateTrimBounds(sVal, eVal) {
      const v = document.getElementById('trim-editor-video');
      if (sVal !== null) {
        trimCtx.trimStart = Math.max(0, Math.min(trimCtx.trimEnd - 0.5, Number(sVal)));
        if (v) v.currentTime = trimCtx.trimStart;
      }
      if (eVal !== null) {
        trimCtx.trimEnd = Math.min(trimCtx.durationSec, Math.max(trimCtx.trimStart + 0.5, Number(eVal)));
        if (v) v.currentTime = trimCtx.trimEnd;
      }
      const sL = document.getElementById('trim-s-lbl');
      const eL = document.getElementById('trim-e-lbl');
      if (sL) sL.textContent = formatPreciseTime(trimCtx.trimStart);
      if (eL) eL.textContent = formatPreciseTime(trimCtx.trimEnd);
    }

    async function saveTrimChanges() {
      const item = state.catalog.find(m => m.id === trimCtx.itemId);
      if (!item) return;
      const activeSec = Math.max(0.5, trimCtx.trimEnd - trimCtx.trimStart);
      const newDur = formatDurationFromSeconds(activeSec);

      if (item.type === 'movie') {
        const sObj = (item.sources || []).find(s => s.id === trimCtx.sourceId) || item.sources[0];
        if (sObj) { sObj.trimStart = trimCtx.trimStart; sObj.trimEnd = trimCtx.trimEnd; sObj.durationSec = activeSec; }
        item.duration = newDur;
      } else {
        const ep = (item.episodes || []).find(e => Number(e.season) === Number(trimCtx.season) && Number(e.number) === Number(trimCtx.episode)) || item.episodes[0];
        if (ep) {
          const sObj = (ep.sources || []).find(s => s.id === trimCtx.sourceId) || ep.sources[0];
          if (sObj) { sObj.trimStart = trimCtx.trimStart; sObj.trimEnd = trimCtx.trimEnd; sObj.durationSec = activeSec; }
          ep.duration = newDur;
        }
      }
      writeLocalCatalogCache(state.catalog);
      renderMainView();
      closeModal();
      await pushItemToAllClouds(item);
      showToast('Kesim kaydedildi.', 'success');
    }

    function updateFilterButtons() {
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        const tab = btn.getAttribute('data-nav-tab');
        const active = tab === state.navTab;
        const activeMap = { all: 'bg-bpRoyal text-white', movies: 'bg-bpNavy text-white', series: 'bg-bpEmerald text-white' };
        btn.className = active
          ? `nav-tab-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-extrabold transition cursor-pointer ${activeMap[tab]}`
          : 'nav-tab-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-bpBlack border border-slate-200 hover:bg-slate-100 transition cursor-pointer';
      });

      document.querySelectorAll('.lang-filter-btn').forEach(btn => {
        const lang = btn.getAttribute('data-lang-btn');
        btn.className = lang === state.langFilter
          ? 'lang-filter-btn px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-bpNavy text-white transition cursor-pointer'
          : 'lang-filter-btn px-2.5 py-1 rounded-lg text-[11px] font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition cursor-pointer';
      });
    }

      updateFilterButtons();
      renderMainView();
    }

    function switchLangFilter(lang) {
      state.langFilter = lang;
      updateFilterButtons();
      renderMainView();
    }

    function getFilteredItems() {
      const q = state.searchQuery.toLowerCase();
      return (state.catalog || []).filter(item => {
        if (!item || deletedTombstones.has(item.id)) return false;
        if (q && !item.title.toLowerCase().includes(q) && !String(item.year).includes(q) && !(item.genre && item.genre.toLowerCase().includes(q))) {
          return false;
        }
        if (state.langFilter === 'dub' && !item.hasDub) return false;
        if (state.langFilter === 'sub' && !item.hasSub) return false;
        return true;
      });
    }

      const filtered = getFilteredItems();

          </div>
          ${movies.length === 0 ? renderEmptyBox('movie') : `<div class="catalog-responsive-grid">${movies.map(renderCard).join('')}</div>`}
