  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      deleteDoc,
      onSnapshot,
      collection
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import {
      getStorage,
      ref as storageRef,
      uploadBytesResumable,
      getDownloadURL,
      deleteObject
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

    /* =========================================================================
       1. FIREBASE YAPILANDIRMASI (BİRPERDETR)
    ========================================================================= */
    const firebaseConfig = {
      apiKey: "AIzaSyB1eT555N2stbzj6x6zkmxHKtMolvCJmeY",
      authDomain: "birperdetr.firebaseapp.com",
      databaseURL: "https://birperdetr-default-rtdb.firebaseio.com",
      projectId: "birperdetr",
      storageBucket: "birperdetr.firebasestorage.app",
      messagingSenderId: "315520445101",
      appId: "1:315520445101:web:f1f6361b23e957b2f7f424",
      measurementId: "G-1Y3247DHPR"
    };

    let fbApp = null;
    let fbAuth = null;
    let fbDb = null;
    let fbStorage = null;

    /* =========================================================================
       2. CİHAZ GALERİ VİDEO/AFİŞ DEPOLAMA YARDIMCISI (INDEXEDDB + BLOB URL)
       Bulut yüklemesi beklerken veya kural/bağlantı engeli olursa asla takılmaz!
    ========================================================================= */
    const IDB_NAME = 'YoneticiDuzenleyiciMediaDB';
    const IDB_STORE = 'media_blobs';
    const activeObjectUrls = new Map();

    function openLocalMediaDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveBlobToLocalDB(key, fileBlob) {
      const db = await openLocalMediaDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(fileBlob, key);
        tx.oncomplete = () => resolve(key);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getBlobUrlFromLocalDB(idbUri) {
      if (!idbUri || !idbUri.startsWith('idb://')) return idbUri;
      if (activeObjectUrls.has(idbUri)) return activeObjectUrls.get(idbUri);

      const key = idbUri.replace('idb://', '');
      const db = await openLocalMediaDB();
      return new Promise((resolve) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = () => {
          if (req.result) {
            const objUrl = URL.createObjectURL(req.result);
            activeObjectUrls.set(idbUri, objUrl);
            resolve(objUrl);
          } else {
            resolve('');
          }
        };
        req.onerror = () => resolve('');
      });
    }

    async function deleteFromLocalDB(idbUri) {
      if (!idbUri || !idbUri.startsWith('idb://')) return;
      const key = idbUri.replace('idb://', '');
      if (activeObjectUrls.has(idbUri)) {
        try { URL.revokeObjectURL(activeObjectUrls.get(idbUri)); } catch (e) {}
        activeObjectUrls.delete(idbUri);
      }
      try {
        const db = await openLocalMediaDB();
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(key);
      } catch (e) {}
    }

    /* =========================================================================
       3. YATAY KAYDIRMA VE EKRAN YAKINLAŞTIRMA ENGELLEYİCİ
    ========================================================================= */
    (function lockViewportZoomAndHorizontalScroll() {
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt => {
        document.addEventListener(evt, e => e.preventDefault(), { passive: false });
      });
      document.addEventListener('touchmove', e => {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false });
      let lastTap = 0;
      document.addEventListener('touchend', e => {
        const now = Date.now();
        if (now - lastTap <= 280) e.preventDefault();
        lastTap = now;
      }, { passive: false });
      document.addEventListener('wheel', e => {
        if (e.ctrlKey || e.metaKey) e.preventDefault();
      }, { passive: false });
      document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) e.preventDefault();
      });
    })();

    /* =========================================================================
       4. FIRESTORE VE FIREBASE STORAGE BAĞLANTISI
    ========================================================================= */
    const LOCAL_CATALOG_CACHE = 'yonetici_duzenleyici_catalog_cache_v2';

    function readLocalCache() {
      try {
        const raw = localStorage.getItem(LOCAL_CATALOG_CACHE);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function writeLocalCache(val) {
      try {
        localStorage.setItem(LOCAL_CATALOG_CACHE, JSON.stringify(val));
      } catch (e) {}
    }

    async function initCloudBackend() {
      const statusPill = document.getElementById('backend-status-pill');
      try {
        fbApp = initializeApp(firebaseConfig);
        fbAuth = getAuth(fbApp);
        fbDb = getFirestore(fbApp);
        fbStorage = getStorage(fbApp);
        fbStorage.maxUploadRetryTime = 15000;
        fbStorage.maxOperationRetryTime = 15000;

        try {
          await signInAnonymously(fbAuth);
        } catch (authErr) {}

        onSnapshot(collection(fbDb, 'birperde_catalog'), (snap) => {
          const cloudList = [];
          snap.forEach(d => cloudList.push({ id: d.id, ...d.data() }));

          // Yerel önbellekte olup henüz buluta yazılmamış kayıtları koru
          const localOnly = readLocalCache().filter(loc => loc.localOnly && !cloudList.some(c => c.id === loc.id));
          const merged = [...localOnly, ...cloudList];
          merged.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

          state.catalog = merged;
          writeLocalCache(merged);

          if (state.player.media) {
            const updatedMedia = state.catalog.find(m => m.id === state.player.media.id);
            if (updatedMedia) {
              state.player.media = updatedMedia;
              state.player.channels = buildChannelsForMedia(updatedMedia, state.player.season, state.player.episode);
            } else {
              closeWatchStudio();
            }
          }
          renderMainView();
        }, () => {
          if (statusPill) {
            statusPill.textContent = 'Yerel Mod';
            statusPill.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold bg-bpYellow/30 text-bpBrown';
          }
        });

        if (statusPill) {
          statusPill.textContent = 'Bulut Aktif';
          statusPill.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold bg-bpEmerald/15 text-bpEmerald';
        }
      } catch (err) {
        if (statusPill) {
          statusPill.textContent = 'Yerel Mod';
          statusPill.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold bg-bpYellow/30 text-bpBrown';
        }
      }
    }

    async function saveCatalogItemToCloud(itemObj) {
      const idx = state.catalog.findIndex(i => i.id === itemObj.id);
      if (idx >= 0) state.catalog[idx] = itemObj;
      else state.catalog.unshift(itemObj);
      writeLocalCache(state.catalog);

      if (!fbDb) return;
      try {
        await setDoc(doc(fbDb, 'birperde_catalog', itemObj.id), itemObj, { merge: true });
      } catch (e) {
        itemObj.localOnly = true;
        writeLocalCache(state.catalog);
      }
    }

    async function deleteMediaFiles(paths, urls) {
      if (fbStorage && Array.isArray(paths)) {
        for (const p of paths) {
          if (p) {
            try { await deleteObject(storageRef(fbStorage, p)); } catch (e) {}
          }
        }
      }
      if (Array.isArray(urls)) {
        for (const u of urls) {
          if (u && u.startsWith('idb://')) {
            await deleteFromLocalDB(u);
          }
        }
      }
    }

    async function deleteCatalogItemFromCloud(itemObj) {
      state.catalog = state.catalog.filter(i => i.id !== itemObj.id);
      writeLocalCache(state.catalog);

      const paths = [];
      const urls = [];
      if (itemObj.posterStoragePath) paths.push(itemObj.posterStoragePath);
      if (itemObj.posterUrl) urls.push(itemObj.posterUrl);

      (itemObj.sources || []).forEach(s => {
        if (s.storagePath) paths.push(s.storagePath);
        if (s.url) urls.push(s.url);
      });
      (itemObj.episodes || []).forEach(ep => {
        (ep.sources || []).forEach(s => {
          if (s.storagePath) paths.push(s.storagePath);
          if (s.url) urls.push(s.url);
        });
      });

      await deleteMediaFiles(paths, urls);

      if (fbDb) {
        try { await deleteDoc(doc(fbDb, 'birperde_catalog', itemObj.id)); } catch (e) {}
      }
    }

    /* =========================================================================
       5. GALERİDEN / CİHAZDAN YÜKLEME MOTORU (ASLA TAKILMAYAN ÇİFT KATMANLI YAPI)
    ========================================================================= */
    function formatFileSizeMB(bytes) {
      if (!bytes || bytes <= 0) return '0 MB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function uploadFileReliably(file, folder, onProgress) {
      return new Promise(async (resolve) => {
        const safeName = (file.name || 'video.mp4').replace(/[^a-zA-Z0-9._-]/g, '_');
        const uniqueKey = `${folder}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}_${safeName}`;
        const mimeType = file.type || (folder.includes('poster') ? 'image/jpeg' : 'video/mp4');

        // 1. Önce cihazın IndexedDB deposuna anında kopyala (asla veri kaybı veya takılma olmaz)
        const idbUri = `idb://${uniqueKey}`;
        try {
          await saveBlobToLocalDB(uniqueKey, file);
          const objUrl = URL.createObjectURL(file);
          activeObjectUrls.set(idbUri, objUrl);
        } catch (idbErr) {}

        if (!fbStorage) {
          if (typeof onProgress === 'function') onProgress(100, 'Cihaz Deposuna Kaydedildi');
          resolve({ url: idbUri, storagePath: '' });
          return;
        }

        // 2. Firebase Storage'a yüklemeyi başlat + takılma koruması (8 sn boyunca 0 byte giderse kilidi aç)
        const cloudPath = `${folder}/${uniqueKey}`;
        const fileRef = storageRef(fbStorage, cloudPath);
        const task = uploadBytesResumable(fileRef, file, { contentType: mimeType });

        let settled = false;
        let bytesMoved = false;

        const finishWithLocalFallback = () => {
          if (settled) return;
          settled = true;
          try { task.cancel(); } catch (e) {}
          if (typeof onProgress === 'function') onProgress(100, 'Cihaz Galerisinden Hazırlandı');
          resolve({ url: idbUri, storagePath: '' });
        };

        const stallWatchdog = setTimeout(() => {
          if (!bytesMoved && !settled) {
            finishWithLocalFallback();
          }
        }, 8000);

        task.on(
          'state_changed',
          (snapshot) => {
            if (snapshot.bytesTransferred > 0) {
              bytesMoved = true;
              clearTimeout(stallWatchdog);
            }
            if (snapshot.totalBytes > 0 && typeof onProgress === 'function') {
              const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
              const detail = `${formatFileSizeMB(snapshot.bytesTransferred)} / ${formatFileSizeMB(snapshot.totalBytes)}`;
              onProgress(pct, detail);
            }
          },
          () => {
            clearTimeout(stallWatchdog);
            finishWithLocalFallback();
          },
          async () => {
            clearTimeout(stallWatchdog);
            if (settled) return;
            try {
              const cloudUrl = await getDownloadURL(task.snapshot.ref);
              settled = true;
              resolve({ url: cloudUrl, storagePath: cloudPath });
            } catch (e) {
              finishWithLocalFallback();
            }
          }
        );
      });
    }

    async function hydrateLocalPosterImages() {
      const imgs = document.querySelectorAll('img[data-idb-src]');
      for (const img of imgs) {
        const idbSrc = img.getAttribute('data-idb-src');
        if (idbSrc && idbSrc.startsWith('idb://')) {
          const resolved = await getBlobUrlFromLocalDB(idbSrc);
          if (resolved) img.src = resolved;
        }
      }
    }

    function renderRealPosterImg(item, imgClass = 'w-full h-full object-cover') {
      const rawSrc = item && item.posterUrl ? item.posterUrl : CINEMA_FALLBACK_PHOTO;
      const isIdb = rawSrc.startsWith('idb://');
      const initialSrc = isIdb ? (activeObjectUrls.get(rawSrc) || CINEMA_FALLBACK_PHOTO) : rawSrc;

      return `
        <img
          src="${escapeAttr(initialSrc)}"
          ${isIdb ? `data-idb-src="${escapeAttr(rawSrc)}"` : ''}
          alt="${escapeAttr(item ? item.title : 'Afiş')}"
          referrerpolicy="no-referrer"
          loading="lazy"
          onerror="if(!this.dataset.err){this.dataset.err='1';this.src='${CINEMA_FALLBACK_PHOTO}';}"
          class="${imgClass}"
        />
      `;
    }

    function buildChannelsForMedia(media, season = 1, episode = 1) {
      const isSeries = media.type === 'series';
      let sourceList = [];

      if (isSeries) {
        const epList = Array.isArray(media.episodes) ? media.episodes : [];
        const epObj = epList.find(e => Number(e.season) === Number(season) && Number(e.number) === Number(episode)) || epList[0];
        if (epObj && Array.isArray(epObj.sources) && epObj.sources.length > 0) {
          sourceList = epObj.sources;
        }
      } else {
        if (Array.isArray(media.sources) && media.sources.length > 0) {
          sourceList = media.sources;
        }
      }

      if (sourceList.length === 0) {
        return [{
          id: 'sub',
          label: 'TR Altyazılı',
          defaultMode: 'sub',
          fileName: 'video.mp4',
          streamUrl: ''
        }];
      }

      return sourceList.map((src, idx) => {
        const mode = src.defaultMode || (src.label && src.label.toLowerCase().includes('dublaj') ? 'dub' : 'sub');
        return {
          id: src.id || `${mode}-${idx + 1}`,
          label: src.label || (mode === 'dub' ? 'TR Dublaj' : 'TR Altyazılı'),
          defaultMode: mode,
          fileName: src.fileName || 'video.mp4',
          streamUrl: src.url || ''
        };
      });
    }

    async function collectSubAndDubSources(prefix, baseSlug) {
      const subChecked = document.getElementById(`${prefix}-sub-check`).checked;
      const subFile = document.getElementById(`${prefix}-sub-file`).files[0];
      const subUrl = document.getElementById(`${prefix}-sub-url`).value.trim();

      const dubChecked = document.getElementById(`${prefix}-dub-check`).checked;
      const dubFile = document.getElementById(`${prefix}-dub-file`).files[0];
      const dubUrl = document.getElementById(`${prefix}-dub-url`).value.trim();

      const sources = [];

      if ((subChecked || subFile || subUrl) && (subFile || subUrl)) {
        if (subFile) {
          const upSub = await uploadFileReliably(subFile, 'birperde_videos', (pct, detail) => {
            updateModalUploadProgress(pct, `Altyazılı Video (${detail})`);
          });
          sources.push({
            id: 'sub',
            label: 'TR Altyazılı',
            defaultMode: 'sub',
            url: upSub.url,
            storagePath: upSub.storagePath,
            fileName: subFile.name
          });
        } else if (subUrl) {
          sources.push({
            id: 'sub',
            label: 'TR Altyazılı',
            defaultMode: 'sub',
            url: subUrl,
            storagePath: '',
            fileName: `${baseSlug}_Altyazili.mp4`
          });
        }
      }

      if ((dubChecked || dubFile || dubUrl) && (dubFile || dubUrl)) {
        if (dubFile) {
          const upDub = await uploadFileReliably(dubFile, 'birperde_videos', (pct, detail) => {
            updateModalUploadProgress(pct, `Dublaj Video (${detail})`);
          });
          sources.push({
            id: 'dub',
            label: 'TR Dublaj',
            defaultMode: 'dub',
            url: upDub.url,
            storagePath: upDub.storagePath,
            fileName: dubFile.name
          });
        } else if (dubUrl) {
          sources.push({
            id: 'dub',
            label: 'TR Dublaj',
            defaultMode: 'dub',
            url: dubUrl,
            storagePath: '',
            fileName: `${baseSlug}_Dublaj.mp4`
          });
        }
      }

      return sources;
    }

    async function handleAddEpisodeSubmit(event) {
      event.preventDefault();
      if (isUploadingMedia) return;

      const seriesId = document.getElementById('add-ep-series-id').value;
      const season = Math.max(1, Number(document.getElementById('add-ep-season').value) || 1);
      const number = Math.max(1, Number(document.getElementById('add-ep-number').value) || 1);
      const name = document.getElementById('add-ep-name').value.trim() || `${number}. Bölüm`;

      const subFile = document.getElementById('ep-sub-file').files[0];
      const subUrl = document.getElementById('ep-sub-url').value.trim();
      const dubFile = document.getElementById('ep-dub-file').files[0];
      const dubUrl = document.getElementById('ep-dub-url').value.trim();

      const series = state.catalog.find(s => s.id === seriesId && s.type === 'series');
      if (!series) return;

      if (!subFile && !subUrl && !dubFile && !dubUrl) {
        showToast('Lütfen bölüm için Altyazılı veya Dublaj video seçin ya da link girin.', 'error');
        return;
      }

      isUploadingMedia = true;
      const submitBtn = document.getElementById('submit-ep-btn');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Yükleniyor...';
      }

      try {
        const sources = await collectSubAndDubSources('ep', `${series.title}_S${season}_B${number}`);

        if (!Array.isArray(series.episodes)) series.episodes = [];
        const existingIdx = series.episodes.findIndex(e => Number(e.season) === season && Number(e.number) === number);
        if (existingIdx >= 0) {
          const oldPaths = (series.episodes[existingIdx].sources || []).map(s => s.storagePath).filter(Boolean);
          const oldUrls = (series.episodes[existingIdx].sources || []).map(s => s.url).filter(Boolean);
          await deleteMediaFiles(oldPaths, oldUrls);
          series.episodes[existingIdx] = { season, number, name, sources };
        } else {
          series.episodes.push({ season, number, name, sources });
        }

        series.episodes.sort((a, b) => (Number(a.season) - Number(b.season)) || (Number(a.number) - Number(b.number)));
        series.seasons = Math.max(...series.episodes.map(e => Number(e.season)));
        series.hasSub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'sub'));
        series.hasDub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'dub'));

        await saveCatalogItemToCloud(series);
        closeModal();
        renderMainView();
        await hydrateLocalPosterImages();
        if (state.player.media && state.player.media.id === series.id) {
          openPlayerForMedia(series.id, season, number);
        }
        showToast(`${series.title} — Sezon ${season} Bölüm ${number} yüklendi.`, 'success');
      } catch (err) {
        showToast('Bölüm yükleme hatası: ' + (err.message || ''), 'error');
      } finally {
        isUploadingMedia = false;
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Bölümü Yükle & Kaydet';
        }
      }
    }

    async function deleteSingleEpisode(seriesId, season, episodeNum) {
      const series = state.catalog.find(s => s.id === seriesId && s.type === 'series');
      if (!series || !Array.isArray(series.episodes)) return;

      const targetEp = series.episodes.find(e => Number(e.season) === Number(season) && Number(e.number) === Number(episodeNum));
      if (!targetEp) return;

      const storagePaths = (targetEp.sources || []).map(s => s.storagePath).filter(Boolean);
      const urls = (targetEp.sources || []).map(s => s.url).filter(Boolean);
      await deleteMediaFiles(storagePaths, urls);

      series.episodes = series.episodes.filter(e => !(Number(e.season) === Number(season) && Number(e.number) === Number(episodeNum)));
      series.seasons = series.episodes.length > 0 ? Math.max(...series.episodes.map(e => Number(e.season))) : 1;
      series.hasSub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'sub'));
      series.hasDub = series.episodes.some(ep => (ep.sources || []).some(s => s.defaultMode === 'dub'));

      await saveCatalogItemToCloud(series);
      renderMainView();
      await hydrateLocalPosterImages();
      openSeriesEpisodesModal(series.id);
      showToast(`Sezon ${season} Bölüm ${episodeNum} silindi.`, 'info');
    }

    function filterItemsByCriteria(list) {
      const q = state.searchQuery.toLowerCase();
      return list.filter(item => {
        if (
          q &&
          !item.title.toLowerCase().includes(q) &&
          !String(item.year).includes(q) &&
          !(item.genre && item.genre.toLowerCase().includes(q))
        ) {
          return false;
        }
        if (state.langFilter === 'dub' && !item.hasDub) return false;
        if (state.langFilter === 'sub' && !item.hasSub) return false;
        return true;
      });
    }

    function renderCompactMediaCard(item) {

              </h3>
              <div class="flex items-center gap-1 mt-1 flex-wrap">
                ${item.hasDub ? '<span class="px-1.5 py-0.2 rounded bg-bpGreen/15 text-bpGreen text-[9px] font-extrabold">Dublaj</span>' : ''}
                ${item.hasSub ? '<span class="px-1.5 py-0.2 rounded bg-bpSky text-bpRoyal text-[9px] font-extrabold">Altyazılı</span>' : ''}

            ${isMovie ? `

                  Ön İzle
                </button>
                <button type="button" onclick="confirmDeleteMediaItem('${escapeAttr(item.id)}')" class="py-1.5 px-1 rounded-lg bg-bpRed hover:bg-red-700 text-white text-[10px] font-extrabold text-center transition">

              <div class="grid grid-cols-3 gap-1 pt-1 border-t border-bpSky">
                <button type="button" onclick="openSeriesEpisodesModal('${escapeAttr(item.id)}')" class="py-1.5 px-1 rounded-lg bg-bpEmerald hover:bg-bpGreen text-white text-[10px] font-extrabold text-center transition">
                  Bölümler
                </button>
                <button type="button" onclick="openAddContentModal('episode', '${escapeAttr(item.id)}')" class="py-1.5 px-1 rounded-lg bg-bpSky hover:bg-bpRoyal text-bpNavy hover:text-white text-[10px] font-extrabold text-center transition">
                  + Bölüm
                </button>
                <button type="button" onclick="confirmDeleteMediaItem('${escapeAttr(item.id)}')" class="py-1.5 px-1 rounded-lg bg-bpRed hover:bg-red-700 text-white text-[10px] font-extrabold text-center transition">
                  Sil

    /* =========================================================================
       9. VİDEO ÖN İZLEME OYNATICISI (ALTYAZILI / DUBLAJ GEÇİŞLİ)
    ========================================================================= */
    let activeHlsInstance = null;

    function stopMediaEngines() {
      if (activeHlsInstance) {
        try { activeHlsInstance.destroy(); } catch (e) {}
        activeHlsInstance = null;
      }
    }

    function openPlayerForMedia(mediaId, season = null, episode = null) {
      const media = state.catalog.find(m => m.id === mediaId);
      if (!media) return;

      let targetSeason = Number(season) || 1;
      let targetEpisode = Number(episode) || 1;
      if (media.type === 'series' && Array.isArray(media.episodes) && media.episodes.length > 0 && season === null) {
        targetSeason = Number(media.episodes[0].season) || 1;
        targetEpisode = Number(media.episodes[0].number) || 1;
      }

      const channels = buildChannelsForMedia(media, targetSeason, targetEpisode);
      state.player.media = media;
      state.player.season = targetSeason;
      state.player.episode = targetEpisode;
      state.player.channels = channels;
      state.player.activeChannelId = channels[0].id;
      state.player.audioMode = channels[0].defaultMode;
      state.player.isPlaying = true;
      state.player.isLoading = true;
      state.player.currentTime = 0;

      renderWatchStudio();
      if (!state.player.isCustomFullscreen) {
        const sec = document.getElementById('watch-studio-wrapper');
        if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function selectStreamingChannel(channelId) {
      const ch = state.player.channels.find(c => c.id === channelId);
      if (!ch) return;
      state.player.activeChannelId = ch.id;
      state.player.audioMode = ch.defaultMode;
      state.player.isLoading = true;
      renderWatchStudio();
    }

    function switchSeriesSeasonEpisode(season, episode) {
      if (!state.player.media) return;
      openPlayerForMedia(state.player.media.id, Number(season), Number(episode));
    }

    function toggleCustomFullscreen() {
      state.player.isCustomFullscreen = !state.player.isCustomFullscreen;
      document.body.style.overflow = state.player.isCustomFullscreen ? 'hidden' : '';
      renderWatchStudio();
    }

    function closeWatchStudio() {
      stopMediaEngines();
      const vid = document.getElementById('birperde-video-player');
      if (vid) vid.pause();
      state.player.media = null;
      state.player.isCustomFullscreen = false;
      document.body.style.overflow = '';
      const sec = document.getElementById('watch-studio-wrapper');
      sec.classList.add('hidden');
      sec.innerHTML = '';
    }

    function getActiveChannel() {
      return state.player.channels.find(c => c.id === state.player.activeChannelId) || state.player.channels[0];
    }

    function toggleVideoPlayPause() {
      const vid = document.getElementById('birperde-video-player');
      if (!vid) return;
      if (vid.paused) vid.play().catch(() => {});
      else vid.pause();
      updateCustomControlsDOM();
    }

    function toggleVideoMute() {
      const vid = document.getElementById('birperde-video-player');
      if (!vid) return;
      vid.muted = !vid.muted;
      state.player.isMuted = vid.muted;
      updateCustomControlsDOM();
    }

    function scrubVideoTimeline(val) {
      const vid = document.getElementById('birperde-video-player');
      if (!vid || !isFinite(vid.duration)) return;
      vid.currentTime = (Number(val) / 100) * vid.duration;
      updateCustomControlsDOM();
    }

    async function wireMediaPlayer() {
      stopMediaEngines();
      const vid = document.getElementById('birperde-video-player');
      const loader = document.getElementById('bp-player-loader');
      if (!vid) return;

      const onReady = () => {
        state.player.isLoading = false;
        if (loader) loader.classList.add('hidden');
        updateCustomControlsDOM();
      };

      vid.addEventListener('loadeddata', onReady);
      vid.addEventListener('canplay', onReady);
      vid.addEventListener('playing', onReady);
      vid.addEventListener('timeupdate', updateCustomControlsDOM);
      vid.addEventListener('play', updateCustomControlsDOM);
      vid.addEventListener('pause', updateCustomControlsDOM);

      const activeCh = getActiveChannel();
      if (!activeCh || !activeCh.streamUrl) {
        if (loader) loader.innerHTML = '<span>Video Bulunamadı</span>';
        return;
      }

      // Yerel IndexedDB kaydıysa anında Blob URL'ye çevir
      let resolvedUrl = activeCh.streamUrl;
      if (resolvedUrl.startsWith('idb://')) {
        resolvedUrl = await getBlobUrlFromLocalDB(resolvedUrl);
      }

      const isHls = /\.m3u8(\?|$)/i.test(resolvedUrl) || resolvedUrl.toLowerCase().includes('m3u8');
      if (isHls && window.Hls && window.Hls.isSupported()) {
        const hls = new window.Hls({ enableWorker: true, lowLatencyMode: true });
        activeHlsInstance = hls;
        hls.loadSource(resolvedUrl);
        hls.attachMedia(vid);
        hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
          vid.play().catch(() => {
            vid.muted = true;
            vid.play().catch(() => {});
          });
        });
      } else {
        vid.src = resolvedUrl;
        vid.load();
        vid.play().catch(() => {
          vid.muted = true;
          vid.play().catch(() => {});
        });
      }
    }

    function formatTimeMMSS(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const m = String(Math.floor(s / 60)).padStart(2, '0');
      const r = String(s % 60).padStart(2, '0');
      return `${m}:${r}`;
    }

    function updateCustomControlsDOM() {
      const vid = document.getElementById('birperde-video-player');
      if (!vid) return;

      state.player.currentTime = vid.currentTime || 0;
      state.player.duration = (vid.duration && isFinite(vid.duration)) ? vid.duration : 0;
      state.player.isPlaying = !vid.paused;
      state.player.isMuted = vid.muted;

      const pct = state.player.duration > 0
        ? Math.min(100, (state.player.currentTime / state.player.duration) * 100)
        : 0;

      const scrubber = document.getElementById('bp-scrubber-input');
      if (scrubber) scrubber.value = pct;

      const clockLabel = document.getElementById('bp-player-clock');
      if (clockLabel) {
        clockLabel.textContent = `${formatTimeMMSS(state.player.currentTime)} / ${formatTimeMMSS(state.player.duration)}`;
      }

      const playBtn = document.getElementById('bp-play-toggle-btn');
      if (playBtn) {
        playBtn.innerHTML = state.player.isPlaying
          ? `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`
          : `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>`;
      }

      const muteBtn = document.getElementById('bp-mute-toggle-btn');
      if (muteBtn) {
        muteBtn.innerHTML = state.player.isMuted
          ? `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>`
          : `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
      }
    }

    function renderWatchStudio() {
      const wrapper = document.getElementById('watch-studio-wrapper');
      const p = state.player;
      if (!wrapper || !p.media) return;

      wrapper.classList.remove('hidden');

      if (p.isCustomFullscreen) {
        wrapper.className = 'fixed inset-0 z-[80] bg-bpBlack flex flex-col overflow-y-auto p-2 sm:p-4';
      } else {
        wrapper.className = 'max-w-6xl w-full mx-auto px-3 sm:px-5 pt-4';
      }

      const media = p.media;

      let episodeButtonsHtml = '';
      if (media.type === 'series') {
        const allEps = Array.isArray(media.episodes) && media.episodes.length > 0
          ? media.episodes
          : [{ season: 1, number: 1, name: '1. Bölüm' }];
        const seasonSet = Array.from(new Set(allEps.map(e => Number(e.season)))).sort((a, b) => a - b);
        const currentSeasonEps = allEps
          .filter(e => Number(e.season) === Number(p.season))
          .sort((a, b) => Number(a.number) - Number(b.number));

        episodeButtonsHtml = `
          <div class="px-4 py-2.5 bg-slate-900 border-b border-white/10 flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2">
              <select onchange="switchSeriesSeasonEpisode(this.value, 1)" class="px-2.5 py-1.5 rounded-lg bg-bpNavy border border-bpRoyal text-xs font-extrabold text-white">
                ${seasonSet.map(sNum => `<option value="${sNum}" ${Number(p.season) === sNum ? 'selected' : ''}>${sNum}. Sezon</option>`).join('')}
              </select>
              <div class="flex items-center gap-1 overflow-x-auto py-0.5 max-w-full">
                ${currentSeasonEps.map(ep => {
                  const active = Number(ep.number) === Number(p.episode);
                  return `
                    <button type="button" onclick="switchSeriesSeasonEpisode(${p.season}, ${ep.number})" title="${escapeAttr(ep.name)}" class="shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition ${active ? 'bg-bpGreen text-white' : 'bg-white/10 hover:bg-white/20 text-slate-200'}">
                      ${ep.number}. Bölüm
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button type="button" onclick="openAddContentModal('episode', '${escapeAttr(media.id)}')" class="px-2.5 py-1 rounded-lg bg-bpYellow text-bpBlack text-[11px] font-extrabold shrink-0">
                + Bölüm Ekle
              </button>
              <button type="button" onclick="openSeriesEpisodesModal('${escapeAttr(media.id)}')" class="px-2.5 py-1 rounded-lg bg-bpRed text-white text-[11px] font-extrabold shrink-0">
                Bölüm Sil
              </button>
            </div>
          </div>
        `;
      }

      wrapper.innerHTML = `
        <div class="bg-bpBlack text-white ${p.isCustomFullscreen ? 'flex-1 flex flex-col rounded-2xl border-2 border-bpYellow' : 'rounded-2xl border-2 border-bpRoyal shadow-xl'} overflow-hidden">
          <div class="birperde-ribbon"></div>

          <!-- Üst Başlık -->
          <div class="px-4 py-3 bg-bpNavy flex flex-wrap items-center justify-between gap-2 border-b border-white/10">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2 py-0.5 rounded text-[10px] font-extrabold uppercase ${media.type === 'movie' ? 'bg-bpRed' : 'bg-bpEmerald'}">
                ${media.type === 'movie' ? 'FİLM ÖN İZLEME' : 'DİZİ ÖN İZLEME'}
              </span>
              <h2 class="text-sm sm:text-lg font-extrabold text-white">${escapeHtml(media.title)}</h2>
              <span class="px-2 py-0.5 rounded bg-bpYellow text-bpBlack font-mono text-[11px] font-extrabold">${media.year}</span>
              ${media.type === 'series' ? `<span class="px-2 py-0.5 rounded bg-bpRoyal text-white font-mono text-[11px] font-extrabold">Sezon ${p.season} • Bölüm ${p.episode}</span>` : ''}
            </div>

            <div class="flex items-center gap-1.5">
              <button type="button" onclick="confirmDeleteMediaItem('${escapeAttr(media.id)}')" class="px-3 py-1.5 rounded-xl bg-bpRed hover:bg-red-700 text-white text-xs font-extrabold transition">
                Kalıcı Sil
              </button>
              <button type="button" onclick="toggleCustomFullscreen()" class="px-3 py-1.5 rounded-xl ${p.isCustomFullscreen ? 'bg-bpYellow text-bpBlack' : 'bg-bpRoyal hover:bg-blue-600 text-white'} text-xs font-extrabold transition">
                ${p.isCustomFullscreen ? 'Tam Ekrandan Çık' : 'Tam Ekran'}
              </button>
              <button type="button" onclick="closeWatchStudio()" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-extrabold transition">
                Kapat
              </button>
            </div>
          </div>

          ${episodeButtonsHtml}

          <!-- ALTYAZILI / DUBLAJ VİDEO SEÇİM SEKMELERİ -->
          <div class="px-4 py-2 bg-slate-900/95 border-b border-white/10 flex items-center gap-2 flex-wrap">
            <span class="text-[11px] font-bold text-slate-400">Ses / Sürüm Seçimi:</span>
            ${p.channels.map(ch => {
              const selected = ch.id === p.activeChannelId;
              const isDub = ch.defaultMode === 'dub';
              return `
                <button type="button" onclick="selectStreamingChannel('${escapeAttr(ch.id)}')" class="px-3.5 py-1.5 rounded-xl text-xs font-extrabold border transition ${selected ? (isDub ? 'bg-bpEmerald border-bpYellow text-white shadow' : 'bg-bpRoyal border-bpYellow text-white shadow') : 'bg-white/5 hover:bg-white/15 border-white/15 text-slate-200'}">
                  ${escapeHtml(ch.label)}
                </button>
              `;
            }).join('')}
          </div>

          <!-- VİDEO OYNATICI -->
          <div class="p-3 sm:p-4 ${p.isCustomFullscreen ? 'flex-1 flex flex-col' : ''}">
            <div class="relative ${p.isCustomFullscreen ? 'flex-1 min-h-[260px]' : 'aspect-video'} rounded-xl overflow-hidden bg-bpNavy border border-white/20">
              <video
                id="birperde-video-player"
                preload="auto"
                playsinline
                onclick="toggleVideoPlayPause()"
                class="w-full h-full object-contain bg-bpNavy cursor-pointer"
              ></video>

              <div id="bp-player-loader" class="pointer-events-none absolute top-2.5 right-2.5 px-2.5 py-1 rounded-lg bg-bpRoyal/90 text-white text-[10px] font-extrabold flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-bpYellow live-indicator"></span>
                <span>Yükleniyor</span>
              </div>

              <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/95 via-black/80 to-transparent px-3 py-2 flex items-center gap-2">
                <button type="button" id="bp-play-toggle-btn" onclick="toggleVideoPlayPause()" aria-label="Oynat veya Duraklat" class="w-8 h-8 rounded-lg bg-bpRoyal hover:bg-bpNavy text-white flex items-center justify-center shrink-0 transition">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                </button>

                <input
                  type="range"
                  id="bp-scrubber-input"
                  min="0"
                  max="100"
                  step="0.5"
                  value="0"
                  oninput="scrubVideoTimeline(this.value)"
                  aria-label="Zaman Çizelgesi"
                  class="bp-scrubber flex-1 min-w-0"
                />

                <span id="bp-player-clock" class="font-mono text-[10px] sm:text-[11px] font-bold text-sky-200 shrink-0">
                  00:00 / 00:00
                </span>

                <button type="button" id="bp-mute-toggle-btn" onclick="toggleVideoMute()" aria-label="Sesi Aç veya Kapat" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 text-white flex items-center justify-center shrink-0 transition">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                </button>

                <button type="button" onclick="toggleCustomFullscreen()" aria-label="Tam Ekran" class="w-8 h-8 rounded-lg ${p.isCustomFullscreen ? 'bg-bpYellow text-bpBlack' : 'bg-white/10 hover:bg-white/20 text-white'} flex items-center justify-center shrink-0 transition">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;

      wireMediaPlayer();
    }

       10. YARDIMCI FONKSİYONLAR VE YÖNETİCİ DÜZENLEYİCİ LOGOSU
    ========================================================================= */

          <rect x="8" y="34" width="3.5" height="4" rx="1" fill="#D92626"/>
          <rect x="36.5" y="10" width="3.5" height="4" rx="1" fill="#D92626"/>
          <rect x="36.5" y="18" width="3.5" height="4" rx="1" fill="#EAB308"/>
          <rect x="36.5" y="26" width="3.5" height="4" rx="1" fill="#EAF4FF"/>

      `;
    }

    function openModal(html) {
      document.getElementById('modal-card').innerHTML = html;
      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
      document.getElementById('modal-card').innerHTML = '';
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'modal-overlay') closeModal();
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const styles = {
        success: 'bg-bpEmerald text-white border-bpYellow',
        error: 'bg-bpRed text-white border-white',
        info: 'bg-bpNavy text-white border-bpRoyal'
      };
      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl border text-xs font-extrabold shadow-lg ${styles[type] || styles.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => { if (el.parentElement) el.remove(); }, 3400);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    Object.assign(window, {
      openAddContentModal,
      onGalleryFilePicked,
      toggleTrackUploadBox,
      handleAddMovieSubmit,
      handleAddSeriesSubmit,
      handleAddEpisodeSubmit,
      openSeriesEpisodesModal,
      deleteSingleEpisode,
      confirmDeleteMediaItem,
      executeDeleteMediaItem,
      handleSearchInput,
      resetSearchInput,
      switchNavTab,
      switchLangFilter,
      openPlayerForMedia,
      selectStreamingChannel,
      switchSeriesSeasonEpisode,
      toggleCustomFullscreen,
      closeWatchStudio,
      toggleVideoPlayPause,
      toggleVideoMute,
      scrubVideoTimeline,
      closeModal,
      handleOverlayClick
    });

    window.addEventListener('DOMContentLoaded', bootstrapApp);
  </script>
</body>
</html>
