<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BirPerdeTR — Film ve Dizi Platformu</title>
  <meta name="theme-color" content="#071326" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BirPerdeTR" />

  <link id="bp-favicon-svg" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='12' fill='%23071326' stroke='%232563EB' stroke-width='2'/%3E%3Crect x='8' y='10' width='3.5' height='4' rx='1' fill='%23FACC15'/%3E%3Crect x='8' y='18' width='3.5' height='4' rx='1' fill='%2338BDF8'/%3E%3Crect x='8' y='26' width='3.5' height='4' rx='1' fill='%23E11D48'/%3E%3Crect x='8' y='34' width='3.5' height='4' rx='1' fill='%2310B981'/%3E%3Crect x='36.5' y='10' width='3.5' height='4' rx='1' fill='%2310B981'/%3E%3Crect x='36.5' y='18' width='3.5' height='4' rx='1' fill='%23E11D48'/%3E%3Crect x='36.5' y='26' width='3.5' height='4' rx='1' fill='%2338BDF8'/%3E%3Crect x='36.5' y='34' width='3.5' height='4' rx='1' fill='%23FACC15'/%3E%3Crect x='14.5' y='11' width='19' height='26' rx='4' fill='%23059669'/%3E%3Cpolygon points='21,18 30,24 21,30' fill='%23FFFFFF'/%3E%3C/svg%3E" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            bpWhite: '#FFFFFF',
            bpSky: '#EFF6FF',
            bpSkyBorder: '#CBD5E1',
            bpRed: '#E11D48',
            bpRoyal: '#2563EB',
            bpYellow: '#FACC15',
            bpGreen: '#10B981',
            bpBlack: '#0F172A',
            bpNavy: '#071326',
            bpEmerald: '#059669',
          }
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: clip;
      overscroll-behavior-x: none;
      touch-action: pan-y;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      user-select: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #EFF6FF;
      color: #0F172A;
      margin: 0;
      padding: 0;
    }

    body.bp-dark-theme {
      background-color: #030712;
      color: #F8FAFC;
    }

    body.bp-dark-theme #app-top-header,
    body.bp-dark-theme footer,
    body.bp-dark-theme #modal-card {
      background-color: #0F172A !important;
      border-color: #1E293B !important;
      color: #F8FAFC !important;
    }

    body.bp-dark-theme #app-top-header > div:last-child {
      background-color: #071326 !important;
      border-color: #1E293B !important;
    }

    body.bp-dark-theme #brand-title-text,
    body.bp-dark-theme #modal-card h3,
    body.bp-dark-theme #modal-card label {
      color: #F8FAFC !important;
    }

    body.bp-dark-theme #modal-card input,
    body.bp-dark-theme #modal-card select,
    body.bp-dark-theme #global-search-input,
    body.bp-dark-theme #genre-filter-select,
    body.bp-dark-theme #sort-order-select {
      background-color: #1E293B !important;
      border-color: #334155 !important;
      color: #F8FAFC !important;
    }

    input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
    }

    #admin-app, header, main, section, article, footer, #modal-overlay {
      max-width: 100%;
      overflow-x: clip;
    }

    body.bp-cinema-blur-active #admin-app > header,
    body.bp-cinema-blur-active #admin-app > main,
    body.bp-cinema-blur-active #admin-app > footer,
    body.bp-cinema-blur-active #background-sync-banner {
      filter: blur(14px) brightness(0.45);
      pointer-events: none;
      transition: filter 0.25s ease;
    }

    body.bp-cinema-blur-active #watch-studio-wrapper {
      position: relative;
      z-index: 60;
      max-width: 72rem !important;
      transition: max-width 0.25s ease;
    }

    body.bp-cinema-blur-active #watch-studio-wrapper .bp-player-stage {
      max-height: 75vh !important;
    }

    #intro-splash {
      position: fixed;
      inset: 0;
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #16325C 0%, #071326 65%, #030712 100%);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #intro-splash.splash-exit {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    .intro-shimmer-ring {
      position: absolute;
      width: 210px;
      height: 210px;
      border-radius: 9999px;
      background: conic-gradient(from 0deg, rgba(250, 204, 21, 0), rgba(250, 204, 21, 0.55), rgba(56, 189, 248, 0.45), rgba(250, 204, 21, 0));
      filter: blur(18px);
      animation: introSpin 4.5s linear infinite;
    }

    @keyframes introSpin {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(0.95); }
    }

    @keyframes introPop {
      0% { opacity: 0; transform: translateY(12px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .intro-brand-pop {
      animation: introPop 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes titleShine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .intro-shine-text {
      background: linear-gradient(90deg, #E0F2FE 0%, #FACC15 35%, #FFFFFF 50%, #38BDF8 70%, #E0F2FE 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleShine 2.6s linear infinite;
    }

    .bg-pattern-sky {
      background-color: #EFF6FF;
      background-image: radial-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    body.bp-dark-theme.bg-pattern-sky {
      background-color: #030712;
      background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px);
    }

    .theme-banner-movies {
      background: linear-gradient(135deg, #071326 0%, #1E3A8A 100%);
    }

    .theme-banner-series {
      background: linear-gradient(135deg, #064E3B 0%, #059669 100%);
    }

    .birperde-ribbon {
      height: 4px;
      background: linear-gradient(90deg, #2563EB 0%, #FACC15 28%, #059669 55%, #38BDF8 78%, #E11D48 100%);
    }

    .catalog-responsive-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    .catalog-grid-compact {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .catalog-grid-large {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (min-width: 640px) {
      .catalog-responsive-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
      .catalog-grid-compact {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .catalog-grid-large {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .catalog-responsive-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
      }
      .catalog-grid-compact {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
      .catalog-grid-large {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .card-movie-frame {
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-top: 3px solid #E11D48;
      border-radius: 14px;
      overflow: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 12px -4px rgba(7, 19, 38, 0.12);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    body.bp-dark-theme .card-movie-frame,
    body.bp-dark-theme .card-series-frame {
      background: #0F172A;
      border-color: #1E293B;
      color: #F8FAFC;
    }

    .card-movie-frame:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -6px rgba(7, 19, 38, 0.22);
    }

    .card-series-frame {
      background: #FFFFFF;
      border: 1px solid #A7F3D0;
      border-top: 3px solid #059669;
      border-radius: 14px;
      overflow: hidden;
      min-width: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 12px -4px rgba(5, 150, 105, 0.12);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card-series-frame:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -6px rgba(5, 150, 105, 0.22);
    }

    .bp-fs-rot-cw {
      position: fixed !important;
      top: 0 !important;
      left: 100vw !important;
      width: 100dvh !important;
      height: 100vw !important;
      max-width: none !important;
      transform: rotate(90deg) !important;
      transform-origin: top left !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    .bp-fs-rot-ccw {
      position: fixed !important;
      top: 100vh !important;
      left: 0 !important;
      width: 100dvh !important;
      height: 100vw !important;
      max-width: none !important;
      transform: rotate(-90deg) !important;
      transform-origin: top left !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    @supports not (width: 100dvh) {
      .bp-fs-rot-cw, .bp-fs-rot-ccw {
        width: 100vh !important;
      }
    }

    .bp-fullscreen-landscape-native {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      z-index: 9999 !important;
      background: #000000 !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      overflow: hidden !important;
      touch-action: manipulation !important;
    }

    .bp-fs-rot-cw video,
    .bp-fs-rot-ccw video,
    .bp-fullscreen-landscape-native video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      border-radius: 0 !important;
      border: 0 !important;
      background: #000000 !important;
    }

    .fs-icon-btn {
      background: rgba(7, 19, 38, 0.68);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .fs-icon-btn:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.25);
    }

    .fs-icon-active {
      background: rgba(37, 99, 235, 0.85);
      border: 1px solid rgba(250, 204, 21, 0.85);
      color: #FFFFFF;
    }

    .watch-soft-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #F1F5F9;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .watch-soft-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .watch-soft-active {
      background: rgba(37, 99, 235, 0.55);
      border: 1px solid rgba(250, 204, 21, 0.75);
      color: #FFFFFF;
    }

    input[type="range"].bp-scrubber {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"].bp-scrubber::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: 9999px;
      background: rgba(148, 163, 184, 0.45);
    }

    input[type="range"].bp-scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 9999px;
      background: #FACC15;
      border: 2px solid #071326;
      margin-top: -5px;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .live-indicator {
      animation: livePulse 1.3s infinite ease-in-out;
    }

    @keyframes seekPop {
      0% { opacity: 0; transform: scale(0.85); }
      20% { opacity: 1; transform: scale(1.04); }
      80% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.95); }
    }
    .seek-feedback-badge {
      animation: seekPop 0.75s ease forwards;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #EFF6FF;
    }
    ::-webkit-scrollbar-thumb {
      background: #2563EB;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-pattern-sky min-h-screen">

  <!-- INTRO SPLASH SCREEN -->
  <div id="intro-splash" onclick="dismissIntroSplashNow()" class="cursor-pointer select-none px-6 text-center">
    <div class="relative flex flex-col items-center justify-center">
      <div class="intro-shimmer-ring"></div>
      <div id="intro-logo-mount" class="intro-brand-pop relative z-10 mb-5 drop-shadow-[0_0_28px_rgba(250,204,21,0.35)]"></div>
      <h1 class="intro-brand-pop relative z-10 text-4xl sm:text-6xl font-extrabold tracking-tight intro-shine-text">
        BirPerdeTR
      </h1>
      <p class="intro-brand-pop relative z-10 mt-2 text-xs sm:text-sm font-semibold tracking-widest uppercase text-sky-200/80">
        Bulut Film &amp; Dizi Platformu
      </p>
    </div>
  </div>

  <!-- Top Signature Ribbon -->
  <div class="birperde-ribbon w-full sticky top-0 z-50"></div>

  <!-- Toast Notifications -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[10000] flex flex-col gap-2 max-w-xs w-[calc(100%-2rem)] pointer-events-none"></div>

  <!-- MAIN APPLICATION SHELL -->
  <div id="admin-app" class="min-h-screen flex flex-col w-full">

    <!-- TOP HEADER BAR -->
    <header id="app-top-header" class="sticky top-[4px] z-40 bg-bpWhite/95 backdrop-blur-md border-b border-slate-200 shadow-xs w-full">
      <div class="max-w-6xl mx-auto px-3 sm:px-5 py-2.5 flex flex-wrap items-center justify-between gap-2">

        <!-- Left: Brand -->
        <div class="flex items-center gap-2.5 shrink-0 min-w-0">
          <div id="header-brand-logo" onclick="replayIntroSplash()" class="cursor-pointer"></div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span id="brand-title-text" class="text-base sm:text-xl font-extrabold tracking-tight text-bpNavy">BirPerdeTR</span>
              <span id="cloud-live-dot" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-bpEmerald/15 text-bpEmerald border border-bpEmerald/30">
                <span class="w-1.5 h-1.5 rounded-full bg-bpEmerald live-indicator"></span>
                <span>YÖNETİCİ</span>
              </span>
            </div>
            <p class="text-[11px] text-slate-500 hidden sm:block">1 MB – 15 GB bulut video motoru • Tüm cihazlarda kalıcı</p>
          </div>
        </div>

        <!-- Right: Action Buttons -->
        <div class="flex items-center gap-1.5 sm:gap-2 order-2 md:order-3 shrink-0 flex-wrap">
          <button type="button" onclick="openAddContentModal('movie')" class="px-3 py-2 rounded-xl bg-bpNavy hover:bg-bpRoyal text-white text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
            <span>Film</span>
          </button>

          <button type="button" onclick="openAddContentModal('series')" class="px-3 py-2 rounded-xl bg-bpEmerald hover:bg-emerald-700 text-white text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
            <span>Dizi</span>
          </button>

          <button type="button" onclick="openAddContentModal('batch')" class="px-3 py-2 rounded-xl bg-bpRoyal hover:bg-blue-700 text-white text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer" title="Tek seferde birden fazla video yükle">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            <span>Toplu Yükle</span>
          </button>

          <button type="button" onclick="openAddContentModal('episode')" class="px-2.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-bpNavy text-xs font-extrabold flex items-center gap-1 shadow-xs transition cursor-pointer">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>
            <span class="hidden sm:inline">Bölüm</span>
          </button>

          <button type="button" onclick="openPlatformSettingsModal()" class="p-2 rounded-xl bg-slate-100 hover:bg-bpNavy hover:text-white text-bpNavy transition cursor-pointer" title="Bulut Ayarları & Kısayollar">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>

          <button type="button" onclick="syncAllFromCloudNow(true)" class="p-2 rounded-xl bg-slate-100 hover:bg-bpRoyal hover:text-white text-bpNavy transition cursor-pointer" title="Buluttan Yenile">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
          </button>
        </div>

        <!-- Center: Search -->
        <div class="relative order-3 md:order-2 w-full md:flex-1 md:max-w-md min-w-0">
          <div class="relative flex items-center">
            <svg class="w-4 h-4 text-bpRoyal absolute left-3 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
            </svg>
            <input
              type="text"
              id="global-search-input"
              autocomplete="off"
              oninput="handleSearchInput(this.value)"
              placeholder="Film, dizi, tür, bölüm veya yıl ara..."
              class="w-full pl-9 pr-10 py-2 rounded-xl bg-slate-100/80 border border-slate-200 focus:border-bpRoyal focus:bg-white focus:outline-none text-xs sm:text-sm font-medium text-bpBlack"
            />
            <button type="button" id="search-clear-btn" onclick="resetSearchInput()" class="hidden absolute right-2 w-6 h-6 rounded-lg bg-bpRed/15 text-bpRed flex items-center justify-center cursor-pointer" title="Temizle">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
        </div>

    /* =====================================================================
       2. FIREBASE + CLOUDINARY + CORS-FREE STREAM ENGINE
    ===================================================================== */
    const firebaseConfig = {
      apiKey: "AIzaSyB1eT555N2stbzj6x6zkmxHKtMolvCJmeY",
      authDomain: "birperdetr.firebaseapp.com",
      databaseURL: "https://birperdetr-default-rtdb.firebaseio.com",
      projectId: "birperdetr",
      storageBucket: "birperdetr.firebasestorage.app",
      messagingSenderId: "315520445101",
      appId: "1:315520445101:web:f1f6361b23e957b2f7f424",
      measurementId: "G-1Y3247DHPR"
    };

    const app = initializeApp(firebaseConfig);
    const fbAuth = getAuth(app);
    const fbDb = getFirestore(app);
    const fbStorage = getStorage(app);

    const LOCAL_SESSION_BLOBS = new Map();
    const PENDING_FILES = new Map();
    let cloudUploadCancelFlag = false;
    let activeUploadsCount = 0;
    const activeXhrSet = new Set();
    let activeFbTask = null;

    function readDeletedTombstones() {
      try {
        const arr = JSON.parse(localStorage.getItem(MASTER_DELETED_KEY) || '[]');
        return new Set(Array.isArray(arr) ? arr.map(String) : []);

        return new Set();
      }
    }

    const deletedTombstones = readDeletedTombstones();

    function saveDeletedTombstones() {
      try {
        localStorage.setItem(MASTER_DELETED_KEY, JSON.stringify(Array.from(deletedTombstones)));
      } catch (e) {}
    }

    function readLocalCatalogCache() {
      try {
        const arr = JSON.parse(localStorage.getItem(MASTER_CATALOG_KEY) || '[]');
        if (!Array.isArray(arr)) return [];
        return arr.filter(it => it && it.id && !deletedTombstones.has(String(it.id)));
      } catch (e) {
        return [];
      }
    }

    function writeLocalCatalogCache(list) {
      try {
        const clean = (list || []).map(it => {
          const copy = JSON.parse(JSON.stringify(it));
          if (copy.posterUrl && copy.posterUrl.startsWith('blob:')) {
            copy.posterUrl = CINEMA_FALLBACK_PHOTO;
          }
          return copy;
        });
        localStorage.setItem(MASTER_CATALOG_KEY, JSON.stringify(clean));
      } catch (e) {}
    }

    function readWatchProgressMap() {
      try {
        return JSON.parse(localStorage.getItem(WATCH_PROGRESS_KEY) || '{}') || {};
      } catch (e) {
        return {};
      }
    }

    function saveWatchProgress(key, sec) {
      if (!key || !isFinite(sec) || sec < 2) return;
      try {
        const map = readWatchProgressMap();
        map[key] = Math.floor(sec);
        localStorage.setItem(WATCH_PROGRESS_KEY, JSON.stringify(map));
      } catch (e) {}
    }

    function getSavedWatchProgress(key) {
      const map = readWatchProgressMap();
      return Number(map[key]) || 0;
    }

    const savedPrefs = loadPrefs();
    const state = {
      prefs: savedPrefs,
      catalog: readLocalCatalogCache(),
      navTab: 'all',
      langFilter: 'all',
      genreFilter: 'all',
      sortOrder: 'newest',
      searchQuery: '',
      player: {
        media: null,
        season: 1,
        episode: 1,
        channels: [],
        activeChannelId: 'sub',
        playbackRate: savedPrefs.defaultSpeed || 1,
        volume: (savedPrefs.defaultVolumeStep ?? 5) / 5,
        lastNonZeroVolume: 1,
        volumePopoverOpen: false,
        isPlaying: false,
        isFullscreen: false,
        blurMode: false,
        loopMode: false
      }
    };

    applyThemePrefs();

    async function ensureAuthReady() {
      if (fbAuth.currentUser) return fbAuth.currentUser;
      try {
        const cred = await signInAnonymously(fbAuth);
        return cred.user;
      } catch (e) {
        return null;
      }
    }

    function sanitizePlayableUrl(rawUrl) {
      let u = String(rawUrl || '').trim();
      if (!u) return '';
      u = u.replace('/upload/f_mp4,vc_h264/', '/upload/');
      if (/res\.cloudinary\.com/i.test(u) && /\.mov(\?.*)?$/i.test(u)) {
        u = u.replace(/\.mov(\?.*)?$/i, '.mp4$1');
      }
      const gdriveMatch = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([a-zA-Z0-9_-]{15,})/i);
      if (gdriveMatch && gdriveMatch[1]) {
        u = `https://drive.usercontent.google.com/download?id=${gdriveMatch[1]}&export=download&confirm=t`;
      }
      if (/dropbox\.com/i.test(u)) {
        u = u.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace(/[?&]dl=[01]/g, '');
      }
      return u;
    }

    function normalizeItem(raw) {
      if (!raw || typeof raw !== 'object' || !raw.id || !raw.title) return null;
      const id = String(raw.id);
      if (deletedTombstones.has(id) || raw.deleted === true) return null;

      const type = raw.type === 'series' ? 'series' : 'movie';
      const normSrc = (s, idx) => {
        if (!s || typeof s !== 'object') return null;
        return {
          id: s.id || (idx === 1 ? 'dub' : 'sub'),
          label: s.label || (s.defaultMode === 'dub' ? 'TR Dublaj' : 'TR Altyazılı'),
          defaultMode: s.defaultMode || (idx === 1 ? 'dub' : 'sub'),
          url: sanitizePlayableUrl(s.url),
          sessionKey: String(s.sessionKey || ''),
          storagePath: String(s.storagePath || '').trim(),
          lastError: String(s.lastError || ''),
          durationSec: Number(s.durationSec) || 0,
          trimStart: Number(s.trimStart) || 0,
          trimEnd: Number(s.trimEnd) || 0
        };
      };

      const item = {
        id,
        type,
        title: String(raw.title).trim(),
        year: Number(raw.year) || new Date().getFullYear(),
        duration: String(raw.duration || ''),
        durationSec: Number(raw.durationSec) || 0,
        genre: String(raw.genre || (type === 'series' ? 'Dizi' : 'Sinema')),
        seasons: type === 'series' ? Math.max(1, Number(raw.seasons) || 1) : undefined,
        posterUrl: String(raw.posterUrl || CINEMA_FALLBACK_PHOTO),
        posterStyle: String(raw.posterStyle || ''),
        posterStoragePath: String(raw.posterStoragePath || ''),
        createdAt: Number(raw.createdAt) || Date.now(),
        updatedAt: Number(raw.updatedAt) || Number(raw.createdAt) || Date.now(),
        sources: [],
        episodes: [],
        hasSub: false,
        hasDub: false
      };

      if (type === 'movie') {
        item.sources = (Array.isArray(raw.sources) ? raw.sources : []).map(normSrc).filter(Boolean);
        item.hasSub = item.sources.some(s => s.defaultMode === 'sub');
        item.hasDub = item.sources.some(s => s.defaultMode === 'dub');
      } else {
        item.episodes = (Array.isArray(raw.episodes) ? raw.episodes : []).map((ep, i) => ({
          season: Math.max(1, Number(ep.season) || 1),
          number: Math.max(1, Number(ep.number) || (i + 1)),
          name: String(ep.name || `${Number(ep.number) || (i + 1)}. Bölüm`),
          duration: String(ep.duration || ''),
          durationSec: Number(ep.durationSec) || 0,
          sources: (Array.isArray(ep.sources) ? ep.sources : []).map(normSrc).filter(Boolean)
        })).sort((a, b) => (a.season - b.season) || (a.number - b.number));
        item.hasSub = item.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'sub'));
        item.hasDub = item.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'dub'));
      }

      return item;
    }

    function applyCloudCatalogMerge(incomingList, authoritativeSet = null) {
      const map = new Map();
      (state.catalog || []).forEach(it => {
        if (!it || !it.id || deletedTombstones.has(it.id)) return;
        if (authoritativeSet && !authoritativeSet.has(it.id) && (Date.now() - (it.createdAt || 0) > 15000)) {
          return;
        }
        map.set(it.id, it);
      });

      (incomingList || []).forEach(raw => {
        if (!raw || !raw.id) return;
        const id = String(raw.id);
        if (raw.deleted === true) {
          deletedTombstones.add(id);
          saveDeletedTombstones();
          map.delete(id);
          return;
        }
        if (deletedTombstones.has(id)) return;
        const norm = normalizeItem(raw);
        if (!norm) return;

        const existing = map.get(id);
        if (!existing) {
          map.set(id, norm);
        } else {
          const merged = { ...existing, ...norm };
          if (norm.type === 'movie') {
            const sMap = new Map();
            (existing.sources || []).forEach(s => sMap.set(s.id, { ...s }));
            (norm.sources || []).forEach(s => {
              const prevS = sMap.get(s.id) || {};
              sMap.set(s.id, {
                ...prevS,
                ...s,
                url: s.url || prevS.url || '',
                storagePath: s.storagePath || prevS.storagePath || '',
                sessionKey: s.sessionKey || prevS.sessionKey || '',
                lastError: s.lastError || prevS.lastError || ''
              });
            });
            merged.sources = Array.from(sMap.values());
            merged.hasSub = merged.sources.some(s => s.defaultMode === 'sub');
            merged.hasDub = merged.sources.some(s => s.defaultMode === 'dub');
          } else {
            const epMap = new Map();
            (existing.episodes || []).forEach(e => epMap.set(`${e.season}_${e.number}`, { ...e }));
            (norm.episodes || []).forEach(e => {
              const k = `${e.season}_${e.number}`;
              const prevE = epMap.get(k);
              if (!prevE) {
                epMap.set(k, e);
              } else {
                const esMap = new Map();
                (prevE.sources || []).forEach(s => esMap.set(s.id, { ...s }));
                (e.sources || []).forEach(s => {
                  const ps = esMap.get(s.id) || {};
                  esMap.set(s.id, {
                    ...ps,
                    ...s,
                    url: s.url || ps.url || '',
                    storagePath: s.storagePath || ps.storagePath || '',
                    sessionKey: s.sessionKey || ps.sessionKey || '',
                    lastError: s.lastError || ps.lastError || ''
                  });
                });
                epMap.set(k, { ...prevE, ...e, sources: Array.from(esMap.values()) });
              }
            });
            merged.episodes = Array.from(epMap.values()).sort((a, b) => (a.season - b.season) || (a.number - b.number));
            merged.hasSub = merged.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'sub'));
            merged.hasDub = merged.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'dub'));
          }
          if ((!merged.posterUrl || merged.posterUrl === CINEMA_FALLBACK_PHOTO) && existing.posterUrl && existing.posterUrl !== CINEMA_FALLBACK_PHOTO) {
            merged.posterUrl = existing.posterUrl;
          }
          map.set(id, merged);
        }
      });

      state.catalog = Array.from(map.values())
        .filter(it => !deletedTombstones.has(it.id))
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

      writeLocalCatalogCache(state.catalog);
      populateGenreSelect();
      renderMainView();
    }

    async function pushItemToAllClouds(item) {
      if (!item || deletedTombstones.has(item.id)) return;
      item.updatedAt = Date.now();
      const payload = JSON.parse(JSON.stringify(item));
      if (payload.posterUrl && payload.posterUrl.startsWith('blob:')) {
        payload.posterUrl = CINEMA_FALLBACK_PHOTO;
      }

      const p1 = fetch(`${firebaseConfig.databaseURL}/${RTDB_NODE}/${encodeURIComponent(payload.id)}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(() => {});

      const p2 = ensureAuthReady().then(() => setDoc(doc(fbDb, FIRESTORE_COLLECTION, payload.id), payload)).catch(() => {});
      await Promise.allSettled([p1, p2]);
    }

    async function deleteItemFromAllClouds(item) {
      if (!item || !item.id) return;
      const id = String(item.id);
      deletedTombstones.add(id);
      saveDeletedTombstones();

      state.catalog = state.catalog.filter(m => m.id !== id);
      writeLocalCatalogCache(state.catalog);
      populateGenreSelect();
      renderMainView();

      fetch(`${firebaseConfig.databaseURL}/${RTDB_NODE}/${encodeURIComponent(id)}.json`, {
        method: 'DELETE'
      }).catch(() => {});

      try {
        await ensureAuthReady();
        await deleteDoc(doc(fbDb, FIRESTORE_COLLECTION, id));
        const paths = [];
        if (item.posterStoragePath) paths.push(item.posterStoragePath);
        (item.sources || []).forEach(s => { if (s.storagePath) paths.push(s.storagePath); });
        (item.episodes || []).forEach(ep => (ep.sources || []).forEach(s => { if (s.storagePath) paths.push(s.storagePath); }));
        for (const p of paths) {
          deleteObject(storageRef(fbStorage, p)).catch(() => {});
        }
      } catch (e) {}
    }

    async function syncAllFromCloudNow(showFeedback = false) {
      let mergedAny = false;
      try {
        const rtdbResp = await fetch(`${firebaseConfig.databaseURL}/${RTDB_NODE}.json`, { cache: 'no-store' });
        if (rtdbResp.ok) {
          const data = await rtdbResp.json();
          if (data && typeof data === 'object') {
            const items = Object.values(data).filter(Boolean);
            const authIds = new Set(items.map(i => String(i.id)));
            applyCloudCatalogMerge(items, authIds);
            mergedAny = true;
          } else if (data === null && state.catalog.length > 0) {
            state.catalog = state.catalog.filter(it => (Date.now() - (it.createdAt || 0)) < 15000);
            writeLocalCatalogCache(state.catalog);
            renderMainView();
          }
        }
      } catch (e) {}

      try {
        await ensureAuthReady();
        const snap = await getDocs(collection(fbDb, FIRESTORE_COLLECTION));
        const docs = [];
        snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
        if (docs.length > 0) {
          applyCloudCatalogMerge(docs);
          mergedAny = true;
        }
      } catch (e) {}

      if (showFeedback) {
        showToast(mergedAny ? 'Bulut arşivi anında güncellendi.' : 'Bulut bağlantısı güncel.', 'success');
      }
    }

    function startRealtimeCloudListener() {
      setInterval(() => {
        if (activeUploadsCount === 0) {
          syncAllFromCloudNow(false);
        }
      }, 2500);

      ensureAuthReady().then(() => {
        onSnapshot(collection(fbDb, FIRESTORE_COLLECTION), (snap) => {

          snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
          if (docs.length > 0) {
            applyCloudCatalogMerge(docs);
          }
        }, () => {});
      }).catch(() => {});
    }

    /* =====================================================================
       3. 1 MB – 15 GB MULTI-STAGE CLOUD UPLOAD ENGINE (CORS-FREE)
    ===================================================================== */
    function setUploadBanner(show, text = '', pct = 0) {
      const banner = document.getElementById('background-sync-banner');
      const txt = document.getElementById('background-sync-text');
      const pctEl = document.getElementById('background-sync-pct');
      const barEl = document.getElementById('background-sync-bar');
      if (!banner) return;
      if (!show) {
        banner.classList.add('hidden');
        return;
      }
      banner.classList.remove('hidden');
      if (txt) txt.textContent = text;
      if (pctEl) pctEl.textContent = `%${pct}`;
      if (barEl) barEl.style.width = `${Math.max(1, Math.min(100, pct))}%`;
    }

    function cancelActiveCloudSync() {
      cloudUploadCancelFlag = true;
      if (activeFbTask) {
        try { activeFbTask.cancel(); } catch (e) {}
        activeFbTask = null;
      }
      activeXhrSet.forEach(xhr => { try { xhr.abort(); } catch (e) {} });
      activeXhrSet.clear();
      activeUploadsCount = 0;
      setUploadBanner(false);
      showToast('Bulut aktarımı iptal edildi.', 'info');
    }

    function uploadBlobSingleXhr(endpoint, fieldName, extraFields, blob, filename, onProgress, customHeaders = {}) {
      return new Promise((resolve, reject) => {
        const formData = new FormData();
        Object.entries(extraFields || {}).forEach(([k, v]) => formData.append(k, v));
        formData.append(fieldName, blob, filename);

        const xhr = new XMLHttpRequest();
        activeXhrSet.add(xhr);
        xhr.open('POST', endpoint, true);
        Object.entries(customHeaders || {}).forEach(([hk, hv]) => xhr.setRequestHeader(hk, hv));

        let lastByteAt = Date.now();
        const stallGuard = setInterval(() => {
          if (Date.now() - lastByteAt > 30000) {
            clearInterval(stallGuard);
            try { xhr.abort(); } catch (e) {}
            reject(new Error('Sunucu yanıt vermedi'));
          }
        }, 5000);

        xhr.upload.onprogress = (ev) => {
          lastByteAt = Date.now();
          if (cloudUploadCancelFlag) {
            clearInterval(stallGuard);
            try { xhr.abort(); } catch (e) {}
            return;
          }
          if (ev.lengthComputable && ev.total > 0) onProgress(ev.loaded, ev.total);
        };

        xhr.onload = () => {
          clearInterval(stallGuard);
          activeXhrSet.delete(xhr);
          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(xhr.responseText || '');
          } else {
            let errMsg = `HTTP ${xhr.status}`;
            try {
              const errJson = JSON.parse(xhr.responseText || '{}');
              if (errJson?.error?.message) errMsg = errJson.error.message;
            } catch (e) {}
            reject(new Error(errMsg));
          }
        };

        xhr.onerror = () => { clearInterval(stallGuard); activeXhrSet.delete(xhr); reject(new Error('Bağlantı kesildi')); };
        xhr.onabort = () => { clearInterval(stallGuard); activeXhrSet.delete(xhr); reject(new Error('İptal')); };
        xhr.send(formData);
      });
    }

    // 1 MB - 15 GB arası dosyalar için %0 takılma korumalı Firebase Resumable Storage
    function uploadFileViaFirebaseResumable(file, onProgress) {
      return new Promise(async (resolve, reject) => {
        let settled = false;
        let hasTransferredAnyByte = false;
        let stallTimer = null;

        const failOnce = (msg) => {
          if (settled) return;
          settled = true;
          clearTimeout(stallTimer);
          if (activeFbTask) {
            try { activeFbTask.cancel(); } catch (e) {}
            activeFbTask = null;
          }
          reject(new Error(msg));
        };

        try {
          await ensureAuthReady();
          const safeName = (file.name || 'video.mp4').replace(/[^a-zA-Z0-9._-]/g, '_');
          const path = `birperde_media/${Date.now()}_${Math.random().toString(36).slice(2, 6)}_${safeName}`;
          const ref = storageRef(fbStorage, path);
          const task = uploadBytesResumable(ref, file, {
            contentType: file.type || 'video/mp4',
            cacheControl: 'public, max-age=31536000'
          });
          activeFbTask = task;

          stallTimer = setTimeout(() => {
            if (!hasTransferredAnyByte && !settled) {
              failOnce('Firebase Storage ilk bağlantıyı başlatamadı');
            }
          }, 3000);

          task.on(
            'state_changed',
            (snap) => {
              if (cloudUploadCancelFlag) {
                failOnce('İptal edildi');
                return;
              }
              if (snap.bytesTransferred > 0) {
                hasTransferredAnyByte = true;
                clearTimeout(stallTimer);
              }
              if (snap.totalBytes > 0) {
                onProgress(snap.bytesTransferred, snap.totalBytes);
              }
            },
            (err) => failOnce(err?.message || 'Firebase aktarım hatası'),
            async () => {
              if (settled) return;
              settled = true;
              clearTimeout(stallTimer);
              activeFbTask = null;
              try {
                const downloadUrl = await getDownloadURL(task.snapshot.ref);
                resolve({ downloadUrl, storagePath: path });
              } catch (e) {
                reject(e);
              }
            }
          );
        } catch (err) {
          failOnce(err?.message || 'Firebase başlatılamadı');
        }
      });
    }

    // Cloudinary Parçalı (Chunked) Yükleme Motoru
    async function uploadViaCloudinaryChunked(file, onProgress) {
      const cloudName = (state.prefs.cloudinaryCloudName || '').trim() || HARDCODED_CLOUD_NAME;
      const uploadPreset = (state.prefs.cloudinaryUploadPreset || '').trim() || HARDCODED_UPLOAD_PRESET;
      const endpoint = `https://api.cloudinary.com/v1_1/${encodeURIComponent(cloudName)}/auto/upload`;

      if (file.size <= CLOUDINARY_SINGLE_MAX_BYTES) {
        const txt = await uploadBlobSingleXhr(
          endpoint,
          'file',
          { upload_preset: uploadPreset },
          file,
          file.name || 'video.mp4',
          onProgress
        );
        const yanit = JSON.parse(txt || '{}');
        if (!yanit.secure_url) throw new Error('Cloudinary URL döndürmedi');
        return { downloadUrl: sanitizePlayableUrl(yanit.secure_url), storagePath: '' };
      }

      const CHUNK_SIZE = 10 * 1024 * 1024;
      const totalSize = file.size;
      const uniqueUploadId = 'bp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
      let start = 0;
      let lastResponseJson = {};

      while (start < totalSize) {
        if (cloudUploadCancelFlag) throw new Error('İptal edildi');
        const end = Math.min(start + CHUNK_SIZE, totalSize);
        const chunkBlob = file.slice(start, end);
        const contentRange = `bytes ${start}-${end - 1}/${totalSize}`;

        const txt = await uploadBlobSingleXhr(
          endpoint,
          'file',
          { upload_preset: uploadPreset },
          chunkBlob,
          file.name || 'video.mp4',
          (chunkSent) => {
            onProgress(Math.min(totalSize, start + chunkSent), totalSize);
          },
          {
            'X-Unique-Upload-Id': uniqueUploadId,
            'Content-Range': contentRange
          }
        );

        lastResponseJson = JSON.parse(txt || '{}');
        start = end;
        onProgress(start, totalSize);
      }

      if (!lastResponseJson.secure_url) {
        throw new Error('Bulut dosya boyutu sınırını aştı');
      }
      return { downloadUrl: sanitizePlayableUrl(lastResponseJson.secure_url), storagePath: '' };
    }

    // Tam CORS Destekli Yüksek Kapasiteli Bulut Sunucusu (Litterbox / Catbox)
    async function uploadViaCorsFreeCloud(file, onProgress) {
      const txt = await uploadBlobSingleXhr(
        'https://litterbox.catbox.moe/resources/internals/api.php',
        'fileToUpload',
        { reqtype: 'fileupload', time: '72h' },
        file,
        file.name || 'video.mp4',
        onProgress
      );
      const cleanUrl = String(txt || '').trim();
      if (!/^https?:\/\//i.test(cleanUrl)) {
        throw new Error('Yedek sunucu geçerli bağlantı döndürmedi');
      }
      return { downloadUrl: cleanUrl, storagePath: '' };
    }

    // 1 MB - 15 GB Akıllı Sıralı Aktarım Motoru
    async function uploadFileSmartCloud(file, onProgress) {
      if (file.size > MAX_ALLOWED_FILE_BYTES) {
        throw new Error(`Dosya boyutu (${formatFileSizeHuman(file.size)}) 15 GB sınırını aşıyor.`);
      }

      if (file.size <= CLOUDINARY_SINGLE_MAX_BYTES) {
        try {
          return await uploadViaCloudinaryChunked(file, onProgress);
        } catch (e1) {
          try {
            return await uploadFileViaFirebaseResumable(file, onProgress);
          } catch (e2) {
            return await uploadViaCorsFreeCloud(file, onProgress);
          }
        }
      }

      try {
        return await uploadFileViaFirebaseResumable(file, onProgress);
      } catch (fbErr) {
        try {
          return await uploadViaCloudinaryChunked(file, onProgress);
        } catch (clErr) {
          return await uploadViaCorsFreeCloud(file, onProgress);
        }
      }
    }

    async function uploadMediaFilesToCloud(itemId, tasks) {
      if (!tasks || tasks.length === 0) return;
      cloudUploadCancelFlag = false;
      activeUploadsCount++;

      try {
        for (const task of tasks) {
          if (cloudUploadCancelFlag) break;
          const totalLabel = formatFileSizeHuman(task.file.size);
          const startTs = Date.now();

          setUploadBanner(true, `Buluta Aktarılıyor: ${task.title} (${task.label}) • 0 MB / ${totalLabel}`, 1);

          const onProgress = (sent, total) => {
            const pct = Math.max(1, Math.round((sent / total) * 100));
            const sentLabel = formatFileSizeHuman(sent);
            const elapsedSec = Math.max(0.5, (Date.now() - startTs) / 1000);
            const speedMbps = ((sent / (1024 * 1024)) / elapsedSec).toFixed(1);
            setUploadBanner(
              true,
              `${task.title} • ${sentLabel} / ${totalLabel} (${speedMbps} MB/sn)`,
              pct
            );
          };

          let result = null;
          let failMessage = '';
          try {
            result = await uploadFileSmartCloud(task.file, onProgress);
          } catch (err) {
            failMessage = err.message || 'Yükleme hatası';
            if (!cloudUploadCancelFlag) {
              showToast(`Aktarım Hatası: ${failMessage}`, 'error');
            }
          }

          const target = state.catalog.find(m => m.id === itemId);
          if (target) {
            if (result && result.downloadUrl) {
              if (task.kind === 'poster') {
                target.posterUrl = result.downloadUrl;
                target.posterStoragePath = result.storagePath || '';
              } else if (task.kind === 'movie_source') {
                const srcObj = (target.sources || []).find(s => s.id === task.sourceId);
                if (srcObj) {
                  srcObj.url = result.downloadUrl;
                  srcObj.storagePath = result.storagePath || '';
                  srcObj.lastError = '';
                }
              } else if (task.kind === 'episode_source') {
                const ep = (target.episodes || []).find(e => Number(e.season) === Number(task.season) && Number(e.number) === Number(task.episode));
                const srcObj = ep && (ep.sources || []).find(s => s.id === task.sourceId);
                if (srcObj) {
                  srcObj.url = result.downloadUrl;
                  srcObj.storagePath = result.storagePath || '';
                  srcObj.lastError = '';
                }
              }
              writeLocalCatalogCache(state.catalog);
              renderMainView();
              await pushItemToAllClouds(target);
              if (task.kind !== 'poster') {
                showToast(`"${task.title}" (${totalLabel}) kalıcı buluta kaydedildi!`, 'success');
              }
            } else if (failMessage) {
              if (task.kind === 'movie_source') {
                const srcObj = (target.sources || []).find(s => s.id === task.sourceId);
                if (srcObj) srcObj.lastError = failMessage;
              } else if (task.kind === 'episode_source') {
                const ep = (target.episodes || []).find(e => Number(e.season) === Number(task.season) && Number(e.number) === Number(task.episode));
                const srcObj = ep && (ep.sources || []).find(s => s.id === task.sourceId);
                if (srcObj) srcObj.lastError = failMessage;
              }
              writeLocalCatalogCache(state.catalog);
              renderMainView();
              await pushItemToAllClouds(target);
            }
          }
        }
      } finally {
        activeUploadsCount = Math.max(0, activeUploadsCount - 1);
        if (activeUploadsCount === 0) setUploadBanner(false);
      }
    }

    async function resolvePlayableVideoUrl(source) {
      if (!source) return { url: '', status: 'none', lastError: '' };
      if (source.sessionKey && LOCAL_SESSION_BLOBS.has(source.sessionKey)) {
        return { url: LOCAL_SESSION_BLOBS.get(source.sessionKey), status: 'local_session', lastError: '' };
      }
      if (source.url && /^https?:\/\//i.test(source.url)) {
        return { url: sanitizePlayableUrl(source.url), status: 'cloud_ready', lastError: '' };
      }
      if (source.storagePath) {
        try {
          await ensureAuthReady();
          const dl = await getDownloadURL(storageRef(fbStorage, source.storagePath));
          if (dl) {
            source.url = dl;
            return { url: dl, status: 'cloud_ready', lastError: '' };
          }
        } catch (e) {}
      }
      return {
        url: '',
        status: source.lastError ? 'upload_failed' : 'not_uploaded_yet',
        lastError: source.lastError || ''
      };
    }

    function getCloudStatusPill(item) {
      const srcs = item.type === 'movie'
        ? (item.sources || [])
        : (item.episodes || []).flatMap(ep => ep.sources || []);
      const hasCloudUrl = srcs.some(s => /^https?:\/\//i.test(s.url || '') || Boolean(s.storagePath));
      if (hasCloudUrl) {
        return { label: 'Kalıcı Bulut • Her Cihazda Açılır', cls: 'bg-bpEmerald text-white' };
      }
      const errSrc = srcs.find(s => Boolean(s.lastError));
      if (errSrc) {
        return { label: `Hata: ${errSrc.lastError}`, cls: 'bg-bpRed text-white' };
      }
      return { label: 'Buluta Yükleniyor...', cls: 'bg-amber-500 text-bpNavy' };
    }

    /* =====================================================================
       4. REAL FRAME CAPTURE (ZERO BLACK SCREEN) & 6-FRAME PICKER
    ===================================================================== */
    let activeFrameVideoUrl = '';
    let currentFullFrameDataUrl = '';
    let cropBoxState = { x: 25, y: 5, w: 50, h: 90 };
    let cropDragMode = null;
    let cropDragStart = { px: 0, py: 0, box: null };

    function resetCropBoxState() {
      cropBoxState = { x: 25, y: 5, w: 50, h: 90 };
    }

    function isCanvasMostlyBlack(ctx, w, h) {
      try {
        const data = ctx.getImageData(0, 0, w, h).data;
        let sum = 0;
        let count = 0;
        const step = Math.max(4, Math.floor(data.length / 400) * 4);
        for (let i = 0; i < data.length; i += step) {
          const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          sum += lum;
          count++;
        }
        return count > 0 && (sum / count) < 18;
      } catch (e) {
        return false;
      }
    }

    function captureFrameFromVideoFile(fileOrUrl, targetRatio = null, retryCount = 0) {
      return new Promise((resolve) => {
        let rev = '';
        let src = '';
        if (fileOrUrl instanceof File || fileOrUrl instanceof Blob) {
          rev = URL.createObjectURL(fileOrUrl);
          src = rev;
        } else if (typeof fileOrUrl === 'string') {
          src = fileOrUrl.trim();
        }
        if (!src) return resolve(null);

        const v = document.createElement('video');
        v.muted = true;
        v.playsInline = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('webkit-playsinline', '');
        v.preload = 'auto';
        v.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:320px;height:180px;opacity:0.01;pointer-events:none;';
        if (!src.startsWith('blob:') && !src.startsWith('data:')) {
          v.crossOrigin = 'anonymous';
        }
        document.body.appendChild(v);
        v.src = src;

        let done = false;
        const cleanup = (res) => {
          if (done) return;
          done = true;
          try { v.pause(); v.removeAttribute('src'); v.load(); v.remove(); } catch (e) {}
          if (rev) setTimeout(() => { try { URL.revokeObjectURL(rev); } catch (e) {} }, 300);
          resolve(res);
        };

        const timer = setTimeout(() => cleanup(null), 8000);

        const triggerSeek = () => {
          const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : 10;
          const fallbackRatios = [0.22, 0.45, 0.72];
          const baseRatio = targetRatio !== null
            ? Math.min(0.95, targetRatio + retryCount * 0.07)
            : fallbackRatios[Math.min(retryCount, fallbackRatios.length - 1)];
          const seekTo = Math.max(0.8, Math.min(dur - 0.5, dur * baseRatio));
          try {
            v.currentTime = seekTo;
          } catch (e) {
            clearTimeout(timer);
            cleanup(null);
          }
        };

        v.onloadeddata = () => {
          triggerSeek();
        };

        v.onseeked = () => {
          // Tarayıcı decoder'ının gerçek video karesini çizmesi için kısa frame beklemesi
          setTimeout(() => {
            if (done) return;
            try {
              const vw = v.videoWidth || 480;
              const vh = v.videoHeight || 270;
              const maxW = 480;
              const scale = Math.min(1, maxW / vw);
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(160, Math.round(vw * scale));
              canvas.height = Math.max(90, Math.round(vh * scale));
              const ctx = canvas.getContext('2d', { willReadFrequently: true });
              ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

              if (retryCount < 2 && isCanvasMostlyBlack(ctx, canvas.width, canvas.height)) {
                clearTimeout(timer);
                cleanup(null);
                captureFrameFromVideoFile(fileOrUrl, targetRatio, retryCount + 1).then(resolve);
                return;
              }

              clearTimeout(timer);
              const fullDataUrl = canvas.toDataURL('image/jpeg', 0.85);
              cleanup({
                previewUrl: fullDataUrl,
                fullDataUrl,
                durationSec: v.duration || 0
              });
            } catch (e) {
              clearTimeout(timer);
              cleanup(null);
            }
          }, 140);
        };

        v.onerror = () => { clearTimeout(timer); cleanup(null); };
      });
    }

    function applyCroppedPosterFromFullFrame(fullDataUrl) {
      if (!fullDataUrl) return;
      currentFullFrameDataUrl = fullDataUrl;
      const img = new Image();
      img.onload = () => {
        const sx = Math.round((cropBoxState.x / 100) * img.width);
        const sy = Math.round((cropBoxState.y / 100) * img.height);
        const sw = Math.max(40, Math.round((cropBoxState.w / 100) * img.width));
        const sh = Math.max(40, Math.round((cropBoxState.h / 100) * img.height));

        const outCanvas = document.createElement('canvas');
        outCanvas.width = 360;
        outCanvas.height = Math.max(180, Math.round(360 * (sh / sw)));
        const ctx = outCanvas.getContext('2d');
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outCanvas.width, outCanvas.height);

        const croppedDataUrl = outCanvas.toDataURL('image/jpeg', 0.84);
        PENDING_FILES.set('posterDataUrl', croppedDataUrl);
        const prevImg = document.getElementById('draft-poster-preview') || document.getElementById('edit-poster-img');
        if (prevImg) prevImg.src = croppedDataUrl;
      };
      img.src = fullDataUrl;
    }

    function syncCropOverlayBoxDom() {
      const box = document.getElementById('crop-selection-box');
      if (!box) return;
      box.style.left = `${cropBoxState.x}%`;
      box.style.top = `${cropBoxState.y}%`;
      box.style.width = `${cropBoxState.w}%`;
      box.style.height = `${cropBoxState.h}%`;
    }

    function startCropBoxDrag(ev, mode) {
      ev.preventDefault();
      ev.stopPropagation();
      cropDragMode = mode;
      const pt = (ev.touches && ev.touches[0]) || ev;
      cropDragStart = {
        px: pt.clientX,
        py: pt.clientY,
        box: { ...cropBoxState }
      };
    }

    function moveCropBoxDrag(ev) {
      if (!cropDragMode) return;
      const stage = document.getElementById('video-crop-stage');
      if (!stage) return;
      const rect = stage.getBoundingClientRect();
      const pt = (ev.touches && ev.touches[0]) || ev;
      const dxPct = ((pt.clientX - cropDragStart.px) / Math.max(1, rect.width)) * 100;
      const dyPct = ((pt.clientY - cropDragStart.py) / Math.max(1, rect.height)) * 100;
      const b = cropDragStart.box;

      if (cropDragMode === 'move') {
        cropBoxState.x = Math.max(0, Math.min(100 - b.w, b.x + dxPct));
        cropBoxState.y = Math.max(0, Math.min(100 - b.h, b.y + dyPct));
      } else if (cropDragMode === 'resize') {
        cropBoxState.w = Math.max(20, Math.min(100 - b.x, b.w + dxPct));
        cropBoxState.h = Math.max(25, Math.min(100 - b.y, b.h + dyPct));
      }
      syncCropOverlayBoxDom();
    }

    function endCropBoxDrag() {
      if (!cropDragMode) return;
      cropDragMode = null;
      if (currentFullFrameDataUrl) {
        applyCroppedPosterFromFullFrame(currentFullFrameDataUrl);
      }
    }

    window.addEventListener('mousemove', moveCropBoxDrag);

    function formatDurationFromSeconds(sec) {
      const s = Math.max(0, Math.round(Number(sec) || 0));
      if (!s) return '';
      const mins = Math.max(1, Math.round(s / 60));
      if (mins >= 60) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return m > 0 ? `${h} sa ${m} dk` : `${h} sa`;
      }
      return `${mins} dk`;
    }

    function formatPreciseTime(sec) {
      const val = Math.max(0, Number(sec) || 0);
      const mins = Math.floor(val / 60);
      const secs = Math.floor(val % 60);
      const tenths = Math.floor((val * 10) % 10);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${tenths}`;
    }

    function readVideoMetadataQuick(fileOrUrl) {
      return new Promise((resolve) => {
        let rev = '';
        let src = '';
        if (fileOrUrl instanceof File || fileOrUrl instanceof Blob) {
          rev = URL.createObjectURL(fileOrUrl);
          src = rev;
        } else if (typeof fileOrUrl === 'string') {
          src = fileOrUrl.trim();
        }
        if (!src) return resolve({ durationSec: 0, durationLabel: '' });

        const v = document.createElement('video');
        v.preload = 'metadata';
        v.muted = true;
        v.src = src;

        let done = false;
        const end = (res) => {
          if (done) return;
          done = true;
          try { v.removeAttribute('src'); v.load(); } catch (e) {}
          if (rev) setTimeout(() => { try { URL.revokeObjectURL(rev); } catch (e) {} }, 200);
          resolve(res);
        };

        const t = setTimeout(() => end({ durationSec: 0, durationLabel: '' }), 2500);
        v.onloadedmetadata = () => {
          clearTimeout(t);
          const d = isFinite(v.duration) && v.duration > 0 ? v.duration : 0;
          end({ durationSec: d, durationLabel: d > 0 ? formatDurationFromSeconds(d) : '' });
        };
        v.onerror = () => { clearTimeout(t); end({ durationSec: 0, durationLabel: '' }); };
      });
    }

    function parseFilenameDetails(filename) {
      if (!filename) return { title: '', year: null, season: 1, episode: 1, isDub: false };
      let base = filename.replace(/\.[^/.]+$/, '');
      const isDub = /\b(dublaj|tr\s*dub|turkce\s*dublaj)\b/i.test(base);

      let season = 1;
      let episode = 1;
      const seMatch = base.match(/S(\d{1,2})[\s._-]*E(\d{1,3})/i) || base.match(/(\d{1,2})x(\d{1,3})/i);
      if (seMatch) {
        season = Number(seMatch[1]) || 1;
        episode = Number(seMatch[2]) || 1;
        base = base.slice(0, seMatch.index);
      } else {
        const epMatch = base.match(/\b(\d{1,3})\.?\s*(?:bolum|bölüm|ep)\b/i);
        if (epMatch) {
          episode = Number(epMatch[1]) || 1;
          base = base.slice(0, epMatch.index);
        }
      }

      const yMatch = base.match(/\b(19\d{2}|20\d{2})\b/);
      const year = yMatch ? Number(yMatch[1]) : null;
      if (yMatch) base = base.slice(0, yMatch.index);

      base = base
        .replace(/\(.*?\)|\[.*?\]/g, ' ')
        .replace(/\b(1080p|720p|480p|2160p|4k|bluray|web-dl|webrip|hdrip|x264|x265|hevc|tr|dublaj|altyazili|altyazı)\b/gi, ' ')
        .replace(/[._-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      return { title: base || 'Yeni İçerik', year, season, episode, isDub };
    }

    async function searchOnlineMetadata(query, mediaType = 'movie') {
      const clean = (query || '').replace(/\b(19\d{2}|20\d{2})\b/g, '').trim();
      if (clean.length < 2) return [];
      const out = [];
      const seen = new Set();

      const p1 = fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(clean)}&country=tr&media=${mediaType === 'series' ? 'tvShow' : 'movie'}&limit=8`)
        .then(r => r.json())
        .then(data => {
          (data.results || []).forEach(it => {
            const title = it.trackName || it.collectionName || '';
            if (!title) return;
            const yMatch = String(it.releaseDate || '').match(/\b(19\d{2}|20\d{2})\b/);
            const yr = yMatch ? Number(yMatch[1]) : new Date().getFullYear();
            const key = `${title.toLowerCase()}_${yr}`;
            if (seen.has(key)) return;
            seen.add(key);
            out.push({
              title,
              year: yr,
              genre: it.primaryGenreName || (mediaType === 'series' ? 'Dizi' : 'Sinema'),
              posterUrl: it.artworkUrl100 ? it.artworkUrl100.replace(/100x100bb\.(jpg|png)/i, '600x600bb.$1') : '',
              duration: it.trackTimeMillis ? formatDurationFromSeconds(it.trackTimeMillis / 1000) : ''
            });
          });
        })
        .catch(() => {});

      const p2 = fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(clean)}`)
        .then(r => r.json())
        .then(list2 => {
          (list2 || []).slice(0, 6).forEach(entry => {
            const sh = entry.show;
            if (!sh || !sh.name) return;
            const yr = sh.premiered ? Number(sh.premiered.slice(0, 4)) : new Date().getFullYear();
            const key = `${sh.name.toLowerCase()}_${yr}`;
            if (seen.has(key)) return;
            seen.add(key);
            out.push({
              title: sh.name,
              year: yr,
              genre: (sh.genres && sh.genres[0]) || 'Dizi',
              posterUrl: (sh.image && (sh.image.original || sh.image.medium)) || '',
              duration: sh.runtime ? `${sh.runtime} dk` : ''
            });
          });
        })
        .catch(() => {});

      await Promise.allSettled([p1, p2]);
      return out.slice(0, 8);
    }

        showToast(`Dosya (${formatFileSizeHuman(file.size)}) 15 GB sınırını aşıyor.`, 'error');
        return;
      }

      PENDING_FILES.set(slotKey, file);

      const sizeTxt = formatFileSizeHuman(file.size);
      if (badge) {
        badge.textContent = `${file.name} (${sizeTxt})`;
        badge.classList.remove('hidden');
      }

      const parsed = parseFilenameDetails(file.name);
      if (titleInputId) {
        const tEl = document.getElementById(titleInputId);
        if (tEl && !tEl.value.trim() && parsed.title) {
          tEl.value = parsed.title;

      if (parsed.year) {
        formDraft.year = parsed.year;
        const yEl = document.getElementById('draft-year-input');
        if (yEl) yEl.value = parsed.year;
      }

      const meta = await readVideoMetadataQuick(file);
      if (meta.durationSec > 0) {
        formDraft.durationSec = meta.durationSec;
        formDraft.duration = meta.durationLabel;
        const dEl = document.getElementById('draft-duration-input');
        if (dEl) dEl.value = meta.durationLabel;

      await generateSixFrameStrip();
    }

    async function submitBatchUpload(e) {
      e.preventDefault();
      if (batchQueueFiles.length === 0) {
        showToast('Lütfen en az bir video dosyası seçin.', 'error');
        return;
      }
      const mode = document.getElementById('batch-mode-select')?.value || 'movies';
      const sharedSeriesTitle = document.getElementById('batch-series-title')?.value?.trim() || batchQueueFiles[0].title;
      const itemsToProcess = [...batchQueueFiles];
      closeModal();

      if (mode === 'movies') {
        showToast(`${itemsToProcess.length} film buluta aktarılıyor...`, 'success');
        for (const entry of itemsToProcess) {
          const sk = 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5);
          LOCAL_SESSION_BLOBS.set(sk, URL.createObjectURL(entry.file));
          const meta = await readVideoMetadataQuick(entry.file);
          const snap = await captureFrameFromVideoFile(entry.file, 0.25);

          const id = 'mov-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
          const movie = {
            id,
            type: 'movie',
            title: entry.title,
            year: entry.year,
            genre: 'Sinema',
            duration: meta.durationLabel || '',
            durationSec: meta.durationSec || 0,
            hasSub: !entry.isDub,
            hasDub: entry.isDub,
            posterUrl: snap ? (snap.fullDataUrl || snap.previewUrl) : CINEMA_FALLBACK_PHOTO,
            sources: [{
              id: entry.isDub ? 'dub' : 'sub',
              label: entry.isDub ? 'TR Dublaj' : 'TR Altyazılı',
              defaultMode: entry.isDub ? 'dub' : 'sub',
              url: '',
              sessionKey: sk,
              storagePath: '',
              lastError: '',
              durationSec: meta.durationSec || 0,
              trimStart: 0,
              trimEnd: meta.durationSec || 0
            }],
            createdAt: Date.now(),
            updatedAt: Date.now()
          };

          state.catalog.unshift(movie);
          writeLocalCatalogCache(state.catalog);
          renderMainView();
          await pushItemToAllClouds(movie);

          uploadMediaFilesToCloud(id, [{
            kind: 'movie_source',
            sourceId: entry.isDub ? 'dub' : 'sub',
            title: entry.title,
            label: entry.isDub ? 'TR Dublaj' : 'TR Altyazılı',
            file: entry.file
          }]);
        }
      } else {
        showToast(`${itemsToProcess.length} bölüm "${sharedSeriesTitle}" dizisine ekleniyor...`, 'success');
        const firstSnap = await captureFrameFromVideoFile(itemsToProcess[0].file, 0.25);
        const seriesId = 'ser-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
        const episodes = [];
        const allTasks = [];

        for (let i = 0; i < itemsToProcess.length; i++) {
          const entry = itemsToProcess[i];
          const sk = 'sess_' + Date.now() + '_' + i;
          LOCAL_SESSION_BLOBS.set(sk, URL.createObjectURL(entry.file));
          const meta = await readVideoMetadataQuick(entry.file);
          const epNum = entry.episode > 1 ? entry.episode : (i + 1);
          const sNum = entry.season || 1;
          const srcId = entry.isDub ? 'dub' : 'sub';

          episodes.push({
            season: sNum,
            number: epNum,
            name: `${epNum}. Bölüm`,
            duration: meta.durationLabel || '',
            durationSec: meta.durationSec || 0,
            sources: [{
              id: srcId,
              label: entry.isDub ? 'TR Dublaj' : 'TR Altyazılı',
              defaultMode: srcId,
              url: '',
              sessionKey: sk,
              storagePath: '',
              lastError: '',
              durationSec: meta.durationSec || 0,
              trimStart: 0,
              trimEnd: meta.durationSec || 0
            }]
          });

          allTasks.push({
            kind: 'episode_source',
            sourceId: srcId,
            season: sNum,
            episode: epNum,
            title: sharedSeriesTitle,
            label: `S${sNum} B${epNum}`,
            file: entry.file
          });
        }

        const series = {
          id: seriesId,
          type: 'series',
          title: sharedSeriesTitle,
          year: itemsToProcess[0].year || new Date().getFullYear(),
          genre: 'Dizi',
          seasons: Math.max(...episodes.map(e => e.season)),
          hasSub: episodes.some(ep => ep.sources.some(s => s.defaultMode === 'sub')),
          hasDub: episodes.some(ep => ep.sources.some(s => s.defaultMode === 'dub')),
          posterUrl: firstSnap ? (firstSnap.fullDataUrl || firstSnap.previewUrl) : CINEMA_FALLBACK_PHOTO,
          episodes,
          createdAt: Date.now(),
          updatedAt: Date.now()
        };

        state.catalog.unshift(series);
        writeLocalCatalogCache(state.catalog);
        renderMainView();
        await pushItemToAllClouds(series);
        uploadMediaFilesToCloud(seriesId, allTasks);
      }
    }

    function collectVideoSourcesAndTasks(prefix, title, season = null, episode = null) {
      const subFile = PENDING_FILES.get(`${prefix}_sub`) || document.getElementById(`${prefix}-sub-file`)?.files?.[0];
      const dubFile = PENDING_FILES.get(`${prefix}_dub`) || document.getElementById(`${prefix}-dub-file`)?.files?.[0];
      const subUrl = sanitizePlayableUrl(document.getElementById(`${prefix}-sub-url`)?.value || '');
      const dubUrl = sanitizePlayableUrl(document.getElementById(`${prefix}-dub-url`)?.value || '');

      const sources = [];
      const tasks = [];

      if (subFile) {
        const sk = 'sess_' + Date.now() + '_sub';
        LOCAL_SESSION_BLOBS.set(sk, URL.createObjectURL(subFile));
        sources.push({
          id: 'sub',
          label: 'TR Altyazılı',
          defaultMode: 'sub',
          url: '',
          sessionKey: sk,
          storagePath: '',
          lastError: '',
          durationSec: formDraft.durationSec || 0,
          trimStart: 0,
          trimEnd: formDraft.durationSec || 0
        });
        tasks.push({
          kind: season !== null ? 'episode_source' : 'movie_source',
          sourceId: 'sub',
          season,
          episode,
          title,
          label: 'TR Altyazılı',
          file: subFile
        });
      } else if (subUrl) {
        sources.push({
          id: 'sub',
          label: 'TR Altyazılı',
          defaultMode: 'sub',
          url: subUrl,
          sessionKey: '',
          storagePath: '',
          lastError: '',
          durationSec: formDraft.durationSec || 0,
          trimStart: 0,
          trimEnd: formDraft.durationSec || 0
        });
      }

      if (dubFile) {
        const sk = 'sess_' + Date.now() + '_dub';
        LOCAL_SESSION_BLOBS.set(sk, URL.createObjectURL(dubFile));
        sources.push({
          id: 'dub',
          label: 'TR Dublaj',
          defaultMode: 'dub',
          url: '',
          sessionKey: sk,
          storagePath: '',
          lastError: '',
          durationSec: formDraft.durationSec || 0,
          trimStart: 0,
          trimEnd: formDraft.durationSec || 0
        });
        tasks.push({
          kind: season !== null ? 'episode_source' : 'movie_source',
          sourceId: 'dub',
          season,
          episode,
          title,
          label: 'TR Dublaj',
          file: dubFile
        });
      } else if (dubUrl) {
        sources.push({
          id: 'dub',
          label: 'TR Dublaj',
          defaultMode: 'dub',
          url: dubUrl,
          sessionKey: '',
          storagePath: '',
          lastError: '',
          durationSec: formDraft.durationSec || 0,
          trimStart: 0,
          trimEnd: formDraft.durationSec || 0
        });
      }

      return { sources, tasks };
    }

      const series = state.catalog.find(s => s.id === seriesId);
      if (!series) return;

      const { sources, tasks } = collectVideoSourcesAndTasks('ep', series.title, season, number);
      if (sources.length === 0) {
        showToast('Lütfen video seçin veya URL girin.', 'error');
        return;
      }

      if (!Array.isArray(series.episodes)) series.episodes = [];
      const idx = series.episodes.findIndex(ep => Number(ep.season) === season && Number(ep.number) === number);
      const epObj = { season, number, name, duration: formDraft.duration || '', durationSec: formDraft.durationSec || 0, sources };
      if (idx >= 0) series.episodes[idx] = epObj;
      else series.episodes.push(epObj);

      series.episodes.sort((a, b) => (a.season - b.season) || (a.number - b.number));
      series.seasons = Math.max(...series.episodes.map(ep => ep.season));
      series.hasSub = series.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'sub'));
      series.hasDub = series.episodes.some(ep => ep.sources.some(s => s.defaultMode === 'dub'));

      writeLocalCatalogCache(state.catalog);
      renderMainView();
      closeModal();
      showToast(`${series.title} — S${season} B${number} eklendi.`, 'success');

      await pushItemToAllClouds(series);
      if (tasks.length > 0) uploadMediaFilesToCloud(series.id, tasks);
    }

    function importCatalogBackup(inputEl) {
      const f = inputEl?.files?.[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const arr = JSON.parse(ev.target.result);
          if (Array.isArray(arr)) {
            applyCloudCatalogMerge(arr);
            for (const item of arr) {
              await pushItemToAllClouds(item);
            }
            closeModal();
            showToast(`${arr.length} içerik yedekten yüklendi.`, 'success');
          }
        } catch (e) {
          showToast('Geçersiz yedek dosyası.', 'error');
        }
      };
      reader.readAsText(f);
    }
