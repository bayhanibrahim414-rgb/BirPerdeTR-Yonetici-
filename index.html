    /* =====================================================================
       10. WATCH STUDIO (ON-DEMAND POPUP VOLUME LINE + REAL IOS GAIN ENGINE)
    ===================================================================== */
    let hlsController = null;
    let singleTapTimer = null;
    let lastTapTs = 0;
    let hudVisibleInFullscreen = false;
    let volumePopoverHideTimer = null;
    let isDraggingVerticalVol = false;
    let autoplayFallbackMuted = false;

    function getCurrentProgressKey() {
      const m = state.player.media;
      if (!m) return '';
      return m.type === 'series'
        ? `${m.id}_s${state.player.season}_e${state.player.episode}`
        : `${m.id}_movie`;
    }

    function buildChannels(media, season, episode) {
      let list = [];
      if (media.type === 'series') {
        const eps = Array.isArray(media.episodes) ? media.episodes : [];
        const ep = eps.find(e => Number(e.season) === Number(season) && Number(e.number) === Number(episode)) || eps[0];
        if (ep && Array.isArray(ep.sources) && ep.sources.length > 0) list = ep.sources;
      } else if (Array.isArray(media.sources) && media.sources.length > 0) {
        list = media.sources;
      }

      if (list.length === 0) {
        return [{ id: 'sub', label: 'TR Altyazılı', defaultMode: 'sub', url: '', localKey: '' }];
      }

      return list.map((src, idx) => ({
        id: src.id || `src-${idx}`,
        label: src.label || (src.defaultMode === 'dub' ? 'TR Dublaj' : 'TR Altyazılı'),
        defaultMode: src.defaultMode || 'sub',
        url: src.url || '',
        localKey: src.localKey || ''
      }));
    }

    function canAttachWebAudioGain(url) {
      if (!url) return false;
      if (url.startsWith('blob:') || url.startsWith('data:')) return true;
      try {
        const parsed = new URL(url, window.location.href);
        return parsed.origin === window.location.origin;
      } catch (e) {
        return false;
      }
    }

    function setupVideoGainPipeline(vid, playableUrl = '') {
      if (!vid || wiredGainVideo === vid) return;
      if (!canAttachWebAudioGain(playableUrl || vid.currentSrc || vid.src)) return;
      try {
        unlockAudioEngine();
        if (!audioCtxGain) return;
        const srcNode = audioCtxGain.createMediaElementSource(vid);
        audioGainNode = audioCtxGain.createGain();
        audioGainNode.gain.setValueAtTime(state.player.volume ?? 1, audioCtxGain.currentTime);
        srcNode.connect(audioGainNode);
        audioGainNode.connect(audioCtxGain.destination);
        wiredGainVideo = vid;
      } catch (e) {
        audioGainNode = null;
      }
    }

    function syncMediaSessionMetadata() {
      try {
        if (!('mediaSession' in navigator) || !state.player.media) return;
        const m = state.player.media;
        navigator.mediaSession.metadata = new MediaMetadata({
          title: m.title,
          artist: m.type === 'series' ? `${state.player.season}. Sezon ${state.player.episode}. Bölüm` : 'BirPerdeTR'
        });
        navigator.mediaSession.playbackState = state.player.isPlaying ? 'playing' : 'paused';
      } catch (e) {}
    }

    function openVolumePopover(autoHideMs = 2200) {
      const dock = document.getElementById('bp-vertical-vol-dock');
      if (!dock) return;
      state.player.volumePopoverOpen = true;
      dock.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
      dock.classList.add('opacity-100', 'scale-100');
      clearTimeout(volumePopoverHideTimer);
      if (autoHideMs > 0 && !isDraggingVerticalVol) {
        volumePopoverHideTimer = setTimeout(() => {
          closeVolumePopover();
        }, autoHideMs);
      }
    }

    function closeVolumePopover() {
      const dock = document.getElementById('bp-vertical-vol-dock');
      state.player.volumePopoverOpen = false;
      if (!dock) return;
      dock.classList.remove('opacity-100', 'scale-100');
      dock.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
    }

    function toggleVolumePopoverByButton(ev) {
      if (ev) ev.stopPropagation();
      unlockAudioEngine();
      if (state.player.volumePopoverOpen) {
        closeVolumePopover();
      } else {
        openVolumePopover(2600);
      }
    }

    function applyVolumeLevel(newVol, syncToNativeElement = true, revealPopover = true) {
      unlockAudioEngine();
      const clamped = Math.max(0, Math.min(1, Number(Number(newVol).toFixed(2))));
      state.player.volume = clamped;
      if (clamped > 0.02) {
        state.player.lastNonZeroVolume = clamped;
      }

      const vid = document.getElementById('birperde-video');
      if (vid) {
        if (clamped > 0.005) {
          autoplayFallbackMuted = false;
          vid.muted = false;
        } else {
          vid.muted = true;
        }

        if (audioGainNode && wiredGainVideo === vid && audioCtxGain) {
          if (audioCtxGain.state === 'suspended') {
            audioCtxGain.resume().catch(() => {});
          }
          try {
            vid.volume = 1;
            audioGainNode.gain.cancelScheduledValues(audioCtxGain.currentTime);
            audioGainNode.gain.setTargetAtTime(clamped, audioCtxGain.currentTime, 0.015);
          } catch (e) {
            audioGainNode.gain.value = clamped;
          }
        } else if (syncToNativeElement) {
          try {
            vid.volume = clamped;
          } catch (e) {}
        }
      }

      renderVerticalVolumeVisuals();
      if (revealPopover) {
        openVolumePopover(isDraggingVerticalVol ? 0 : 2100);
      }
    }

    function adjustVolumeStep(delta, revealPopover = true) {
      applyVolumeLevel((state.player.volume ?? 1) + delta, true, revealPopover);
    }

    function toggleMuteVerticalVolume(ev) {
      if (ev) ev.stopPropagation();
      if ((state.player.volume ?? 1) > 0.01) {
        applyVolumeLevel(0, true, true);
      } else {
        applyVolumeLevel(state.player.lastNonZeroVolume || 1, true, true);
      }
    }

    function setVerticalVolumeFromPointer(ev, trackEl) {
      if (!trackEl) return;
      const pt = (ev.touches && ev.touches[0]) || ev;
      const rect = trackEl.getBoundingClientRect();
      const isRotated = state.player.isFullscreen && isMobilePortraitViewport();
      const angle = getOrientationAngle();

      let ratio = 1 - ((pt.clientY - rect.top) / Math.max(1, rect.height));
      if (isRotated) {
        ratio = angle === 270
          ? 1 - ((pt.clientX - rect.left) / Math.max(1, rect.width))
          : (pt.clientX - rect.left) / Math.max(1, rect.width);
      }
      applyVolumeLevel(ratio, true, true);
    }

    function onVerticalVolPointerDown(ev, trackEl) {
      ev.stopPropagation();
      unlockAudioEngine();
      isDraggingVerticalVol = true;
      clearTimeout(volumePopoverHideTimer);
      try { trackEl.setPointerCapture(ev.pointerId); } catch (e) {}
      setVerticalVolumeFromPointer(ev, trackEl);
    }

    function onVerticalVolPointerMove(ev, trackEl) {
      if (!isDraggingVerticalVol) return;
      ev.stopPropagation();
      setVerticalVolumeFromPointer(ev, trackEl);
    }

    function onVerticalVolPointerUp(ev, trackEl) {
      if (!isDraggingVerticalVol) return;
      ev.stopPropagation();
      isDraggingVerticalVol = false;
      try { trackEl.releasePointerCapture(ev.pointerId); } catch (e) {}
      openVolumePopover(1800);
    }

    function onVerticalVolWheel(ev) {
      ev.preventDefault();
      ev.stopPropagation();
      const step = ev.deltaY < 0 ? 0.08 : -0.08;
      adjustVolumeStep(step, true);
    }

    function renderVerticalVolumeVisuals() {
      const vol = Math.max(0, Math.min(1, state.player.volume ?? 1));
      const pct = Math.round(vol * 100);

      const lineFill = document.getElementById('bp-vvol-fill');
      if (lineFill) lineFill.style.height = `${pct}%`;

      const thumbDot = document.getElementById('bp-vvol-thumb');
      if (thumbDot) thumbDot.style.bottom = `calc(${pct}% - 5px)`;

      const pctLabel = document.getElementById('bp-vvol-pct');
      if (pctLabel) pctLabel.textContent = `${pct}`;

      const speakerSvg = pct === 0
        ? `<svg class="w-4 h-4 text-rose-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>`
        : pct < 50
          ? `<svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`
          : `<svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;

      const iconBox = document.getElementById('bp-vvol-icon');
      if (iconBox) iconBox.innerHTML = speakerSvg;

      const triggerBtn = document.getElementById('bp-vol-trigger-btn');
      if (triggerBtn) triggerBtn.innerHTML = speakerSvg;
    }

    function buildVerticalVolumeLineWidget(isFullscreenMode) {
      const pct = Math.round(Math.max(0, Math.min(1, state.player.volume ?? 1)) * 100);
      const posCls = isFullscreenMode
        ? 'right-14 sm:right-16 bottom-16 z-30'
        : 'right-11 bottom-12 z-20';
      const shellCls = isFullscreenMode
        ? 'fs-icon-btn'
        : 'bg-slate-950/88 backdrop-blur-md border border-white/25';

      return `
        <div
          id="bp-vertical-vol-dock"
          onclick="event.stopPropagation()"
          onwheel="onVerticalVolWheel(event)"
          class="absolute ${posCls} w-8 py-2 rounded-full ${shellCls} flex flex-col items-center gap-1 select-none shadow-xl opacity-0 scale-95 pointer-events-none transition-all duration-150"
        >
          <span id="bp-vvol-pct" class="font-mono text-[9px] font-extrabold text-white/90 leading-none">${pct}</span>

          <div
            onpointerdown="onVerticalVolPointerDown(event, this)"
            onpointermove="onVerticalVolPointerMove(event, this)"
            onpointerup="onVerticalVolPointerUp(event, this)"
            onpointercancel="onVerticalVolPointerUp(event, this)"
            style="touch-action: none;"
            role="slider"
            aria-label="Ses Seviyesi"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="${pct}"
            class="relative w-7 h-24 flex items-center justify-center cursor-pointer"
          >
            <div class="relative w-1 h-20 rounded-full bg-white/25 overflow-visible">
              <div id="bp-vvol-fill" style="height: ${pct}%" class="absolute bottom-0 inset-x-0 rounded-full bg-white transition-[height] duration-75"></div>
              <span id="bp-vvol-thumb" style="bottom: calc(${pct}% - 5px)" class="absolute left-1/2 -translate-x-1/2 w-2.5 h-2.5 rounded-full bg-white shadow"></span>
            </div>
          </div>

          <button type="button" id="bp-vvol-icon" onclick="toggleMuteVerticalVolume(event)" aria-label="Sesi Kapat veya Aç" class="w-5 h-5 flex items-center justify-center cursor-pointer">
            <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </button>
        </div>
      `;
    }

    function cleanupPlayerTimers() {
      if (hlsController) {
        try { hlsController.destroy(); } catch (e) {}
        hlsController = null;
      }
      clearTimeout(singleTapTimer);
      clearTimeout(volumePopoverHideTimer);
    }

    function openPlayer(itemId, season = null, episode = null) {
      unlockAudioEngine();
      const media = state.catalog.find(m => m.id === itemId);
      if (!media) return;

      let s = Number(season) || 1;
      let ep = Number(episode) || 1;
      if (media.type === 'series' && Array.isArray(media.episodes) && media.episodes.length > 0 && season === null) {
        s = Number(media.episodes[0].season) || 1;
        ep = Number(media.episodes[0].number) || 1;
      }

      const channels = buildChannels(media, s, ep);
      state.player.media = media;
      state.player.season = s;
      state.player.episode = ep;
      state.player.channels = channels;
      state.player.activeChannelId = channels[0].id;
      state.player.isFullscreen = false;
      state.player.isPlaying = true;
      state.player.volumePopoverOpen = false;
      hudVisibleInFullscreen = false;

      const progKey = media.type === 'series' ? `${media.id}_s${s}_e${ep}` : `${media.id}_movie`;
      const saved = readWatchProgress()[progKey];
      const startSec = saved && saved.time > 5 && (!saved.duration || saved.time < saved.duration - 10) ? saved.time : 0;

      renderWatchStudio(startSec, true);
      const sec = document.getElementById('watch-studio-wrapper');
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function switchPlayerChannel(channelId) {
      unlockAudioEngine();
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;
      state.player.activeChannelId = channelId;
      renderWatchStudio(resume, playing);
    }

    function switchPlayerEpisode(season, episode) {
      if (!state.player.media) return;
      openPlayer(state.player.media.id, Number(season), Number(episode));
    }

    function changePlaybackSpeed(rate) {
      const numRate = Number(rate) || 1;
      state.player.playbackRate = numRate;
      const vid = document.getElementById('birperde-video');
      if (vid) vid.playbackRate = numRate;
    }

    function getOrientationAngle() {
      const scrAngle = (screen.orientation && typeof screen.orientation.angle === 'number')
        ? screen.orientation.angle
        : (typeof window.orientation === 'number' ? window.orientation : 0);
      return ((scrAngle % 360) + 360) % 360;
    }

    function isMobilePortraitViewport() {
      return window.innerWidth < 768 && window.innerHeight > window.innerWidth;
    }

    function syncFullscreenClass() {
      const wrap = document.getElementById('watch-studio-wrapper');
      if (!wrap || !state.player.isFullscreen) return;
      if (!isMobilePortraitViewport()) {
        wrap.className = 'bp-fullscreen-landscape-native';
        return;
      }
      const angle = getOrientationAngle();
      wrap.className = angle === 270 ? 'bp-fs-rot-ccw' : 'bp-fs-rot-cw';
    }

    async function enterFullscreenMode() {
      unlockAudioEngine();
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;

      state.player.isFullscreen = true;
      hudVisibleInFullscreen = true;
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';

      renderWatchStudio(resume, playing);
      setFullscreenHudVisibility(true);

      const wrap = document.getElementById('watch-studio-wrapper');
      if (!isMobilePortraitViewport() && wrap && wrap.requestFullscreen) {
        try { await wrap.requestFullscreen(); } catch (e) {}
      } else if (screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock('landscape'); } catch (e) {}
      }
    }

    async function exitFullscreenMode() {
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;

      cleanupPlayerTimers();
      hudVisibleInFullscreen = false;
      state.player.isFullscreen = false;
      state.player.volumePopoverOpen = false;
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';

      if (document.fullscreenElement && document.exitFullscreen) {
        try { await document.exitFullscreen(); } catch (e) {}
      }
      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (e) {}
      }

      renderWatchStudio(resume, playing);
    }

    function setFullscreenHudVisibility(show) {
      const hud = document.getElementById('fs-hud');
      hudVisibleInFullscreen = Boolean(show);
      if (hud) {
        if (hudVisibleInFullscreen) {
          hud.classList.remove('opacity-0', 'pointer-events-none');
          hud.classList.add('opacity-100');
        } else {
          hud.classList.remove('opacity-100');
          hud.classList.add('opacity-0', 'pointer-events-none');
          closeVolumePopover();
        }
      }
    }

    function toggleFullscreenHudByTap() {
      if (state.player.volumePopoverOpen) {
        closeVolumePopover();
        return;
      }
      setFullscreenHudVisibility(!hudVisibleInFullscreen);
    }

    function flashSeekBadge(side, text) {
      const el = document.getElementById(side === 'left' ? 'fs-seek-left' : 'fs-seek-right');
      if (!el) return;
      el.textContent = text;
      el.classList.remove('hidden', 'seek-feedback-badge');
      void el.offsetWidth;
      el.classList.add('seek-feedback-badge');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.add('hidden'), 860);
    }

    function seekRelative(sec) {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      const dur = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : (vid.currentTime + Math.abs(sec) + 10);
      vid.currentTime = Math.max(0, Math.min(dur, (vid.currentTime || 0) + sec));
      syncPlayerControls();
      flashSeekBadge(sec < 0 ? 'left' : 'right', sec < 0 ? '« 10s' : '10s »');
    }

    function handleFullscreenTap(ev) {
      if (!state.player.isFullscreen) {
        if (state.player.volumePopoverOpen) {
          closeVolumePopover();
          return;
        }
        togglePlayPause();
        return;
      }
      const surface = document.getElementById('fs-tap-surface');
      if (!surface) return;
      const pt = (ev.changedTouches && ev.changedTouches[0]) || ev;
      const rect = surface.getBoundingClientRect();
      const rotated = isMobilePortraitViewport();
      const angle = getOrientationAngle();

      let ratioX = (pt.clientX - rect.left) / Math.max(1, rect.width);
      if (rotated) {
        ratioX = angle === 270
          ? 1 - ((pt.clientY - rect.top) / Math.max(1, rect.height))
          : (pt.clientY - rect.top) / Math.max(1, rect.height);
      }

      const now = Date.now();
      if (now - lastTapTs <= 280) {
        clearTimeout(singleTapTimer);
        lastTapTs = 0;
        if (ratioX < 0.5) seekRelative(-10);
        else seekRelative(10);
        return;
      }

      lastTapTs = now;
      clearTimeout(singleTapTimer);
      singleTapTimer = setTimeout(() => {
        lastTapTs = 0;
        toggleFullscreenHudByTap();
      }, 280);
    }

    function closePlayer() {
      cleanupPlayerTimers();
      const vid = document.getElementById('birperde-video');
      if (vid) {
        saveWatchProgress(getCurrentProgressKey(), vid.currentTime, vid.duration);
        vid.pause();
      }
      state.player.media = null;
      state.player.isFullscreen = false;
      state.player.volumePopoverOpen = false;
      hudVisibleInFullscreen = false;
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
      const wrap = document.getElementById('watch-studio-wrapper');
      wrap.classList.add('hidden');
      wrap.innerHTML = '';
    }

    function togglePlayPause() {
      unlockAudioEngine();
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      if (autoplayFallbackMuted || ((state.player.volume ?? 1) > 0.005 && vid.muted)) {
        autoplayFallbackMuted = false;
        vid.muted = false;
        applyVolumeLevel(state.player.volume || state.player.lastNonZeroVolume || 1, true, false);
      }
      if (vid.paused) vid.play().catch(() => {});
      else vid.pause();
      syncPlayerControls();
    }

    function scrubPlayer(val) {
      const vid = document.getElementById('birperde-video');
      if (!vid || !isFinite(vid.duration) || vid.duration <= 0) return;
      vid.currentTime = (Number(val) / 100) * vid.duration;
      syncPlayerControls();
    }

    function formatClock(seconds) {
      const s = Math.max(0, Math.floor(seconds || 0));
      const h = Math.floor(s / 3600);
      const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const r = String(s % 60).padStart(2, '0');
      return h > 0 ? `${h}:${m}:${r}` : `${m}:${r}`;
    }

    function syncPlayerControls() {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      const cur = vid.currentTime || 0;
      const dur = (vid.duration && isFinite(vid.duration)) ? vid.duration : 0;
      const pct = dur > 0 ? Math.min(100, (cur / dur) * 100) : 0;

      state.player.isPlaying = !vid.paused;
      syncMediaSessionMetadata();

      if (cur > 3) {
        saveWatchProgress(getCurrentProgressKey(), cur, dur);
      }

      const slider = document.getElementById('bp-timeline-slider');
      if (slider) slider.value = pct;

      const clock = document.getElementById('bp-clock-text');
      if (clock) clock.textContent = `${formatClock(cur)} / ${formatClock(dur)}`;

      renderVerticalVolumeVisuals();

      const playIcon = document.getElementById('bp-play-btn');
      if (playIcon) {
        playIcon.innerHTML = !vid.paused
          ? `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`
          : `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>`;
      }

      const centerBtn = document.getElementById('fs-center-play');
      if (centerBtn) {
        centerBtn.innerHTML = !vid.paused
          ? `<svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>`
          : `<svg class="w-7 h-7 ml-0.5" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>`;
      }
    }

    async function attachVideoSource(resumeTime = 0, shouldPlay = true) {
      cleanupPlayerTimers();
      wiredGainVideo = null;
      autoplayFallbackMuted = false;
      const vid = document.getElementById('birperde-video');
      const badge = document.getElementById('bp-loading-badge');
      if (!vid) return;

      const ch = state.player.channels.find(c => c.id === state.player.activeChannelId) || state.player.channels[0];
      const playableUrl = await resolvePlayableUrl(ch);

      vid.playbackRate = state.player.playbackRate || 1;
      vid.muted = (state.player.volume ?? 1) <= 0.005;
      vid.volume = 1;

      const onCanPlay = () => {
        if (badge) badge.classList.add('hidden');
        if (resumeTime > 0 && isFinite(vid.duration) && resumeTime < vid.duration) {
          vid.currentTime = resumeTime;
          resumeTime = 0;
        }
        syncPlayerControls();
      };

      vid.addEventListener('loadeddata', onCanPlay);
      vid.addEventListener('canplay', onCanPlay);
      vid.addEventListener('playing', () => {
        setupVideoGainPipeline(vid, playableUrl);
        onCanPlay();
      });
      vid.addEventListener('timeupdate', syncPlayerControls);
      vid.addEventListener('play', syncPlayerControls);
      vid.addEventListener('pause', syncPlayerControls);
      vid.addEventListener('volumechange', () => {
        if (autoplayFallbackMuted) return;
        const isWebAudioControlled = Boolean(audioGainNode && wiredGainVideo === vid);
        if (isWebAudioControlled) {
          if (vid.muted && (state.player.volume ?? 1) > 0.01) {
            state.player.volume = 0;
            audioGainNode.gain.value = 0;
            renderVerticalVolumeVisuals();
            openVolumePopover(1800);
          }
          return;
        }
        const nextVol = vid.muted ? 0 : vid.volume;
        if (Math.abs((state.player.volume ?? 1) - nextVol) > 0.01) {
          state.player.volume = Number(nextVol.toFixed(2));
          if (state.player.volume > 0.02) {
            state.player.lastNonZeroVolume = state.player.volume;
          }
          renderVerticalVolumeVisuals();
          openVolumePopover(1800);
        }
      });

      if (!playableUrl) {
        if (badge) badge.textContent = 'Video Yok';
        return;
      }

      if (canAttachWebAudioGain(playableUrl)) {
        setupVideoGainPipeline(vid, playableUrl);
      } else {
        vid.volume = state.player.volume ?? 1;
      }

      const isHls = /\.m3u8(\?|$)/i.test(playableUrl);
      if (isHls && window.Hls && window.Hls.isSupported()) {
        const hls = new window.Hls({ enableWorker: true });
        hlsController = hls;
        hls.loadSource(playableUrl);
        hls.attachMedia(vid);
        hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
          vid.playbackRate = state.player.playbackRate || 1;
          if (shouldPlay) {
            vid.play().catch(() => {
              autoplayFallbackMuted = true;
              vid.muted = true;
              vid.play().catch(() => {});
            });
          }
        });
      } else {
        vid.src = playableUrl;
        vid.load();
        if (shouldPlay) {
          vid.play().catch(() => {
            autoplayFallbackMuted = true;
            vid.muted = true;
            vid.play().catch(() => {});
          });
        }
      }
      renderVerticalVolumeVisuals();
    }

                  <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                </button>

                <button type="button" onclick="enterFullscreenMode()" aria-label="Tam Ekran" class="w-8 h-8 rounded-lg watch-soft-active text-white flex items-center justify-center shrink-0 transition cursor-pointer">
                  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;

      attachVideoSource(resumeTime, shouldPlay);
    }

    /* =====================================================================
       11. UI HELPERS & GLOBAL EXPORTS
    ===================================================================== */
    function getBrandSvg(size = 34) {
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" class="shrink-0">
          <rect x="2" y="2" width="44" height="44" rx="12" fill="#0B1F3A" stroke="#1D4ED8" stroke-width="2"/>
          <rect x="8" y="10" width="3.5" height="4" rx="1" fill="#EAB308"/>
          <rect x="8" y="18" width="3.5" height="4" rx="1" fill="#EAF4FF"/>
          <rect x="8" y="26" width="3.5" height="4" rx="1" fill="#16A34A"/>
          <rect x="8" y="34" width="3.5" height="4" rx="1" fill="#D92626"/>
          <rect x="36.5" y="10" width="3.5" height="4" rx="1" fill="#D92626"/>
          <rect x="36.5" y="18" width="3.5" height="4" rx="1" fill="#EAB308"/>
          <rect x="36.5" y="26" width="3.5" height="4" rx="1" fill="#EAF4FF"/>
          <rect x="36.5" y="34" width="3.5" height="4" rx="1" fill="#16A34A"/>
          <rect x="14.5" y="11" width="19" height="26" rx="4" fill="#047857"/>
          <polygon points="21,18 30,24 21,30" fill="#FFFFFF"/>
        </svg>
      `;
    }

    function openModal(html) {
      document.getElementById('modal-card').innerHTML = html;
      document.getElementById('modal-overlay').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
      document.getElementById('modal-card').innerHTML = '';
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'modal-overlay') closeModal();
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toast-container');
      const el = document.createElement('div');
      const palette = {
        success: 'bg-bpEmerald text-white border-bpYellow',
        error: 'bg-bpRed text-white border-white',
        info: 'bg-bpNavy text-white border-bpRoyal'
      };
      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl border text-xs font-extrabold shadow-lg ${palette[type] || palette.info}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => { if (el.parentElement) el.remove(); }, 3200);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    Object.assign(window, {
      state,
      formDraft,
      dismissIntroSplashNow,
      replayIntroSplash,
      openAddContentModal,
      handleDraftTitleChange,
      runMetadataLookupNow,
      selectSearchCandidate,
      onEpisodeSeriesChanged,
      handleVideoPickerChange,
      handlePosterFileChosen,
      handleManualPosterUrlInput,
      openCoverFrameCutter,
      updateCutterReadout,
      seekCutterBySlider,
      stepCutterSeconds,
      toggleCutterPlayback,
      captureCurrentFrameAsCover,
      closeCoverFrameCutter,
      submitNewMovie,
      submitNewSeries,
      submitNewEpisode,
      openEditItemModal,
      lookupIntoEditModal,
      saveEditedItem,
      openBackupModal,
      downloadCatalogJsonFile,
      copyCatalogJsonToClipboard,
      importCatalogJsonText,
      openEpisodesModal,
      deleteEpisodeFromSeries,
      askDeleteItem,
      confirmDeleteItem,
      handleSearchInput,
      resetSearchInput,
      switchNavTab,
      switchLangFilter,
      openPlayer,
      switchPlayerChannel,
      switchPlayerEpisode,
      changePlaybackSpeed,
      enterFullscreenMode,
      exitFullscreenMode,
      handleFullscreenTap,
      toggleFullscreenHudByTap,
      seekRelative,
      toggleVolumePopoverByButton,
      closeVolumePopover,
      adjustVolumeStep,
      toggleMuteVerticalVolume,
      onVerticalVolPointerDown,
      onVerticalVolPointerMove,
      onVerticalVolPointerUp,
      onVerticalVolWheel,
      closePlayer,
      togglePlayPause,
      scrubPlayer,
      closeModal,
      handleOverlayClick
    });

    function bootstrapApp() {
      const logoEl = document.getElementById('header-brand-logo');
      if (logoEl && !logoEl.innerHTML) {
        logoEl.innerHTML = getBrandSvg(34);
      }
      startInitialIntro();
      updateFilterButtons();
      renderMainView();
      hydrateCatalogFromIDBIfNeeded();
      initBackgroundFirebase();
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', bootstrapApp);
    } else {
      bootstrapApp();
    }

    window.addEventListener('resize', syncFullscreenClass);
    window.addEventListener('orientationchange', syncFullscreenClass);
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && state.player.isFullscreen && !isMobilePortraitViewport()) {
        exitFullscreenMode();
      }
    });

    function handleHardwareOrKeyboardVolume(e) {
      if (!state.player.media) return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

      const k = e.key || '';
      const kc = e.keyCode || e.which || 0;

      if (k === 'Escape' && state.player.isFullscreen) {
        exitFullscreenMode();
      } else if (k === 'AudioVolumeUp' || k === 'VolumeUp' || kc === 175 || k === 'ArrowUp' || k === '+' || k === '=') {
        e.preventDefault();
        adjustVolumeStep(0.1, true);
      } else if (k === 'AudioVolumeDown' || k === 'VolumeDown' || kc === 174 || k === 'ArrowDown' || k === '-' || k === '_') {
        e.preventDefault();
        adjustVolumeStep(-0.1, true);
      } else if (k === 'AudioVolumeMute' || k === 'VolumeMute' || kc === 173 || k === 'm' || k === 'M') {
        e.preventDefault();
        toggleMuteVerticalVolume();
      }
    }

    document.addEventListener('keydown', handleHardwareOrKeyboardVolume, { passive: false });
  </script>
