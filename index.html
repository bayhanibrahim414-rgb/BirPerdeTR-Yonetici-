    async function openVideoTrimModal(itemId, season = null, episode = null, sourceId = null) {
      const item = state.catalog.find(m => m.id === itemId);
      if (!item) return;
      const srcs = item.type === 'movie'
        ? (item.sources || [])
        : ((item.episodes || []).find(e => Number(e.season) === Number(season) && Number(e.number) === Number(episode)) || (item.episodes || [])[0])?.sources || [];

      if (srcs.length === 0) {
        showToast('Video kaynağı bulunamadı.', 'error');
        return;
      }

      const chosen = srcs.find(s => s.id === sourceId) || srcs[0];
      const resolved = await resolvePlayableVideoUrl(chosen);
      if (!resolved.url) {
        showToast('Video henüz yüklenmediği için kesilemiyor.', 'error');
        return;
      }

      const meta = await readVideoMetadataQuick(resolved.url);
      const totalDur = meta.durationSec > 0 ? meta.durationSec : (chosen.durationSec || 120);
      trimCtx = {
        itemId: item.id,
        season,
        episode,
        sourceId: chosen.id,
        durationSec: Number(totalDur.toFixed(1)),
        trimStart: Number((chosen.trimStart || 0).toFixed(1)),
        trimEnd: Number((chosen.trimEnd > 0 && chosen.trimEnd <= totalDur ? chosen.trimEnd : totalDur).toFixed(1))
      };

      openModal(`
        <div class="birperde-ribbon"></div>
        <div class="p-4 sm:p-5 space-y-3.5">
          <div class="flex items-center justify-between gap-2">
            <h3 class="text-base font-extrabold text-bpNavy truncate">Videoyu Kes — ${escapeHtml(item.title)}</h3>
            <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-bpRed hover:text-white flex items-center justify-center cursor-pointer">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>

          <div class="relative aspect-video rounded-xl overflow-hidden bg-black">
            <video id="trim-editor-video" src="${escapeAttr(resolved.url)}" playsinline preload="metadata" onloadedmetadata="onTrimMeta()" class="w-full h-full object-contain bg-black"></video>
          </div>

          <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
            <div class="flex items-center justify-between text-xs font-bold">
              <span>Başlangıç: <strong id="trim-s-lbl" class="font-mono text-bpEmerald">${formatPreciseTime(trimCtx.trimStart)}</strong></span>
              <span>Bitiş: <strong id="trim-e-lbl" class="font-mono text-bpRed">${formatPreciseTime(trimCtx.trimEnd)}</strong></span>
            </div>
            <input type="range" id="trim-s-rng" min="0" max="${trimCtx.durationSec}" step="0.1" value="${trimCtx.trimStart}" oninput="updateTrimBounds(this.value, null)" class="bp-scrubber w-full" />
            <input type="range" id="trim-e-rng" min="0" max="${trimCtx.durationSec}" step="0.1" value="${trimCtx.trimEnd}" oninput="updateTrimBounds(null, this.value)" class="bp-scrubber w-full" />

            <div class="flex justify-end gap-2 pt-1">
              <button type="button" onclick="saveTrimChanges()" class="px-4 py-2 rounded-xl bg-bpEmerald text-white text-xs font-extrabold cursor-pointer">Kesimi Kaydet</button>
            </div>
          </div>
        </div>
      `);
    }

    function onTrimMeta() {
      const v = document.getElementById('trim-editor-video');
      if (!v || !isFinite(v.duration) || v.duration <= 0) return;
      trimCtx.durationSec = Number(v.duration.toFixed(1));
      if (trimCtx.trimEnd <= 0 || trimCtx.trimEnd > trimCtx.durationSec) trimCtx.trimEnd = trimCtx.durationSec;
      const sR = document.getElementById('trim-s-rng');
      const eR = document.getElementById('trim-e-rng');
      if (sR) { sR.max = trimCtx.durationSec; sR.value = trimCtx.trimStart; }
      if (eR) { eR.max = trimCtx.durationSec; eR.value = trimCtx.trimEnd; }
      v.currentTime = trimCtx.trimStart;
    }

    function updateTrimBounds(sVal, eVal) {
      const v = document.getElementById('trim-editor-video');
      if (sVal !== null) {
        trimCtx.trimStart = Math.max(0, Math.min(trimCtx.trimEnd - 0.5, Number(sVal)));
        if (v) v.currentTime = trimCtx.trimStart;
      }
      if (eVal !== null) {
        trimCtx.trimEnd = Math.min(trimCtx.durationSec, Math.max(trimCtx.trimStart + 0.5, Number(eVal)));
        if (v) v.currentTime = trimCtx.trimEnd;
      }
      const sL = document.getElementById('trim-s-lbl');
      const eL = document.getElementById('trim-e-lbl');
      if (sL) sL.textContent = formatPreciseTime(trimCtx.trimStart);
      if (eL) eL.textContent = formatPreciseTime(trimCtx.trimEnd);
    }

    async function saveTrimChanges() {
      const item = state.catalog.find(m => m.id === trimCtx.itemId);
      if (!item) return;
      const activeSec = Math.max(0.5, trimCtx.trimEnd - trimCtx.trimStart);
      const newDur = formatDurationFromSeconds(activeSec);

      if (item.type === 'movie') {
        const sObj = (item.sources || []).find(s => s.id === trimCtx.sourceId) || item.sources[0];
        if (sObj) { sObj.trimStart = trimCtx.trimStart; sObj.trimEnd = trimCtx.trimEnd; sObj.durationSec = activeSec; }
        item.duration = newDur;
      } else {
        const ep = (item.episodes || []).find(e => Number(e.season) === Number(trimCtx.season) && Number(e.number) === Number(trimCtx.episode)) || item.episodes[0];
        if (ep) {
          const sObj = (ep.sources || []).find(s => s.id === trimCtx.sourceId) || ep.sources[0];
          if (sObj) { sObj.trimStart = trimCtx.trimStart; sObj.trimEnd = trimCtx.trimEnd; sObj.durationSec = activeSec; }
          ep.duration = newDur;
        }
      }
      writeLocalCatalogCache(state.catalog);
      renderMainView();
      closeModal();
      await pushItemToAllClouds(item);
      showToast('Kesim kaydedildi.', 'success');
    }

    function getFilteredItems() {
      const q = state.searchQuery.toLowerCase();
      const progMap = readWatchProgressMap();
      const list = (state.catalog || []).filter(item => {
        if (!item || deletedTombstones.has(item.id)) return false;
        if (q && !item.title.toLowerCase().includes(q) && !String(item.year).includes(q) && !(item.genre && item.genre.toLowerCase().includes(q))) {
          return false;
        }
        if (state.langFilter === 'dub' && !item.hasDub) return false;
        if (state.langFilter === 'sub' && !item.hasSub) return false;
        if (state.genreFilter !== 'all' && (item.genre || '') !== state.genreFilter) return false;
        if (state.navTab === 'continue') {
          const hasProg = Object.keys(progMap).some(k => k === item.id || k.startsWith(`${item.id}_s`));
          if (!hasProg) return false;
        }
        return true;
      });

      const order = state.sortOrder;
      list.sort((a, b) => {
        if (order === 'oldest') return (a.createdAt || 0) - (b.createdAt || 0);
        if (order === 'az') return a.title.localeCompare(b.title, 'tr');
        if (order === 'za') return b.title.localeCompare(a.title, 'tr');
        if (order === 'year_desc') return (b.year || 0) - (a.year || 0);
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      return list;
    }

    /* =====================================================================
       9. WATCH STUDIO + DIAGNOSTIC FALLBACK STREAM LOADER
    ===================================================================== */
    let hlsController = null;
    let singleTapTimer = null;
    let lastTapTs = 0;
    let hudVisibleInFullscreen = true;
    let volumePopoverHideTimer = null;
    let isDraggingVerticalVol = false;

    function buildChannels(media, season, episode) {
      let list = [];
      if (media.type === 'series') {
        const eps = Array.isArray(media.episodes) ? media.episodes : [];
        const ep = eps.find(e => Number(e.season) === Number(season) && Number(e.number) === Number(episode)) || eps[0];
        if (ep && Array.isArray(ep.sources)) list = ep.sources;
      } else if (Array.isArray(media.sources)) {
        list = media.sources;
      }
      if (list.length === 0) {
        return [{ id: 'sub', label: 'TR Altyazılı', defaultMode: 'sub', url: '', sessionKey: '', storagePath: '', lastError: '', trimStart: 0, trimEnd: 0 }];
      }
      return list;
    }

    function openPlayer(itemId, season = null, episode = null) {
      const media = state.catalog.find(m => m.id === itemId);
      if (!media) return;

      let s = Number(season) || 1;
      let ep = Number(episode) || 1;
      if (media.type === 'series' && Array.isArray(media.episodes) && media.episodes.length > 0 && season === null) {
        s = Number(media.episodes[0].season) || 1;
        ep = Number(media.episodes[0].number) || 1;
      }

      const channels = buildChannels(media, s, ep);
      state.player.media = media;
      state.player.season = s;
      state.player.episode = ep;
      state.player.channels = channels;
      state.player.activeChannelId = channels[0].id;
      state.player.isFullscreen = false;
      state.player.isPlaying = true;
      state.player.volumePopoverOpen = false;
      hudVisibleInFullscreen = true;

      const progKey = media.type === 'series' ? `${media.id}_s${s}_e${ep}` : media.id;
      const savedPos = state.prefs.resumePlayback ? getSavedWatchProgress(progKey) : 0;
      const minStart = channels[0]?.trimStart > 0 ? channels[0].trimStart : 0;
      const startSec = savedPos > minStart + 3 ? savedPos : minStart;

      renderWatchStudio(startSec, true);
      document.getElementById('watch-studio-wrapper')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function switchPlayerChannel(channelId) {
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;
      state.player.activeChannelId = channelId;
      renderWatchStudio(resume, playing);
    }

    function switchPlayerEpisode(season, episode) {
      if (!state.player.media) return;
      openPlayer(state.player.media.id, Number(season), Number(episode));
    }

    function playAdjacentEpisode(delta) {
      const media = state.player.media;
      if (!media || media.type !== 'series' || !Array.isArray(media.episodes)) return false;
      const idx = media.episodes.findIndex(e => Number(e.season) === Number(state.player.season) && Number(e.number) === Number(state.player.episode));
      const next = media.episodes[idx + delta];
      if (!next) return false;
      openPlayer(media.id, next.season, next.number);
      return true;
    }

    function changePlaybackSpeed(rate) {
      const num = Math.max(0.5, Math.min(2.5, Number(rate) || 1));
      state.player.playbackRate = num;
      const vid = document.getElementById('birperde-video');
      if (vid) vid.playbackRate = num;
      const sel = document.getElementById('bp-speed-select');
      if (sel) sel.value = String(num);
    }

    function stepPlaybackSpeed(delta) {
      const steps = [0.5, 0.75, 1, 1.25, 1.5, 2];
      const curIdx = steps.findIndex(s => Math.abs(s - (state.player.playbackRate || 1)) < 0.05);
      const nextIdx = Math.max(0, Math.min(steps.length - 1, (curIdx >= 0 ? curIdx : 2) + delta));
      changePlaybackSpeed(steps[nextIdx]);
      showSeekVisualBadge(`<span class="font-mono text-xs font-extrabold">${steps[nextIdx]}x</span>`, 'center');
    }

    function toggleCinemaBlurMode() {
      state.player.blurMode = !state.player.blurMode;
      document.body.classList.toggle('bp-cinema-blur-active', state.player.blurMode);
      const btn = document.getElementById('bp-blur-btn');
      if (btn) {
        btn.classList.toggle('watch-soft-active', state.player.blurMode);
        btn.classList.toggle('watch-soft-btn', !state.player.blurMode);
      }
    }

    function toggleLoopMode() {
      state.player.loopMode = !state.player.loopMode;
      const vid = document.getElementById('birperde-video');
      if (vid) vid.loop = state.player.loopMode;
      const btn = document.getElementById('bp-loop-bottom-btn');
      if (btn) {
        btn.classList.toggle('watch-soft-active', state.player.loopMode);
        btn.classList.toggle('watch-soft-btn', !state.player.loopMode);
      }
    }

    async function togglePictureInPicture() {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (vid.requestPictureInPicture) {
          await vid.requestPictureInPicture();
        }
      } catch (e) {}
    }

    function captureQuickVideoSnapshot() {
      const vid = document.getElementById('birperde-video');
      if (!vid || !vid.videoWidth) return;
      try {
        const canvas = document.createElement('canvas');
        canvas.width = vid.videoWidth;
        canvas.height = vid.videoHeight;
        canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `birperde-${Math.floor(vid.currentTime || 0)}s.png`;
        a.click();
        showToast('Kare indirildi.', 'success');
      } catch (e) {
        showToast('Dış kaynak nedeniyle kare indirilemedi.', 'error');
      }
    }

    function getOrientationAngle() {
      const scrAngle = (screen.orientation && typeof screen.orientation.angle === 'number')
        ? screen.orientation.angle
        : (typeof window.orientation === 'number' ? window.orientation : 0);
      return ((scrAngle % 360) + 360) % 360;
    }

    function isMobilePortraitViewport() {
      return window.innerWidth < 768 && window.innerHeight > window.innerWidth;
    }

    function syncFullscreenClass() {
      const wrap = document.getElementById('watch-studio-wrapper');
      if (!wrap || !state.player.isFullscreen) return;
      if (!isMobilePortraitViewport()) {
        wrap.className = 'bp-fullscreen-landscape-native';
        return;
      }
      wrap.className = getOrientationAngle() === 270 ? 'bp-fs-rot-ccw' : 'bp-fs-rot-cw';
    }

    async function enterFullscreenMode() {
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;

      state.player.isFullscreen = true;
      hudVisibleInFullscreen = true;
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';

      renderWatchStudio(resume, playing);

      const wrap = document.getElementById('watch-studio-wrapper');
      if (!isMobilePortraitViewport() && wrap && wrap.requestFullscreen) {
        try { await wrap.requestFullscreen(); } catch (e) {}
      } else if (screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock('landscape'); } catch (e) {}
      }
    }

    async function exitFullscreenMode() {
      const vid = document.getElementById('birperde-video');
      const resume = vid ? vid.currentTime : 0;
      const playing = vid ? !vid.paused : true;

      state.player.isFullscreen = false;
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';

      if (document.fullscreenElement) {
        try { await document.exitFullscreen(); } catch (e) {}
      }
      if (screen.orientation && screen.orientation.unlock) {
        try { screen.orientation.unlock(); } catch (e) {}
      }
      renderWatchStudio(resume, playing);
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && state.player.isFullscreen && !isMobilePortraitViewport()) {
        exitFullscreenMode();
      }
    });

    function setVolumeStep(step, showOsd = true) {
      const clampedStep = Math.max(0, Math.min(5, Math.round(step)));
      const newVol = clampedStep / 5;
      applyVolumeLevel(newVol, false);

      if (showOsd) {
        const bars = [1, 2, 3, 4, 5].map(i =>
          `<span class="w-1.5 h-4 rounded-sm ${i <= clampedStep ? 'bg-bpYellow' : 'bg-white/25'}"></span>`
        ).join('');
        showSeekVisualBadge(
          `<div class="flex flex-col items-center gap-1">
            <div class="flex items-center gap-0.5">${bars}</div>
            <span class="font-mono text-[10px] font-extrabold text-bpYellow">%${clampedStep * 20}</span>
          </div>`,
          'center'
        );
      }
    }

    function stepVolumeFiveLevels(delta) {
      const curStep = Math.round((state.player.volume ?? 1) * 5);
      setVolumeStep(curStep + delta, true);
    }

    document.addEventListener('keydown', (e) => {
      if (!state.player.media) return;
      if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

      const key = e.key.toLowerCase();
      if (e.code === 'Space' || key === 'k') {
        e.preventDefault();
        togglePlayPauseVideo();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        const stepSec = e.shiftKey ? -30 : -10;
        seekVideoBySeconds(stepSec);
        showSeekVisualBadge(`<span class="font-mono text-xs font-extrabold">${stepSec}s</span>`, 'left');
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        const stepSec = e.shiftKey ? 30 : 10;
        seekVideoBySeconds(stepSec);
        showSeekVisualBadge(`<span class="font-mono text-xs font-extrabold">+${stepSec}s</span>`, 'right');
      } else if (e.code === 'ArrowUp') {
        e.preventDefault();
        stepVolumeFiveLevels(1);
      } else if (e.code === 'ArrowDown') {
        e.preventDefault();
        stepVolumeFiveLevels(-1);
      } else if (key === 'f') {
        e.preventDefault();
        if (state.player.isFullscreen) exitFullscreenMode(); else enterFullscreenMode();
      } else if (key === 'm') {
        e.preventDefault();
        const curStep = Math.round((state.player.volume ?? 1) * 5);
        if (curStep > 0) {
          state.player.lastVolumeStep = curStep;
          setVolumeStep(0, true);
        } else {
          setVolumeStep(state.player.lastVolumeStep || 5, true);
        }
      } else if (key === 'c') {
        e.preventDefault();
        stepPlaybackSpeed(-1);
      } else if (key === 'v') {
        e.preventDefault();
        stepPlaybackSpeed(1);
      } else if (key === 'n') {
        e.preventDefault();
        playAdjacentEpisode(1);
      } else if (key === 'p') {
        e.preventDefault();
        playAdjacentEpisode(-1);
      } else if (key === 's') {
        e.preventDefault();
        captureQuickVideoSnapshot();
      } else if (key === 'b') {
        e.preventDefault();
        toggleCinemaBlurMode();
      } else if (/^[0-9]$/.test(e.key)) {
        e.preventDefault();
        seekVideoByPercent(Number(e.key) * 10);
      }
    });

    window.addEventListener('orientationchange', () => { if (state.player.isFullscreen) syncFullscreenClass(); });
    window.addEventListener('resize', () => { if (state.player.isFullscreen) syncFullscreenClass(); });

    function closePlayer() {
      if (state.player.isFullscreen) {
        document.documentElement.style.overflow = '';
        document.body.style.overflow = '';
        if (document.fullscreenElement) {
          try { document.exitFullscreen(); } catch (e) {}
        }
      }
      if (state.player.blurMode) {
        state.player.blurMode = false;
        document.body.classList.remove('bp-cinema-blur-active');
      }
      if (hlsController) {
        try { hlsController.destroy(); } catch (e) {}
        hlsController = null;
      }
      clearTimeout(singleTapTimer);
      clearTimeout(volumePopoverHideTimer);
      state.player.media = null;
      state.player.isFullscreen = false;
      const sec = document.getElementById('watch-studio-wrapper');
      if (sec) {
        sec.className = 'hidden max-w-4xl w-full mx-auto px-3 sm:px-5 pt-4';
        sec.innerHTML = '';
      }
    }

    function showSeekVisualBadge(iconHtml, side) {
      const box = document.getElementById('seek-feedback-layer');
      if (!box) return;
      const alignClass = side === 'left'
        ? 'left-8 top-1/2 -translate-y-1/2'
        : side === 'right'
          ? 'right-8 top-1/2 -translate-y-1/2'
          : 'left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2';

      box.innerHTML = `
        <div class="seek-feedback-badge absolute ${alignClass} min-w-[3.25rem] h-12 px-2.5 rounded-full bg-slate-950/80 border border-white/25 text-white flex items-center justify-center shadow-lg">
          ${iconHtml}
        </div>
      `;
    }

    function handlePlayerSurfaceTap(ev) {
      if (ev.target && ev.target.closest('button, input, select, a, label')) return;

      if (state.player.volumePopoverOpen) {
        closeVolumePopover();
        return;
      }

      const rect = ev.currentTarget.getBoundingClientRect();
      const pt = (ev.changedTouches && ev.changedTouches[0]) || ev;
      let relX = (pt.clientX - rect.left) / Math.max(1, rect.width);

      if (state.player.isFullscreen && isMobilePortraitViewport()) {
        const angle = getOrientationAngle();
        relX = angle === 270
          ? 1 - ((pt.clientY - rect.top) / Math.max(1, rect.height))
          : (pt.clientY - rect.top) / Math.max(1, rect.height);
      }

      const now = Date.now();
      const isDoubleTap = (now - lastTapTs) < 290;
      lastTapTs = now;

      if (isDoubleTap) {
        clearTimeout(singleTapTimer);
        if (relX < 0.36) {
          seekVideoBySeconds(-10);
          showSeekVisualBadge(`<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>`, 'left');
        } else if (relX > 0.64) {
          seekVideoBySeconds(10);
          showSeekVisualBadge(`<svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>`, 'right');
        } else {
          togglePlayPauseVideo();
          const vid = document.getElementById('birperde-video');
          const paused = vid ? vid.paused : false;
          showSeekVisualBadge(
            paused
              ? `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`
              : `<svg class="w-6 h-6 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`,
            'center'
          );
        }
        return;
      }

      clearTimeout(singleTapTimer);
      singleTapTimer = setTimeout(() => {
        if (state.player.isFullscreen) {
          hudVisibleInFullscreen = !hudVisibleInFullscreen;
          const hud = document.getElementById('fullscreen-hud-layer');
          if (hud) {
            hud.classList.toggle('opacity-0', !hudVisibleInFullscreen);
            hud.classList.toggle('pointer-events-none', !hudVisibleInFullscreen);
          }
        } else {
          togglePlayPauseVideo();
        }
      }, 295);
    }

    function togglePlayPauseVideo() {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      if (vid.paused) vid.play().catch(() => {});
      else vid.pause();
    }

    function seekVideoBySeconds(delta) {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      const activeCh = state.player.channels.find(c => c.id === state.player.activeChannelId) || state.player.channels[0];
      const minB = activeCh?.trimStart > 0 ? activeCh.trimStart : 0;
      const rawDur = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : (vid.currentTime + Math.abs(delta) + 10);
      const maxB = activeCh?.trimEnd > minB && activeCh.trimEnd <= rawDur ? activeCh.trimEnd : rawDur;
      vid.currentTime = Math.max(minB, Math.min(maxB, (vid.currentTime || 0) + delta));
      updateVideoTimelineUI();
    }

    function seekVideoByPercent(pct) {
      const vid = document.getElementById('birperde-video');
      if (!vid || !isFinite(vid.duration) || vid.duration <= 0) return;
      const activeCh = state.player.channels.find(c => c.id === state.player.activeChannelId) || state.player.channels[0];
      const minB = activeCh?.trimStart > 0 ? activeCh.trimStart : 0;
      const maxB = activeCh?.trimEnd > minB && activeCh.trimEnd <= vid.duration ? activeCh.trimEnd : vid.duration;
      vid.currentTime = minB + (Number(pct) / 100) * Math.max(0.1, maxB - minB);
      updateVideoTimelineUI();
    }

    function formatClock(sec) {
      if (!isFinite(sec) || sec < 0) return '00:00';
      const s = Math.floor(sec);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const rem = s % 60;
      return h > 0
        ? `${h}:${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`
        : `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    let lastProgressSaveSec = 0;

    function updateVideoTimelineUI() {
      const vid = document.getElementById('birperde-video');
      if (!vid) return;
      const activeCh = state.player.channels.find(c => c.id === state.player.activeChannelId) || state.player.channels[0];
      const minB = activeCh?.trimStart > 0 ? activeCh.trimStart : 0;
      const rawDur = isFinite(vid.duration) && vid.duration > 0 ? vid.duration : 0;
      const maxB = activeCh?.trimEnd > minB && (rawDur === 0 || activeCh.trimEnd <= rawDur) ? activeCh.trimEnd : rawDur;

      const media = state.player.media;
      if (media && Math.abs((vid.currentTime || 0) - lastProgressSaveSec) >= 5) {
        lastProgressSaveSec = vid.currentTime || 0;
        const progKey = media.type === 'series' ? `${media.id}_s${state.player.season}_e${state.player.episode}` : media.id;
        saveWatchProgress(progKey, vid.currentTime);
      }

      if (maxB > minB && vid.currentTime >= maxB - 0.15) {
        if (state.player.loopMode) {
          vid.currentTime = minB;
          vid.play().catch(() => {});
          return;
        }
        if (media && media.type === 'series' && state.prefs.autoPlayNext && playAdjacentEpisode(1)) {
          return;
        }
        vid.pause();
        vid.currentTime = minB;
        return;
      }

      const relCur = Math.max(0, (vid.currentTime || 0) - minB);
      const relDur = Math.max(0, maxB - minB);
      const curEl = document.getElementById('bp-cur-time');
      const durEl = document.getElementById('bp-dur-time');
      const rngEl = document.getElementById('bp-timeline-range');
      if (curEl) curEl.textContent = formatClock(relCur);
      if (durEl) durEl.textContent = formatClock(relDur);
      if (rngEl && relDur > 0) rngEl.value = Math.min(100, (relCur / relDur) * 100);
    }

    function syncPlayPauseButtons(isPlaying) {
      state.player.isPlaying = isPlaying;
      const iconPlay = `<svg class="w-4 h-4 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
      const iconPause = `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`;
      const btn = document.getElementById('bp-play-pause-btn');
      if (btn) btn.innerHTML = isPlaying ? iconPause : iconPlay;

      const fsBtn = document.getElementById('fs-center-play-btn');
      if (fsBtn) {
        fsBtn.innerHTML = isPlaying
          ? `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`
          : `<svg class="w-6 h-6 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
      }
    }

    function openVolumePopover(autoHideMs = 2400) {
      const dock = document.getElementById('bp-vertical-vol-dock');
      if (!dock) return;
      state.player.volumePopoverOpen = true;
      dock.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
      dock.classList.add('opacity-100', 'scale-100');
      clearTimeout(volumePopoverHideTimer);
      if (autoHideMs > 0 && !isDraggingVerticalVol) {
        volumePopoverHideTimer = setTimeout(closeVolumePopover, autoHideMs);
      }
    }

    function closeVolumePopover() {
      const dock = document.getElementById('bp-vertical-vol-dock');
      state.player.volumePopoverOpen = false;
      if (!dock) return;
      dock.classList.remove('opacity-100', 'scale-100');
      dock.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
    }

    function toggleVolumePopoverByButton(ev) {
      if (ev) ev.stopPropagation();
      if (state.player.volumePopoverOpen) closeVolumePopover();
      else openVolumePopover(2600);
    }

    function applyVolumeLevel(newVol, reveal = true) {
      const clamped = Math.max(0, Math.min(1, Number(Number(newVol).toFixed(2))));
      state.player.volume = clamped;
      if (clamped > 0.02) state.player.lastNonZeroVolume = clamped;
      const vid = document.getElementById('birperde-video');
      if (vid) {
        vid.muted = clamped <= 0.005;
        vid.volume = clamped;
      }
      const fill = document.getElementById('bp-vvol-fill');
      const thumb = document.getElementById('bp-vvol-thumb');
      const pctEl = document.getElementById('bp-vvol-pct');
      const pct = Math.round(clamped * 100);
      if (fill) fill.style.height = `${pct}%`;
      if (thumb) thumb.style.bottom = `calc(${pct}% - 6px)`;
      if (pctEl) pctEl.textContent = `%${pct}`;
      if (reveal) openVolumePopover(isDraggingVerticalVol ? 0 : 2000);
    }

    function onVerticalVolPointerDown(ev, trackEl) {
      ev.stopPropagation();
      isDraggingVerticalVol = true;
      clearTimeout(volumePopoverHideTimer);
      try { trackEl.setPointerCapture(ev.pointerId); } catch (e) {}
      setVolFromPtr(ev, trackEl);
    }

    function onVerticalVolPointerMove(ev, trackEl) {
      if (!isDraggingVerticalVol) return;
      ev.stopPropagation();
      setVolFromPtr(ev, trackEl);
    }

    function onVerticalVolPointerUp(ev, trackEl) {
      if (!isDraggingVerticalVol) return;
      ev.stopPropagation();
      isDraggingVerticalVol = false;
      try { trackEl.releasePointerCapture(ev.pointerId); } catch (e) {}
      openVolumePopover(2000);
    }

    function setVolFromPtr(ev, trackEl) {
      const rect = trackEl.getBoundingClientRect();
      const ratio = 1 - ((ev.clientY - rect.top) / Math.max(1, rect.height));
      applyVolumeLevel(ratio, true);
    }

    function buildVolumeDockHtml(isFs) {
      const pct = Math.round((state.player.volume ?? 1) * 100);
      return `
        <div
          id="bp-vertical-vol-dock"
          onclick="event.stopPropagation()"
          class="absolute ${isFs ? 'right-16 bottom-16 z-30' : 'right-11 bottom-12 z-20'} w-11 py-2 rounded-2xl bg-slate-950/90 backdrop-blur-md border border-white/25 flex flex-col items-center gap-1 shadow-2xl opacity-0 scale-95 pointer-events-none transition-all duration-150"
        >
          <span id="bp-vvol-pct" class="font-mono text-[9px] font-extrabold text-bpYellow leading-none">%${pct}</span>
          <button type="button" onclick="stepVolumeFiveLevels(1)" class="w-7 h-6 rounded-lg bg-white/10 hover:bg-white/25 text-white text-xs font-extrabold cursor-pointer">+</button>
          <div
            onpointerdown="onVerticalVolPointerDown(event, this)"
            onpointermove="onVerticalVolPointerMove(event, this)"
            onpointerup="onVerticalVolPointerUp(event, this)"
            style="touch-action: none;"
            class="relative w-8 h-20 flex items-center justify-center cursor-pointer"
          >
            <div class="relative w-1.5 h-16 rounded-full bg-white/25">
              <div id="bp-vvol-fill" style="height: ${pct}%" class="absolute bottom-0 inset-x-0 rounded-full bg-bpYellow"></div>
              <span id="bp-vvol-thumb" style="bottom: calc(${pct}% - 6px)" class="absolute left-1/2 -translate-x-1/2 w-3 h-3 rounded-full bg-white shadow"></span>
            </div>
          </div>
          <button type="button" onclick="stepVolumeFiveLevels(-1)" class="w-7 h-6 rounded-lg bg-white/10 hover:bg-white/25 text-white text-xs font-extrabold cursor-pointer">-</button>
        </div>
      `;
    }

    async function renderWatchStudio(resumeTime = 0, autoPlay = true) {
      if (hlsController) {
        try { hlsController.destroy(); } catch (e) {}
        hlsController = null;

        wrapper.innerHTML = `

                  <button type="button" onclick="closePlayer()" aria-label="Kapat" class="fs-icon-btn w-9 h-9 rounded-xl flex items-center justify-center cursor-pointer">

                  <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
                </button>
              </div>

              <div class="space-y-1.5">
                <div class="flex items-center justify-between text-[11px] font-mono text-white/95 px-1">

                  <button type="button" onclick="toggleVolumePopoverByButton(event)" aria-label="Ses" class="fs-icon-btn w-9 h-9 rounded-xl flex items-center justify-center shrink-0 cursor-pointer">
                    ${volIcon}

      } else {
        wrapper.className = 'max-w-4xl w-full mx-auto px-3 sm:px-5 pt-4';
        wrapper.innerHTML = `
          <div class="bg-bpNavy rounded-2xl border border-slate-700 shadow-2xl overflow-hidden text-white">
            <div class="px-3.5 py-2.5 bg-slate-950/90 border-b border-slate-800 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <span class="px-2 py-0.5 rounded bg-bpRoyal/30 text-bpYellow border border-bpYellow/40 text-[10px] font-extrabold shrink-0">
                  ${media.type === 'series' ? `S${state.player.season} B${state.player.episode}` : 'FİLM'}
                </span>
                <h2 class="text-xs sm:text-sm font-extrabold truncate text-white">${escapeHtml(media.title)}</h2>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                ${channels.map(ch => `
                  <button type="button" onclick="switchPlayerChannel('${escapeAttr(ch.id)}')" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold cursor-pointer ${ch.id === activeCh.id ? 'watch-soft-active' : 'watch-soft-btn'}">
                    ${escapeHtml(ch.label)}
                  </button>
                `).join('')}

                <button type="button" id="bp-blur-btn" onclick="toggleCinemaBlurMode()" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold cursor-pointer ${state.player.blurMode ? 'watch-soft-active' : 'watch-soft-btn'}">

                    <button type="button" onclick="playAdjacentEpisode(1)" aria-label="Sonraki Bölüm" class="w-8 h-8 rounded-lg watch-soft-btn flex items-center justify-center cursor-pointer">

                    </button>

                </div>

                <div class="flex items-center gap-1.5">
                  <select id="bp-speed-select" onchange="changePlaybackSpeed(this.value)" aria-label="Hız" class="px-2 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-[11px] font-extrabold text-slate-200 cursor-pointer">
                    <option value="0.5" ${state.player.playbackRate === 0.5 ? 'selected' : ''}>0.5x</option>
                    <option value="0.75" ${state.player.playbackRate === 0.75 ? 'selected' : ''}>0.75x</option>

                    <option value="1.25" ${state.player.playbackRate === 1.25 ? 'selected' : ''}>1.25x</option>
                    <option value="1.5" ${state.player.playbackRate === 1.5 ? 'selected' : ''}>1.5x</option>
                    <option value="2" ${state.player.playbackRate === 2 ? 'selected' : ''}>2x</option>

                  <button type="button" id="bp-loop-bottom-btn" onclick="toggleLoopMode()" aria-label="Tekrar" class="w-8 h-8 rounded-lg flex items-center justify-center cursor-pointer ${state.player.loopMode ? 'watch-soft-active' : 'watch-soft-btn'}">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
                  </button>

                  <button type="button" onclick="togglePictureInPicture()" aria-label="PiP" class="w-8 h-8 rounded-lg watch-soft-btn flex items-center justify-center cursor-pointer">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/></svg>
                  </button>

                  <button type="button" onclick="captureQuickVideoSnapshot()" aria-label="Kare Yakala" class="hidden sm:flex w-8 h-8 rounded-lg watch-soft-btn items-center justify-center cursor-pointer">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                  </button>

                  <button type="button" onclick="toggleVolumePopoverByButton(event)" aria-label="Ses" class="w-8 h-8 rounded-lg watch-soft-btn flex items-center justify-center cursor-pointer">

                  <button type="button" onclick="enterFullscreenMode()" aria-label="Tam Ekran" class="w-8 h-8 rounded-lg watch-soft-active flex items-center justify-center cursor-pointer">

                  </button>
                </div>

            </div>
          </div>
        `;
      }

      const resolved = await resolvePlayableVideoUrl(activeCh);
      attachVideoStream(resolved.url, resolved.status, resumeTime, autoPlay, activeCh, resolved.lastError);
    }

    function attachVideoStream(url, status, resumeTime, autoPlay, activeCh, lastError = '') {
      const video = document.getElementById('birperde-video');
      const overlay = document.getElementById('player-status-overlay');
      const statusText = document.getElementById('player-status-text');
      const statusActions = document.getElementById('player-status-actions');
      const media = state.player.media;
      if (!video) return;

      video.onplay = () => syncPlayPauseButtons(true);
      video.onpause = () => syncPlayPauseButtons(false);
      video.ontimeupdate = updateVideoTimelineUI;
      video.onloadedmetadata = updateVideoTimelineUI;

      if (!url) {
        if (overlay) overlay.classList.remove('hidden');
        if (statusText) {
          if (status === 'upload_failed') {
            statusText.textContent = `Bulut aktarımı başarısız oldu: ${lastError}`;
          } else if (status === 'not_uploaded_yet') {
            statusText.textContent = 'Bu video henüz buluta yüklenmemiş veya yükleme yarım kalmış. Yeniden yüklemek için aşağıdaki butona basın.';
          } else {
            statusText.textContent = 'Video kaynağı bulunamadı.';
          }
        }
        if (statusActions && media) {
          statusActions.innerHTML = `
            <button type="button" onclick="openEditItemModal('${escapeAttr(media.id)}')" class="px-4 py-2 rounded-xl bg-bpEmerald text-white text-xs font-extrabold cursor-pointer">Videoyu Yeniden Yükle</button>
            <button type="button" onclick="syncAllFromCloudNow(true)" class="px-3.5 py-2 rounded-xl bg-bpRoyal text-white text-xs font-extrabold cursor-pointer">Buluttan Yenile</button>
          `;
        }
        return;
      }

      if (overlay) overlay.classList.add('hidden');
      const minStart = activeCh?.trimStart > 0 ? activeCh.trimStart : 0;

      const candidates = Array.from(new Set([
        url,
        url.replace(/\.mp4(\?.*)?$/i, '.mov$1'),
        url.replace('/upload/', '/upload/f_mp4/')
      ].filter(Boolean)));
      let attemptIdx = 0;

      const onReady = () => {
        if (overlay) overlay.classList.add('hidden');
        video.playbackRate = state.player.playbackRate || 1;
        video.volume = state.player.volume ?? 1;
        const pos = resumeTime > minStart ? resumeTime : minStart;
        if (pos > 0.2) {
          try { video.currentTime = pos; } catch (e) {}
        }
        if (autoPlay) {
          video.play().catch(() => {
            video.muted = true;
            video.play().catch(() => {});
          });
        }
      };

      const tryNextCandidate = () => {
        attemptIdx++;
        if (attemptIdx < candidates.length) {
          video.src = candidates[attemptIdx];
          video.load();
          return;
        }
        if (overlay) overlay.classList.remove('hidden');
        if (statusText) {
          statusText.textContent = `Bu bağlantı tarayıcı tarafından açılamadı. Videoyu yeniden seçip buluta yükleyin.`;
        }
        if (statusActions) {
          statusActions.innerHTML = `
            ${media ? `<button type="button" onclick="openEditItemModal('${escapeAttr(media.id)}')" class="px-4 py-2 rounded-xl bg-bpEmerald text-white text-xs font-extrabold cursor-pointer">Videoyu Yeniden Yükle</button>` : ''}
            <a href="${escapeAttr(url)}" target="_blank" rel="noopener" class="px-3.5 py-2 rounded-xl bg-bpRoyal text-white text-xs font-extrabold">Linki Yeni Sekmede Aç</a>
          `;
        }
      };

      video.onerror = tryNextCandidate;

      if (url.includes('.m3u8') && window.Hls && Hls.isSupported()) {
        hlsController = new Hls({ enableWorker: true });
        hlsController.loadSource(url);
        hlsController.attachMedia(video);
        hlsController.on(Hls.Events.MANIFEST_PARSED, onReady);
      } else {
        video.src = candidates[0];
        video.addEventListener('loadedmetadata', onReady, { once: true });
      }
    }

    /* =====================================================================
       10. MODAL & TOAST HELPERS
    ===================================================================== */
    function openModal(html) {
      const overlay = document.getElementById('modal-overlay');
      const card = document.getElementById('modal-card');
      if (!overlay || !card) return;
      card.innerHTML = html;
      overlay.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-overlay')?.classList.add('hidden');
    }

    function handleOverlayClick(e) {
      if (e.target && e.target.id === 'modal-overlay') closeModal();
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toast-container');
      if (!box) return;
      const colors = {
        success: 'bg-bpEmerald text-white border-emerald-700',
        error: 'bg-bpRed text-white border-rose-800',
        info: 'bg-bpNavy text-white border-bpRoyal'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl border text-xs font-extrabold shadow-xl ${colors[type] || colors.info}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 4500);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

      confirmDeleteItem,
      handleSearchInput,

      switchNavTab,

      switchSortOrder,
      syncAllFromCloudNow,
      cancelActiveCloudSync,
      openPlayer,
      switchPlayerChannel,
      switchPlayerEpisode,
      playAdjacentEpisode,

      stepPlaybackSpeed,
      toggleCinemaBlurMode,
      toggleLoopMode,

      setVolumeStep,
      stepVolumeFiveLevels,
      onVerticalVolPointerDown,
      onVerticalVolPointerMove,
      onVerticalVolPointerUp,
      closeModal,
      handleOverlayClick
